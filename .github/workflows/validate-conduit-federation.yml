            and .roles.acrPull == "7f951dda-4ed3-4680-a7ca-43fe172d538d"
            and .scopePrefixes.keyVault == "/subscriptions/73783c0c-5a53-4f9b-b244-6f64e813814c/resourceGroups/rg-polyedge-dev/providers/Microsoft.KeyVault/vaults/"
