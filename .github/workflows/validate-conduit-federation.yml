              and .roleDefinitionId == "2a2b9908-6ea1-4ae2-8e65-a410df84e7d1"
              and .scope == "/subscriptions/73783c0c-5a53-4f9b-b244-6f64e813814c/resourceGroups/rg-polyedge-dev/providers/Microsoft.Storage/storageAccounts/stpolyedge6urdjr5nmwx7w/blobServices/default/containers/polyedge-qset-control")
            and (.lanes.research.positiveChecks[] | select(
