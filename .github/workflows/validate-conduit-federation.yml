                    scope: (($plan.scopePrefixes[$parts[0]] + ($parts[1:] | join("/"))) | ascii_downcase)
                  }
              ] | sort_by(.id)) as $producerExpected
            | ([ $proof.lanes["funded-intent-producer"].roleAssignments[]
                | {id, roleDefinitionId, scope: (.scope | ascii_downcase)}
              ] | sort_by(.id)) as $producerObserved
            | ($expected | length) == 10
