name: Validate conduit workload federation

on:
  pull_request:
    paths:
      - 'crates/polyedge-storage/**'
      - 'crates/polyedge-api/**'
      - 'crates/polyedge-cli/**'
      - 'crates/polyedge-reporting/**'
      - 'infra/conduit-federated-identity.bicep'
      - 'infra/conduit-data-roles.bicep'
      - 'infra/main.bicep'
      - 'ops/conduit/**'
      - '.github/workflows/validate-conduit-federation.yml'
  push:
    branches: [main]
    paths:
      - 'crates/polyedge-storage/**'
      - 'crates/polyedge-api/**'
      - 'crates/polyedge-cli/**'
      - 'crates/polyedge-reporting/**'
      - 'infra/conduit-federated-identity.bicep'
      - 'infra/conduit-data-roles.bicep'
      - 'infra/main.bicep'
      - 'ops/conduit/**'
      - '.github/workflows/validate-conduit-federation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-conduit-federation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Verify public OIDC discovery and JWKS
        env:
          OIDC_ISSUER: https://oidc.jupiterlabs.dev
        run: |
          set -euo pipefail
          discovery=$(mktemp)
          jwks=$(mktemp)
          trap 'rm -f "$discovery" "$jwks"' EXIT
          curl --fail --silent --show-error --proto '=https' --tlsv1.2 --max-time 20 \
            --retry 2 --retry-all-errors --retry-delay 2 \
            "$OIDC_ISSUER/.well-known/openid-configuration" --output "$discovery"
          jq -e --arg issuer "$OIDC_ISSUER" '
            .issuer == $issuer
            and .jwks_uri == ($issuer + "/keys")
            and (.id_token_signing_alg_values_supported | index("RS256") != null)
          ' "$discovery" >/dev/null
          curl --fail --silent --show-error --proto '=https' --tlsv1.2 --max-time 20 \
            --retry 2 --retry-all-errors --retry-delay 2 \
            "$OIDC_ISSUER/keys" --output "$jwks"
          jq -e '
            (.keys | type == "array" and length > 0)
            and all(.keys[];
              .kty == "RSA" and .alg == "RS256"
              and (.kid | type == "string" and length > 0)
              and (.n | type == "string" and length > 0)
              and (.e | type == "string" and length > 0))
          ' "$jwks" >/dev/null

      - uses: dtolnay/rust-toolchain@stable

      - name: Test shared Azure token authentication
        run: |
          cargo test -p polyedge-storage
          cargo test -p polyedge-api recorder
          cargo test -p polyedge-cli ring_manifest
          cargo test -p polyedge-reporting audit_recomputes_primary_paper_batch
          cargo test -p polyedge-reporting expected_daily_scan_is_inclusive_and_bounded
          cargo test -p polyedge-reporting local_daily_scan_stops_at_expected_date

      - name: Test token rotation and bounded Node smoke
        run: |
          ops/conduit/test/test-federated-token-refresh.sh
          ops/conduit/test/test-boot-disk-guard.sh
          ops/conduit/test/test-quadlet-deploy.sh
          ops/conduit/test/test-run-job-mappings.sh
          ops/conduit/test/test-ring-sync.sh
          ops/conduit/test/test-parity-hourly.sh
          ops/conduit/test/test-parity-daily.sh
          node --test venue-probe/test/workload-identity-smoke.test.mjs
          jq -e '
            .status == "applied-live-verified"
            and .proof == "identity-rbac-proof.json"
            and (.lanes | keys == ["api", "funded-signer", "research", "shadow-qset"])
            and ([.lanes[].assignments[]] | length == 22)
            and all(.lanes[]; (.negativeAssertions | length) > 0)
            and .arc.unchanged
            and .roles.acaJobExecutionReader == "a6f3874a-dc9c-4880-8039-ed1a4e57e4ea"
            and (.lanes.research.assignments[] | select(
              .role == "acaJobExecutionReader"
              and .id == "324fb8fa-c71c-4cdf-a22a-391d290feaa0"
              and .scope == "/subscriptions/73783c0c-5a53-4f9b-b244-6f64e813814c/resourceGroups/rg-polyedge-dev/providers/Microsoft.App/jobs/polyedge-hourly-quality-job"
            ))
            and .githubDeployment.assignment.role == "blobReader"
            and (.githubDeployment.negativeAssertions | length) == 3
            and (.githubDeployment.legacyDeploymentPlaneExceptions | length) == 10
            and all(.githubDeployment.legacyDeploymentPlaneExceptions[]; .preexisting and .outsideFourWorkloadUamiProof)
          ' ops/conduit/identity-rbac-plan.json
          jq -e '
            .status == "live-verified"
            and .secretsOrTokensCaptured == false
            and .issuer.validTls
            and .jwtSvid.perLaneOwnerOnlyFiles
            and ([.lanes[].assignmentCount] | add) == 22
            and all(.lanes[]; .exactPlanMatch)
            and all(.lanes[]; all(.negativeAssertions[]; .passed))
            and .arc.unchanged
            and .roleDefinitions.acaJobExecutionReader.id == "a6f3874a-dc9c-4880-8039-ed1a4e57e4ea"
            and .roleDefinitions.acaJobExecutionReader.actions == ["Microsoft.App/jobs/execution/read"]
            and .roleDefinitions.acaJobExecutionReader.dataActions == []
            and .roleDefinitions.acaJobExecutionReader.exactDefinitionMatch
            and (.lanes.research.positiveChecks[] | select(
              .operation == "Microsoft.App/jobs/execution/read"
              and .assignmentId == "324fb8fa-c71c-4cdf-a22a-391d290feaa0"
              and .result == "success"
            ))
            and .githubDeployment.assignment.id == "839dda8c-f69d-4f3c-8fb5-052ddcaaa9fd"
            and .githubDeployment.assignment.role == "Storage Blob Data Reader"
            and .githubDeployment.scopeOfThisDataPlaneProof == "only the new Storage Blob Data Reader assignment on polyedge-shadow-events"
            and all(.githubDeployment.negativeAssertions[]; .passed)
            and (.githubDeployment.legacyDeploymentPlaneExceptions | length) == 10
            and all(.githubDeployment.legacyDeploymentPlaneExceptions[]; .preexisting and .outsideFourWorkloadUamiProof)
            and ([.githubDeployment.legacyDeploymentPlaneExceptions[].role] | sort == ["AcrPush", "Contributor", "Storage Blob Data Contributor", "Storage Blob Data Contributor", "Storage Blob Data Contributor", "Storage Blob Data Contributor", "Storage Blob Data Reader", "Storage Blob Data Reader", "Storage Blob Data Reader", "User Access Administrator"])
          ' ops/conduit/identity-rbac-proof.json

      - name: Validate isolated UAMI federation template
        run: |
          set -euo pipefail
          az bicep build \
            --file infra/conduit-federated-identity.bicep \
            --stdout > conduit-federated-identity.json
          jq -e '
            ([.resources[] | select(.type == "Microsoft.ManagedIdentity/userAssignedIdentities")] | length) == 1
            and ([.resources[] | select(.type == "Microsoft.ManagedIdentity/userAssignedIdentities/federatedIdentityCredentials")] | length) == 1
            and ([.resources[] | select(.type == "Microsoft.Authorization/roleAssignments")] | length) == 0
            and ([.resources[] | select(.type | test("KeyVault|ServiceBus|Storage"; "i"))] | length) == 0
          ' conduit-federated-identity.json
          jq -e '
            .variables.audience == "api://AzureADTokenExchange"
            and ([.resources[]
              | select(.type == "Microsoft.ManagedIdentity/userAssignedIdentities/federatedIdentityCredentials")
              | .properties.audiences
              | length]
            == [1])
          ' conduit-federated-identity.json
          az bicep build --file infra/conduit-data-roles.bicep --stdout > conduit-data-roles.json
          jq -e '
            ([.resources[] | select(.type == "Microsoft.Authorization/roleDefinitions")] | length) == 3
            and (.resources[] | select(
              .name == "a6f3874a-dc9c-4880-8039-ed1a4e57e4ea"
              and .properties.roleName == "PolyEdge ACA Job Execution Reader"
              and .properties.permissions == [{
                actions: ["Microsoft.App/jobs/execution/read"],
                notActions: [],
                dataActions: [],
                notDataActions: []
              }]
              and .properties.assignableScopes == ["[subscription().id]"]
            ))
          ' conduit-data-roles.json
          az bicep build --file infra/main.bicep --stdout > main.json
          jq -e '
            [.resources[]
              | select(.type == "Microsoft.App/containerApps"
                and .name == "[variables(\u0027apiContainerAppName\u0027)]")
              | .properties.template.containers[]
              | .env[]
              | select(.name == "LOCAL_JSONL_RECORDER_ENABLED" and .value == "false")]
            | length == 1
          ' main.json
