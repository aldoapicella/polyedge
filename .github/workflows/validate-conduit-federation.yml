name: Validate conduit workload federation

on:
  pull_request:
    paths:
      - 'crates/polyedge-storage/**'
      - 'crates/polyedge-api/**'
      - 'crates/polyedge-cli/**'
      - 'crates/polyedge-reporting/**'
      - 'infra/conduit-federated-identity.bicep'
      - 'infra/conduit-data-roles.bicep'
      - 'infra/conduit-funded-access.bicep'
      - 'infra/main.bicep'
      - 'ops/conduit/**'
      - '.github/workflows/deploy-conduit-oci.yml'
      - '.github/workflows/validate-conduit-federation.yml'
  push:
    branches: [main]
    paths:
      - 'crates/polyedge-storage/**'
      - 'crates/polyedge-api/**'
      - 'crates/polyedge-cli/**'
      - 'crates/polyedge-reporting/**'
      - 'infra/conduit-federated-identity.bicep'
      - 'infra/conduit-data-roles.bicep'
      - 'infra/conduit-funded-access.bicep'
      - 'infra/main.bicep'
      - 'ops/conduit/**'
      - '.github/workflows/deploy-conduit-oci.yml'
      - '.github/workflows/validate-conduit-federation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-conduit-federation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Verify public OIDC discovery and JWKS
        env:
          OIDC_ISSUER: https://oidc.jupiterlabs.dev
        run: |
          set -euo pipefail
          discovery=$(mktemp)
          jwks=$(mktemp)
          trap 'rm -f "$discovery" "$jwks"' EXIT
          curl --fail --silent --show-error --proto '=https' --tlsv1.2 --max-time 20 \
            --retry 2 --retry-all-errors --retry-delay 2 \
            "$OIDC_ISSUER/.well-known/openid-configuration" --output "$discovery"
          jq -e --arg issuer "$OIDC_ISSUER" '
            .issuer == $issuer
            and .jwks_uri == ($issuer + "/keys")
            and (.id_token_signing_alg_values_supported | index("RS256") != null)
          ' "$discovery" >/dev/null
          curl --fail --silent --show-error --proto '=https' --tlsv1.2 --max-time 20 \
            --retry 2 --retry-all-errors --retry-delay 2 \
            "$OIDC_ISSUER/keys" --output "$jwks"
          jq -e '
            (.keys | type == "array" and length > 0)
            and all(.keys[];
              .kty == "RSA" and .alg == "RS256"
              and (.kid | type == "string" and length > 0)
              and (.n | type == "string" and length > 0)
              and (.e | type == "string" and length > 0))
          ' "$jwks" >/dev/null

      - uses: dtolnay/rust-toolchain@stable

      - name: Test shared Azure token authentication
        run: |
          cargo test -p polyedge-storage
          cargo test -p polyedge-api recorder
          cargo test -p polyedge-cli ring_manifest
          cargo test -p polyedge-reporting audit_recomputes_primary_paper_batch
          cargo test -p polyedge-reporting expected_daily_scan_is_inclusive_and_bounded
          cargo test -p polyedge-reporting local_daily_scan_stops_at_expected_date

      - name: Test token rotation and bounded Node smoke
        run: |
          ops/conduit/test/test-federated-token-refresh.sh
          ops/conduit/test/test-boot-disk-guard.sh
          ops/conduit/test/test-quadlet-deploy.sh
          ops/conduit/test/test-github-deploy.sh
          ops/conduit/test/test-run-job-mappings.sh
          ops/conduit/test/test-ring-sync.sh
          ops/conduit/test/test-parity-hourly.sh
          ops/conduit/test/test-parity-daily.sh
          ops/conduit/test/test-reboot-attestation.sh
          ops/conduit/test/test-parity-systemd-ordering.sh
          ops/conduit/test/test-funded-secret-bootstrap.sh
          ops/conduit/test/test-funded-signer-env-example.sh
          ops/conduit/test/test-funded-post-recovery-rollout.sh
          ops/conduit/test/test-funded-parity-activation.sh
          ops/conduit/test/test-qset-v4-ops.sh
          ops/conduit/test/test-qset-v4-processor.sh
          ops/conduit/test/test-qset-v4-rbac-proof.sh
          ops/conduit/test/test-qset-v4-retire-writer.sh
          ops/conduit/test/test-qset-v4-source-freeze-upload-interruption-recovery.sh
          ops/conduit/test/test-qset-v5-ops.sh
          ops/conduit/test/test-qset-v5-processor.sh
          ops/conduit/test/test-qset-v5-rbac-proof.sh
          ops/conduit/test/test-qset-v5-retire-writer.sh
          ops/conduit/test/test-qset-v5-source-freeze-upload-interruption-recovery.sh
          ops/conduit/test/test-qset-v6-ops.sh
          ops/conduit/test/test-qset-v6-processor.sh
          ops/conduit/test/test-qset-v6-processor-handoff.sh
          ops/conduit/test/test-qset-v6-rbac-proof.sh
          ops/conduit/test/test-qset-v6-retire-writer.sh
          ops/conduit/test/test-qset-v6-source-freeze-upload-interruption-recovery.sh
          ops/conduit/test/test-qset-v7-ops.sh
          ops/conduit/test/test-qset-v7-processor.sh
          ops/conduit/test/test-qset-v7-processor-handoff.sh
          ops/conduit/test/test-qset-v7-rbac-proof.sh
          ops/conduit/test/test-qset-v7-retire-writer.sh
          ops/conduit/test/test-qset-v7-source-freeze-upload-interruption-recovery.sh
          bash research/test_run_shadow_daily_v7.sh
          bash research/test_verify_shadow_daily_v7_bundle.sh
          bash research/test_run_shadow_daily_v6.sh
          bash research/test_verify_shadow_daily_v6_bundle.sh
          node --test venue-probe/test/workload-identity-smoke.test.mjs
          jq -e '
