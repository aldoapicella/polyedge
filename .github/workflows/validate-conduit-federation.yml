            .[0] as $plan
            | .[1] as $proof
            | ([ $plan.lanes["funded-signer"].assignments[] as $assignment
                | ($assignment.scope | split("/")) as $parts
                | {
                    id: $assignment.id,
                    roleDefinitionId: $plan.roles[$assignment.role],
                    scope: (($plan.scopePrefixes[$parts[0]] + ($parts[1:] | join("/"))) | ascii_downcase)
