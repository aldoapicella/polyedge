name: Recover frozen PolyEdge qset bootstrap

on:
  workflow_dispatch:
    inputs:
      confirm_campaign_id:
        description: Type campaign-2026-07-28-qset-v1
        required: true
        type: string

concurrency:
  group: polyedge-shadow-qset-v1-control-plane
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  AZURE_RESOURCE_GROUP: rg-polyedge-dev
  STORAGE_ACCOUNT: stpolyedge6urdjr5nmwx7w
  CAMPAIGN_ID: campaign-2026-07-28-qset-v1
  CAMPAIGN_START: "2026-07-28"
  CAMPAIGN_CUTOVER_UTC: "2026-07-28T00:00:00Z"
  RECOVERY_START_DEADLINE_UTC: "2026-07-27T22:45:00Z"
  RECOVERY_SEAL_DEADLINE_UTC: "2026-07-27T23:30:00Z"
  FROZEN_SOURCE_COMMIT: 298fc76da0f7cc482883b6503dd06d0a582f6ac6
  BACKEND_IMAGE: crpolyedge6urdjr5nmwx7w.azurecr.io/polyedge-rust-backend@sha256:e31dbc1b47eed665a6c5bb5b03418e6b0a7bae6632cd82da5079a078d975d670
  FRONTEND_IMAGE: crpolyedge6urdjr5nmwx7w.azurecr.io/polyedge-frontend@sha256:32bed43c6b23bbe02b46e9949f78365067254d7f82598b6112c2c325c9f96d8e
  SOURCE_FREEZE_SHA256: sha256:96e34ad8ae268a50b64a3ace7e0d3bcde8a4c720252a9464476e89423e8cce06
  SOURCE_FREEZE_PATH: reports/research/shadow/campaigns/campaign-2026-07-28-qset-v1/control/code-freeze/source-96e34ad8ae268a50b64a3ace7e0d3bcde8a4c720252a9464476e89423e8cce06.json
  QSET_APP: polyedge-shadow-qset-neu
  QSET_JOB: polyedge-shadow-qset-neu-job
  QSET_EVENTS_CONTAINER: polyedge-shadow-qset-events
  QSET_RESEARCH_CONTAINER: polyedge-research-qset
  QSET_CONTROL_CONTAINER: polyedge-qset-control
  LEGACY_APP: polyedge-shadow-neu
  LEGACY_JOB: polyedge-shadow-daily-neu-job
  LEGACY_CAMPAIGN_ID: campaign-2026-07-23
  MAIN_APP: polyedge-dev
  GITHUB_DEPLOY_IDENTITY_NAME: id-github-polyedge-dev

jobs:
  recover-bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout the already frozen evidence source
        uses: actions/checkout@v4
        with:
          ref: 298fc76da0f7cc482883b6503dd06d0a582f6ac6

      - name: Fail closed outside the incomplete pre-cutover bootstrap
        env:
          CONFIRM_CAMPAIGN_ID: ${{ inputs.confirm_campaign_id }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "main"
          test "$CONFIRM_CAMPAIGN_ID" = "$CAMPAIGN_ID"
          test "$(git rev-parse HEAD)" = "$FROZEN_SOURCE_COMMIT"
          test "$(date -u +%s)" -lt "$(date -u -d "$CAMPAIGN_CUTOVER_UTC" +%s)"

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Verify exact partial deployment and immutable source
        env:
          EXPECTED_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          set -euo pipefail
          test "$(az account show --query id -o tsv)" = "$EXPECTED_SUBSCRIPTION_ID"
          expected_client_id=$(az identity show --resource-group "$AZURE_RESOURCE_GROUP" --name "$GITHUB_DEPLOY_IDENTITY_NAME" --query clientId -o tsv)
          authenticated_client_id=$(az account show --query user.name -o tsv)
          test "$(tr 'A-F' 'a-f' <<<"$authenticated_client_id")" = "$(tr 'A-F' 'a-f' <<<"$expected_client_id")"
          for spec in \
            "polyedge-venue-probe-neu-job|ALLOW_LIVE" \
            "polyedge-redeem-neu-job|VENUE_REDEMPTION_ENABLED" \
            "polyedge-strategy-canary-neu-job|STRATEGY_CANARY_CONTROLLER_ENABLED" \
            "polyedge-funded-ladder-neu-job|FUNDED_LADDER_CONTROLLER_ENABLED" \
            "polyedge-promotion-neu-job|PROMOTION_TRANSITION_ENABLED" \
            "polyedge-venue-model-job|QUEUE_MODEL_TRAINING_ENABLED"; do
            job=${spec%%|*}
            flag=${spec#*|}
            test "$(az containerapp job show --resource-group "$AZURE_RESOURCE_GROUP" --name "$job" --query properties.configuration.triggerType -o tsv)" = "Manual"
            test "$(az containerapp job execution list --resource-group "$AZURE_RESOURCE_GROUP" --name "$job" --query '[?properties.status==`Running`] | length(@)' -o tsv)" = "0"
            test "$(az containerapp job show --resource-group "$AZURE_RESOURCE_GROUP" --name "$job" --query "properties.template.containers[0].env[?name=='$flag'].value | [0]" -o tsv)" = "false"
          done

          policy_json=$(az storage container immutability-policy show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --account-name "$STORAGE_ACCOUNT" \
            --container-name "$QSET_CONTROL_CONTAINER" \
            -o json)
          policy_state=$(jq -r '.state' <<<"$policy_json")
          case "$policy_state" in
            Unlocked|Locked) ;;
            *) exit 1 ;;
          esac
          test "$(jq -r '.immutabilityPeriodSinceCreationInDays' <<<"$policy_json")" = "90"

          active_path="reports/research/shadow/campaigns/$CAMPAIGN_ID/control/code-freeze/active.json"
          active_exists=$(az storage blob exists --account-name "$STORAGE_ACCOUNT" --container-name "$QSET_CONTROL_CONTAINER" --name "$active_path" --auth-mode login --query exists -o tsv)
          case "$active_exists" in
            true|false) ;;
            *) exit 1 ;;
          esac
          if [ "$policy_state" = "Locked" ]; then
            test "$active_exists" = "true"
            test "$(date -u +%s)" -lt "$(date -u -d "$CAMPAIGN_CUTOVER_UTC" +%s)"
            echo "BOOTSTRAP_ALREADY_SEALED=true" >> "$GITHUB_ENV"
            echo "BOOTSTRAP_RECOVERY_MODE=sealed_verify" >> "$GITHUB_ENV"
          elif [ "$active_exists" = "true" ]; then
            test "$(date -u +%s)" -lt "$(date -u -d "$RECOVERY_SEAL_DEADLINE_UTC" +%s)"
            echo "BOOTSTRAP_ALREADY_SEALED=false" >> "$GITHUB_ENV"
            echo "BOOTSTRAP_RECOVERY_MODE=pointer_resume" >> "$GITHUB_ENV"
          else
            test "$(date -u +%s)" -lt "$(date -u -d "$RECOVERY_START_DEADLINE_UTC" +%s)"
            echo "BOOTSTRAP_ALREADY_SEALED=false" >> "$GITHUB_ENV"
            echo "BOOTSTRAP_RECOVERY_MODE=fresh" >> "$GITHUB_ENV"
          fi
          echo "ACTIVE_POINTER_EXISTS=$active_exists" >> "$GITHUB_ENV"
          if [ "$active_exists" = "true" ]; then
            az storage blob download \
              --account-name "$STORAGE_ACCOUNT" \
              --container-name "$QSET_CONTROL_CONTAINER" \
              --name "$active_path" \
              --file active-existing.json \
              --auth-mode login \
              --overwrite \
              --only-show-errors \
              -o none
            jq -e \
              --arg campaign_id "$CAMPAIGN_ID" \
              --arg source_path "$SOURCE_FREEZE_PATH" \
              --arg source_sha "$SOURCE_FREEZE_SHA256" \
              '
                .schema == "polyedge.shadow_code_freeze_pointer.v1"
                and .campaign_id == $campaign_id
                and .source_manifest.path == $source_path
                and .source_manifest.sha256 == $source_sha
                and .bootstrap_recovery.failed_initial_run_id == "30238484780"
                and .bootstrap_recovery.reason == "initial_managed_identity_rbac_propagation_restarts"
                and .bootstrap_recovery.evidence_source_unchanged == true
                and .code_frozen == true
              ' active-existing.json
          fi
          az storage blob download \
            --account-name "$STORAGE_ACCOUNT" \
            --container-name "$QSET_CONTROL_CONTAINER" \
            --name "$SOURCE_FREEZE_PATH" \
            --file source-freeze.json \
            --auth-mode login \
            --overwrite \
            --only-show-errors \
            -o none
          test "sha256:$(sha256sum source-freeze.json | cut -d' ' -f1)" = "$SOURCE_FREEZE_SHA256"
          jq -e \
            --arg commit "$FROZEN_SOURCE_COMMIT" \
            --arg backend "$BACKEND_IMAGE" \
            --arg frontend "$FRONTEND_IMAGE" \
            '.source_commit == $commit and .backend_image == $backend and .frontend_image == $frontend' \
            source-freeze.json
          while IFS= read -r protected; do
            path=$(jq -r '.path' <<<"$protected")
            expected=$(jq -r '.sha256' <<<"$protected")
            test -f "$path"
            test "sha256:$(sha256sum "$path" | cut -d' ' -f1)" = "$expected"
          done < <(jq -c '.critical_files[]' source-freeze.json)

          app_json=$(az containerapp show --resource-group "$AZURE_RESOURCE_GROUP" --name "$QSET_APP" -o json)
          job_json=$(az containerapp job show --resource-group "$AZURE_RESOURCE_GROUP" --name "$QSET_JOB" -o json)
          test "$(jq -r '.properties.template.containers[0].image' <<<"$app_json")" = "$BACKEND_IMAGE"
          test "$(jq -r '.properties.template.containers[0].image' <<<"$job_json")" = "$BACKEND_IMAGE"
          test "$(jq -r '.properties.configuration.ingress.external // false' <<<"$app_json")" = "false"
          test "$(jq -r '.properties.configuration.triggerType' <<<"$job_json")" = "Manual"
          test "$(az containerapp job execution list --resource-group "$AZURE_RESOURCE_GROUP" --name "$QSET_JOB" --query '[?properties.status==`Running`] | length(@)' -o tsv)" = "0"
          for pair in EXECUTION_MODE=paper ALLOW_LIVE=false ENABLE_TAKER_ORDERS=false PAPER_MAKER_FILL_POLICY=none; do
            name=${pair%%=*}
            value=${pair#*=}
            test "$(jq -r --arg name "$name" '.properties.template.containers[0].env[] | select(.name == $name) | .value' <<<"$app_json")" = "$value"
            test "$(jq -r --arg name "$name" '.properties.template.containers[0].env[] | select(.name == $name) | .value' <<<"$job_json")" = "$value"
          done
          test "$(jq -r '.properties.template.containers[0].env[] | select(.name == "SHADOW_CODE_FREEZE_SHA256") | .value' <<<"$job_json")" = "$SOURCE_FREEZE_SHA256"
          test "$(jq -r '.properties.template.containers[0].env[] | select(.name == "SHADOW_CODE_FREEZE_MANIFEST") | .value' <<<"$job_json")" = "azure://$STORAGE_ACCOUNT/$QSET_CONTROL_CONTAINER/$SOURCE_FREEZE_PATH"
          test "$(jq -r '[.properties.template.containers[].env[].name | select(test("POLYMARKET_(PRIVATE_KEY|API_KEY|API_SECRET|API_PASSPHRASE)"))] | length' <<<"$app_json")" = "0"
          test "$(jq -r '[.properties.template.containers[].env[].name | select(test("POLYMARKET_(PRIVATE_KEY|API_KEY|API_SECRET|API_PASSPHRASE)"))] | length' <<<"$job_json")" = "0"
          test "$(jq -r '(.properties.configuration.secrets // []) | length' <<<"$app_json")" = "0"
          test "$(jq -r '(.properties.configuration.secrets // []) | length' <<<"$job_json")" = "0"

          report_prefix="reports/research/shadow/campaigns/$CAMPAIGN_ID/"
          event_prefix="shadow-events/$CAMPAIGN_ID/"
          preflight_prefix="shadow-events/preflight/$CAMPAIGN_ID/"
          test "$(az storage blob list --account-name "$STORAGE_ACCOUNT" --container-name "$QSET_RESEARCH_CONTAINER" --prefix "$report_prefix" --auth-mode login --query 'length(@)' -o tsv)" = "0"
          test "$(az storage blob list --account-name "$STORAGE_ACCOUNT" --container-name "$QSET_EVENTS_CONTAINER" --prefix "$event_prefix" --auth-mode login --query 'length(@)' -o tsv)" = "0"
          test "$(az storage blob list --account-name "$STORAGE_ACCOUNT" --container-name "$QSET_EVENTS_CONTAINER" --prefix "$preflight_prefix" --auth-mode login --query 'length(@)' -o tsv)" -gt 0

          writer=$(az identity show --resource-group "$AZURE_RESOURCE_GROUP" --name polyedge-shadow-qset-neu-id --query principalId -o tsv)
          researcher=$(az identity show --resource-group "$AZURE_RESOURCE_GROUP" --name polyedge-qset-research-neu-id --query principalId -o tsv)
          key_vault_id=$(az keyvault show --resource-group "$AZURE_RESOURCE_GROUP" --name kvpolyedge6urdjr5nmwx7w --query id -o tsv)
          storage_id=$(az storage account show --resource-group "$AZURE_RESOURCE_GROUP" --name "$STORAGE_ACCOUNT" --query id -o tsv)
          for principal in "$writer" "$researcher"; do
            for scope in \
              "$key_vault_id" \
              "$storage_id/blobServices/default/containers/polyedge-funded-evidence" \
              "$storage_id/blobServices/default/containers/polyedge-shadow-events" \
              "$storage_id/blobServices/default/containers/polyedge-research" \
              "$storage_id/blobServices/default/containers/$QSET_CONTROL_CONTAINER"; do
              test "$(az role assignment list --scope "$scope" --assignee "$principal" --include-inherited --query 'length(@)' -o tsv)" = "0"
            done
          done

      - name: Reconcile complete qset resources to frozen Bicep
        if: env.BOOTSTRAP_ALREADY_SEALED != 'true'
        run: |
          set -euo pipefail
          az deployment group what-if \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --template-file infra/shadow-profitability-qset-v1.bicep \
            --parameters backendImage="$BACKEND_IMAGE" enableDailySchedule=false initializeFreezeBoundary=true codeFreezeSha256="$SOURCE_FREEZE_SHA256" codeFreezeManifestPath="$SOURCE_FREEZE_PATH" \
            --result-format FullResourcePayloads \
            --no-pretty-print \
            -o json > qset-recovery-what-if.json
          jq -e '
            [ .changes[] | select(.changeType != "Ignore") ] as $changes
            | ($changes | length) == 23
            and all($changes[]; .changeType == "Modify")
            and ([ $changes[]
              | select(
                  (.resourceId | ascii_downcase | contains("/microsoft.authorization/roleassignments/")) or
                  (.resourceId | ascii_downcase | endswith("/microsoft.managedidentity/userassignedidentities/polyedge-shadow-qset-neu-id")) or
                  (.resourceId | ascii_downcase | endswith("/microsoft.managedidentity/userassignedidentities/polyedge-qset-research-neu-id")) or
                  (.resourceId | ascii_downcase | endswith("/blobservices/default/containers/polyedge-shadow-qset-events")) or
                  (.resourceId | ascii_downcase | endswith("/blobservices/default/containers/polyedge-research-qset")) or
                  (.resourceId | ascii_downcase | endswith("/blobservices/default/containers/polyedge-qset-control")) or
                  (.resourceId | ascii_downcase | endswith("/blobservices/default/containers/polyedge-qset-control/immutabilitypolicies/default")) or
                  (.resourceId | ascii_downcase | endswith("/tableservices/default/tables/shadowqseteventindex")) or
                  (.resourceId | ascii_downcase | endswith("/tableservices/default/tables/shadowqsetchartseries")) or
                  (.resourceId | ascii_downcase | endswith("/tableservices/default/tables/shadowqsetmarketcatalog")) or
                  (.resourceId | ascii_downcase | endswith("/microsoft.app/containerapps/polyedge-shadow-qset-neu")) or
                  (.resourceId | ascii_downcase | endswith("/microsoft.app/jobs/polyedge-shadow-qset-neu-job"))
                )
            ] | length) == 23
            and all(
              $changes[];
              (.resourceId | ascii_downcase) as $id
              | if ($id | endswith("/microsoft.app/containerapps/polyedge-shadow-qset-neu")) then
                  all(
                    .delta[]?;
                    (.path == "properties.configuration.maxInactiveRevisions" and .propertyChangeType == "Delete")
                    or (.path == "properties.configuration.registries" and .propertyChangeType == "Array")
                    or (.path == "properties.runningStatus" and .propertyChangeType == "Delete")
                    or (.path == "properties.template.containers" and .propertyChangeType == "Array")
                    or (.path == "properties.workloadProfileName" and .propertyChangeType == "Delete")
                  )
                elif ($id | endswith("/microsoft.app/jobs/polyedge-shadow-qset-neu-job")) then
                  all(
                    .delta[]?;
                    (.path == "properties.configuration.registries" and .propertyChangeType == "Array")
                    or (.path == "properties.template.containers" and .propertyChangeType == "Array")
                    or (.path == "properties.workloadProfileName" and .propertyChangeType == "Delete")
                  )
                elif ($id | contains("/microsoft.authorization/roleassignments/")) then
                  all(
                    .delta[]?;
                    (.path == "properties.principalId" and .propertyChangeType == "Modify")
                    or (.path == "properties.principalType" and .propertyChangeType == "NoEffect")
                  )
                elif (
                  ($id | endswith("/blobservices/default/containers/polyedge-shadow-qset-events"))
                  or ($id | endswith("/blobservices/default/containers/polyedge-research-qset"))
                  or ($id | endswith("/blobservices/default/containers/polyedge-qset-control"))
                ) then
                  all(
                    .delta[]?;
                    (.path == "properties.defaultEncryptionScope" and .propertyChangeType == "Delete")
                    or (.path == "properties.denyEncryptionScopeOverride" and .propertyChangeType == "Delete")
                  )
                else
                  (.delta // [] | length) == 0
                end
            )
          ' qset-recovery-what-if.json
          test "$(date -u +%s)" -lt "$(date -u -d "$RECOVERY_SEAL_DEADLINE_UTC" +%s)"
          az deployment group create \
            --name "polyedge-shadow-qset-v1-recovery-$GITHUB_RUN_ID" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --template-file infra/shadow-profitability-qset-v1.bicep \
            --parameters backendImage="$BACKEND_IMAGE" enableDailySchedule=false initializeFreezeBoundary=true codeFreezeSha256="$SOURCE_FREEZE_SHA256" codeFreezeManifestPath="$SOURCE_FREEZE_PATH" \
            --only-show-errors \
            -o none
          writer=$(az identity show --resource-group "$AZURE_RESOURCE_GROUP" --name polyedge-shadow-qset-neu-id --query principalId -o tsv)
          researcher=$(az identity show --resource-group "$AZURE_RESOURCE_GROUP" --name polyedge-qset-research-neu-id --query principalId -o tsv)
          storage_id=$(az storage account show --resource-group "$AZURE_RESOURCE_GROUP" --name "$STORAGE_ACCOUNT" --query id -o tsv)
          acr_id=$(az acr show --resource-group "$AZURE_RESOURCE_GROUP" --name crpolyedge6urdjr5nmwx7w --query id -o tsv)
          az role assignment list --assignee "$writer" --all -o json \
            | jq -r '.[] | "\(.roleDefinitionName)|\(.scope | ascii_downcase)"' \
            | sort -u > writer-roles-actual.txt
          {
            printf 'AcrPull|%s\n' "$(tr 'A-Z' 'a-z' <<<"$acr_id")"
            printf 'Storage Blob Data Contributor|%s/blobservices/default/containers/%s\n' "$(tr 'A-Z' 'a-z' <<<"$storage_id")" "$QSET_EVENTS_CONTAINER"
            for table in ShadowQsetChartSeries ShadowQsetEventIndex ShadowQsetMarketCatalog; do
              printf 'Storage Table Data Contributor|%s/tableservices/default/tables/%s\n' "$(tr 'A-Z' 'a-z' <<<"$storage_id")" "$(tr 'A-Z' 'a-z' <<<"$table")"
            done
          } | sort -u > writer-roles-expected.txt
          cmp -s writer-roles-expected.txt writer-roles-actual.txt

          az role assignment list --assignee "$researcher" --all -o json \
            | jq -r '.[] | "\(.roleDefinitionName)|\(.scope | ascii_downcase)"' \
            | sort -u > researcher-roles-actual.txt
          {
            printf 'AcrPull|%s\n' "$(tr 'A-Z' 'a-z' <<<"$acr_id")"
            printf 'Storage Blob Data Contributor|%s/blobservices/default/containers/%s\n' "$(tr 'A-Z' 'a-z' <<<"$storage_id")" "$QSET_RESEARCH_CONTAINER"
            printf 'Storage Blob Data Reader|%s/blobservices/default/containers/%s\n' "$(tr 'A-Z' 'a-z' <<<"$storage_id")" "$QSET_EVENTS_CONTAINER"
          } | sort -u > researcher-roles-expected.txt
          cmp -s researcher-roles-expected.txt researcher-roles-actual.txt

      - name: Snapshot predecessor and non-reader state
        run: |
          set -euo pipefail
          test "$(az containerapp job execution list --resource-group "$AZURE_RESOURCE_GROUP" --name "$LEGACY_JOB" --query '[?properties.status==`Running`] | length(@)' -o tsv)" = "0"
          az containerapp show --resource-group "$AZURE_RESOURCE_GROUP" --name "$LEGACY_APP" -o json \
            | jq -S '{id,identity,configuration:(.properties.configuration | .secrets = [(.secrets[]? | {name})]),template:.properties.template,latestRevisionName:.properties.latestRevisionName}' \
            > legacy-app-before.json
          az containerapp job show --resource-group "$AZURE_RESOURCE_GROUP" --name "$LEGACY_JOB" -o json \
            | jq -S '{id,identity,configuration:(.properties.configuration | .secrets = [(.secrets[]? | {name})]),template:.properties.template}' \
            > legacy-job-before.json
          az containerapp show --resource-group "$AZURE_RESOURCE_GROUP" --name "$MAIN_APP" -o json \
            | jq -S '{
                id,
                identity,
                configuration:(.properties.configuration | .secrets = [(.secrets[]? | {name})]),
                template:(
                  .properties.template
                  | .containers = [
                      .containers[]
                      | if .name == "bot" then
                          .image = "<active-reader-image>"
                          | .env = [
                              .env[]?
                              | select(
                                  .name != "AZURE_SHADOW_RESEARCH_STORAGE_CONTAINER_NAME"
                                  and .name != "SHADOW_CAMPAIGN_ID"
                                  and .name != "SHADOW_CAMPAIGN_START"
                                  and .name != "SHADOW_CAMPAIGN_REPORT_ROOT"
                                  and .name != "SHADOW_CORRECTION_ROOT"
                                )
                            ]
                        elif .name == "frontend" then
                          .image = "<active-reader-image>"
                        else .
                        end
                    ]
                )
              }' > main-app-nonreader-before.json
          for prefix in \
            "data/research/shadow/$LEGACY_CAMPAIGN_ID/" \
            "reports/research/shadow/campaigns/$LEGACY_CAMPAIGN_ID/"; do
            az storage blob list \
              --account-name "$STORAGE_ACCOUNT" \
              --container-name polyedge-research \
              --prefix "$prefix" \
              --auth-mode login \
              --query '[].{name:name,etag:properties.etag,size:properties.contentLength}' \
              -o json
          done | jq -s 'add | sort_by(.name)' > legacy-artifacts-before.json

      - name: Restart exact frozen recorder after RBAC propagation
        if: env.BOOTSTRAP_ALREADY_SEALED != 'true'
        run: |
          set -euo pipefail
          revision=$(az containerapp show --resource-group "$AZURE_RESOURCE_GROUP" --name "$QSET_APP" --query properties.latestReadyRevisionName -o tsv)
          test -n "$revision"
          az storage blob list \
            --account-name "$STORAGE_ACCOUNT" \
            --container-name "$QSET_EVENTS_CONTAINER" \
            --prefix "shadow-events/preflight/$CAMPAIGN_ID/" \
            --auth-mode login \
            --query '[].{name:name,etag:properties.etag,lastModified:properties.lastModified}' \
            -o json > preflight-before-restart.json
          test "$(jq 'length' preflight-before-restart.json)" -gt 0
          az containerapp revision restart \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$QSET_APP" \
            --revision "$revision" \
            --only-show-errors \
            -o none
          replica_ready=false
          for attempt in $(seq 1 45); do
            az containerapp replica list \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --name "$QSET_APP" \
              --revision "$revision" \
              -o json > qset-replicas.json
            if jq -e 'length == 1 and all(.[]; all(.properties.containers[]; .ready == true and .runningState == "Running" and (.restartCount // 0) == 0))' qset-replicas.json >/dev/null; then
              replica_ready=true
              break
            fi
            sleep 10
          done
          test "$replica_ready" = "true"
          az storage blob list \
            --account-name "$STORAGE_ACCOUNT" \
            --container-name "$QSET_EVENTS_CONTAINER" \
            --prefix "shadow-events/preflight/$CAMPAIGN_ID/" \
            --auth-mode login \
            --query '[].{name:name,etag:properties.etag,lastModified:properties.lastModified}' \
            -o json > preflight-at-ready.json
          test "$(jq 'length' preflight-at-ready.json)" -gt 0
          new_write=false
          for attempt in $(seq 1 60); do
            az storage blob list \
              --account-name "$STORAGE_ACCOUNT" \
              --container-name "$QSET_EVENTS_CONTAINER" \
              --prefix "shadow-events/preflight/$CAMPAIGN_ID/" \
              --auth-mode login \
              --query '[].{name:name,etag:properties.etag,lastModified:properties.lastModified}' \
              -o json > preflight-after-restart.json
            if jq -e --slurpfile before preflight-at-ready.json '
              [
                .[]
                | . as $current
                | select(
                    (($before[0] | map(select(.name == $current.name))[0].etag // null) != $current.etag)
                  )
              ]
              | length > 0
            ' preflight-after-restart.json >/dev/null; then
              new_write=true
              break
            fi
            sleep 10
          done
          test "$new_write" = "true"
          test "$(az containerapp show --resource-group "$AZURE_RESOURCE_GROUP" --name "$QSET_APP" --query 'properties.template.containers[0].image' -o tsv)" = "$BACKEND_IMAGE"

      - name: Deploy active Labs reader only
        if: env.BOOTSTRAP_ALREADY_SEALED != 'true'
        run: |
          set -euo pipefail
          az containerapp update \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$MAIN_APP" \
            --container-name bot \
            --image "$BACKEND_IMAGE" \
            --set-env-vars \
              "AZURE_SHADOW_RESEARCH_STORAGE_CONTAINER_NAME=$QSET_RESEARCH_CONTAINER" \
              "SHADOW_CAMPAIGN_ID=$CAMPAIGN_ID" \
              "SHADOW_CAMPAIGN_START=$CAMPAIGN_START" \
              "SHADOW_CAMPAIGN_REPORT_ROOT=reports/research/shadow/campaigns/$CAMPAIGN_ID" \
              "SHADOW_CORRECTION_ROOT=reports/research/shadow/campaigns/$CAMPAIGN_ID/corrections" \
            --only-show-errors -o none
          az containerapp update \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$MAIN_APP" \
            --container-name frontend \
            --image "$FRONTEND_IMAGE" \
            --only-show-errors -o none

      - name: Verify live Labs routing and paper boundary
        env:
          DASHBOARD_AUTH_PASSWORD: ${{ secrets.DASHBOARD_AUTH_PASSWORD }}
        run: |
          set -euo pipefail
          app_json=$(az containerapp show --resource-group "$AZURE_RESOURCE_GROUP" --name "$MAIN_APP" -o json)
          test "$(jq -r '.properties.template.containers[] | select(.name == "bot") | .image' <<<"$app_json")" = "$BACKEND_IMAGE"
          test "$(jq -r '.properties.template.containers[] | select(.name == "frontend") | .image' <<<"$app_json")" = "$FRONTEND_IMAGE"
          test "$(jq -r '.properties.template.containers[] | select(.name == "bot") | .env[] | select(.name == "SHADOW_CAMPAIGN_ID") | .value' <<<"$app_json")" = "$CAMPAIGN_ID"
          test "$(jq -r '.properties.template.containers[] | select(.name == "bot") | .env[] | select(.name == "AZURE_SHADOW_RESEARCH_STORAGE_CONTAINER_NAME") | .value' <<<"$app_json")" = "$QSET_RESEARCH_CONTAINER"
          for pair in EXECUTION_MODE=paper ALLOW_LIVE=false RUN_BOT_ON_STARTUP=true ENABLE_TAKER_ORDERS=false REQUIRE_API_AUTH=true; do
            name=${pair%%=*}
            value=${pair#*=}
            test "$(jq -r --arg name "$name" '.properties.template.containers[] | select(.name == "bot") | .env[] | select(.name == $name) | .value' <<<"$app_json")" = "$value"
          done
          fqdn=$(jq -r '.properties.configuration.ingress.fqdn' <<<"$app_json")
          login_body=$(jq -nc --arg password "$DASHBOARD_AUTH_PASSWORD" '{password:$password}')
          ready=false
          for attempt in $(seq 1 40); do
            code=$(curl -sS -o login.json -c cookies.txt -w '%{http_code}' -H 'content-type: application/json' --data "$login_body" "https://$fqdn/api/auth/login" || true)
            if [ "$code" = 200 ]; then
              ready=true
              break
            fi
            sleep 10
          done
          unset login_body
          test "$ready" = "true"
          curl --fail --silent --show-error -b cookies.txt "https://$fqdn/api/backend/status" -o live-status.json
          curl --fail --silent --show-error -b cookies.txt "https://$fqdn/api/backend/labs/reports/latest" -o live-labs-latest.json
          curl --fail --silent --show-error -b cookies.txt "https://$fqdn/api/backend/labs/reports/daily/2026-07-23" -o live-labs-archived.json
          jq -e --arg sha "$FROZEN_SOURCE_COMMIT" '.execution_mode == "paper" and .git_sha == $sha' live-status.json
          jq -e --arg id "$CAMPAIGN_ID" '.campaign_id == $id and .status == "awaiting_first_sealed_day"' live-labs-latest.json
          jq -e --arg id "$LEGACY_CAMPAIGN_ID" '.campaign_id == $id and .status == "historical_ineligible"' live-labs-archived.json

      - name: Re-prove predecessor state and seal freeze pointer
        run: |
          set -euo pipefail
          if [ "$BOOTSTRAP_RECOVERY_MODE" = "sealed_verify" ]; then
            test "$(date -u +%s)" -lt "$(date -u -d "$CAMPAIGN_CUTOVER_UTC" +%s)"
          else
            test "$(date -u +%s)" -lt "$(date -u -d "$RECOVERY_SEAL_DEADLINE_UTC" +%s)"
          fi
          test "$(az storage blob list --account-name "$STORAGE_ACCOUNT" --container-name "$QSET_RESEARCH_CONTAINER" --prefix "reports/research/shadow/campaigns/$CAMPAIGN_ID/" --auth-mode login --query 'length(@)' -o tsv)" = "0"
          test "$(az storage blob list --account-name "$STORAGE_ACCOUNT" --container-name "$QSET_EVENTS_CONTAINER" --prefix "shadow-events/$CAMPAIGN_ID/" --auth-mode login --query 'length(@)' -o tsv)" = "0"
          az containerapp show --resource-group "$AZURE_RESOURCE_GROUP" --name "$LEGACY_APP" -o json \
            | jq -S '{id,identity,configuration:(.properties.configuration | .secrets = [(.secrets[]? | {name})]),template:.properties.template,latestRevisionName:.properties.latestRevisionName}' \
            > legacy-app-after.json
          az containerapp job show --resource-group "$AZURE_RESOURCE_GROUP" --name "$LEGACY_JOB" -o json \
            | jq -S '{id,identity,configuration:(.properties.configuration | .secrets = [(.secrets[]? | {name})]),template:.properties.template}' \
            > legacy-job-after.json
          az containerapp show --resource-group "$AZURE_RESOURCE_GROUP" --name "$MAIN_APP" -o json \
            | jq -S '{
                id,
                identity,
                configuration:(.properties.configuration | .secrets = [(.secrets[]? | {name})]),
                template:(
                  .properties.template
                  | .containers = [
                      .containers[]
                      | if .name == "bot" then
                          .image = "<active-reader-image>"
                          | .env = [
                              .env[]?
                              | select(
                                  .name != "AZURE_SHADOW_RESEARCH_STORAGE_CONTAINER_NAME"
                                  and .name != "SHADOW_CAMPAIGN_ID"
                                  and .name != "SHADOW_CAMPAIGN_START"
                                  and .name != "SHADOW_CAMPAIGN_REPORT_ROOT"
                                  and .name != "SHADOW_CORRECTION_ROOT"
                                )
                            ]
                        elif .name == "frontend" then
                          .image = "<active-reader-image>"
                        else .
                        end
                    ]
                )
              }' > main-app-nonreader-after.json
          for prefix in \
            "data/research/shadow/$LEGACY_CAMPAIGN_ID/" \
            "reports/research/shadow/campaigns/$LEGACY_CAMPAIGN_ID/"; do
            az storage blob list \
              --account-name "$STORAGE_ACCOUNT" \
              --container-name polyedge-research \
              --prefix "$prefix" \
              --auth-mode login \
              --query '[].{name:name,etag:properties.etag,size:properties.contentLength}' \
              -o json
          done | jq -s 'add | sort_by(.name)' > legacy-artifacts-after.json
          cmp -s legacy-app-before.json legacy-app-after.json
          cmp -s legacy-job-before.json legacy-job-after.json
          cmp -s legacy-artifacts-before.json legacy-artifacts-after.json
          cmp -s main-app-nonreader-before.json main-app-nonreader-after.json

          qset_app_sha=$(az containerapp show --resource-group "$AZURE_RESOURCE_GROUP" --name "$QSET_APP" -o json | jq -S '{identity,managedEnvironmentId:.properties.managedEnvironmentId,workloadProfileName:.properties.workloadProfileName,configuration:(.properties.configuration | .secrets = [(.secrets[]? | {name})]),template:.properties.template}' | sha256sum | cut -d' ' -f1)
          qset_job_evidence_sha=$(az containerapp job show --resource-group "$AZURE_RESOURCE_GROUP" --name "$QSET_JOB" -o json | jq -S '{
            identity,
            environmentId:.properties.environmentId,
            workloadProfileName:.properties.workloadProfileName,
            evidence_configuration:{
              registries:.properties.configuration.registries,
              replicaRetryLimit:.properties.configuration.replicaRetryLimit,
              replicaTimeout:.properties.configuration.replicaTimeout
            },
            template:.properties.template
          }' | sha256sum | cut -d' ' -f1)
          main_labs_reader_sha=$(az containerapp show --resource-group "$AZURE_RESOURCE_GROUP" --name "$MAIN_APP" -o json | jq -S '{
            identity,
            reader_containers:([
              .properties.template.containers[]
              | select(.name == "bot" or .name == "frontend")
              | {
                  name,
                  image,
                  env:([
                    .env[]?
                    | {name,value,secretRef}
                  ] | sort_by(.name))
                }
            ] | sort_by(.name))
          }' | sha256sum | cut -d' ' -f1)
          legacy_app_sha=$(sha256sum legacy-app-after.json | cut -d' ' -f1)
          legacy_job_sha=$(sha256sum legacy-job-after.json | cut -d' ' -f1)
          legacy_artifacts_sha=$(sha256sum legacy-artifacts-after.json | cut -d' ' -f1)
          jq -n \
            --arg campaign_id "$CAMPAIGN_ID" \
            --arg source_path "$SOURCE_FREEZE_PATH" \
            --arg source_sha256 "$SOURCE_FREEZE_SHA256" \
            --arg qset_app_sha256 "sha256:$qset_app_sha" \
            --arg qset_job_evidence_sha256 "sha256:$qset_job_evidence_sha" \
            --arg main_labs_reader_sha256 "sha256:$main_labs_reader_sha" \
            --arg legacy_app_sha256 "sha256:$legacy_app_sha" \
            --arg legacy_job_sha256 "sha256:$legacy_job_sha" \
            --arg legacy_artifacts_sha256 "sha256:$legacy_artifacts_sha" \
            --arg deployed_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg recovery_run_id "$GITHUB_RUN_ID" \
            '{
              schema:"polyedge.shadow_code_freeze_pointer.v1",
              campaign_id:$campaign_id,
              source_manifest:{path:$source_path,sha256:$source_sha256},
              live_invariants:{
                qset_app_sha256:$qset_app_sha256,
                qset_job_evidence_sha256:$qset_job_evidence_sha256,
                main_labs_reader_sha256:$main_labs_reader_sha256,
                predecessor_app_sha256:$legacy_app_sha256,
                predecessor_job_sha256:$legacy_job_sha256,
                predecessor_artifacts_sha256:$legacy_artifacts_sha256
              },
              bootstrap_recovery:{
                failed_initial_run_id:"30238484780",
                recovery_run_id:$recovery_run_id,
                reason:"initial_managed_identity_rbac_propagation_restarts",
                evidence_source_unchanged:true
              },
              deployed_at:$deployed_at,
              code_frozen:true
            }' > active-freeze.json
          active_path="reports/research/shadow/campaigns/$CAMPAIGN_ID/control/code-freeze/active.json"
          if [ "$ACTIVE_POINTER_EXISTS" = "true" ]; then
            az storage blob download \
              --account-name "$STORAGE_ACCOUNT" \
              --container-name "$QSET_CONTROL_CONTAINER" \
              --name "$active_path" \
              --file active-freeze-verified.json \
              --auth-mode login \
              --overwrite \
              --only-show-errors \
              -o none
            jq -e \
              --arg qset_app_sha256 "sha256:$qset_app_sha" \
              --arg qset_job_evidence_sha256 "sha256:$qset_job_evidence_sha" \
              --arg main_labs_reader_sha256 "sha256:$main_labs_reader_sha" \
              --arg legacy_app_sha256 "sha256:$legacy_app_sha" \
              --arg legacy_job_sha256 "sha256:$legacy_job_sha" \
              --arg legacy_artifacts_sha256 "sha256:$legacy_artifacts_sha" \
              '
                .live_invariants.qset_app_sha256 == $qset_app_sha256
                and .live_invariants.qset_job_evidence_sha256 == $qset_job_evidence_sha256
                and .live_invariants.main_labs_reader_sha256 == $main_labs_reader_sha256
                and .live_invariants.predecessor_app_sha256 == $legacy_app_sha256
                and .live_invariants.predecessor_job_sha256 == $legacy_job_sha256
                and .live_invariants.predecessor_artifacts_sha256 == $legacy_artifacts_sha256
              ' active-freeze-verified.json
          else
            az storage blob upload \
              --account-name "$STORAGE_ACCOUNT" \
              --container-name "$QSET_CONTROL_CONTAINER" \
              --name "$active_path" \
              --file active-freeze.json \
              --auth-mode login \
              --overwrite false \
              --content-type application/json \
              --only-show-errors \
              -o none
            az storage blob download \
              --account-name "$STORAGE_ACCOUNT" \
              --container-name "$QSET_CONTROL_CONTAINER" \
              --name "$active_path" \
              --file active-freeze-verified.json \
              --auth-mode login \
              --overwrite \
              --only-show-errors \
              -o none
            cmp -s active-freeze.json active-freeze-verified.json
          fi

      - name: Lock dedicated freeze-control WORM boundary
        run: |
          set -euo pipefail
          if [ "$BOOTSTRAP_RECOVERY_MODE" = "sealed_verify" ]; then
            test "$(date -u +%s)" -lt "$(date -u -d "$CAMPAIGN_CUTOVER_UTC" +%s)"
          else
            test "$(date -u +%s)" -lt "$(date -u -d "$RECOVERY_SEAL_DEADLINE_UTC" +%s)"
          fi
          test "$(az storage blob list --account-name "$STORAGE_ACCOUNT" --container-name "$QSET_RESEARCH_CONTAINER" --prefix "reports/research/shadow/campaigns/$CAMPAIGN_ID/" --auth-mode login --query 'length(@)' -o tsv)" = "0"
          test "$(az storage blob list --account-name "$STORAGE_ACCOUNT" --container-name "$QSET_EVENTS_CONTAINER" --prefix "shadow-events/$CAMPAIGN_ID/" --auth-mode login --query 'length(@)' -o tsv)" = "0"
          policy_json=$(az storage container immutability-policy show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --account-name "$STORAGE_ACCOUNT" \
            --container-name "$QSET_CONTROL_CONTAINER" \
            -o json)
          test "$(jq -r '.immutabilityPeriodSinceCreationInDays' <<<"$policy_json")" = "90"
          case "$(jq -r '.state' <<<"$policy_json")" in
            Unlocked)
              etag=$(jq -r '.etag' <<<"$policy_json")
              test -n "$etag"
              az storage container immutability-policy lock \
                --resource-group "$AZURE_RESOURCE_GROUP" \
                --account-name "$STORAGE_ACCOUNT" \
                --container-name "$QSET_CONTROL_CONTAINER" \
                --if-match "$etag" \
                --only-show-errors \
                -o none
              ;;
            Locked) ;;
            *) exit 1 ;;
          esac
          locked_json=$(az storage container immutability-policy show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --account-name "$STORAGE_ACCOUNT" \
            --container-name "$QSET_CONTROL_CONTAINER" \
            -o json)
          test "$(jq -r '.state' <<<"$locked_json")" = "Locked"
          test "$(jq -r '.immutabilityPeriodSinceCreationInDays' <<<"$locked_json")" = "90"

      - name: Final funded and recorder safety proof
        run: |
          set -euo pipefail
          test "$(az containerapp job show --resource-group "$AZURE_RESOURCE_GROUP" --name "$QSET_JOB" --query properties.configuration.triggerType -o tsv)" = "Manual"
          test "$(az containerapp job execution list --resource-group "$AZURE_RESOURCE_GROUP" --name "$QSET_JOB" --query '[?properties.status==`Running`] | length(@)' -o tsv)" = "0"
          for spec in \
            "polyedge-venue-probe-neu-job|ALLOW_LIVE" \
            "polyedge-redeem-neu-job|VENUE_REDEMPTION_ENABLED" \
            "polyedge-strategy-canary-neu-job|STRATEGY_CANARY_CONTROLLER_ENABLED" \
            "polyedge-funded-ladder-neu-job|FUNDED_LADDER_CONTROLLER_ENABLED" \
            "polyedge-promotion-neu-job|PROMOTION_TRANSITION_ENABLED" \
            "polyedge-venue-model-job|QUEUE_MODEL_TRAINING_ENABLED"; do
            job=${spec%%|*}
            flag=${spec#*|}
            test "$(az containerapp job show --resource-group "$AZURE_RESOURCE_GROUP" --name "$job" --query properties.configuration.triggerType -o tsv)" = "Manual"
            test "$(az containerapp job execution list --resource-group "$AZURE_RESOURCE_GROUP" --name "$job" --query '[?properties.status==`Running`] | length(@)' -o tsv)" = "0"
            test "$(az containerapp job show --resource-group "$AZURE_RESOURCE_GROUP" --name "$job" --query "properties.template.containers[0].env[?name=='$flag'].value | [0]" -o tsv)" = "false"
          done
          revision=$(az containerapp show --resource-group "$AZURE_RESOURCE_GROUP" --name "$QSET_APP" --query properties.latestReadyRevisionName -o tsv)
          az containerapp replica list --resource-group "$AZURE_RESOURCE_GROUP" --name "$QSET_APP" --revision "$revision" -o json > qset-replicas-final.json
          jq -e 'length == 1 and all(.[]; all(.properties.containers[]; .ready == true and .runningState == "Running" and (.restartCount // 0) == 0))' qset-replicas-final.json
