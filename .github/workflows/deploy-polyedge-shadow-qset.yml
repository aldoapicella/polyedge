name: Validate clean PolyEdge qset successor

on:
  pull_request:
    paths:
      - ".github/workflows/deploy-polyedge-shadow-qset.yml"
      - "crates/polyedge-reporting/src/research/projected_cache.rs"
      - "ops/conduit/bin/polyedge-run-job"
      - "ops/conduit/env/jobs.env.example"
      - "research/configs/*qset*"
      - "research/run_shadow_daily.sh"
      - "research/verify_shadow_daily_bundle.sh"
      - "research/test_*shadow_daily*.sh"
  workflow_dispatch:
    inputs:
      confirm_campaign_id:
        description: Type campaign-2026-08-22-qset-v2
        required: true
        type: string
      research_image:
        description: Immutable multi-architecture GHCR research image digest
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: polyedge-shadow-qset-v2-validation
  cancel-in-progress: false

env:
  CAMPAIGN_ID: campaign-2026-08-22-qset-v2
  CAMPAIGN_START: "2026-08-22"
  EVIDENCE_VERSION: protocol-v3-qset-v2
  CAMPAIGN_CONTRACT: research/configs/profitability_gate_v3_2026-08-22_qset_v2.yaml
  FREEZE_POLICY: research/configs/campaign_freeze_2026-08-22_qset_v2.json
  DISPOSITION: research/configs/protocol-v3-campaign-disposition-2026-08-22-qset-v2.json

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate exact successor and immutable retirement
        env:
          CONFIRM_CAMPAIGN_ID: ${{ inputs.confirm_campaign_id }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = workflow_dispatch ]; then
            test "$CONFIRM_CAMPAIGN_ID" = "$CAMPAIGN_ID"
          fi
          test "$(jq -r '.campaign_id' "$FREEZE_POLICY")" = "$CAMPAIGN_ID"
          test "$(jq -r '.evidence_version' "$FREEZE_POLICY")" = "$EVIDENCE_VERSION"
          test "$(jq -r '.start_date' "$FREEZE_POLICY")" = "$CAMPAIGN_START"
          test "$(jq -r '.active_campaign.campaign_id' "$DISPOSITION")" = "$CAMPAIGN_ID"
          test "$(jq -r '.active_campaign.code_frozen' "$DISPOSITION")" = false
          jq -e '.archived_campaigns[] | select(.campaign_id == "campaign-2026-07-28-qset-v1") | .promotion_eligible == false and .artifacts_mutable == false' "$DISPOSITION"
          grep -Fx "  id: $CAMPAIGN_ID" "$CAMPAIGN_CONTRACT"
          grep -Fx "  start_date: $CAMPAIGN_START" "$CAMPAIGN_CONTRACT"
          grep -Fx "  event_blob_prefix: shadow-events/$CAMPAIGN_ID" "$CAMPAIGN_CONTRACT"
          grep -Fx "  lease_blob: data/research/shadow/$CAMPAIGN_ID/control/replay.lock" "$CAMPAIGN_CONTRACT"
          echo "1311fce312aee52f039b61024472118be030a083c40e0f48249c7dda61c4deac  research/configs/profitability_gate_v3_2026-07-28_qset_v1.yaml" | sha256sum -c -
          echo "534fc08f695add40fe35cdff2d96555da2cd51c0ffc75008354265aa98e377b2  research/configs/campaign_freeze_2026-07-28_qset_v1.json" | sha256sum -c -
          echo "942c50f1d95ff8aa64de608d5d938970943279bb635e3da2c3a561f740f35b4c  research/configs/protocol-v3-campaign-disposition-2026-07-28-qset-v1.json" | sha256sum -c -

      - name: Validate fail-closed runner and sealed source
        run: |
          set -euo pipefail
          sh -n research/run_shadow_daily.sh research/verify_shadow_daily_bundle.sh ops/conduit/bin/polyedge-run-job
          sh research/test_run_shadow_daily.sh
          sh research/test_verify_shadow_daily_bundle.sh
          sh ops/conduit/test/test-run-job-mappings.sh
          cargo test -p polyedge-reporting raw_inventory_field_mutation_changes_identity_and_requires_rehash

  source-freeze:
    if: github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build review-only immutable source manifest
        env:
          RESEARCH_IMAGE: ${{ inputs.research_image }}
        run: |
          set -euo pipefail
          printf '%s' "$RESEARCH_IMAGE" | grep -Eq '^ghcr\.io/[^[:space:]@]+/[^[:space:]@]+@sha256:[0-9a-f]{64}$'
          : > critical-files.ndjson
          while IFS= read -r file; do
            test -f "$file"
            jq -nc --arg path "$file" --arg sha256 "sha256:$(sha256sum "$file" | cut -d' ' -f1)" --argjson bytes "$(wc -c <"$file")"               '{path:$path,sha256:$sha256,bytes:$bytes}' >> critical-files.ndjson
          done < <(jq -r '.protected_files[]' "$FREEZE_POLICY")
          jq -s --arg campaign_id "$CAMPAIGN_ID" --arg evidence_version "$EVIDENCE_VERSION"             --arg source_commit "$GITHUB_SHA" --arg git_tree "$(git rev-parse 'HEAD^{tree}')"             --arg research_image "$RESEARCH_IMAGE"             --arg contract_sha256 "sha256:$(sha256sum "$CAMPAIGN_CONTRACT" | cut -d' ' -f1)"             --arg policy_sha256 "sha256:$(sha256sum "$FREEZE_POLICY" | cut -d' ' -f1)"             '{schema:"polyedge.shadow_source_freeze.v1",campaign_id:$campaign_id,evidence_version:$evidence_version,source_commit:$source_commit,git_tree:$git_tree,research_image:$research_image,campaign_contract_sha256:$contract_sha256,freeze_policy_sha256:$policy_sha256,critical_files:.}'             critical-files.ndjson > source-freeze.json
          jq -e --arg id "$CAMPAIGN_ID" --arg version "$EVIDENCE_VERSION" '.campaign_id == $id and .evidence_version == $version and (.critical_files | length) > 0' source-freeze.json

      - uses: actions/upload-artifact@v4
        with:
          name: qset-v2-source-freeze-${{ github.sha }}
          path: source-freeze.json
          if-no-files-found: error
          retention-days: 7
