            --only-show-errors -o none
          test "sha256:$(sha256sum v5-capital-reserve-state.json | cut -d' ' -f1)" = \
            "sha256:9e63db7ef8c22d3af53a14f1858b817b8769ca7ba737e6668a900ffb73330c15"
          jq -e '
            .schema == "polyedge.protected_compounding_state.v1"
            and .session_id == "dynamic-quote-funded-2026-07-29-v5"
            and .reconciliation_complete == true
            and .historical_high_water_equity >= 102.78112
            and .high_water_equity >= 102.78112
            and (.last_reconciled_equity - 29.505501 | fabs) <= 0.01
          ' v5-capital-reserve-state.json

      - name: Deploy and verify the pointer-only preflight Dynamic Quote intent producer
        id: pointer_preflight_producer
        run: |
          set -euo pipefail
          echo "FUNDED_POINTER_PREFLIGHT_REQUESTED=true" >> "$GITHUB_ENV"
          az containerapp update \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$INTENT_PRODUCER_APP" \
            --image "${{ steps.images.outputs.producer_reference }}" \
            --set-env-vars \
              RUN_BOT_ON_STARTUP=true \
              FUNDED_DIRECT_SERVICE_BUS_ENABLED=true \
              FUNDED_DIRECT_SERVICE_BUS_NAMESPACE="$SERVICE_BUS_NAMESPACE" \
              FUNDED_DIRECT_SERVICE_BUS_QUEUE="$SERVICE_BUS_QUEUE" \
              STRATEGY_INTENT_POINTER_ONLY_PREFLIGHT=true \
              LOCAL_JSONL_RECORDER_ENABLED=false \
            --only-show-errors \
            -o none
          producer_revision=$(az containerapp show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$INTENT_PRODUCER_APP" \
            --query properties.latestRevisionName -o tsv)
          test -n "$producer_revision"
          for attempt in $(seq 1 36); do
            az containerapp revision list \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --name "$INTENT_PRODUCER_APP" \
              -o json > producer-revisions.json
            active_count=$(jq '[.[] | select(.properties.active == true)] | length' producer-revisions.json)
            active_revision=$(jq -r '[.[] | select(.properties.active == true)][0].name // ""' producer-revisions.json)
            health=$(jq -r --arg revision "$producer_revision" \
              '.[] | select(.name == $revision) | .properties.healthState // ""' producer-revisions.json)
            replicas=$(jq -r --arg revision "$producer_revision" \
              '.[] | select(.name == $revision) | .properties.replicas // 0' producer-revisions.json)
            if [ "$active_count" = "1" ] && \
                [ "$active_revision" = "$producer_revision" ] && \
                [ "$health" = "Healthy" ] && \
                [ "$replicas" -ge 1 ]; then
              break
            fi
            sleep 10
          done
          test "$active_count" = "1"
          test "$active_revision" = "$producer_revision"
          test "$health" = "Healthy"
          test "$replicas" -ge 1
          producer_image=$(az containerapp show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$INTENT_PRODUCER_APP" \
            --query properties.template.containers[0].image -o tsv)
          test "$producer_image" = "${{ steps.images.outputs.producer_reference }}"
          az containerapp show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$INTENT_PRODUCER_APP" \
            -o json > intent-producer-pointer-preflight.json
          producer_pointer_env() {
            jq -er --arg name "$1" '
              [.properties.template.containers[0].env[]
                | select(.name == $name) | .value]
              | if length == 1 then .[0]
                else error("expected one pointer-only producer environment value for " + $name)
                end
            ' intent-producer-pointer-preflight.json
          }
          test "$(producer_pointer_env EXECUTION_MODE)" = "paper"
          test "$(producer_pointer_env ALLOW_LIVE)" = "false"
          test "$(producer_pointer_env RUN_BOT_ON_STARTUP)" = "true"
          test "$(producer_pointer_env STRATEGY_INTENT_OPERATOR_DIRECT)" = "true"
          test "$(producer_pointer_env STRATEGY_INTENT_POINTER_ONLY_PREFLIGHT)" = "true"
          test "$(producer_pointer_env FUNDED_DIRECT_SERVICE_BUS_ENABLED)" = "true"
          test "$(producer_pointer_env FUNDED_DIRECT_SERVICE_BUS_NAMESPACE)" = "$SERVICE_BUS_NAMESPACE"
          test "$(producer_pointer_env FUNDED_DIRECT_SERVICE_BUS_QUEUE)" = "$SERVICE_BUS_QUEUE"
          jq -e '
            ([.properties.template.containers[0].env[]
              | select(.name == "POLYMARKET_PRIVATE_KEY")]
             | length) == 0
          ' intent-producer-pointer-preflight.json >/dev/null
          pointer_preflight_intent_prefix=$(producer_pointer_env STRATEGY_CANARY_INTENT_PREFIX)
          pointer_preflight_intent_container=$(producer_pointer_env AZURE_STORAGE_CONTAINER_NAME)
          [[ "$pointer_preflight_intent_prefix" =~ /intents$ ]]
          test -n "$pointer_preflight_intent_container"
          pointer_preflight_current_blob="${pointer_preflight_intent_prefix%/intents}/current-funded-intent.json"
          pointer_preflight_cutoff_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          pointer_preflight_cutoff_epoch=$(date -u +%s)
          pointer_before_exists=false
          pointer_before_etag=""
          pointer_show_stderr=$(mktemp)
          if az storage blob show \
            --account-name "$STORAGE_ACCOUNT" \
            --container-name "$pointer_preflight_intent_container" \
            --name "$pointer_preflight_current_blob" \
            --auth-mode login --only-show-errors -o json > pointer-before-preflight.json \
            2>"$pointer_show_stderr"; then
            pointer_before_exists=true
            pointer_before_etag=$(jq -er '.properties.etag' pointer-before-preflight.json)
            test -n "$pointer_before_etag"
          elif grep -Eq 'BlobNotFound|404' "$pointer_show_stderr"; then
            rm -f "$pointer_show_stderr"
          else
            cat "$pointer_show_stderr" >&2
            exit 1
          fi
          echo "cutoff_at=$pointer_preflight_cutoff_at" >> "$GITHUB_OUTPUT"
          echo "cutoff_epoch=$pointer_preflight_cutoff_epoch" >> "$GITHUB_OUTPUT"
          echo "intent_prefix=$pointer_preflight_intent_prefix" >> "$GITHUB_OUTPUT"
          echo "intent_container=$pointer_preflight_intent_container" >> "$GITHUB_OUTPUT"
          echo "current_blob=$pointer_preflight_current_blob" >> "$GITHUB_OUTPUT"
          echo "pointer_before_exists=$pointer_before_exists" >> "$GITHUB_OUTPUT"
          echo "pointer_before_etag=$pointer_before_etag" >> "$GITHUB_OUTPUT"

      - name: Reconcile v10 capital state with no executable order path
        run: |
          set -Eeuo pipefail
          az servicebus queue show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --namespace-name "$SERVICE_BUS_NAMESPACE" \
            --name "$SERVICE_BUS_QUEUE" \
            -o json > funded-queue-before-capital-reconcile.json
          jq -e '
            .status == "SendDisabled"
            and (.countDetails.activeMessageCount | tonumber) == 0
            and (.countDetails.scheduledMessageCount | tonumber) == 0
          ' funded-queue-before-capital-reconcile.json >/dev/null
          test "$(jq -r '.countDetails.deadLetterMessageCount' \
            funded-queue-before-capital-reconcile.json)" = "$(cat funded-fenced-dlq-before.txt)"
          jq -S '{
            status,
            active: .countDetails.activeMessageCount,
            scheduled: .countDetails.scheduledMessageCount,
            dead_letter: .countDetails.deadLetterMessageCount
          }' funded-queue-before-capital-reconcile.json > funded-queue-before-capital-reconcile.snapshot.json
          az containerapp job show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$FUNDED_JOB" \
            -o json > funded-capital-reconcile-job.json
          jq '
            .properties.template
            | .containers |= map(
                if .name == "funded-direct" then
                  .command = ["node", "src/funded-direct-reconciliation.mjs"]
                  | .env = (
                      [.env[] | select(.name != "FUNDED_DIRECT_RECONCILE_STATE_WRITE"
                        and .name != "FUNDED_DIRECT_WORKER_ENABLED"
                        and .name != "FUNDED_DIRECT_SERVICE_ENABLED"
                        and .name != "FUNDED_DIRECT_DRY_RUN"
                        and .name != "FUNDED_DIRECT_PREFLIGHT_ONLY"
                        and .name != "FUNDED_DIRECT_AUTO_REDEMPTION_ENABLED"
                        and .name != "ALLOW_FUNDED_DIRECT"
                        and .name != "ALLOW_LIVE"
                        and .name != "ALLOW_STRATEGY_CANARY"
                        and .name != "ENABLE_TAKER_ORDERS")]
                      + [
                        {name:"FUNDED_DIRECT_RECONCILE_STATE_WRITE",value:"true"},
                        {name:"FUNDED_DIRECT_WORKER_ENABLED",value:"false"},
                        {name:"FUNDED_DIRECT_SERVICE_ENABLED",value:"false"},
                        {name:"FUNDED_DIRECT_DRY_RUN",value:"true"},
                        {name:"FUNDED_DIRECT_PREFLIGHT_ONLY",value:"false"},
                        {name:"FUNDED_DIRECT_AUTO_REDEMPTION_ENABLED",value:"false"},
                        {name:"ALLOW_FUNDED_DIRECT",value:"false"},
                        {name:"ALLOW_LIVE",value:"false"},
                        {name:"ALLOW_STRATEGY_CANARY",value:"false"},
                        {name:"ENABLE_TAKER_ORDERS",value:"false"}
                      ]
                    )
                else . end
              )
          ' funded-capital-reconcile-job.json > funded-capital-reconcile-execution.yaml
          jq -e '
            (.containers | length) == 1
            and .containers[0].name == "funded-direct"
            and .containers[0].command == ["node", "src/funded-direct-reconciliation.mjs"]
            and ([.containers[0].env[] | select(
              .name == "FUNDED_DIRECT_RECONCILE_STATE_WRITE" and .value == "true")] | length) == 1
            and ([.containers[0].env[] | select(.name == "FUNDED_DIRECT_DRY_RUN"
              or .name == "FUNDED_DIRECT_WORKER_ENABLED"
              or .name == "FUNDED_DIRECT_SERVICE_ENABLED"
              or .name == "FUNDED_DIRECT_AUTO_REDEMPTION_ENABLED"
              or .name == "ALLOW_FUNDED_DIRECT"
              or .name == "ALLOW_LIVE"
              or .name == "ALLOW_STRATEGY_CANARY"
              or .name == "ENABLE_TAKER_ORDERS")] | length) == 8
            and all(.containers[0].env[] | select(.name == "FUNDED_DIRECT_DRY_RUN"
              or .name == "FUNDED_DIRECT_WORKER_ENABLED"
              or .name == "FUNDED_DIRECT_SERVICE_ENABLED"
              or .name == "FUNDED_DIRECT_AUTO_REDEMPTION_ENABLED"
              or .name == "ALLOW_FUNDED_DIRECT"
              or .name == "ALLOW_LIVE"
              or .name == "ALLOW_STRATEGY_CANARY"
              or .name == "ENABLE_TAKER_ORDERS");
              if .name == "FUNDED_DIRECT_DRY_RUN" then .value == "true" else .value == "false" end)
          ' funded-capital-reconcile-execution.yaml >/dev/null
          monotonic_seconds() {
            python3 -c 'import time; print(int(time.monotonic()))'
          }
          status=Failed
          for reconcile_attempt in 1 2 3; do
            capital_reconcile_execution=$(az containerapp job start \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --name "$FUNDED_JOB" \
              --yaml funded-capital-reconcile-execution.yaml \
              --query name -o tsv)
            test -n "$capital_reconcile_execution"
            status=Running
            capital_reconcile_deadline_monotonic=$(( $(monotonic_seconds) + 900 ))
            while [ "$(monotonic_seconds)" -lt "$capital_reconcile_deadline_monotonic" ]; do
              if status=$(az containerapp job execution show \
                  --resource-group "$AZURE_RESOURCE_GROUP" \
                  --name "$FUNDED_JOB" \
                  --job-execution-name "$capital_reconcile_execution" \
                  --query properties.status -o tsv); then
                case "$status" in
                  Succeeded) break ;;
                  Failed|Stopped|Degraded) break ;;
                esac
              fi
              sleep 10
            done
            [ "$status" = Succeeded ] && break
            case "$status" in
              Failed|Stopped|Degraded) ;;
              *) break ;;
            esac
            [ "$reconcile_attempt" = 3 ] || sleep 10
          done
          test "$status" = "Succeeded"
          az servicebus queue show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --namespace-name "$SERVICE_BUS_NAMESPACE" \
            --name "$SERVICE_BUS_QUEUE" \
            -o json > funded-queue-after-capital-reconcile.json
          jq -S '{
            status,
            active: .countDetails.activeMessageCount,
            scheduled: .countDetails.scheduledMessageCount,
            dead_letter: .countDetails.deadLetterMessageCount
          }' funded-queue-after-capital-reconcile.json > funded-queue-after-capital-reconcile.snapshot.json
          cmp funded-queue-before-capital-reconcile.snapshot.json \
            funded-queue-after-capital-reconcile.snapshot.json

      - name: Backfill canonical v10 recovery journal from matched legacy evidence
        run: |
          set -Eeuo pipefail
          umask 077
          v10_prefix="reports/funded/dynamic-quote/sessions/dynamic-quote-funded-2026-08-13-v10/"
          readonly mutable_control="${v10_prefix}control/redemption-state.json"
          readonly mutable_control_sha256="sha256:88522acc5914116b7a22292e5936547d1f8d831773907911f0d887f0cd00a5fa"
          readonly predecessor_blob="${v10_prefix}redemptions/2026-08-16/venue-redemption-20260816163934709-03fccfd5.json"
          readonly predecessor_sha256="sha256:89d08792ef8a5a2d7da9f271f370c2abd4b993837f400e38c2f052751cb6b384"
          readonly recovery_blob="${v10_prefix}redemptions/2026-08-16/venue-redemption-20260816164043326-56add08b.json"
          readonly recovery_sha256="sha256:eee7f1dcec132cc1cf71cb6fc97ea14a0eaa8ceffd8b9b94d8bd55c73041e9d9"
          readonly recovery_binding_sha256="sha256:adb4ddcc5d445dafaf78df758d1a102d7f2460b753f5eb0d0dd82c4eb07c6b50"
          readonly malformed_journal_sha256="sha256:abfa6beb115f41e302eba8aa0bb24e6b46083c4271a4eda7f058be12edf12df3"
          readonly predecessor_run_id="venue-redemption-20260816163934709-03fccfd5"
          readonly recovery_run_id="venue-redemption-20260816164043326-56add08b"
          readonly journal="${v10_prefix}recovery-controls/${predecessor_run_id}.json"
          readonly receipt="${v10_prefix}recovery-repair-receipts/${predecessor_run_id}/sha256-${malformed_journal_sha256#sha256:}.json"
          queue_file=queue-before-recovery-journal-backfill.json
          app_file=app-before-recovery-journal-backfill.json
          control_file=$(mktemp)
          recovery_file=$(mktemp)
          predecessor_file=$(mktemp)
          journal_file=$(mktemp)
          malformed_file=$(mktemp)
          minimal_repair_file=$(mktemp)
          existing_file=$(mktemp)
          receipt_file=$(mktemp)
          receipt_expected=$(mktemp)
          snapshot_file=$(mktemp)
          metadata_file=$(mktemp)
          operation_stderr=$(mktemp)
          az servicebus queue show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --namespace-name "$SERVICE_BUS_NAMESPACE" \
            --name "$SERVICE_BUS_QUEUE" \
            -o json > "$queue_file"
          jq -e '
            .status == "SendDisabled"
            and (.countDetails.activeMessageCount | tonumber) == 0
            and (.countDetails.scheduledMessageCount | tonumber) == 0
          ' "$queue_file" >/dev/null
          test "$(jq -r '.countDetails.deadLetterMessageCount' "$queue_file")" = \
            "$(cat funded-fenced-dlq-before.txt)"
          az containerapp show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$FUNDED_APP" \
            -o json > "$app_file"
          test "$(jq -r '.properties.template.scale.minReplicas' "$app_file")" = "0"
          test "$(jq -r '
            [.properties.template.containers[0].env[]
              | select(.name == "FUNDED_DIRECT_SERVICE_ENABLED") | .value]
            | if length == 1 then .[0] else "" end
          ' "$app_file")" = "false"

          az storage blob download \
              --account-name "$STORAGE_ACCOUNT" \
              --container-name "$FUNDED_CONTAINER" \
              --name "$predecessor_blob" \
              --file "$predecessor_file" \
              --auth-mode login \
              --overwrite \
              --only-show-errors -o none
          az storage blob download \
              --account-name "$STORAGE_ACCOUNT" \
              --container-name "$FUNDED_CONTAINER" \
              --name "$recovery_blob" \
              --file "$recovery_file" \
              --auth-mode login \
              --overwrite \
              --only-show-errors -o none
          if ! test "$predecessor_sha256" = \
            "sha256:$(sha256sum "$predecessor_file" | cut -d' ' -f1)"; then
            printf '%s\n' 'funded_recovery_backfill_predecessor_sha_mismatch' >&2
            exit 1
          fi
          if ! test "$recovery_sha256" = \
            "sha256:$(sha256sum "$recovery_file" | cut -d' ' -f1)"; then
            printf '%s\n' 'funded_recovery_backfill_recovery_sha_mismatch' >&2
            exit 1
          fi
          if ! jq -e --arg predecessor "$predecessor_run_id" '
            .schema_version == 1
            and .status == "failed_closed"
            and .run_id == $predecessor
            and .redemption_submitted == true
            and .research_only == false
            and .live_strategy_enabled == true
            and (.error | test("^fail closed: terminal evidence requires zero durable unresolved risk reservations \\(observed [1-9][0-9]*\\)$"))
          ' "$predecessor_file" >/dev/null; then
            printf '%s\n' 'funded_recovery_backfill_predecessor_contract_invalid' >&2
            exit 1
          fi
          if ! jq -e --arg recovery "$recovery_run_id" \
            --arg recovery_blob "$recovery_blob" '
            .schema_version == 1
            and .status == "recovered_confirmed_and_verified"
            and .run_id == $recovery
            and .redemption_submitted == true
            and .new_submission_attempted == false
            and .confirmed_transaction_reused == true
            and (.transaction_id | type == "string" and length > 0)
            and (.transaction_hash | test("^0x[0-9a-fA-F]{64}$"))
            and (.selection.selected | type == "array" and length > 0)
            and (.selection.selected_gross_payout | type == "number" and . > 0)
            and (.internal_settlement_blobs | type == "array" and length > 0
              and length == (unique | length))
            and $recovery_blob == ("reports/funded/dynamic-quote/sessions/dynamic-quote-funded-2026-08-13-v10/redemptions/"
              + .finished_ts[0:10] + "/" + .run_id + ".json")
          ' "$recovery_file" >/dev/null; then
            printf '%s\n' 'funded_recovery_backfill_recovery_contract_invalid' >&2
            exit 1
          fi
          jq -cj '{
            transaction_hash: (.transaction_hash | ascii_downcase),
            internal_settlement_blobs: (.internal_settlement_blobs | sort)
          }' "$recovery_file" > recovery-binding.json
          if ! test "$recovery_binding_sha256" = \
            "sha256:$(sha256sum recovery-binding.json | cut -d' ' -f1)"; then
            printf '%s\n' 'funded_recovery_backfill_binding_sha_mismatch' >&2
            exit 1
          fi
          az storage blob download \
            --account-name "$STORAGE_ACCOUNT" \
            --container-name "$FUNDED_CONTAINER" \
            --name "$mutable_control" \
            --file "$control_file" \
            --auth-mode login \
            --overwrite \
            --only-show-errors -o none
          test "$mutable_control_sha256" = \
            "sha256:$(sha256sum "$control_file" | cut -d' ' -f1)"

          # Preserve the original jq collision semantics so only the known bad bytes repair.
          jq -n --slurpfile predecessor "$predecessor_file" \
            --slurpfile summary "$recovery_file" \
            --arg predecessor "$predecessor_run_id" \
            --arg recovery "$recovery_run_id" \
            --arg journal "$journal" '{
              schema_version: 1,
              type: "redemption_recovery_journal",
              predecessor_run_id: $predecessor,
              recovery_run_id: $recovery,
              recovery_journal_blob_name: $journal,
              finalized_control: {
                schema_version: 1,
                state: "confirmed_and_verified",
                run_id: $predecessor,
                owner: $summary[0].owner,
                signer_address: "[REDACTED]",
                funder: $summary[0].funder,
                condition_ids: [$summary[0].selection.selected[].condition_id],
                expected_gross_payout: $summary[0].selection.selected_gross_payout,
                submission_attempted: true,
                transaction_id: $summary[0].transaction_id,
                transaction_hash: $summary[0].transaction_hash,
                created_ts: $predecessor[0].finished_ts,
                updated_ts: $summary[0].finished_ts,
                recovery_run_id: $recovery,
                liquid_collateral_after: $summary[0].liquid_collateral_after,
                realized_payout: $summary[0].realized_payout,
                internal_settlement_blobs: $summary[0].internal_settlement_blobs
              },
              recovered_summary: $summary[0]
            }' > "$malformed_file"
          test "$malformed_journal_sha256" = \
            "sha256:$(sha256sum "$malformed_file" | cut -d' ' -f1)"
          jq -e --arg recovery "$recovery_run_id" --arg blob "$journal" '
            type == "object"
            and (.predecessor_run_id | type == "array")
            and (.finalized_control.run_id | type == "array")
            and .predecessor_run_id == .finalized_control.run_id
            and .recovery_run_id == $recovery
            and .finalized_control.recovery_run_id == $recovery
            and .recovery_journal_blob_name == $blob
          ' "$malformed_file" >/dev/null

          jq -n --slurpfile predecessor_doc "$predecessor_file" \
            --slurpfile recovery_doc "$recovery_file" \
            --arg predecessor_run_id "$predecessor_run_id" \
            --arg recovery_run_id "$recovery_run_id" \
            --arg journal_blob_name "$journal" '{
              schema_version: 1,
              type: "redemption_recovery_journal",
              predecessor_run_id: $predecessor_run_id,
              recovery_run_id: $recovery_run_id,
              recovery_journal_blob_name: $journal_blob_name,
              finalized_control: {
                schema_version: 1,
                state: "confirmed_and_verified",
                run_id: $predecessor_run_id,
                owner: $recovery_doc[0].owner,
                signer_address: "[REDACTED]",
                funder: $recovery_doc[0].funder,
                condition_ids: [$recovery_doc[0].selection.selected[].condition_id],
                expected_gross_payout: $recovery_doc[0].selection.selected_gross_payout,
                submission_attempted: true,
                transaction_id: $recovery_doc[0].transaction_id,
                transaction_hash: $recovery_doc[0].transaction_hash,
                created_ts: $predecessor_doc[0].finished_ts,
                updated_ts: $recovery_doc[0].finished_ts,
                recovery_run_id: $recovery_run_id,
                liquid_collateral_after: $recovery_doc[0].liquid_collateral_after,
                realized_payout: $recovery_doc[0].realized_payout,
                internal_settlement_blobs: $recovery_doc[0].internal_settlement_blobs
              },
              recovered_summary: $recovery_doc[0]
            }' > "$journal_file"
          journal_sha256="sha256:$(sha256sum "$journal_file" | cut -d' ' -f1)"
          jq -e --arg predecessor "$predecessor_run_id" \
            --arg recovery "$recovery_run_id" --arg blob "$journal" '
            type == "object"
            and (.predecessor_run_id | type == "string" and . == $predecessor)
            and (.recovery_run_id | type == "string" and . == $recovery)
            and .recovery_journal_blob_name == $blob
            and (.finalized_control.run_id | type == "string" and . == $predecessor)
            and .finalized_control.recovery_run_id == $recovery
          ' "$journal_file" >/dev/null
          jq --arg predecessor "$predecessor_run_id" \
            '.predecessor_run_id = $predecessor
             | .finalized_control.run_id = $predecessor' \
            "$malformed_file" > "$minimal_repair_file"
          cmp "$journal_file" "$minimal_repair_file"

          validate_receipt() {
            test -f "$1"
            receipt_size=$(stat --printf='%s' "$1")
            [[ "$receipt_size" =~ ^[0-9]+$ ]]
            test "$receipt_size" -gt 0
            test "$receipt_size" -le 16384
            jq -e --arg canonical_blob "$journal" \
              --arg bad_sha256 "$malformed_journal_sha256" \
              --arg good_sha256 "$journal_sha256" \
              --arg predecessor_run "$predecessor_run_id" \
              --arg predecessor_source_blob "$predecessor_blob" \
              --arg predecessor_source_sha256 "$predecessor_sha256" \
              --arg recovery_run "$recovery_run_id" \
              --arg recovery_source_blob "$recovery_blob" \
              --arg recovery_source_sha256 "$recovery_sha256" '
              keys == ["bad_sha256", "canonical_blob", "good_sha256", "predecessor_run_id", "predecessor_source_blob", "predecessor_source_sha256", "recovery_run_id", "recovery_source_blob", "recovery_source_sha256", "schema_version", "snapshot_id", "type"]
              and .schema_version == 1
              and .type == "funded_recovery_journal_repair_receipt"
              and .canonical_blob == $canonical_blob
              and .bad_sha256 == $bad_sha256
              and .good_sha256 == $good_sha256
              and (.snapshot_id | type == "string" and length > 0)
              and .predecessor_run_id == $predecessor_run
              and .predecessor_source_blob == $predecessor_source_blob
              and .predecessor_source_sha256 == $predecessor_source_sha256
              and .recovery_run_id == $recovery_run
              and .recovery_source_blob == $recovery_source_blob
              and .recovery_source_sha256 == $recovery_source_sha256
            ' "$1" >/dev/null
          }
          verify_snapshot() {
            az storage blob download \
              --account-name "$STORAGE_ACCOUNT" \
              --container-name "$FUNDED_CONTAINER" \
              --name "$journal" \
              --snapshot "$1" \
              --file "$snapshot_file" \
              --auth-mode login \
              --overwrite \
              --only-show-errors -o none
            cmp "$malformed_file" "$snapshot_file"
            test "$malformed_journal_sha256" = \
              "sha256:$(sha256sum "$snapshot_file" | cut -d' ' -f1)"
          }
          az storage blob show \
            --account-name "$STORAGE_ACCOUNT" \
            --container-name "$FUNDED_CONTAINER" \
            --name "$journal" \
            --auth-mode login \
            --query '{etag:properties.etag,size:properties.contentLength}' \
            --only-show-errors -o json > "$metadata_file"
          canonical_etag=$(jq -er '.etag | strings | select(length > 0)' "$metadata_file")
          canonical_size=$(jq -er '.size | numbers | select(. > 0 and . <= 1048576 and floor == .)' "$metadata_file")
          az storage blob download \
              --account-name "$STORAGE_ACCOUNT" \
              --container-name "$FUNDED_CONTAINER" \
              --name "$journal" \
              --file "$existing_file" \
              --if-match "$canonical_etag" \
              --auth-mode login \
              --overwrite \
              --only-show-errors -o none
          test "$(stat --printf='%s' "$existing_file")" = "$canonical_size"
          existing_sha256="sha256:$(sha256sum "$existing_file" | cut -d' ' -f1)"
          receipt_exists=false
          if az storage blob download \
              --account-name "$STORAGE_ACCOUNT" \
              --container-name "$FUNDED_CONTAINER" \
              --name "$receipt" \
              --file "$receipt_file" \
              --auth-mode login \
              --overwrite \
              --only-show-errors -o none 2>"$operation_stderr"; then
            receipt_exists=true
          elif ! grep -Eq 'BlobNotFound|404' "$operation_stderr"; then
            printf '%s\n' 'funded_recovery_backfill_receipt_read_failed' >&2
            exit 1
          fi
          if cmp -s "$journal_file" "$existing_file"; then
            test "$existing_sha256" = "$journal_sha256"
            if [ "$receipt_exists" != true ]; then
              printf '%s\n' 'funded_recovery_backfill_repair_receipt_required_for_corrected_canonical' >&2
              exit 1
            fi
            validate_receipt "$receipt_file"
            verify_snapshot "$(jq -r '.snapshot_id' "$receipt_file")"
            exit 0
          fi
          if ! cmp -s "$malformed_file" "$existing_file" || \
              ! test "$existing_sha256" = "$malformed_journal_sha256"; then
            printf '%s\n' 'funded_recovery_backfill_canonical_bytes_unrecognized' >&2
            exit 1
          fi
          if "$receipt_exists"; then
            validate_receipt "$receipt_file"
            snapshot_id=$(jq -r '.snapshot_id' "$receipt_file")
            verify_snapshot "$snapshot_id"
          else
            snapshot_id=$(az storage blob snapshot \
              --account-name "$STORAGE_ACCOUNT" \
              --container-name "$FUNDED_CONTAINER" \
              --name "$journal" \
              --if-match "$canonical_etag" \
              --auth-mode login \
              --only-show-errors --query snapshot -o tsv)
            test -n "$snapshot_id"
            verify_snapshot "$snapshot_id"
            jq -n \
              --arg canonical_blob "$journal" \
              --arg bad_sha256 "$malformed_journal_sha256" \
              --arg good_sha256 "$journal_sha256" \
              --arg snapshot_id "$snapshot_id" \
              --arg predecessor_run "$predecessor_run_id" \
              --arg predecessor_source_blob "$predecessor_blob" \
              --arg predecessor_source_sha256 "$predecessor_sha256" \
              --arg recovery_run "$recovery_run_id" \
              --arg recovery_source_blob "$recovery_blob" \
              --arg recovery_source_sha256 "$recovery_sha256" '{
                schema_version: 1,
                type: "funded_recovery_journal_repair_receipt",
                canonical_blob: $canonical_blob,
                bad_sha256: $bad_sha256,
                good_sha256: $good_sha256,
                snapshot_id: $snapshot_id,
                predecessor_run_id: $predecessor_run,
                predecessor_source_blob: $predecessor_source_blob,
                predecessor_source_sha256: $predecessor_source_sha256,
                recovery_run_id: $recovery_run,
                recovery_source_blob: $recovery_source_blob,
                recovery_source_sha256: $recovery_source_sha256
              }' > "$receipt_expected"
            if ! az storage blob upload \
                --account-name "$STORAGE_ACCOUNT" \
                --container-name "$FUNDED_CONTAINER" \
                --name "$receipt" \
                --file "$receipt_expected" \
                --auth-mode login \
                --overwrite false \
                --content-type application/json \
                --only-show-errors -o none 2>"$operation_stderr"; then
              az storage blob download \
                --account-name "$STORAGE_ACCOUNT" \
                --container-name "$FUNDED_CONTAINER" \
                --name "$receipt" \
                --file "$receipt_file" \
                --auth-mode login \
                --overwrite \
                --only-show-errors -o none
              validate_receipt "$receipt_file"
              cmp "$receipt_expected" "$receipt_file"
            else
              az storage blob download \
                --account-name "$STORAGE_ACCOUNT" \
                --container-name "$FUNDED_CONTAINER" \
                --name "$receipt" \
                --file "$receipt_file" \
                --auth-mode login \
                --overwrite \
                --only-show-errors -o none
              validate_receipt "$receipt_file"
              cmp "$receipt_expected" "$receipt_file"
            fi
          fi
          az storage blob upload \
              --account-name "$STORAGE_ACCOUNT" \
              --container-name "$FUNDED_CONTAINER" \
              --name "$journal" \
              --file "$journal_file" \
              --auth-mode login \
              --if-match "$canonical_etag" \
              --overwrite true \
              --content-type application/json \
              --only-show-errors -o none
          az storage blob show \
            --account-name "$STORAGE_ACCOUNT" \
            --container-name "$FUNDED_CONTAINER" \
            --name "$journal" \
            --auth-mode login \
            --query '{etag:properties.etag,size:properties.contentLength}' \
            --only-show-errors -o json > "$metadata_file"
          repaired_etag=$(jq -er '.etag | strings | select(length > 0)' "$metadata_file")
          repaired_size=$(jq -er '.size | numbers | select(. >= 0)' "$metadata_file")
          az storage blob download \
            --account-name "$STORAGE_ACCOUNT" \
            --container-name "$FUNDED_CONTAINER" \
            --name "$journal" \
            --file "$existing_file" \
            --if-match "$repaired_etag" \
            --auth-mode login \
            --overwrite \
            --only-show-errors -o none
          test "$(stat --printf='%s' "$existing_file")" = "$repaired_size"
          cmp "$journal_file" "$existing_file"
          test "$journal_sha256" = "sha256:$(sha256sum "$existing_file" | cut -d' ' -f1)"

      - name: Prepare zero-write v10 preflight inputs
        run: |
          set -Eeuo pipefail
          trap 'status=$?; printf "funded v10 preflight input validation failed at shell line %s (exit %s)\n" "$LINENO" "$status" >&2' ERR
          v10_prefix="reports/funded/dynamic-quote/sessions/dynamic-quote-funded-2026-08-13-v10/"
          readonly v10_session_blob="${v10_prefix}session.json"
          readonly v10_state_blob="${v10_prefix}capital-reserve-state.json"
          readonly v10_session_sha256="sha256:c516c052fc5c01eed5403842ff24bf4b08512d6c38e8260e2d064580c82322f8"
          readonly v10_latest_redemption="${v10_prefix}latest-redemption.json"
          readonly v10_redemption_prefix="${v10_prefix}redemptions/"
          readonly v10_redemption_control="${v10_prefix}control/redemption-state.json"
          readonly v10_recovery_control_prefix="${v10_prefix}recovery-controls/"
          readonly v10_recovery_repair_receipt_prefix="${v10_prefix}recovery-repair-receipts/"
          readonly v10_internal_settlement_prefix="${v10_prefix}internal-settlements/"
          readonly v10_authorization_prefix="${v10_prefix}authorizations/"
          readonly v10_completion_prefix="${v10_prefix}completed/"
          readonly reviewed_legacy_onchain_error_count=47
          readonly reviewed_legacy_onchain_error_sha256="sha256:e16c157b51b6e867b30693946340de95c5edae8b5c2327864cdb77e9abc76a26"
          # legacy_candidate_verifier_begin
          verify_reviewed_legacy_onchain_candidates() {
            local candidates_file=$1
            local expected_count=$2
            local expected_sha256=$3
            local canonical_file=$4
            local observed_count
            observed_count=$(wc -l < "$candidates_file")
            test "$observed_count" = "$expected_count" || return 1
            jq -sc 'sort_by(.blob_name)' "$candidates_file" \
              | tr -d '\n' > "$canonical_file" || return 1
            test "$expected_sha256" = \
              "sha256:$(sha256sum "$canonical_file" | cut -d' ' -f1)"
          }
          # legacy_candidate_verifier_end
          v5_state="reports/funded/dynamic-quote/sessions/dynamic-quote-funded-2026-07-29-v5/capital-reserve-state.json"
          readonly v5_state_sha256="sha256:9e63db7ef8c22d3af53a14f1858b817b8769ca7ba737e6668a900ffb73330c15"
          az servicebus queue show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --namespace-name "$SERVICE_BUS_NAMESPACE" \
            --name "$SERVICE_BUS_QUEUE" \
            -o json > funded-queue-before-pointer-preflight.json
          jq -e '
            .status == "SendDisabled"
            and (.countDetails.activeMessageCount | tonumber) == 0
            and (.countDetails.scheduledMessageCount | tonumber) == 0
            and (.countDetails.deadLetterMessageCount | tonumber) >= 0
          ' funded-queue-before-pointer-preflight.json >/dev/null
          test "$(jq -r '.countDetails.deadLetterMessageCount' \
            funded-queue-before-pointer-preflight.json)" = "$(cat funded-fenced-dlq-before.txt)"
          jq -S '{
            status,
            active: .countDetails.activeMessageCount,
            scheduled: .countDetails.scheduledMessageCount,
            dead_letter: .countDetails.deadLetterMessageCount
          }' funded-queue-before-pointer-preflight.json > funded-queue-before-pointer-preflight.snapshot.json
          az storage blob list \
            --account-name "$STORAGE_ACCOUNT" \
            --container-name "$FUNDED_CONTAINER" \
            --prefix "$v10_prefix" \
            --num-results '*' \
            --auth-mode login \
            --only-show-errors -o json > v10-prefix-before-preflight.json
          jq -e \
            --arg session "$v10_session_blob" \
            --arg state "$v10_state_blob" \
            --arg latest "$v10_latest_redemption" \
            --arg archive "$v10_redemption_prefix" \
            --arg redemption_control "$v10_redemption_control" \
            --arg recovery_controls "$v10_recovery_control_prefix" \
            --arg recovery_repair_receipts "$v10_recovery_repair_receipt_prefix" \
            --arg internal_settlements "$v10_internal_settlement_prefix" \
            --arg authorizations "$v10_authorization_prefix" \
            --arg completions "$v10_completion_prefix" '
            ([.[].name] | length == (unique | length))
            and all(.[].properties.contentLength; . > 0 and . <= 16384)
            and all(.[].name;
              . == $session
              or . == $state
              or . == $latest
              or . == $redemption_control
              or test("^" + $recovery_controls + "venue-redemption-[0-9]{17}-[0-9a-f]{8}\\.json$")
              or test("^" + $recovery_repair_receipts + "venue-redemption-[0-9]{17}-[0-9a-f]{8}/sha256-[0-9a-f]{64}\\.json\\z")
              or test("^" + $internal_settlements + "[0-9a-f]{64}\\.json$")
              or test("^" + $archive + "[0-9]{4}-[0-9]{2}-[0-9]{2}/venue-redemption-[0-9]{17}-[0-9a-f]{8}\\.json$")
              or test("^" + $authorizations + "[0-9a-f]{64}\\.json$")
              or test("^" + $completions + "[0-9a-f]{64}\\.json$"))
          ' v10-prefix-before-preflight.json >/dev/null
          jq -S '[.[] | {name, etag: .properties.etag, size: .properties.contentLength}]' \
            v10-prefix-before-preflight.json > v10-prefix-before-preflight.snapshot.json
          az containerapp job show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$FUNDED_JOB" \
            -o json > funded-preflight-job.json
          intent_container=$(jq -r '.properties.template.containers[0].env[] | select(.name == "STRATEGY_CANARY_INTENT_CONTAINER_NAME") | .value' funded-preflight-job.json)
          intent_prefix=$(jq -r '.properties.template.containers[0].env[] | select(.name == "STRATEGY_CANARY_INTENT_PREFIX") | .value' funded-preflight-job.json)
          test "$(jq -r '.properties.configuration.replicaTimeout' funded-preflight-job.json)" = "11400"
          test "$intent_container" = "polyedge-shadow-events"
          test "$intent_prefix" = "reports/research/venue-probe/control/strategy-canary/intents"
          if jq -e --arg session "$v10_session_blob" \
              '[.[].name] | index($session) != null' \
              v10-prefix-before-preflight.json >/dev/null; then
            az storage blob download \
              --account-name "$STORAGE_ACCOUNT" \
              --container-name "$FUNDED_CONTAINER" \
              --name "$v10_session_blob" \
              --file existing-v10-session.json \
              --auth-mode login \
              --overwrite \
              --only-show-errors -o none
            test "$v10_session_sha256" = "sha256:$(sha256sum existing-v10-session.json | cut -d' ' -f1)"
          fi
          if jq -e --arg state "$v10_state_blob" \
              '[.[].name] | index($state) != null' \
              v10-prefix-before-preflight.json >/dev/null; then
          az storage blob download \
            --account-name "$STORAGE_ACCOUNT" \
            --container-name "$FUNDED_CONTAINER" \
            --name "$v10_state_blob" \
            --file existing-v10-capital-state.json \
            --auth-mode login \
            --overwrite \
