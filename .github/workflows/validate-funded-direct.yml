                          (($bound_pairs[$index].payout
                            - $selected_pairs[$index].payout) | fabs) > 0.0000011
                        else
                          $bound_pairs[$index].payout
                            != $selected_pairs[$index].payout
                        end)) then
                    "settlement_selected_payout_mismatch"
                  elif ((([$bound[].payout] | add) - $realized_payout) | fabs)
                    > 0.0000011 then
                    "settlement_payout_sum_mismatch"
                  else
                    "ok"
                  end) as $category
                | [$category, ($references | length), ($bound | length)]
                | @tsv
              ' "$redemption_file" 2>/dev/null); then
                printf '%s\n' \
                  "funded v10 redemption binding validation failed: status=${redemption_status} ordinal=${redemption_ordinal}/${redemption_total} category=diagnostic_evaluation_error" >&2
                exit 1
              fi
              IFS=$'\t' read -r binding_category binding_reference_count \
                binding_bound_count <<< "$binding_diagnostic"
              if [ "$binding_category" != "ok" ]; then
                printf '%s\n' \
                  "funded v10 redemption binding validation failed: status=${redemption_status} ordinal=${redemption_ordinal}/${redemption_total} category=${binding_category} reference_count=${binding_reference_count} bound_count=${binding_bound_count}" >&2
                exit 1
              fi
            fi
            if ! jq -e --argjson authorized_ceiling "$authorized_ceiling" \
              --argjson settlement_bindings "$settlement_bindings" \
              --argjson redemption_control "$redemption_control" \
              --argjson recovery_journal_summary "$recovery_journal_summary" \
              --arg recovery_control_blob_name "$recovery_control_blob_name" \
              --arg recovery_control_sha256 "$recovery_control_sha256" \
              --arg record_sha256 "$redemption_sha" \
              --arg blob_name "$blob_name" --arg latest "$v10_latest_redemption" '
              .schema_version == 1
              and (.finished_ts | type == "string")
              and (.finished_ts
                | test("^[0-9]{4}-(0[1-9]|1[0-2])-(0[1-9]|[12][0-9]|3[01])T([01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9]\\.[0-9]{3}Z\\z")
                and (sub("\\.[0-9]{3}Z\\z"; "Z") as $whole_seconds
                  | (try ($whole_seconds | fromdateiso8601 | todateiso8601) catch null)
                    == $whole_seconds))
              and (.run_id | test("^venue-redemption-[0-9]{17}-[0-9a-f]{8}\\z"))
              and (if .status == "failed_closed" then
                ((.redemption_submitted == false
                    and (.error == "Data API positions returned HTTP 429"
                      or .error == "Data API activity returned HTTP 429"
                      or .error == "The operation was aborted due to timeout"
                      or ($blob_name != $latest and
                        (.error | test("^fail closed: selected condition has no positive onchain payout \\(0x[0-9a-fA-F]{64}\\)\\z")))
                      or ($blob_name != $latest and
                        (.error | test("^fail closed: Data API payout disagrees with onchain payout for 0x[0-9a-fA-F]{64}\\z")))))
                  or
                  (.redemption_submitted == true
                    and (.error | test("^fail closed: terminal evidence requires zero durable unresolved risk reservations \\(observed [1-9][0-9]*\\)\\z"))
                    and $redemption_control.schema_version == 1
                    and $redemption_control.state == "confirmed_and_verified"
                    and $redemption_control.submission_attempted == true
                    and $redemption_control.run_id == .run_id
                    and ($redemption_control.recovery_run_id
                      | test("^venue-redemption-[0-9]{17}-[0-9a-f]{8}\\z"))
                    and ($recovery_control_blob_name | length) > 0
                    and ($recovery_control_sha256
                      | test("^sha256:[0-9a-f]{64}\\z"))))
                and .research_only == false
                and .live_strategy_enabled == true
                and ((keys | sort) == ([
                  "error", "finished_ts", "live_strategy_enabled",
                  "redemption_submitted", "research_only", "run_id",
                  "schema_version", "status"
                ] | sort))
              else
                .execution_origin == "azure_chile_central_static_egress"
                and .execution_country == "CL"
                and .static_egress_verified == true
                and .dry_run == false
                and .redemption_enabled == true
                and .zero_open_orders_confirmed == true
                and .derived_wallet_match == true
                and .wallet_type == "legacy_uups_deposit_wallet"
                and .research_only == false
                and .live_strategy_enabled == true
                and (.liquid_collateral_before | type == "number")
                and .liquid_collateral_before > 0
                and .liquid_collateral_before <=
                  (if $blob_name == $latest then $authorized_ceiling else 29.505501 end)
                and (if .status == "nothing_to_redeem" then
                .redemption_submitted == false
                and .selection.selected == []
                and .selection.selected_gross_payout == 0
                and .planned_calls == []
              elif .status == "redeemed_and_verified"
                  or .status == "recovered_confirmed_and_verified" then
                .redemption_submitted == true
                and (.selection.selected | type == "array" and length >= 1)
                and (.selection.selected_gross_payout | type == "number" and . > 0)
                and (if .status == "recovered_confirmed_and_verified" then
                    .planned_calls == []
                    and .new_submission_attempted == false
                    and .confirmed_transaction_reused == true
                    and $redemption_control.schema_version == 1
                    and $redemption_control.state == "confirmed_and_verified"
                    and $redemption_control.submission_attempted == true
                    and $redemption_control.recovery_run_id == .run_id
                    and $redemption_control.transaction_id == .transaction_id
                    and ($redemption_control.transaction_hash | ascii_downcase)
                      == (.transaction_hash | ascii_downcase)
                    and ([$redemption_control.condition_ids[] | ascii_downcase] | sort)
                      == ([.selection.selected[].condition_id | ascii_downcase] | sort)
                    and (($redemption_control.expected_gross_payout
                      - .selection.selected_gross_payout) | fabs) <= 0.0000011
                    and ($redemption_control.internal_settlement_blobs | sort)
                      == (.internal_settlement_blobs | sort)
                    and $recovery_journal_summary == .
                    and (if $redemption_control
                          | has("recovery_journal_blob_name") then
                        .predecessor_run_id == $redemption_control.run_id
                        and .recovery_journal_blob_name
                          == $recovery_control_blob_name
                        and $redemption_control.recovery_journal_blob_name
                          == $recovery_control_blob_name
                        and $redemption_control.recovery_publication_complete
                          == true
                        and $redemption_control.recovery_summary_sha256
                          == $record_sha256
                        and (if $blob_name == $latest then true else
                          $redemption_control.recovery_summary_blob_name
                            == $blob_name end)
                      else
                        (has("predecessor_run_id") | not)
                        and (has("recovery_journal_blob_name") | not)
                      end)
                  else
                    (.planned_calls | type == "array" and length >= 1)
                  end)
                and (.transaction_id | type == "string" and length > 0)
                and (.transaction_hash | type == "string"
                  and test("^0x[0-9a-fA-F]{64}$"))
                and (.liquid_collateral_after | type == "number" and . >= 0)
                and (.realized_payout | type == "number" and . > 0)
                and ((.realized_payout - .selection.selected_gross_payout) | fabs)
                  <= 0.0000011
                and (if .status == "recovered_confirmed_and_verified" then
                    ((.liquid_collateral_after - .liquid_collateral_before) | fabs)
                      <= 0.0000011
                  else
                    ((.liquid_collateral_after - .liquid_collateral_before
                      - .realized_payout) | fabs) <= 0.0000011
                  end)
                and (.internal_settlement_blobs | type == "array" and length >= 1)
                and (.internal_settlement_blobs | length) == (.selection.selected | length)
                and (.internal_settlement_blobs | length) ==
                  (.internal_settlement_blobs | unique | length)
                and (.internal_settlement_blobs as $references
                  | .selection.selected as $selected
                  | .transaction_hash as $transaction_hash
                  | .realized_payout as $realized_payout
                  | [$settlement_bindings[]
                    | select(.blob_name as $candidate
                      | ($references | index($candidate)) != null)] as $bound
                  | ($bound | length) == ($references | length)
                  and all($bound[];
                    .type == "internal_automatic_settlement"
                    and .transaction_hash == $transaction_hash)
                  and (([$bound[] | {
                    condition_id: (.condition_id | ascii_downcase),
                    payout
                  }] | sort_by(.condition_id, .payout)) as $bound_pairs
                    |
                    ([$selected[] | {
                      condition_id: (.condition_id | ascii_downcase),
                      payout: (if has("onchain_expected_payout") then
                        .onchain_expected_payout
                      else .gross_payout end),
                      canonical: has("onchain_expected_payout")
                    }] | sort_by(.condition_id, .payout)) as $selected_pairs
                    | ($bound_pairs | length) == ($selected_pairs | length)
                    and all(range(0; $bound_pairs | length); . as $index
                      | $bound_pairs[$index].condition_id
                          == $selected_pairs[$index].condition_id
                      and (if $selected_pairs[$index].canonical then
                          (($bound_pairs[$index].payout
                            - $selected_pairs[$index].payout) | fabs) <= 0.0000011
                        else
                          $bound_pairs[$index].payout
                            == $selected_pairs[$index].payout
                        end)))
                  and ((([$bound[].payout] | add) - $realized_payout) | fabs)
                    <= 0.0000011
                )
              else false
              end)
              end)
            ' "$redemption_file" >/dev/null; then
              if ! redemption_contract_category=$(jq -er --argjson authorized_ceiling "$authorized_ceiling" --argjson redemption_control "$redemption_control" --argjson recovery_journal_summary "$recovery_journal_summary" --arg recovery_control_blob_name "$recovery_control_blob_name" --arg recovery_control_sha256 "$recovery_control_sha256" --arg record_sha256 "$redemption_sha" --arg blob_name "$blob_name" --arg latest "$v10_latest_redemption" '
                def valid($predicate): try $predicate catch false;
                if (valid(
                  .schema_version == 1
                  and (.finished_ts | type == "string")
                  and (.finished_ts
                    | test("^[0-9]{4}-(0[1-9]|1[0-2])-(0[1-9]|[12][0-9]|3[01])T([01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9]\\.[0-9]{3}Z\\z")
                    and (sub("\\.[0-9]{3}Z\\z"; "Z") as $whole_seconds
                      | (try ($whole_seconds | fromdateiso8601 | todateiso8601)
                          catch null) == $whole_seconds))
                  and (.run_id
                    | test("^venue-redemption-[0-9]{17}-[0-9a-f]{8}\\z"))))
                  | not then
                  "record_header"
                elif .status == "failed_closed" then
                  if .redemption_submitted != false
                      and .redemption_submitted != true then
                    "failed_closed_submission"
                  elif .redemption_submitted == false
                      and $blob_name == $latest
                      and valid(
                        (.error | test("^fail closed: selected condition has no positive onchain payout \\(0x[0-9a-fA-F]{64}\\)\\z"))
                        or (.error | test("^fail closed: Data API payout disagrees with onchain payout for 0x[0-9a-fA-F]{64}\\z"))) then
                    "failed_closed_error_class"
                  elif .redemption_submitted == false
                      and valid(.error != "Data API positions returned HTTP 429"
                        and .error != "Data API activity returned HTTP 429"
                        and .error != "The operation was aborted due to timeout"
                        and (.error | test("^fail closed: selected condition has no positive onchain payout \\(0x[0-9a-fA-F]{64}\\)\\z") | not)
                        and (.error | test("^fail closed: Data API payout disagrees with onchain payout for 0x[0-9a-fA-F]{64}\\z") | not)) then
                    "failed_closed_error_class"
                  elif .redemption_submitted == true
                      and valid(.error
                        | test("^fail closed: terminal evidence requires zero durable unresolved risk reservations \\(observed [1-9][0-9]*\\)\\z") | not) then
                    "failed_closed_submission"
                  elif .redemption_submitted == true
                      and valid($redemption_control.schema_version != 1
                        or $redemption_control.state != "confirmed_and_verified"
                        or $redemption_control.submission_attempted != true
                        or $redemption_control.run_id != .run_id
                        or ($redemption_control.recovery_run_id
                          | test("^venue-redemption-[0-9]{17}-[0-9a-f]{8}\\z") | not)) then
                    "failed_closed_recovery_chain"
                  elif .research_only != false then
                    "failed_closed_research_mode"
                  elif .live_strategy_enabled != true then
                    "failed_closed_live_strategy"
                  elif valid((keys | sort) != ([
                    "error", "finished_ts", "live_strategy_enabled",
                    "redemption_submitted", "research_only", "run_id",
                    "schema_version", "status"
                  ] | sort)) then
                    "failed_closed_field_set"
                  else "ok" end
                elif .status != "nothing_to_redeem"
                    and .status != "redeemed_and_verified"
                    and .status != "recovered_confirmed_and_verified" then
                  "unsupported_status"
                elif (valid(
                  .execution_origin == "azure_chile_central_static_egress"
                  and .execution_country == "CL"
                  and .static_egress_verified == true
                  and .dry_run == false
                  and .redemption_enabled == true
                  and .zero_open_orders_confirmed == true
                  and .derived_wallet_match == true
                  and .wallet_type == "legacy_uups_deposit_wallet"
                  and .research_only == false
                  and .live_strategy_enabled == true
                  and (.liquid_collateral_before | type == "number")
                  and .liquid_collateral_before > 0
                  and .liquid_collateral_before <=
                    (if $blob_name == $latest then $authorized_ceiling
                    else 29.505501 end))) | not then
                  "active_execution_contract"
                elif .status == "nothing_to_redeem" then
                  if valid(
                    .redemption_submitted == false
                    and .selection.selected == []
                    and .selection.selected_gross_payout == 0
                    and .planned_calls == []) then
                    "ok"
                  else "nothing_to_redeem_contract" end
                elif valid(
                  .redemption_submitted == true
                  and (.selection.selected | type == "array" and length >= 1)
                  and (.selection.selected_gross_payout
                    | type == "number" and . > 0)
                  and (if .status == "recovered_confirmed_and_verified" then
                      .planned_calls == []
                      and .new_submission_attempted == false
                      and .confirmed_transaction_reused == true
                      and $redemption_control.schema_version == 1
                      and $redemption_control.state == "confirmed_and_verified"
                      and $redemption_control.submission_attempted == true
                      and $redemption_control.recovery_run_id == .run_id
                      and $redemption_control.transaction_id == .transaction_id
                      and ($redemption_control.transaction_hash | ascii_downcase)
                        == (.transaction_hash | ascii_downcase)
                      and ([$redemption_control.condition_ids[] | ascii_downcase] | sort)
                        == ([.selection.selected[].condition_id | ascii_downcase] | sort)
                      and (($redemption_control.expected_gross_payout
                        - .selection.selected_gross_payout) | fabs) <= 0.0000011
                      and ($redemption_control.internal_settlement_blobs | sort)
                        == (.internal_settlement_blobs | sort)
                      and $recovery_journal_summary == .
                      and (if $redemption_control
                            | has("recovery_journal_blob_name") then
                          .predecessor_run_id == $redemption_control.run_id
                          and .recovery_journal_blob_name
                            == $recovery_control_blob_name
                          and $redemption_control.recovery_journal_blob_name
                            == $recovery_control_blob_name
                          and $redemption_control.recovery_publication_complete
                            == true
                          and $redemption_control.recovery_summary_sha256
                            == $record_sha256
                          and (if $blob_name == $latest then true else
                            $redemption_control.recovery_summary_blob_name
                              == $blob_name end)
                        else
                          (has("predecessor_run_id") | not)
                          and (has("recovery_journal_blob_name") | not)
                        end)
                    else
                      (.planned_calls | type == "array" and length >= 1)
                    end)
                  and (.transaction_id | type == "string" and length > 0)
                  and (.transaction_hash | type == "string"
                    and test("^0x[0-9a-fA-F]{64}$"))
                  and (.liquid_collateral_after | type == "number" and . >= 0)
                  and (.realized_payout | type == "number" and . > 0)
                  and ((.realized_payout
                    - .selection.selected_gross_payout) | fabs) <= 0.0000011
                  and (if .status == "recovered_confirmed_and_verified" then
                      ((.liquid_collateral_after - .liquid_collateral_before) | fabs)
                        <= 0.0000011
                    else
                      ((.liquid_collateral_after - .liquid_collateral_before
                        - .realized_payout) | fabs) <= 0.0000011
                    end)
                  and (.internal_settlement_blobs
                    | type == "array" and length >= 1)
                  and (.internal_settlement_blobs | length) ==
                    (.selection.selected | length)
                  and (.internal_settlement_blobs | length) ==
                    (.internal_settlement_blobs | unique | length)) then
                  "ok"
                elif .status == "recovered_confirmed_and_verified" then
                  "recovered_confirmed_and_verified_contract"
                else "redeemed_and_verified_contract" end
              ' "$redemption_file" 2>/dev/null); then
                redemption_contract_category=diagnostic_evaluation_error
              fi
              if [ "$redemption_contract_category" = "ok" ]; then
                redemption_contract_category=diagnostic_logic_gap
              fi
              printf '%s\n' \
                "funded v10 redemption contract validation failed: category=${redemption_contract_category}" >&2
              exit 1
            fi
            jq -c --arg record_sha256 "$redemption_sha" \
              --arg recovery_control_blob_name "$recovery_control_blob_name" \
              --arg recovery_control_sha256 "$recovery_control_sha256" \
              --argjson redemption_control "$redemption_control" '{
                run_id,
                status,
                redemption_submitted,
                record_sha256: $record_sha256,
                transaction_hash: (.transaction_hash // null),
                internal_settlement_blobs: (.internal_settlement_blobs // []),
                chain_predecessor_run_id: ($redemption_control.run_id // null),
                chain_recovery_run_id: ($redemption_control.recovery_run_id // null),
                chain_transaction_hash: ($redemption_control.transaction_hash // null),
                chain_settlement_blobs:
                  ($redemption_control.internal_settlement_blobs // []),
                recovery_control_blob_name:
                  (if $recovery_control_blob_name == "" then null
                    else $recovery_control_blob_name end),
                recovery_control_sha256:
                  (if $recovery_control_sha256 == "" then null
                    else $recovery_control_sha256 end)
              }' "$redemption_file" \
              >> existing-v10-redemption-chain.jsonl
            if [ "$blob_name" = "$v10_latest_redemption" ]; then
              latest_redemption_sha="$redemption_sha"
            else
              redemption_date=$(jq -r '.finished_ts[0:10]' "$redemption_file")
              redemption_run=$(jq -r '.run_id' "$redemption_file")
              test "$blob_name" = \
                "${v10_redemption_prefix}${redemption_date}/${redemption_run}.json"
              printf '%s\n' "$redemption_sha" >> existing-v10-redemption-sha256.txt
            fi
          done < <(jq -r --arg latest "$v10_latest_redemption" --arg archive "$v10_redemption_prefix" '
            .[].name | select(. == $latest or startswith($archive))
          ' v10-prefix-before-preflight.json)
          if [ "$archive_count" != "0" ]; then
            grep -Fqx "$latest_redemption_sha" existing-v10-redemption-sha256.txt
          fi
          verify_reviewed_legacy_onchain_candidates \
            existing-v10-legacy-onchain-error-candidates.jsonl \
