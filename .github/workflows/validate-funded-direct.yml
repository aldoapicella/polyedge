name: Validate funded Dynamic Quote safety

on:
  pull_request:
    paths:
      - ".github/workflows/validate-funded-direct.yml"
      - ".github/workflows/verify-funded-v10-intent.mjs"
      - "crates/polyedge-api/**"
      - "crates/polyedge-config/**"
      - "crates/polyedge-domain/**"
      - "crates/polyedge-storage/**"
      - "infra/funded-direct-chile.bicep"
      - "infra/funded-direct-chile.parameters.json"
      - "infra/storage-service-endpoints.bicep"
      - "infra/venue-probe.bicep"
      - "research/configs/funded_direct_dynamic_quote_*.json"
      - "venue-probe/**"
  workflow_dispatch:
    inputs:
      deploy_funded_service:
        description: Build and deploy the explicitly authorized continuous funded Dynamic Quote service
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

concurrency:
  group: validate-funded-direct-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  funded-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preserve isolated qset
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          git diff --name-only "origin/${GITHUB_BASE_REF}...HEAD" > changed-files.txt
          if grep -E '(^research/configs/.*qset|^infra/shadow-profitability-qset-v1\.bicep$|^\.github/workflows/deploy-polyedge-shadow-qset\.yml$)' changed-files.txt; then
            echo "Funded repair must not modify the frozen qset lane" >&2
            exit 1
          fi

      - name: Validate immutable operator-funded session and continuous deployment inputs
        run: |
          set -euo pipefail
          node <<'NODE'
          const assert = require("node:assert/strict");
          const crypto = require("node:crypto");
          const fs = require("node:fs");
          const session = JSON.parse(fs.readFileSync("research/configs/funded_direct_dynamic_quote_2026-08-13_v10.json"));
          const predecessor = JSON.parse(fs.readFileSync("research/configs/funded_direct_dynamic_quote_2026-07-29_v5.json"));
          const parameters = JSON.parse(fs.readFileSync("infra/funded-direct-chile.parameters.json")).parameters;
          const embedded = JSON.parse(parameters.fundedDirectSessionManifestJson.value);
          assert.deepEqual(embedded, session);
          const digest = `sha256:${crypto.createHash("sha256").update(JSON.stringify(session, null, 2)).digest("hex")}`;
          assert.equal(parameters.fundedDirectSessionManifestSha256.value, digest);
          assert.equal(parameters.fundedDirectEnabled.value, true);
          assert.equal(session.research_promotion_bypassed, true);
          assert.equal(session.research_lane_isolated, true);
          assert.equal(session.no_deposits, true);
          assert.equal(session.allow_automatic_replenishment, false);
          assert.equal(session.allow_compounding, true);
          assert.equal(session.schema_version, "polyedge.operator_funded_session.v3");
          assert.equal(session.continue_after_loss, true);
          assert.equal(session.capital_policy.reserve_ratio, 0.1);
          assert.equal(session.capital_policy.minimum_reserve, 2);
          assert.equal(session.capital_policy.target_order_ratio, 0.05);
          assert.equal(session.capital_policy.operating_buffer_ratio, 0.01);
          assert.equal(session.capital_policy.minimum_order_notional, 1);
          assert.equal(session.capital_policy.reserve_basis, "fully_reconciled_current_equity");
          assert.equal(session.capital_policy.loss_response, "resize_from_fully_reconciled_current_equity");
          assert.equal(session.capital_policy.prior_state_session_id, predecessor.session_id);
          assert.equal(session.capital_policy.prior_state_blob_name, predecessor.capital_policy.state_blob_name);
          assert.equal(
            session.capital_policy.prior_state_sha256,
            "sha256:9e63db7ef8c22d3af53a14f1858b817b8769ca7ba737e6668a900ffb73330c15"
          );
          assert.equal(session.capital_policy.minimum_historical_high_water_equity, 102.78112);
          assert.equal(session.capital_policy.high_water_update, "full_reconciliation_only");
          assert.equal(session.capital_policy.reserve_monotonic, false);
          assert.deepEqual(session.external_cash_flows, []);
          assert.deepEqual(session.internal_settlements, []);
          assert.equal(session.session_id, "dynamic-quote-funded-2026-08-13-v10");
          assert.equal(session.starting_collateral, 29.505501);
          assert.equal(session.max_account_loss, 29.505501);
          assert.equal(session.target_order_notional, 10.5);
          assert.equal(session.max_order_notional, 10.5);
          assert.equal(
            parameters.fundedDirectSessionManifestBlobName.value,
            "reports/funded/dynamic-quote/sessions/dynamic-quote-funded-2026-08-13-v10/session.json"
          );
          assert.equal(
            parameters.fundedDirectSessionManifestSha256.value,
            "sha256:c516c052fc5c01eed5403842ff24bf4b08512d6c38e8260e2d064580c82322f8"
          );
          assert.equal(parameters.fundedDirectCampaignId.value, session.session_id);
          for (const name of [
            "fundedDirectReserveMigrationSourceSessionId",
            "fundedDirectReserveMigrationSourceSessionManifestBlobName",
            "fundedDirectReserveMigrationSourceSessionManifestSha256",
            "fundedDirectReserveMigrationSourceStateBlobName",
            "fundedDirectReserveMigrationMinimumHistoricalHighWaterEquity"
          ]) assert.equal(parameters[name].value, "");
          assert.equal(parameters.fundedDirectStartingCollateral.value, "29.505501");
          assert.equal(parameters.fundedDirectMaxAccountLoss.value, "29.505501");
          NODE
          node --test .github/workflows/verify-funded-v10-intent.mjs

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: venue-probe/package-lock.json

      - name: Test funded worker and adversarial controls
        working-directory: venue-probe
        run: |
          npm ci
          npm test

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Validate intent producer contracts
        run: |
          set -euo pipefail
          cargo fmt --all --check
          cargo test -p polyedge-api
          cargo test -p polyedge-config
          cargo test -p polyedge-domain
          cargo test -p polyedge-storage

      - name: Build fail-closed Azure templates
        run: |
          set -euo pipefail
          az bicep build --file infra/funded-direct-chile.bicep --stdout > funded-direct-chile.json
          az bicep build --file infra/storage-service-endpoints.bicep --stdout > storage-service-endpoints.json
          az bicep build --file infra/venue-probe.bicep --stdout > venue-probe.json
          node <<'NODE'
          const assert = require("node:assert/strict");
          const fs = require("node:fs");
          const template = JSON.parse(fs.readFileSync("funded-direct-chile.json"));
          const resources = (type) => template.resources.filter((resource) => resource.type === type);
          const [namespace] = resources("Microsoft.ServiceBus/namespaces");
          assert.equal(resources("Microsoft.ServiceBus/namespaces").length, 1);
          assert.equal(namespace.sku.name, "Standard");
          assert.equal(namespace.properties.disableLocalAuth, true);
          assert.equal(namespace.properties.publicNetworkAccess, "Enabled");
          const [networkRules] = resources("Microsoft.ServiceBus/namespaces/networkRuleSets");
          assert.equal(networkRules.properties.defaultAction, "Deny");
          assert.equal(networkRules.properties.ipRules.length, 2);
          assert.equal(template.parameters.fundedDirectQueueStatus.defaultValue, "Active");
          assert.deepEqual(template.parameters.fundedDirectQueueStatus.allowedValues, ["Active", "SendDisabled"]);
          const [queue] = resources("Microsoft.ServiceBus/namespaces/queues");
          assert.equal(queue.properties.status, "[parameters('fundedDirectQueueStatus')]");
          assert.equal(queue.properties.requiresDuplicateDetection, true);
          assert.equal(queue.properties.duplicateDetectionHistoryTimeWindow, "PT10M");
          assert.equal(queue.properties.defaultMessageTimeToLive, "PT15S");
          assert.equal(queue.properties.lockDuration, "PT30S");
          assert.equal(queue.properties.deadLetteringOnMessageExpiration, true);
          assert.equal(queue.properties.maxDeliveryCount, 3);
          const deadLetterAlert = resources("Microsoft.Insights/metricAlerts").find((resource) =>
            resource.name === "polyedge-funded-direct-dead-letters");
          assert.equal(deadLetterAlert.properties.criteria.allOf[0].timeAggregation, "Maximum");
          const roleIds = resources("Microsoft.Authorization/roleAssignments")
            .map((resource) => resource.properties.roleDefinitionId.toLowerCase());
          assert.equal(roleIds.filter((value) => value.includes("69a216fc-b8fb-44d8-bc22-1f3c2cd27a39")).length, 1);
          assert.equal(roleIds.filter((value) => value.includes("4f6d3b9b-027b-4f4c-9142-0e5a2a2247e0")).length, 1);
          const isolatedEndpoints = JSON.parse(fs.readFileSync("storage-service-endpoints.json"));
          const endpointSubnets = isolatedEndpoints.resources.filter((resource) =>
            resource.type === "Microsoft.Network/virtualNetworks/subnets");
          assert.equal(endpointSubnets.length, 2);
          assert.equal(endpointSubnets.every((resource) =>
            resource.properties.serviceEndpoints.some((endpoint) => endpoint.service === "Microsoft.Storage.Global")), true);
          const chileVnet = template.resources.find((resource) =>
            resource.type === "Microsoft.Network/virtualNetworks");
          assert.equal(chileVnet.properties.subnets[0].properties.serviceEndpoints[0].service, "Microsoft.Storage.Global");
          assert.equal(template.parameters.producerPublicIpName.defaultValue, "pip-polyedge-venue-neu-egress-2");
          const app = template.resources.find((resource) =>
            resource.type === "Microsoft.App/containerApps" &&
            resource.properties.template.containers[0].name === "funded-direct");
          const envEntries = app.properties.template.containers[0].env;
          const env = Object.fromEntries(envEntries.map((entry) => [entry.name, entry.value]));
          assert.equal(env.FUNDED_DIRECT_ENGINE, "persistent_v1");
          assert.equal(env.FUNDED_DIRECT_SERVICE_BUS_ENABLED, "true");
          assert.equal(env.FUNDED_DIRECT_SIGNAL_TO_SEND_SLO_MS, "7000");
          assert.equal(env.FUNDED_DIRECT_POLL_INTERVAL_MS, "1000");
          assert.equal(env.FUNDED_DIRECT_MIN_REMAINING_TTL_MS, "7000");
          assert.equal(env.FUNDED_DIRECT_CHILD_MIN_REMAINING_TTL_MS, "2000");
          for (const name of [
            "FUNDED_DIRECT_RESERVE_MIGRATION_SOURCE_SESSION_ID",
            "FUNDED_DIRECT_RESERVE_MIGRATION_SOURCE_SESSION_MANIFEST_BLOB_NAME",
            "FUNDED_DIRECT_RESERVE_MIGRATION_SOURCE_SESSION_MANIFEST_SHA256",
            "FUNDED_DIRECT_RESERVE_MIGRATION_SOURCE_STATE_BLOB_NAME",
            "FUNDED_DIRECT_RESERVE_MIGRATION_MINIMUM_HISTORICAL_HIGH_WATER_EQUITY"
          ]) assert.ok(name in env, `${name} missing from funded executor`);
          assert.match(JSON.stringify(env.FUNDED_DIRECT_AUTO_REDEMPTION_ENABLED), /fundedDirectEnabled/);
          assert.equal(env.FUNDED_DIRECT_AUTO_REDEMPTION_INTERVAL_MS, "60000");
          assert.equal(env.FUNDED_DIRECT_AUTO_REDEMPTION_MIN_SECONDS_TO_EXPIRY, "30");
          assert.equal(env.FUNDED_DIRECT_AUTO_REDEMPTION_MAX_SECONDS_TO_EXPIRY, "350");
          assert.equal("VENUE_REDEMPTION_MAX_PAYOUT" in env, false);
          assert.equal(env.VENUE_REDEMPTION_MAX_CONDITIONS, "1");
          assert.equal(
            envEntries.find((entry) => entry.name === "POLYMARKET_RELAYER_API_KEY")?.secretRef,
            "polymarket-relayer-api-key"
          );
          assert.equal(
            app.properties.configuration.secrets.find((entry) => entry.name === "polymarket-relayer-api-key")
              ?.keyVaultUrl.includes("secrets/polymarket-relayer-api-key"),
            true
          );
          assert.equal(app.properties.template.scale.maxReplicas, 1);
          assert.match(JSON.stringify(app.properties.template.scale.minReplicas), /fundedDirectEnabled/);
          const producer = JSON.parse(fs.readFileSync("venue-probe.json")).resources.find((resource) =>
            resource.type === "Microsoft.App/containerApps" &&
            resource.properties.template.containers[0].name === "shadow-runtime");
          const producerEnv = Object.fromEntries(producer.properties.template.containers[0].env.map((entry) => [entry.name, entry.value]));
          assert.ok("FUNDED_DIRECT_SERVICE_BUS_ENABLED" in producerEnv);
          assert.ok("FUNDED_DIRECT_SERVICE_BUS_NAMESPACE" in producerEnv);
          assert.ok("FUNDED_DIRECT_SERVICE_BUS_QUEUE" in producerEnv);
          assert.equal(producerEnv.LOCAL_JSONL_RECORDER_ENABLED, "false");
          assert.equal(
            JSON.parse(fs.readFileSync("venue-probe.json")).parameters.publicIpName.defaultValue,
            "pip-polyedge-venue-neu-egress-2"
          );
          const producerVnet = JSON.parse(fs.readFileSync("venue-probe.json")).resources.find((resource) =>
            resource.type === "Microsoft.Network/virtualNetworks");
          assert.equal(producerVnet.properties.subnets[0].properties.serviceEndpoints[0].service, "Microsoft.Storage.Global");
          const warmup = template.resources.find((resource) =>
            resource.type === "Microsoft.App/jobs" &&
            resource.properties.template.containers[0].name === "funded-warmup");
          assert.equal(warmup.properties.template.containers[0].command.join(" "), "node src/funded-direct-warmup.mjs");
          assert.equal(warmup.properties.template.containers[0].env.some((entry) => entry.name === "POLYMARKET_PRIVATE_KEY"), false);
          const fundedJob = template.resources.find((resource) =>
            resource.type === "Microsoft.App/jobs" &&
            resource.properties.template.containers[0].name === "funded-direct");
          assert.equal(fundedJob.properties.configuration.replicaTimeout, 11400);
          assert.equal(fundedJob.properties.configuration.replicaRetryLimit, 0);
          const workflow = fs.readFileSync(".github/workflows/validate-funded-direct.yml", "utf8");
          assert.equal(workflow.includes(
            ["FUNDED_DIRECT_SERVICE_BUS_ENABLED", "false"].join("=")), false);
          const preparePreflightStart = workflow.lastIndexOf(
            "\n      - name: Prepare zero-write v10 preflight inputs");
          const preparePreflightEnd = workflow.lastIndexOf(
            "\n      - name: Run the zero-write v10 preflight against a fresh producer intent");
          assert.ok(preparePreflightStart >= 0 && preparePreflightStart < preparePreflightEnd);
          const preflightLogin = workflow.lastIndexOf(
            "\n      - name: Refresh Azure login before zero-write v10 preflight", preparePreflightEnd);
          assert.ok(preparePreflightStart < preflightLogin && preflightLogin < preparePreflightEnd);
          const preparePreflight = workflow.slice(preparePreflightStart, preparePreflightEnd);
          assert.equal(preparePreflight.includes(
            "cmp existing-v10-authorization-decisions.txt existing-v10-completion-decisions.txt"), false);
          assert.match(preparePreflight,
            /comm -23 existing-v10-authorization-decisions\.txt existing-v10-completion-decisions\.txt/);
          assert.match(preparePreflight,
            /comm -13 existing-v10-authorization-decisions\.txt existing-v10-completion-decisions\.txt/);
          assert.match(preparePreflight,
            /\.authorization_blob_name == null[\s\S]*\.status == "one_workflow_busy"[\s\S]*\.risk_reservation_created == false/);
          const pointerPreflightDeployment = workflow.indexOf(
            "\n      - name: Deploy and verify the pointer-only preflight Dynamic Quote intent producer"
          );
          assert.ok(pointerPreflightDeployment >= 0);
          const pointerPreflightMarker = workflow.indexOf(
            "FUNDED_POINTER_PREFLIGHT_REQUESTED=true", pointerPreflightDeployment);
          const pointerPreflight = workflow.indexOf(
            "STRATEGY_INTENT_POINTER_ONLY_PREFLIGHT=true", pointerPreflightDeployment);
          const pointerPreflightRestore = workflow.indexOf(
            "--remove-env-vars STRATEGY_INTENT_POINTER_ONLY_PREFLIGHT", pointerPreflight);
          const enableService = workflow.indexOf(
            "- name: Enable v10 only after the zero-write preflight passes", pointerPreflightRestore);
          assert.ok(pointerPreflightMarker >= 0 && pointerPreflightMarker < pointerPreflight);
          assert.ok(pointerPreflight < pointerPreflightRestore && pointerPreflightRestore < enableService);
          const producerConsoleQuery = "ContainerAppName_s == '$" + "INTENT_PRODUCER_APP'";
          assert.equal(workflow.includes(producerConsoleQuery), false);
          const workerPreflightLog = workflow.indexOf(
            "funded-preflight-logs.json", pointerPreflightDeployment);
          const exactIntentProof = workflow.indexOf(
            "pointer-preflight-exact-intent.json", pointerPreflightDeployment);
          assert.ok(workerPreflightLog >= 0 && workerPreflightLog < exactIntentProof);
          const cutoff = workflow.indexOf(
            "pointer_preflight_cutoff_epoch=$(date -u +%s)", pointerPreflightDeployment);
          const pointerSnapshot = workflow.indexOf("pointer-before-preflight.json", cutoff);
          const workerStart = workflow.indexOf("- name: Run the zero-write v10 preflight", pointerSnapshot);
          const workerStep = workflow.slice(
            workerStart, workflow.indexOf("\n      - name:", workerStart + 1));
          assert.match(workerStep,
            /readonly v5_etag_before="\$\{PREFLIGHT_V5_ETAG_BEFORE:\?\}"[\s\S]*readonly intent_container="\$\{PREFLIGHT_INTENT_CONTAINER:\?\}"[\s\S]*readonly intent_prefix="\$\{PREFLIGHT_INTENT_PREFIX:\?\}"/);
          const pointerAfter = workflow.indexOf("pointer-after-preflight.json", workerStart);
          const queueInvariance = workflow.indexOf(
            "funded-queue-after-pointer-preflight.snapshot.json", pointerAfter);
          assert.ok(exactIntentProof < queueInvariance);
          assert.ok(pointerPreflight < cutoff && cutoff < pointerSnapshot && pointerSnapshot < workerStart);
          assert.ok(workerStart < pointerAfter && pointerAfter < queueInvariance);
          assert.match(workflow, /pointer_after_etag[\s\S]*pointer_before_etag/);
          const activation = workflow.slice(
            workflow.lastIndexOf("- name: Pause producer and warm funded intent"),
            workflow.lastIndexOf("- name: Restore the dormant funded service"));
          const pause = activation.indexOf("RUN_BOT_ON_STARTUP=false");
          const active = activation.indexOf("--status Active", pause);
          const warmupStep = activation.indexOf('--name "$FUNDED_WARMUP_JOB"', active);
          const ready = activation.indexOf('test "$warmup_ready" = true', warmupStep);
          const enable = activation.indexOf("RUN_BOT_ON_STARTUP=true", ready);
          const first = activation.indexOf("top 1 by TimeGenerated asc", enable);
          assert.ok(pause < active && active < warmupStep && warmupStep < ready &&
            ready < enable && enable < first);
          assert.match(activation, /signal_to_send_ms <= \.signal_to_send_slo_ms/);
          assert.match(activation, /funded-v10-rollover-warmup\.json/);
          assert.match(activation, /funded-v10-rollover-heartbeat\.json/);
          assert.match(activation, /TimeGenerated <= datetime\(\$lifecycle_completed_at\)/);
          const lifecycleLogin = activation.indexOf("Refresh Azure login before submitted v10 lifecycle");
          const childRunValidation = activation.indexOf(
            '[[ "$child_run_id" =~ ^funded-direct-[0-9]{17}-[0-9a-f]{8}$ ]]', lifecycleLogin);
          const reservationValidation = activation.indexOf(
            '[[ "$reservation_blob" =~ ^reports/research/venue-probe/risk-reservations/', childRunValidation);
          const terminalLogin = activation.indexOf(
            "Refresh Azure login before terminal reservation verification", reservationValidation);
          const explicitFence = activation.lastIndexOf("--status SendDisabled", terminalLogin);
          const fenceReadback = activation.indexOf(
            '--query status -o tsv)" = "SendDisabled"', explicitFence);
          const safeHandoff = activation.indexOf(
            "printf 'FUNDED_LIFECYCLE_DECISION_ID=%s\\n'", fenceReadback);
          const terminalLoop = activation.indexOf(
            "terminal_deadline_epoch=$(( $(date -u +%s) + 2400 ))", terminalLogin);
          const terminalIdentity = activation.indexOf(".schema_version == 1", terminalLoop);
          const terminalProof = activation.indexOf('test "$terminal_reservation_ready" = true', terminalLoop);
          const terminalPredicate = activation.indexOf('.state == "position_settled"', terminalLoop);
          const queueReopen = activation.lastIndexOf("--status Active");
          const cutoverComplete = activation.indexOf("FUNDED_CUTOVER_COMPLETE=true", queueReopen);
          assert.ok(lifecycleLogin < childRunValidation && childRunValidation < reservationValidation);
          assert.ok(reservationValidation < explicitFence && explicitFence < fenceReadback &&
            fenceReadback < safeHandoff && safeHandoff < terminalLogin);
          assert.ok(terminalLogin < terminalLoop && terminalLoop < terminalIdentity &&
            terminalIdentity < terminalPredicate &&
            terminalPredicate < terminalProof && terminalProof < queueReopen && queueReopen < cutoverComplete);
          const terminalStep = activation.slice(terminalLoop);
          assert.match(terminalStep, /\.schema_version == 1[\s\S]*\.campaign_id == "dynamic-quote-funded-2026-08-13-v10"[\s\S]*\.run_id == \$run[\s\S]*\.probe_id == \("funded-direct-" \+ \$decision\)[\s\S]*\.order_submitted == true[\s\S]*\.order_id == \$order_id/);
          assert.match(activation, /\.state == "finalized_no_fill"[\s\S]*\.state == "position_settled"[\s\S]*settlement_evidence_source == "verified_onchain_redemption"[\s\S]*settlement_evidence_source == "polymarket_data_api_redeemable"/);
          assert.equal(activation.includes('echo "FUNDED_LIFECYCLE_'), false);
          assert.equal(activation.includes("for attempt in $(seq 1 360); do"), false);
          const legacyPreflightLoop = ["for attempt in $(seq 1 ", "1200); do"].join("");
          assert.equal(workflow.includes(legacyPreflightLoop), false);
          const waitBounds = Object.fromEntries([...workflow.matchAll(
            /(preflight|lifecycle|terminal)_deadline_epoch=\$\(\( \$\(date -u \+%s\) \+ ([0-9]+) \)\)/g
          )].map((match) => [match[1], Number(match[2])]));
          assert.deepEqual(waitBounds, { preflight: 2700, lifecycle: 2400, terminal: 2400 });
          assert.ok(Object.values(waitBounds).reduce((sum, value) => sum + value, 0) <= 180 * 60);
          const rollback = workflow.slice(
            workflow.lastIndexOf("- name: Restore the dormant funded service"));
          assert.match(rollback,
            /for attempt in \$\(seq 1 30\); do[\s\S]*ContainerAppOperationInProgress[\s\S]*sleep 10/);
          assert.match(rollback,
            /cmp funded-rollback-template\.json restored-funded-template\.json[\s\S]*az containerapp revision deactivate[\s\S]*properties\.active == true/);
          for (const retry of [
            "-o json > funded-preflight-logs.json || { sleep 10; continue; }",
            "--query '[0].Count' -o tsv) || { sleep 10; continue; }",
            "-o json > funded-heartbeat-final.json || { sleep 10; continue; }",
            "-o json > funded-warmup-after-reopen.json || { sleep 5; continue; }",
            "-o json > funded-heartbeat-after-reopen.json || { sleep 5; continue; }"
          ]) assert.ok(workflow.includes(retry), `missing bounded Log Analytics retry: ${retry}`);
          NODE
          git diff --check

  deploy-funded-service:
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_funded_service
    needs: funded-safety
    runs-on: ubuntu-latest
    timeout-minutes: 360
    concurrency:
      group: polyedge-funded-direct-cl
      cancel-in-progress: false
    env:
      AZURE_RESOURCE_GROUP: rg-polyedge-dev
      ACR_NAME: crpolyedge6urdjr5nmwx7w
      FUNDED_APP: polyedge-funded-direct-cl
      INTENT_PRODUCER_APP: polyedge-shadow-neu
      PROTECTED_QSET_APP: polyedge-shadow-qset-neu
      SERVICE_BUS_NAMESPACE: sb-polyedge-funded-cl-6urdjr5nmwx7w
      SERVICE_BUS_QUEUE: funded-dynamic-quote-intents
      FUNDED_JOB: polyedge-funded-direct-cl-job
      FUNDED_WARMUP_JOB: polyedge-funded-warmup-cl
      LEGACY_NEU_FUNDED_JOB: polyedge-funded-ladder-neu-job
      STORAGE_ACCOUNT: stpolyedge6urdjr5nmwx7w
      FUNDED_CONTAINER: polyedge-funded-evidence
    steps:
      - uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Verify deployment identity, intent producer, and protected qset
        env:
          EXPECTED_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          set -euo pipefail
          test "$(az account show --query id -o tsv)" = "$EXPECTED_SUBSCRIPTION_ID"
          az group show --name "$AZURE_RESOURCE_GROUP" --query name -o tsv
          az containerapp show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$INTENT_PRODUCER_APP" \
            --query properties.latestRevisionName \
            -o tsv > intent-producer-revision-before.txt
          test -s intent-producer-revision-before.txt
          az containerapp show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$PROTECTED_QSET_APP" \
            --query properties.latestRevisionName \
            -o tsv > protected-qset-revision-before.txt
          test -s protected-qset-revision-before.txt

      - name: Build and publish immutable producer and funded worker images
        id: images
        run: |
          set -euo pipefail
          login_server=$(az acr show --name "$ACR_NAME" --query loginServer -o tsv)
          producer_tag="$login_server/polyedge-rust-backend:${GITHUB_SHA}"
          funded_tag="$login_server/polyedge-venue-probe:${GITHUB_SHA}"
          az acr login --name "$ACR_NAME"
          docker build --build-arg GIT_SHA="$GITHUB_SHA" -f Dockerfile.rust -t "$producer_tag" .
          docker build -f Dockerfile.venue-probe -t "$funded_tag" .
          docker push "$producer_tag"
          docker push "$funded_tag"
          producer_digest=$(az acr repository show \
            --name "$ACR_NAME" \
            --image "polyedge-rust-backend:${GITHUB_SHA}" \
            --query digest \
            -o tsv)
          funded_digest=$(az acr repository show \
            --name "$ACR_NAME" \
            --image "polyedge-venue-probe:${GITHUB_SHA}" \
            --query digest \
            -o tsv)
          test -n "$producer_digest"
          test -n "$funded_digest"
          echo "producer_reference=$login_server/polyedge-rust-backend@$producer_digest" >> "$GITHUB_OUTPUT"
          echo "funded_reference=$login_server/polyedge-venue-probe@$funded_digest" >> "$GITHUB_OUTPUT"

      - name: Prove isolated funded infrastructure deployment scope
        run: |
          set -euo pipefail
          az deployment group what-if \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --template-file infra/funded-direct-chile.bicep \
            --parameters @infra/funded-direct-chile.parameters.json \
            --parameters venueProbeImage="${{ steps.images.outputs.funded_reference }}" \
            --parameters fundedDirectQueueStatus=SendDisabled \
            --result-format ResourceIdOnly \
            --no-pretty-print \
            -o json > funded-what-if.json
          jq -e '
            [ .changes[]
              | select(.changeType != "Ignore" and .changeType != "NoChange")
              | select(.resourceId | ascii_downcase | test("qset|polyedge-shadow-neu|/containerapps/polyedge-dev$"))
            ] | length == 0
          ' funded-what-if.json

      - name: Refresh Azure login before funded fence
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Fence queue and verify predecessor before dormant v8 audit
        run: |
          set -euo pipefail
          az containerapp show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$FUNDED_APP" \
            -o json > current-funded-app.json
          current_revision=$(jq -r '.properties.latestReadyRevisionName // ""' current-funded-app.json)
          test -n "$current_revision"
          az containerapp revision show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$FUNDED_APP" \
            --revision "$current_revision" \
            --only-show-errors \
            -o json > current-funded-revision.json
          current_session=$(jq -r '
            [.properties.template.containers[0].env[]
              | select(.name == "VENUE_PROBE_FUNDED_CAMPAIGN_ID")
              | .value][0] // ""
          ' current-funded-revision.json)
          current_revision_created_at=$(jq -r '.properties.createdTime // ""' current-funded-revision.json)
          environment_id=$(az containerapp show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$FUNDED_APP" \
            --query properties.environmentId -o tsv)
          workspace_customer_id=$(az containerapp env show \
            --ids "$environment_id" \
            --query properties.appLogsConfiguration.logAnalyticsConfiguration.customerId -o tsv)
          test -n "$current_revision"
          test -n "$current_revision_created_at"
          test -n "$workspace_customer_id"
          fence_started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          az servicebus queue update \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --namespace-name "$SERVICE_BUS_NAMESPACE" \
            --name "$SERVICE_BUS_QUEUE" \
            --status SendDisabled \
            --only-show-errors -o none
          echo "FUNDED_QUEUE_FENCED=true" >> "$GITHUB_ENV"
          test "$(az servicebus queue show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --namespace-name "$SERVICE_BUS_NAMESPACE" \
            --name "$SERVICE_BUS_QUEUE" \
            --query status -o tsv)" = "SendDisabled"
          for attempt in $(seq 1 30); do
            active_messages=$(az servicebus queue show \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --namespace-name "$SERVICE_BUS_NAMESPACE" \
              --name "$SERVICE_BUS_QUEUE" \
              --query countDetails.activeMessageCount -o tsv)
            if [ "${active_messages:-0}" = "0" ]; then break; fi
            sleep 5
          done
          test "${active_messages:-0}" = "0"
          queue_snapshot=$(az servicebus queue show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --namespace-name "$SERVICE_BUS_NAMESPACE" \
            --name "$SERVICE_BUS_QUEUE" -o json)
          test "$(jq -r '.countDetails.activeMessageCount' <<<"$queue_snapshot")" = "0"
          test "$(jq -r '.countDetails.scheduledMessageCount' <<<"$queue_snapshot")" = "0"
          fenced_dlq=$(jq -r '.countDetails.deadLetterMessageCount' <<<"$queue_snapshot")
          [[ "$fenced_dlq" =~ ^[0-9]+$ ]]
          printf '%s\n' "$fenced_dlq" > funded-fenced-dlq-before.txt
          env_value() {
            jq -er --arg name "$1" '
              [.properties.template.containers[0].env[]
                | select(.name == $name) | .value]
              | if length == 1 and .[0] != null then .[0]
                else error("expected exactly one non-null environment value for " + $name)
                end
            ' current-funded-revision.json
          }
          case "$current_session" in
            dynamic-quote-funded-2026-07-29-v5)
              test "$(jq -r '.properties.template.scale.minReplicas' current-funded-revision.json)" = "0"
              test "$(jq -r '.properties.template.scale.maxReplicas' current-funded-revision.json)" = "1"
              for name in \
                FUNDED_DIRECT_SERVICE_ENABLED \
                FUNDED_DIRECT_WORKER_ENABLED \
                FUNDED_DIRECT_AUTO_REDEMPTION_ENABLED \
                ALLOW_FUNDED_DIRECT \
                ALLOW_LIVE \
                ALLOW_STRATEGY_CANARY \
                ENABLE_TAKER_ORDERS; do
                test "$(env_value "$name")" = "false"
              done
              test "$(env_value FUNDED_DIRECT_DRY_RUN)" = "true"
              test "$(env_value VENUE_PROBE_FUNDED_CAMPAIGN_ID)" = \
                "dynamic-quote-funded-2026-07-29-v5"
              test "$(env_value VENUE_PROBE_CAMPAIGN_BASELINE_EQUITY)" = "11.09862"
              test "$(env_value FUNDED_DIRECT_SESSION_MANIFEST_BLOB_NAME)" = \
                "reports/funded/dynamic-quote/sessions/dynamic-quote-funded-2026-07-29-v5/session.json"
              test "$(env_value FUNDED_DIRECT_SESSION_MANIFEST_SHA256)" = \
                "sha256:b8877f266f1e68d846ad2fd3ae8732c2d533cc7ccc14482ac5f76d0d1c1f58f9"
              test "$(env_value FUNDED_DIRECT_RESERVE_MIGRATION_SOURCE_SESSION_ID)" = \
                "dynamic-quote-funded-2026-08-03-v7"
              test "$(env_value FUNDED_DIRECT_RESERVE_MIGRATION_SOURCE_SESSION_MANIFEST_BLOB_NAME)" = \
                "reports/funded/dynamic-quote/sessions/dynamic-quote-funded-2026-08-03-v7/session.json"
              test "$(env_value FUNDED_DIRECT_RESERVE_MIGRATION_SOURCE_SESSION_MANIFEST_SHA256)" = \
                "sha256:410abe9fc7f2f81359bbb4ef8304a153326d7be170a76dc64e84dd2bf1a4e709"
              test "$(env_value FUNDED_DIRECT_RESERVE_MIGRATION_SOURCE_STATE_BLOB_NAME)" = \
                "reports/funded/dynamic-quote/sessions/dynamic-quote-funded-2026-08-03-v7/capital-reserve-state.json"
              test "$(env_value FUNDED_DIRECT_RESERVE_MIGRATION_MINIMUM_HISTORICAL_HIGH_WATER_EQUITY)" = \
                "75.90162"
              ;;
            dynamic-quote-funded-2026-08-11-v8)
              test "$(jq -r '.properties.template.scale.minReplicas' current-funded-revision.json)" = "0"
              test "$(jq -r '.properties.template.scale.maxReplicas' current-funded-revision.json)" = "1"
              for name in \
                FUNDED_DIRECT_SERVICE_ENABLED \
                FUNDED_DIRECT_WORKER_ENABLED \
                FUNDED_DIRECT_AUTO_REDEMPTION_ENABLED \
                ALLOW_FUNDED_DIRECT \
                ALLOW_LIVE \
                ALLOW_STRATEGY_CANARY \
                ENABLE_TAKER_ORDERS; do
                test "$(env_value "$name")" = "false"
              done
              test "$(env_value VENUE_PROBE_FUNDED_CAMPAIGN_ID)" = \
                "dynamic-quote-funded-2026-08-11-v8"
              test "$(env_value FUNDED_DIRECT_DRY_RUN)" = "true"
              test "$(env_value FUNDED_DIRECT_SESSION_MANIFEST_BLOB_NAME)" = \
                "reports/funded/dynamic-quote/sessions/dynamic-quote-funded-2026-08-11-v8/session.json"
              test "$(env_value FUNDED_DIRECT_SESSION_MANIFEST_SHA256)" = \
                "sha256:04c4b7e9816b71b12e1f7ecd14c34be6bc368ab4db581ee34c62fb1c69e5d4bf"
              readonly v8_prefix="reports/funded/dynamic-quote/sessions/dynamic-quote-funded-2026-08-11-v8/"
              readonly v8_session="${v8_prefix}session.json"
              readonly v8_state="${v8_prefix}capital-reserve-state.json"
              az storage blob list \
                --account-name "$STORAGE_ACCOUNT" \
                --container-name "$FUNDED_CONTAINER" \
                --prefix "$v8_prefix" \
                --num-results '*' \
                --auth-mode login \
                --only-show-errors -o json > dormant-v8-prefix.json
              jq -e --arg session "$v8_session" --arg state "$v8_state" '
                (length == 1 or length == 2)
                and ([.[].name] | index($session) != null)
                and ([.[].name | select(. != $session and . != $state)] | length) == 0
              ' dormant-v8-prefix.json >/dev/null
              az storage blob download \
                --account-name "$STORAGE_ACCOUNT" \
                --container-name "$FUNDED_CONTAINER" \
                --name "$v8_session" \
                --file dormant-v8-session.json \
                --auth-mode login \
                --overwrite \
                --only-show-errors -o none
              test "sha256:$(sha256sum dormant-v8-session.json | cut -d' ' -f1)" = \
                "sha256:04c4b7e9816b71b12e1f7ecd14c34be6bc368ab4db581ee34c62fb1c69e5d4bf"
              if jq -e --arg state "$v8_state" '[.[].name] | index($state) != null' \
                  dormant-v8-prefix.json >/dev/null; then
                az storage blob download \
                  --account-name "$STORAGE_ACCOUNT" \
                  --container-name "$FUNDED_CONTAINER" \
                  --name "$v8_state" \
                  --file dormant-v8-capital-reserve-state.json \
                  --auth-mode login \
                  --overwrite \
                  --only-show-errors -o none
                jq -e '
                  .schema == "polyedge.protected_compounding_state.v2"
                  and .session_id == "dynamic-quote-funded-2026-08-11-v8"
                  and .reconciliation_complete == true
                  and .reserve_ratio == 0.1
                  and .minimum_reserve == 2
                  and .target_order_ratio == 0.05
                  and .operating_buffer_ratio == 0.01
                  and .minimum_order_notional == 1
                  and .reserve_basis == "fully_reconciled_current_equity"
                  and .loss_response == "resize_from_fully_reconciled_current_equity"
                  and .continue_after_loss == true
                  and .reserve_monotonic == false
                  and .prior_state_session_id == "dynamic-quote-funded-2026-07-29-v5"
                  and .prior_state_blob_name == "reports/funded/dynamic-quote/sessions/dynamic-quote-funded-2026-07-29-v5/capital-reserve-state.json"
                  and .prior_state_sha256 == "sha256:617b0bd69466dc7d6ff7d61b26f5a4ed1bcfd557d5d9e4b62688b7fb13bf28c6"
                  and .high_water_equity >= 102.78112
                  and .historical_high_water_equity >= 102.78112
                  and (.last_reconciled_equity - 31.655501 | fabs) <= 0.01
                  and (.authorized_equity_ceiling - 31.655501 | fabs) <= 0.0000011
                  and .verified_realized_pnl == 0
                  and .verified_settlement_ids == []
                  and (.protected_reserve - ([2, (.last_reconciled_equity * .reserve_ratio)] | max) | fabs) <= 0.0000011
                  and (.operating_buffer - (.last_reconciled_equity * .operating_buffer_ratio) | fabs) <= 0.0000011
                  and (.operable_capital - ([0, (.last_reconciled_equity - .protected_reserve - .operating_buffer)] | max) | fabs) <= 0.0000011
                  and ([keys[] | select(test("migration_|cash.flow"))] | length) == 0
                ' dormant-v8-capital-reserve-state.json >/dev/null
              fi
              ;;
            dynamic-quote-funded-2026-08-13-v10)
              test "$(jq -r '.properties.template.scale.maxReplicas' current-funded-revision.json)" = "1"
              test "$(env_value VENUE_PROBE_FUNDED_CAMPAIGN_ID)" = \
                "dynamic-quote-funded-2026-08-13-v10"
              test "$(env_value VENUE_PROBE_CAMPAIGN_BASELINE_EQUITY)" = "29.505501"
              test "$(env_value VENUE_PROBE_CAMPAIGN_CASH_FLOWS)" = "[]"
              test "$(env_value FUNDED_DIRECT_SESSION_MANIFEST_BLOB_NAME)" = \
                "reports/funded/dynamic-quote/sessions/dynamic-quote-funded-2026-08-13-v10/session.json"
              test "$(env_value FUNDED_DIRECT_SESSION_MANIFEST_SHA256)" = \
                "sha256:c516c052fc5c01eed5403842ff24bf4b08512d6c38e8260e2d064580c82322f8"
              for name in \
                FUNDED_DIRECT_RESERVE_MIGRATION_SOURCE_SESSION_ID \
                FUNDED_DIRECT_RESERVE_MIGRATION_SOURCE_SESSION_MANIFEST_BLOB_NAME \
                FUNDED_DIRECT_RESERVE_MIGRATION_SOURCE_SESSION_MANIFEST_SHA256 \
                FUNDED_DIRECT_RESERVE_MIGRATION_SOURCE_STATE_BLOB_NAME \
                FUNDED_DIRECT_RESERVE_MIGRATION_MINIMUM_HISTORICAL_HIGH_WATER_EQUITY; do
                test -z "$(env_value "$name")"
              done
              current_min_replicas=$(jq -r '.properties.template.scale.minReplicas' current-funded-revision.json)
              case "$current_min_replicas" in
                0)
                  for name in \
                    FUNDED_DIRECT_SERVICE_ENABLED \
                    FUNDED_DIRECT_WORKER_ENABLED \
                    FUNDED_DIRECT_AUTO_REDEMPTION_ENABLED \
                    ALLOW_FUNDED_DIRECT \
                    ALLOW_LIVE \
                    ALLOW_STRATEGY_CANARY \
                    ENABLE_TAKER_ORDERS; do
                    test "$(env_value "$name")" = "false"
                  done
                  test "$(env_value FUNDED_DIRECT_DRY_RUN)" = "true"
                  ;;
                1)
                  for name in \
                    FUNDED_DIRECT_SERVICE_ENABLED \
                    FUNDED_DIRECT_WORKER_ENABLED \
                    FUNDED_DIRECT_AUTO_REDEMPTION_ENABLED \
                    ALLOW_FUNDED_DIRECT \
                    ALLOW_LIVE \
                    ALLOW_STRATEGY_CANARY; do
                    test "$(env_value "$name")" = "true"
                  done
                  test "$(env_value FUNDED_DIRECT_DRY_RUN)" = "false"
                  test "$(env_value ENABLE_TAKER_ORDERS)" = "false"
                  ;;
                *)
                  echo "Refusing v10 rerun from invalid replica configuration: $current_min_replicas" >&2
                  exit 1
                  ;;
              esac
              ;;
            *)
              echo "Refusing cutover from unexpected funded session: ${current_session:-<unset>}" >&2
              exit 1
              ;;
          esac
          readonly v8_campaign_prefix="reports/research/venue-probe/control/campaign-risk/dynamic-quote-funded-2026-08-11-v8/"
          echo "FUNDED_RETIRE_WORKSPACE_CUSTOMER_ID=$workspace_customer_id" >> "$GITHUB_ENV"
          echo "FUNDED_RETIRE_CURRENT_REVISION=$current_revision" >> "$GITHUB_ENV"

      - name: Retire exact dormant v8 before any v10 deployment
        run: |
          set -euo pipefail
          readonly workspace_customer_id="$FUNDED_RETIRE_WORKSPACE_CUSTOMER_ID"
          readonly current_revision="$FUNDED_RETIRE_CURRENT_REVISION"
          test -n "$workspace_customer_id"
          test -n "$current_revision"
          readonly v8_campaign_prefix="reports/research/venue-probe/control/campaign-risk/dynamic-quote-funded-2026-08-11-v8/"
          readonly v8_baseline="${v8_campaign_prefix}baseline.json"
          readonly v8_index="${v8_campaign_prefix}unresolved-reservations-index.json"
          az storage blob list \
            --account-name "$STORAGE_ACCOUNT" \
            --container-name "$FUNDED_CONTAINER" \
            --prefix "$v8_campaign_prefix" \
            --num-results '*' \
            --auth-mode login \
            --only-show-errors -o json > dormant-v8-campaign-prefix.json
          jq -e --arg baseline "$v8_baseline" --arg index "$v8_index" '
            length == 2
            and ([.[].name] | sort) == ([$baseline, $index] | sort)
          ' dormant-v8-campaign-prefix.json >/dev/null
          v8_index_etag=$(jq -r --arg index "$v8_index" '
            .[] | select(.name == $index) | .properties.etag
          ' dormant-v8-campaign-prefix.json)
          v8_index_etag=${v8_index_etag#\"}
          v8_index_etag=${v8_index_etag%\"}
          [[ "$v8_index_etag" =~ ^0x[0-9A-Fa-f]+$ ]]
          az storage blob download \
            --account-name "$STORAGE_ACCOUNT" \
            --container-name "$FUNDED_CONTAINER" \
            --name "$v8_baseline" \
            --file dormant-v8-baseline.json \
            --auth-mode login \
            --overwrite \
            --only-show-errors -o none
          jq -e '
            .schema_version == 1
            and .campaign_id == "dynamic-quote-funded-2026-08-11-v8"
            and .baseline_equity == 31.655501
            and .equity_floor == 0
            and .max_campaign_drawdown == 31.655501
            and .max_order_notional == 10.5
            and .max_open_orders == 1
            and .max_unresolved_positions == 1
            and .max_reconciliation_discrepancy == 0.01
            and (.created_ts | type == "string")
          ' dormant-v8-baseline.json >/dev/null
          az storage blob download \
            --account-name "$STORAGE_ACCOUNT" \
            --container-name "$FUNDED_CONTAINER" \
            --name "$v8_index" \
            --file dormant-v8-unresolved-index.json \
            --auth-mode login \
            --overwrite \
            --only-show-errors -o none
          jq -e '
            .schema == "polyedge.funded_unresolved_risk_reservation_index.v1"
            and .schema_version == 1
            and .campaign_id == "dynamic-quote-funded-2026-08-11-v8"
            and (.generation | type == "number" and . >= 1 and floor == .)
            and .unresolved_count == 0
            and .entries == []
            and .entries_sha256 == "sha256:4f53cda18c2baa0c0354bb5f9a3ecbe5ed12ab4d8e11ba873c2f11161202b945"
            and (.rebuilt_ts | type == "string")
            and (.updated_ts | type == "string")
          ' dormant-v8-unresolved-index.json >/dev/null
          az storage blob list \
            --account-name "$STORAGE_ACCOUNT" \
            --container-name "$FUNDED_CONTAINER" \
            --prefix "reports/research/venue-probe/risk-reservations/" \
            --num-results '*' \
            --auth-mode login \
            --only-show-errors -o json > all-risk-reservation-blobs.json
          while IFS= read -r blob_name; do
            audit_file=$(mktemp)
            az storage blob download \
              --account-name "$STORAGE_ACCOUNT" \
              --container-name "$FUNDED_CONTAINER" \
              --name "$blob_name" \
              --file "$audit_file" \
              --auth-mode login \
              --overwrite \
              --only-show-errors -o none
            jq -e --arg session "dynamic-quote-funded-2026-08-11-v8" '
              ([.. | objects | .campaign_id? // empty] | index($session)) == null
            ' "$audit_file" >/dev/null
            rm -f "$audit_file"
          done < <(jq -r '.[] | select(.name | endswith(".json")) | .name' \
            all-risk-reservation-blobs.json)
          az storage blob list \
            --account-name "$STORAGE_ACCOUNT" \
            --container-name "$FUNDED_CONTAINER" \
            --prefix "reports/research/venue-probe/runs/" \
            --num-results '*' \
            --auth-mode login \
            --only-show-errors -o json > all-run-blobs.json
          while IFS= read -r blob_name; do
            audit_file=$(mktemp)
            az storage blob download \
              --account-name "$STORAGE_ACCOUNT" \
              --container-name "$FUNDED_CONTAINER" \
              --name "$blob_name" \
              --file "$audit_file" \
              --auth-mode login \
              --overwrite \
              --only-show-errors -o none
            jq -e --arg session "dynamic-quote-funded-2026-08-11-v8" '
              ([.. | objects | .operator_session_id? // empty] | index($session)) == null
            ' "$audit_file" >/dev/null
            rm -f "$audit_file"
          done < <(jq -r '.[] | select(.name | endswith("/summary.json")) | .name' all-run-blobs.json)
          az storage blob list \
            --account-name "$STORAGE_ACCOUNT" \
            --container-name "$FUNDED_CONTAINER" \
            --prefix "reports/research/venue-probe/control/strategy-canary/consumed/" \
            --num-results '*' \
            --auth-mode login \
            --only-show-errors -o json > all-authorization-consumptions.json
          while IFS= read -r blob_name; do
            audit_file=$(mktemp)
            az storage blob download \
              --account-name "$STORAGE_ACCOUNT" \
              --container-name "$FUNDED_CONTAINER" \
              --name "$blob_name" \
              --file "$audit_file" \
              --auth-mode login \
              --overwrite \
              --only-show-errors -o none
            jq -e --arg session "dynamic-quote-funded-2026-08-11-v8" '
              ([.. | strings] | index($session)) == null
            ' "$audit_file" >/dev/null
            rm -f "$audit_file"
          done < <(jq -r '.[] | select(.name | endswith(".json")) | .name' \
            all-authorization-consumptions.json)
          current_v8_index_etag=$(az storage blob show \
            --account-name "$STORAGE_ACCOUNT" \
            --container-name "$FUNDED_CONTAINER" \
            --name "$v8_index" \
            --auth-mode login \
            --query properties.etag -o tsv)
          current_v8_index_etag=${current_v8_index_etag#\"}
          current_v8_index_etag=${current_v8_index_etag%\"}
          [[ "$current_v8_index_etag" =~ ^0x[0-9A-Fa-f]+$ ]]
          test "$current_v8_index_etag" = "$v8_index_etag"
          az containerapp revision list \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$FUNDED_APP" \
            --all \
            -o json > funded-v8-revisions.json
          v8_revisions_json=$(jq -c --arg session "dynamic-quote-funded-2026-08-11-v8" '
            [ .[]
              | select(any(.properties.template.containers[0].env[]?;
                  .name == "VENUE_PROBE_FUNDED_CAMPAIGN_ID" and .value == $session))
            ]
          ' funded-v8-revisions.json)
          test "$(jq 'length' <<<"$v8_revisions_json")" -ge 1
          while IFS= read -r revision_name; do
            [[ "$revision_name" =~ ^polyedge-funded-direct-cl--[a-z0-9-]+$ ]]
          done < <(jq -r '.[].name' <<<"$v8_revisions_json")
          v8_revision_names_kql=$(jq -r '[.[].name] | unique | map(@sh) | join(", ")' \
            <<<"$v8_revisions_json")
          test -n "$v8_revision_names_kql"
          v8_first_revision_created_at=$(jq -r \
            '[.[].properties.createdTime] | min // ""' <<<"$v8_revisions_json")
          test -n "$v8_first_revision_created_at"
          retirement_audit_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          az extension add --name log-analytics --allow-preview true --only-show-errors
          sleep 60
          az monitor log-analytics query \
            --workspace "$workspace_customer_id" \
            --analytics-query "ContainerAppConsoleLogs_CL
              | where ContainerAppName_s == '$FUNDED_APP'
              | where RevisionName_s in ($v8_revision_names_kql)
              | where TimeGenerated between (datetime($v8_first_revision_created_at) .. datetime($retirement_audit_at))
              | summarize
                  OrderSubmissionAttempted=countif(Log_s contains '\"order_submission_attempted\":true'),
                  OrderSubmitted=countif(Log_s contains '\"order_submitted\":true'),
                  RiskReservationCreated=countif(Log_s contains '\"risk_reservation_created\":true'
                    or Log_s contains '\"status\":\"funded_risk_reservation_created\"'),
                  AuthorizationConsumed=countif(Log_s contains '\"authorization_consumed\":true'
                    or Log_s contains '\"status\":\"funded_authorization_consumed\"'),
                  RedemptionSubmitted=countif(Log_s contains '\"redemption_submitted\":true'),
                  ChildCompleted=countif(Log_s contains '\"status\":\"child_completed\"')" \
            -o json > funded-v8-retirement-aggregate.json
          jq -e '
            length == 1
            and (.[0].OrderSubmissionAttempted | tonumber) == 0
            and (.[0].OrderSubmitted | tonumber) == 0
            and (.[0].RiskReservationCreated | tonumber) == 0
            and (.[0].AuthorizationConsumed | tonumber) == 0
            and (.[0].RedemptionSubmitted | tonumber) == 0
            and (.[0].ChildCompleted | tonumber) == 0
          ' funded-v8-retirement-aggregate.json >/dev/null
          az monitor log-analytics query \
            --workspace "$workspace_customer_id" \
            --analytics-query "ContainerAppConsoleLogs_CL
              | where ContainerAppName_s == '$FUNDED_APP'
              | where RevisionName_s in ($v8_revision_names_kql)
              | where TimeGenerated between (datetime($v8_first_revision_created_at) .. datetime($retirement_audit_at))
              | extend record = parse_json(Log_s)
              | where tostring(record.schema) == 'polyedge.funded_capital_snapshot.v1'
              | where tostring(record.session_id) == 'dynamic-quote-funded-2026-08-11-v8'
              | top 1 by TimeGenerated desc
              | project TimeGenerated,
                  SnapshotSource=tostring(record.snapshot_source),
                  RiskPassed=tobool(record.risk_passed),
                  BlockerCount=array_length(record.blockers),
                  OpenOrderCount=toint(record.open_order_count),
                  UnresolvedPositionCount=toint(record.unresolved_position_count),
                  UnresolvedRiskReservationCount=toint(record.unresolved_risk_reservation_count),
                  AccountEquity=todouble(record.account_equity)" \
            -o json > funded-v8-retirement-reconciliation.json
          jq -e '
            length == 1
            and (.[0].SnapshotSource == "live_preflight"
              or .[0].SnapshotSource == "persistent_safety_cache")
            and ((.[0].RiskPassed | tostring | ascii_downcase) == "true")
            and (.[0].BlockerCount | tonumber) == 0
            and (.[0].OpenOrderCount | tonumber) == 0
            and (.[0].UnresolvedPositionCount | tonumber) == 0
            and (.[0].UnresolvedRiskReservationCount | tonumber) == 0
            and ((.[0].AccountEquity | tonumber) - 31.655501 | fabs) <= 0.01
          ' funded-v8-retirement-reconciliation.json >/dev/null
          az storage blob download \
            --account-name "$STORAGE_ACCOUNT" \
            --container-name "$FUNDED_CONTAINER" \
            --name "reports/funded/dynamic-quote/sessions/dynamic-quote-funded-2026-07-29-v5/capital-reserve-state.json" \
            --file current-v5-capital-reserve-state.json \
            --auth-mode login \
            --overwrite \
            --only-show-errors -o none
          test "sha256:$(sha256sum current-v5-capital-reserve-state.json | cut -d' ' -f1)" = \
            "sha256:9e63db7ef8c22d3af53a14f1858b817b8769ca7ba737e6668a900ffb73330c15"
          jq -e '
            .schema == "polyedge.protected_compounding_state.v1"
            and .session_id == "dynamic-quote-funded-2026-07-29-v5"
            and .reconciliation_complete == true
            and .high_water_equity >= 102.78112
            and .historical_high_water_equity >= 102.78112
            and (.last_reconciled_equity - 29.505501 | fabs) <= 0.01
          ' current-v5-capital-reserve-state.json >/dev/null
          jq -S '.properties.template' current-funded-revision.json > funded-rollback-template.json
          echo "FUNDED_ROLLBACK_REVISION=$current_revision" >> "$GITHUB_ENV"

      - name: Deploy continuous funded Dynamic Quote service
        run: |
          set -euo pipefail
          deployed=false
          for attempt in 1 2 3; do
            if az deployment group create \
              --name "polyedge-funded-direct-cl-${GITHUB_RUN_ID}" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --template-file infra/funded-direct-chile.bicep \
              --parameters @infra/funded-direct-chile.parameters.json \
              --parameters venueProbeImage="${{ steps.images.outputs.funded_reference }}" \
              --parameters fundedDirectEnabled=false \
              --parameters fundedDirectQueueStatus=SendDisabled \
              --only-show-errors \
              -o json > funded-deployment.json 2> funded-deployment.stderr; then
              deployed=true
              break
            fi
            if ! grep -Fq 'unable to pull image using Managed identity' funded-deployment.stderr || [ "$attempt" -eq 3 ]; then
              cat funded-deployment.stderr >&2
              exit 1
            fi
            sleep "$((attempt * 30))"
          done
          test "$deployed" = true
          test "$(jq -r '.properties.provisioningState' funded-deployment.json)" = "Succeeded"

      - name: Keep the obsolete North Europe funded job fail-closed
        run: |
          set -euo pipefail
          az containerapp job update \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$LEGACY_NEU_FUNDED_JOB" \
            --set-env-vars \
              FUNDED_DIRECT_WORKER_ENABLED=false \
              ALLOW_FUNDED_DIRECT=false \
              FUNDED_DIRECT_DRY_RUN=true \
              FUNDED_LADDER_CONTROLLER_ENABLED=false \
              ALLOW_FUNDED_LADDER=false \
              FUNDED_LADDER_DRY_RUN=true \
              ALLOW_LIVE=false \
            --only-show-errors \
            -o none
          az containerapp job show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$LEGACY_NEU_FUNDED_JOB" \
            -o json > legacy-neu-funded-job.json
          test "$(jq -r '.properties.configuration.triggerType' legacy-neu-funded-job.json)" = "Manual"
          legacy_env() {
            jq -r --arg name "$1" \
              '.properties.template.containers[0].env[] | select(.name == $name) | .value' \
              legacy-neu-funded-job.json
          }
          test "$(legacy_env FUNDED_DIRECT_WORKER_ENABLED)" = "false"
          test "$(legacy_env ALLOW_FUNDED_DIRECT)" = "false"
          test "$(legacy_env FUNDED_DIRECT_DRY_RUN)" = "true"
          test "$(legacy_env FUNDED_LADDER_CONTROLLER_ENABLED)" = "false"
          test "$(legacy_env ALLOW_FUNDED_LADDER)" = "false"
          test "$(legacy_env FUNDED_LADDER_DRY_RUN)" = "true"
          test "$(legacy_env ALLOW_LIVE)" = "false"
          running=$(az containerapp job execution list \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$LEGACY_NEU_FUNDED_JOB" \
            --query "[?properties.status=='Running'] | length(@)" -o tsv)
          test "${running:-0}" = "0"

      - name: Refresh Azure login before reserve migration proof
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Prove the v5 predecessor while the v10 service remains disabled
        run: |
          set -euo pipefail
          az containerapp show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$FUNDED_APP" \
            -o json > disabled-v10-funded-app.json
          test "$(jq -r '.properties.template.scale.minReplicas' disabled-v10-funded-app.json)" = "0"
          test "$(jq -r '.properties.template.containers[0].env[] | select(.name == "FUNDED_DIRECT_SERVICE_ENABLED") | .value' disabled-v10-funded-app.json)" = "false"
          test "$(jq -r '.properties.template.containers[0].env[] | select(.name == "FUNDED_DIRECT_DRY_RUN") | .value' disabled-v10-funded-app.json)" = "true"
          az storage blob download \
            --account-name "$STORAGE_ACCOUNT" \
            --container-name "$FUNDED_CONTAINER" \
            --name "reports/funded/dynamic-quote/sessions/dynamic-quote-funded-2026-07-29-v5/capital-reserve-state.json" \
            --file v5-capital-reserve-state.json \
            --auth-mode login \
            --overwrite \
            --only-show-errors -o none
          test "sha256:$(sha256sum v5-capital-reserve-state.json | cut -d' ' -f1)" = \
            "sha256:9e63db7ef8c22d3af53a14f1858b817b8769ca7ba737e6668a900ffb73330c15"
          jq -e '
            .schema == "polyedge.protected_compounding_state.v1"
            and .session_id == "dynamic-quote-funded-2026-07-29-v5"
            and .reconciliation_complete == true
            and .historical_high_water_equity >= 102.78112
            and .high_water_equity >= 102.78112
            and (.last_reconciled_equity - 29.505501 | fabs) <= 0.01
          ' v5-capital-reserve-state.json

      - name: Deploy and verify the pointer-only preflight Dynamic Quote intent producer
        id: pointer_preflight_producer
        run: |
          set -euo pipefail
          echo "FUNDED_POINTER_PREFLIGHT_REQUESTED=true" >> "$GITHUB_ENV"
          az containerapp update \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$INTENT_PRODUCER_APP" \
            --image "${{ steps.images.outputs.producer_reference }}" \
            --set-env-vars \
              FUNDED_DIRECT_SERVICE_BUS_ENABLED=true \
              FUNDED_DIRECT_SERVICE_BUS_NAMESPACE="$SERVICE_BUS_NAMESPACE" \
              FUNDED_DIRECT_SERVICE_BUS_QUEUE="$SERVICE_BUS_QUEUE" \
              STRATEGY_INTENT_POINTER_ONLY_PREFLIGHT=true \
              LOCAL_JSONL_RECORDER_ENABLED=false \
            --only-show-errors \
            -o none
          producer_revision=$(az containerapp show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$INTENT_PRODUCER_APP" \
            --query properties.latestRevisionName -o tsv)
          test -n "$producer_revision"
          for attempt in $(seq 1 36); do
            az containerapp revision list \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --name "$INTENT_PRODUCER_APP" \
              -o json > producer-revisions.json
            active_count=$(jq '[.[] | select(.properties.active == true)] | length' producer-revisions.json)
            active_revision=$(jq -r '[.[] | select(.properties.active == true)][0].name // ""' producer-revisions.json)
            health=$(jq -r --arg revision "$producer_revision" \
              '.[] | select(.name == $revision) | .properties.healthState // ""' producer-revisions.json)
            replicas=$(jq -r --arg revision "$producer_revision" \
              '.[] | select(.name == $revision) | .properties.replicas // 0' producer-revisions.json)
            if [ "$active_count" = "1" ] && \
                [ "$active_revision" = "$producer_revision" ] && \
                [ "$health" = "Healthy" ] && \
                [ "$replicas" -ge 1 ]; then
              break
            fi
            sleep 10
          done
          test "$active_count" = "1"
          test "$active_revision" = "$producer_revision"
          test "$health" = "Healthy"
          test "$replicas" -ge 1
          producer_image=$(az containerapp show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$INTENT_PRODUCER_APP" \
            --query properties.template.containers[0].image -o tsv)
          test "$producer_image" = "${{ steps.images.outputs.producer_reference }}"
          az containerapp show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$INTENT_PRODUCER_APP" \
            -o json > intent-producer-pointer-preflight.json
          producer_pointer_env() {
            jq -er --arg name "$1" '
              [.properties.template.containers[0].env[]
                | select(.name == $name) | .value]
              | if length == 1 then .[0]
                else error("expected one pointer-only producer environment value for " + $name)
                end
            ' intent-producer-pointer-preflight.json
          }
          test "$(producer_pointer_env EXECUTION_MODE)" = "paper"
          test "$(producer_pointer_env ALLOW_LIVE)" = "false"
          test "$(producer_pointer_env STRATEGY_INTENT_OPERATOR_DIRECT)" = "true"
          test "$(producer_pointer_env STRATEGY_INTENT_POINTER_ONLY_PREFLIGHT)" = "true"
          test "$(producer_pointer_env FUNDED_DIRECT_SERVICE_BUS_ENABLED)" = "true"
          test "$(producer_pointer_env FUNDED_DIRECT_SERVICE_BUS_NAMESPACE)" = "$SERVICE_BUS_NAMESPACE"
          test "$(producer_pointer_env FUNDED_DIRECT_SERVICE_BUS_QUEUE)" = "$SERVICE_BUS_QUEUE"
          jq -e '
            ([.properties.template.containers[0].env[]
              | select(.name == "POLYMARKET_PRIVATE_KEY")]
             | length) == 0
          ' intent-producer-pointer-preflight.json >/dev/null
          pointer_preflight_intent_prefix=$(producer_pointer_env STRATEGY_CANARY_INTENT_PREFIX)
          pointer_preflight_intent_container=$(producer_pointer_env AZURE_STORAGE_CONTAINER_NAME)
          [[ "$pointer_preflight_intent_prefix" =~ /intents$ ]]
          test -n "$pointer_preflight_intent_container"
          pointer_preflight_current_blob="${pointer_preflight_intent_prefix%/intents}/current-funded-intent.json"
          pointer_preflight_cutoff_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          pointer_preflight_cutoff_epoch=$(date -u +%s)
          pointer_before_exists=false
          pointer_before_etag=""
          pointer_show_stderr=$(mktemp)
          if az storage blob show \
            --account-name "$STORAGE_ACCOUNT" \
            --container-name "$pointer_preflight_intent_container" \
            --name "$pointer_preflight_current_blob" \
            --auth-mode login --only-show-errors -o json > pointer-before-preflight.json \
            2>"$pointer_show_stderr"; then
            pointer_before_exists=true
            pointer_before_etag=$(jq -er '.properties.etag' pointer-before-preflight.json)
            test -n "$pointer_before_etag"
          elif grep -Eq 'BlobNotFound|404' "$pointer_show_stderr"; then
            rm -f "$pointer_show_stderr"
          else
            cat "$pointer_show_stderr" >&2
            exit 1
          fi
          echo "cutoff_at=$pointer_preflight_cutoff_at" >> "$GITHUB_OUTPUT"
          echo "cutoff_epoch=$pointer_preflight_cutoff_epoch" >> "$GITHUB_OUTPUT"
          echo "intent_prefix=$pointer_preflight_intent_prefix" >> "$GITHUB_OUTPUT"
          echo "intent_container=$pointer_preflight_intent_container" >> "$GITHUB_OUTPUT"
          echo "current_blob=$pointer_preflight_current_blob" >> "$GITHUB_OUTPUT"
          echo "pointer_before_exists=$pointer_before_exists" >> "$GITHUB_OUTPUT"
          echo "pointer_before_etag=$pointer_before_etag" >> "$GITHUB_OUTPUT"

      - name: Prepare zero-write v10 preflight inputs
        run: |
          set -euo pipefail
          v10_prefix="reports/funded/dynamic-quote/sessions/dynamic-quote-funded-2026-08-13-v10/"
          readonly v10_session_blob="${v10_prefix}session.json"
          readonly v10_state_blob="${v10_prefix}capital-reserve-state.json"
          readonly v10_session_sha256="sha256:c516c052fc5c01eed5403842ff24bf4b08512d6c38e8260e2d064580c82322f8"
          readonly v10_latest_redemption="${v10_prefix}latest-redemption.json"
          readonly v10_redemption_prefix="${v10_prefix}redemptions/"
          readonly v10_authorization_prefix="${v10_prefix}authorizations/"
          readonly v10_completion_prefix="${v10_prefix}completed/"
          v5_state="reports/funded/dynamic-quote/sessions/dynamic-quote-funded-2026-07-29-v5/capital-reserve-state.json"
          readonly v5_state_sha256="sha256:9e63db7ef8c22d3af53a14f1858b817b8769ca7ba737e6668a900ffb73330c15"
          az servicebus queue show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --namespace-name "$SERVICE_BUS_NAMESPACE" \
            --name "$SERVICE_BUS_QUEUE" \
            -o json > funded-queue-before-pointer-preflight.json
          jq -e '
            .status == "SendDisabled"
            and (.countDetails.activeMessageCount | tonumber) == 0
            and (.countDetails.scheduledMessageCount | tonumber) == 0
            and (.countDetails.deadLetterMessageCount | tonumber) >= 0
          ' funded-queue-before-pointer-preflight.json >/dev/null
          test "$(jq -r '.countDetails.deadLetterMessageCount' \
            funded-queue-before-pointer-preflight.json)" = "$(cat funded-fenced-dlq-before.txt)"
          jq -S '{
            status,
            active: .countDetails.activeMessageCount,
            scheduled: .countDetails.scheduledMessageCount,
            dead_letter: .countDetails.deadLetterMessageCount
          }' funded-queue-before-pointer-preflight.json > funded-queue-before-pointer-preflight.snapshot.json
          az storage blob list \
            --account-name "$STORAGE_ACCOUNT" \
            --container-name "$FUNDED_CONTAINER" \
            --prefix "$v10_prefix" \
            --num-results '*' \
            --auth-mode login \
            --only-show-errors -o json > v10-prefix-before-preflight.json
          jq -e \
            --arg session "$v10_session_blob" \
            --arg state "$v10_state_blob" \
            --arg latest "$v10_latest_redemption" \
            --arg archive "$v10_redemption_prefix" \
            --arg authorizations "$v10_authorization_prefix" \
            --arg completions "$v10_completion_prefix" '
            ([.[].name] | length == (unique | length))
            and all(.[].properties.contentLength; . > 0 and . <= 16384)
            and all(.[].name;
              . == $session
              or . == $state
              or . == $latest
              or test("^" + $archive + "[0-9]{4}-[0-9]{2}-[0-9]{2}/venue-redemption-[0-9]{17}-[0-9a-f]{8}\\.json$")
              or test("^" + $authorizations + "[0-9a-f]{64}\\.json$")
              or test("^" + $completions + "[0-9a-f]{64}\\.json$"))
          ' v10-prefix-before-preflight.json >/dev/null
          jq -S '[.[] | {name, etag: .properties.etag, size: .properties.contentLength}]' \
            v10-prefix-before-preflight.json > v10-prefix-before-preflight.snapshot.json
          az containerapp job show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$FUNDED_JOB" \
            -o json > funded-preflight-job.json
          intent_container=$(jq -r '.properties.template.containers[0].env[] | select(.name == "STRATEGY_CANARY_INTENT_CONTAINER_NAME") | .value' funded-preflight-job.json)
          intent_prefix=$(jq -r '.properties.template.containers[0].env[] | select(.name == "STRATEGY_CANARY_INTENT_PREFIX") | .value' funded-preflight-job.json)
          test "$(jq -r '.properties.configuration.replicaTimeout' funded-preflight-job.json)" = "11400"
          test "$intent_container" = "polyedge-shadow-events"
          test "$intent_prefix" = "reports/research/venue-probe/control/strategy-canary/intents"
          if jq -e --arg session "$v10_session_blob" \
              '[.[].name] | index($session) != null' \
              v10-prefix-before-preflight.json >/dev/null; then
            az storage blob download \
              --account-name "$STORAGE_ACCOUNT" \
              --container-name "$FUNDED_CONTAINER" \
              --name "$v10_session_blob" \
              --file existing-v10-session.json \
              --auth-mode login \
              --overwrite \
              --only-show-errors -o none
            test "$v10_session_sha256" = "sha256:$(sha256sum existing-v10-session.json | cut -d' ' -f1)"
          fi
          if jq -e --arg state "$v10_state_blob" \
              '[.[].name] | index($state) != null' \
              v10-prefix-before-preflight.json >/dev/null; then
          az storage blob download \
            --account-name "$STORAGE_ACCOUNT" \
            --container-name "$FUNDED_CONTAINER" \
            --name "$v10_state_blob" \
            --file existing-v10-capital-state.json \
            --auth-mode login \
            --overwrite \
            --only-show-errors -o none
          jq -e '
            .schema == "polyedge.protected_compounding_state.v2"
            and .session_id == "dynamic-quote-funded-2026-08-13-v10"
            and .reconciliation_complete == true
            and .reserve_ratio == 0.1
            and .minimum_reserve == 2
            and .target_order_ratio == 0.05
            and .operating_buffer_ratio == 0.01
            and .minimum_order_notional == 1
            and .reserve_basis == "fully_reconciled_current_equity"
            and .loss_response == "resize_from_fully_reconciled_current_equity"
            and .reserve_monotonic == false
            and .continue_after_loss == true
            and .prior_state_session_id == "dynamic-quote-funded-2026-07-29-v5"
            and .prior_state_blob_name == "reports/funded/dynamic-quote/sessions/dynamic-quote-funded-2026-07-29-v5/capital-reserve-state.json"
            and .prior_state_sha256 == "sha256:9e63db7ef8c22d3af53a14f1858b817b8769ca7ba737e6668a900ffb73330c15"
            and .last_reconciled_equity > 0
            and .authorized_equity_ceiling == 29.505501
            and .last_reconciled_equity <= .authorized_equity_ceiling
            and .verified_realized_pnl == 0
            and .verified_settlement_ids == []
            and .high_water_equity >= 102.78112
            and .historical_high_water_equity >= 102.78112
            and (.protected_reserve - ([2, (.last_reconciled_equity * .reserve_ratio)] | max) | fabs) <= 0.0000011
            and (.operating_buffer - (.last_reconciled_equity * .operating_buffer_ratio) | fabs) <= 0.0000011
            and (.operable_capital - ([0, (.last_reconciled_equity - .protected_reserve - .operating_buffer)] | max) | fabs) <= 0.0000011
            and .operable_capital >= .minimum_order_notional
            and ([keys[] | select(startswith("migration_"))] | length) == 0
          ' existing-v10-capital-state.json >/dev/null
          authorized_ceiling=$(jq -r '.authorized_equity_ceiling' existing-v10-capital-state.json)
          jq -r --arg prefix "$v10_authorization_prefix" '
            [.[] | .name | select(startswith($prefix)) | sub("^" + $prefix; "") | sub("\\.json$"; "")]
            | sort | .[]
          ' v10-prefix-before-preflight.json > existing-v10-authorization-decisions.txt
          jq -r --arg prefix "$v10_completion_prefix" '
            [.[] | .name | select(startswith($prefix)) | sub("^" + $prefix; "") | sub("\\.json$"; "")]
            | sort | .[]
          ' v10-prefix-before-preflight.json > existing-v10-completion-decisions.txt
          test -s existing-v10-authorization-decisions.txt
          comm -23 existing-v10-authorization-decisions.txt existing-v10-completion-decisions.txt \
            > existing-v10-authorization-only-decisions.txt
          comm -13 existing-v10-authorization-decisions.txt existing-v10-completion-decisions.txt \
            > existing-v10-completion-only-decisions.txt
          test ! -s existing-v10-authorization-only-decisions.txt
          az storage blob list \
            --account-name "$STORAGE_ACCOUNT" \
            --container-name "$FUNDED_CONTAINER" \
            --prefix "reports/research/venue-probe/risk-reservations/" \
            --num-results '*' \
            --auth-mode login \
            --only-show-errors -o json > existing-v10-risk-reservations.json
          now_epoch=$(date -u +%s)
          while IFS= read -r existing_decision; do
            [[ "$existing_decision" =~ ^[0-9a-f]{64}$ ]]
            completion_blob="${v10_completion_prefix}${existing_decision}.json"
            completion_file=$(mktemp)
            intent_file=$(mktemp)
            az storage blob download \
              --account-name "$STORAGE_ACCOUNT" --container-name "$FUNDED_CONTAINER" \
              --name "$completion_blob" --file "$completion_file" \
              --auth-mode login --overwrite --only-show-errors -o none
            jq -e --arg decision "$existing_decision" --arg intent_prefix "$intent_prefix" '
              .schema == "polyedge.operator_funded_intent_completion.v1"
              and .session_id == "dynamic-quote-funded-2026-08-13-v10"
              and .decision_id == $decision
              and .intent_blob_name == ($intent_prefix + "/" + $decision + ".json")
              and (.intent_sha256 | test("^sha256:[0-9a-f]{64}$"))
              and .authorization_blob_name == null
              and .authorization_sha256 == null
              and .child_run_id == null
              and (.completed_at | type == "string" and length > 0)
              and .status == "one_workflow_busy"
              and .order_submission_attempted == false
              and .authorization_consumed == false
              and .risk_reservation_created == false
            ' "$completion_file" >/dev/null
            intent_blob=$(jq -r '.intent_blob_name' "$completion_file")
            intent_sha=$(jq -r '.intent_sha256' "$completion_file")
            az storage blob download \
              --account-name "$STORAGE_ACCOUNT" --container-name "$intent_container" \
              --name "$intent_blob" --file "$intent_file" \
              --auth-mode login --overwrite --only-show-errors -o none
            test "$intent_sha" = "sha256:$(sha256sum "$intent_file" | cut -d' ' -f1)"
            jq -e --arg decision "$existing_decision" --argjson now "$now_epoch" '
              .schema == "polyedge.execution_intent.v1"
              and .decision_id == $decision
              and ((.valid_until | sub("\\.[0-9]+Z$"; "Z") | fromdateiso8601) < $now)
            ' "$intent_file" >/dev/null
            reservation_count=$(jq --arg decision "$existing_decision" '
              [.[] | select(.name | endswith("/funded-direct-" + $decision + ".json"))] | length
            ' existing-v10-risk-reservations.json)
            test "$reservation_count" = "0"
          done < existing-v10-completion-only-decisions.txt
          while IFS= read -r existing_decision; do
            [[ "$existing_decision" =~ ^[0-9a-f]{64}$ ]]
            authorization_blob="${v10_authorization_prefix}${existing_decision}.json"
            completion_blob="${v10_completion_prefix}${existing_decision}.json"
            authorization_file=$(mktemp)
            completion_file=$(mktemp)
            az storage blob download \
              --account-name "$STORAGE_ACCOUNT" --container-name "$FUNDED_CONTAINER" \
              --name "$authorization_blob" --file "$authorization_file" \
              --auth-mode login --overwrite --only-show-errors -o none
            authorization_sha="sha256:$(sha256sum "$authorization_file" | cut -d' ' -f1)"
            az storage blob download \
              --account-name "$STORAGE_ACCOUNT" --container-name "$FUNDED_CONTAINER" \
              --name "$completion_blob" --file "$completion_file" \
              --auth-mode login --overwrite --only-show-errors -o none
            test -s existing-v10-session.json
            jq -e --arg decision "$existing_decision" --slurpfile session existing-v10-session.json '
              .schema == "polyedge.operator_funded_intent_authorization.v1"
              and .authorization_mode == "operator_direct"
              and .session_id == "dynamic-quote-funded-2026-08-13-v10"
              and .decision_id == $decision
              and .authorization_id == ("dynamic-quote-funded-2026-08-13-v10-" + $decision[0:16])
              and (.child_run_id | type == "string" and length > 0)
              and .intent_blob_name == ("reports/research/venue-probe/control/strategy-canary/intents/" + $decision + ".json")
              and (.intent_sha256 | test("^sha256:[0-9a-f]{64}$"))
              and .promotion_manifest_blob_name == "reports/funded/dynamic-quote/sessions/dynamic-quote-funded-2026-08-13-v10/session.json"
              and .promotion_manifest_sha256 == "sha256:c516c052fc5c01eed5403842ff24bf4b08512d6c38e8260e2d064580c82322f8"
              and .operator_session_manifest_blob_name == .promotion_manifest_blob_name
              and .operator_session_manifest_sha256 == .promotion_manifest_sha256
              and .research_promotion_bypassed == true
              and .candidate_name == $session[0].candidate.name
              and .candidate_version == $session[0].candidate.candidate_version
              and .candidate_config_hash == $session[0].candidate.config_hash
              and .required_fill_model_version == $session[0].execution_model.model_version
              and .execution_model_blob_uri == $session[0].execution_model.blob_uri
              and .execution_model_container_name == "polyedge-research"
              and .execution_model_blob_name == "reports/research/venue-probe/models/conservative-execution-prior-v1-91f29155d09f1a51f3354132befcbbb25d3f96b88c9a8a819f2304f4a7a28ed4.json"
              and .execution_model_sha256 == $session[0].execution_model.sha256
              and .max_order_notional == $session[0].max_order_notional
              and .human_authorization_reference == $session[0].authorized_by_user_reference
              and ((.authorized_at | sub("\\.[0-9]+Z$"; "Z") | fromdateiso8601)
                < (.expires_at | sub("\\.[0-9]+Z$"; "Z") | fromdateiso8601))
              and .single_use == true
            ' "$authorization_file" >/dev/null
            jq -e --arg decision "$existing_decision" --arg authorization_blob "$authorization_blob" --arg authorization_sha "$authorization_sha" '
              .schema == "polyedge.operator_funded_intent_completion.v1"
              and .session_id == "dynamic-quote-funded-2026-08-13-v10"
              and .decision_id == $decision
              and .authorization_blob_name == $authorization_blob
              and .authorization_sha256 == $authorization_sha
              and (.child_run_id | type == "string" and length > 0)
              and (
                (.status == "child_failed_closed_pre_submission"
                  and .order_submission_attempted == false
                  and .authorization_consumed == false
                  and .risk_reservation_created == false
                  and (.error | type == "string" and length > 0))
                or
                (.status == "child_completed"
                  and .order_submission_attempted == true
                  and .authorization_consumed == true
                  and .risk_reservation_created == true)
              )
            ' "$completion_file" >/dev/null
            auth_run=$(jq -r '.child_run_id' "$authorization_file")
            test "$(jq -r '.child_run_id' "$completion_file")" = "$auth_run"
            reservation_count=$(jq --arg decision "$existing_decision" '
              [.[] | select(.name | endswith("/funded-direct-" + $decision + ".json"))] | length
            ' existing-v10-risk-reservations.json)
            if [ "$(jq -r '.status' "$completion_file")" = "child_completed" ]; then
              test "$reservation_count" = "1"
              reservation_blob=$(jq -r --arg decision "$existing_decision" '
                [.[] | select(.name | endswith("/funded-direct-" + $decision + ".json"))][0].name
              ' existing-v10-risk-reservations.json)
              reservation_file=$(mktemp)
              az storage blob download \
                --account-name "$STORAGE_ACCOUNT" --container-name "$FUNDED_CONTAINER" \
                --name "$reservation_blob" --file "$reservation_file" \
                --auth-mode login --overwrite --only-show-errors -o none
              jq -e --arg decision "$existing_decision" --arg run "$auth_run" '
                .schema_version == 1
                and .campaign_id == "dynamic-quote-funded-2026-08-13-v10"
                and .run_id == $run
                and .probe_id == ("funded-direct-" + $decision)
                and .order_submitted == true
                and (
                  (.state == "finalized_no_fill"
                    and .matched_notional == 0
                    and .reconciliation_complete == true
                    and .zero_open_orders_confirmed == true)
                  or
                  (.state == "position_settled"
                    and .matched_notional > 0
                    and .settlement_verified == true
                    and (.settlement_evidence_source == "verified_onchain_redemption"
                      or .settlement_evidence_source == "polymarket_data_api_redeemable"))
                )
              ' "$reservation_file" >/dev/null
            else
              test "$reservation_count" = "0"
            fi
          done < existing-v10-authorization-decisions.txt
          else
            test "$(jq --arg prefix "$v10_authorization_prefix" \
              '[.[].name | select(startswith($prefix))] | length' \
              v10-prefix-before-preflight.json)" = "0"
            test "$(jq --arg prefix "$v10_completion_prefix" \
              '[.[].name | select(startswith($prefix))] | length' \
              v10-prefix-before-preflight.json)" = "0"
            authorized_ceiling=29.505501
          fi
          archive_count=$(jq --arg archive "$v10_redemption_prefix" \
            '[.[].name | select(startswith($archive))] | length' \
            v10-prefix-before-preflight.json)
          latest_count=$(jq --arg latest "$v10_latest_redemption" \
            '[.[].name | select(. == $latest)] | length' \
            v10-prefix-before-preflight.json)
          if [ "$archive_count" = "0" ]; then
            test "$latest_count" = "0"
          else
            test "$latest_count" = "1"
          fi
          : > existing-v10-redemption-sha256.txt
          while IFS= read -r blob_name; do
            redemption_file=$(mktemp)
            az storage blob download \
              --account-name "$STORAGE_ACCOUNT" \
              --container-name "$FUNDED_CONTAINER" \
              --name "$blob_name" \
              --file "$redemption_file" \
              --auth-mode login \
              --overwrite \
              --only-show-errors -o none
            jq -e --argjson authorized_ceiling "$authorized_ceiling" '
              .schema_version == 1
              and .status == "nothing_to_redeem"
              and (.finished_ts | type == "string")
              and (.run_id | test("^venue-redemption-[0-9]{17}-[0-9a-f]{8}$"))
              and .execution_origin == "azure_chile_central_static_egress"
              and .execution_country == "CL"
              and .static_egress_verified == true
              and .dry_run == false
              and .redemption_enabled == true
              and .redemption_submitted == false
              and .zero_open_orders_confirmed == true
              and .selection.selected == []
              and .selection.selected_gross_payout == 0
              and .planned_calls == []
              and .derived_wallet_match == true
              and .wallet_type == "legacy_uups_deposit_wallet"
              and .research_only == false
              and .live_strategy_enabled == true
              and (.liquid_collateral_before | type == "number")
              and .liquid_collateral_before > 0
              and .liquid_collateral_before <= $authorized_ceiling
            ' "$redemption_file" >/dev/null
            redemption_sha="sha256:$(sha256sum "$redemption_file" | cut -d' ' -f1)"
            if [ "$blob_name" = "$v10_latest_redemption" ]; then
              latest_redemption_sha="$redemption_sha"
            else
              redemption_date=$(jq -r '.finished_ts[0:10]' "$redemption_file")
              redemption_run=$(jq -r '.run_id' "$redemption_file")
              test "$blob_name" = \
                "${v10_redemption_prefix}${redemption_date}/${redemption_run}.json"
              printf '%s\n' "$redemption_sha" >> existing-v10-redemption-sha256.txt
            fi
          done < <(jq -r --arg latest "$v10_latest_redemption" --arg archive "$v10_redemption_prefix" '
            .[].name | select(. == $latest or startswith($archive))
          ' v10-prefix-before-preflight.json)
          if [ "$archive_count" != "0" ]; then
            grep -Fqx "$latest_redemption_sha" existing-v10-redemption-sha256.txt
          fi
          v5_etag_before=$(az storage blob show \
            --account-name "$STORAGE_ACCOUNT" \
            --container-name "$FUNDED_CONTAINER" \
            --name "$v5_state" \
            --auth-mode login \
            --query properties.etag -o tsv)
          test -n "$v5_etag_before"
          az storage blob download \
            --account-name "$STORAGE_ACCOUNT" \
            --container-name "$FUNDED_CONTAINER" \
            --name "$v5_state" \
            --file v5-state-before-preflight.json \
            --auth-mode login \
            --overwrite \
            --only-show-errors -o none
          v5_sha_before="sha256:$(sha256sum v5-state-before-preflight.json | cut -d' ' -f1)"
          test "$v5_sha_before" = "$v5_state_sha256"
          jq '
            .properties.template
            | .containers |= map(
                if .name == "funded-direct" then
                  .env = (
                    [.env[] | select(.name != "FUNDED_DIRECT_WORKER_ENABLED"
                      and .name != "ALLOW_FUNDED_DIRECT"
                      and .name != "FUNDED_DIRECT_DRY_RUN"
                      and .name != "FUNDED_DIRECT_PREFLIGHT_ONLY"
                      and .name != "FUNDED_DIRECT_MAX_ITERATIONS"
                      and .name != "FUNDED_DIRECT_POLL_INTERVAL_MS"
                      and .name != "FUNDED_DIRECT_MAX_IDLE_MS")]
                    + [
                      {name:"FUNDED_DIRECT_WORKER_ENABLED",value:"true"},
                      {name:"ALLOW_FUNDED_DIRECT",value:"true"},
                      {name:"FUNDED_DIRECT_DRY_RUN",value:"true"},
                      {name:"FUNDED_DIRECT_PREFLIGHT_ONLY",value:"true"},
                      {name:"FUNDED_DIRECT_MAX_ITERATIONS",value:"2401"},
                      {name:"FUNDED_DIRECT_POLL_INTERVAL_MS",value:"1000"},
                      {name:"FUNDED_DIRECT_MAX_IDLE_MS",value:"2400000"}
                    ]
                  )
                else . end
              )
          ' funded-preflight-job.json > funded-preflight-execution.yaml
          echo "PREFLIGHT_V5_ETAG_BEFORE=$v5_etag_before" >> "$GITHUB_ENV"
          echo "PREFLIGHT_INTENT_CONTAINER=$intent_container" >> "$GITHUB_ENV"
          echo "PREFLIGHT_INTENT_PREFIX=$intent_prefix" >> "$GITHUB_ENV"

      - name: Refresh Azure login before zero-write v10 preflight
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Run the zero-write v10 preflight against a fresh producer intent
        id: funded_preflight
        run: |
          set -euo pipefail
          readonly v5_etag_before="${PREFLIGHT_V5_ETAG_BEFORE:?}"
          readonly intent_container="${PREFLIGHT_INTENT_CONTAINER:?}"
          readonly intent_prefix="${PREFLIGHT_INTENT_PREFIX:?}"
          [[ "$v5_etag_before" =~ ^\"?0x[[:xdigit:]]+\"?$ ]]
          [[ "$intent_prefix" =~ /intents$ ]]
          test -s funded-preflight-execution.yaml
          jq -e '
            .containers | length == 1
            and ([.[] | select(.name == "funded-direct") | .env[]
              | select(.name == "FUNDED_DIRECT_WORKER_ENABLED" and .value == "true")] | length) == 1
            and ([.[] | select(.name == "funded-direct") | .env[]
              | select(.name == "ALLOW_FUNDED_DIRECT" and .value == "true")] | length) == 1
            and ([.[] | select(.name == "funded-direct") | .env[]
              | select(.name == "FUNDED_DIRECT_DRY_RUN" and .value == "true")] | length) == 1
            and ([.[] | select(.name == "funded-direct") | .env[]
              | select(.name == "FUNDED_DIRECT_PREFLIGHT_ONLY" and .value == "true")] | length) == 1
            and ([.[] | select(.name == "funded-direct") | .env[]
              | select(.name == "FUNDED_DIRECT_MAX_ITERATIONS" and .value == "2401")] | length) == 1
            and ([.[] | select(.name == "funded-direct") | .env[]
              | select(.name == "FUNDED_DIRECT_POLL_INTERVAL_MS" and .value == "1000")] | length) == 1
            and ([.[] | select(.name == "funded-direct") | .env[]
              | select(.name == "FUNDED_DIRECT_MAX_IDLE_MS" and .value == "2400000")] | length) == 1
          ' funded-preflight-execution.yaml
          preflight_execution=$(az containerapp job start \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$FUNDED_JOB" \
            --yaml funded-preflight-execution.yaml \
            --query name -o tsv)
          test -n "$preflight_execution"
          status=Running
          preflight_deadline_epoch=$(( $(date -u +%s) + 2700 ))
          sleep_before_preflight_deadline() {
            local remaining=$(( preflight_deadline_epoch - $(date -u +%s) ))
            [ "$remaining" -gt 0 ] || return 1
            [ "$remaining" -le 10 ] || remaining=10
            sleep "$remaining"
          }
          while [ "$(date -u +%s)" -lt "$preflight_deadline_epoch" ]; do
            if ! status=$(az containerapp job execution show \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --name "$FUNDED_JOB" \
              --job-execution-name "$preflight_execution" \
              --query properties.status -o tsv); then
              sleep_before_preflight_deadline || break
              continue
            fi
            case "$status" in
              Succeeded) break ;;
              Failed|Stopped|Degraded) exit 1 ;;
            esac
            sleep_before_preflight_deadline || break
          done
          test "$status" = "Succeeded"
          echo "execution=$preflight_execution" >> "$GITHUB_OUTPUT"
          echo "v5_etag_before=$v5_etag_before" >> "$GITHUB_OUTPUT"
          echo "intent_container=$intent_container" >> "$GITHUB_OUTPUT"
          echo "intent_prefix=$intent_prefix" >> "$GITHUB_OUTPUT"

      - name: Refresh Azure login after zero-write preflight wait
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Verify the zero-write v10 preflight
        env:
          PREFLIGHT_EXECUTION: ${{ steps.funded_preflight.outputs.execution }}
          POINTER_PREFLIGHT_CUTOFF_AT: ${{ steps.pointer_preflight_producer.outputs.cutoff_at }}
          POINTER_PREFLIGHT_CUTOFF_EPOCH: ${{ steps.pointer_preflight_producer.outputs.cutoff_epoch }}
          POINTER_PREFLIGHT_INTENT_PREFIX: ${{ steps.pointer_preflight_producer.outputs.intent_prefix }}
          POINTER_PREFLIGHT_INTENT_CONTAINER: ${{ steps.pointer_preflight_producer.outputs.intent_container }}
          POINTER_PREFLIGHT_CURRENT_BLOB: ${{ steps.pointer_preflight_producer.outputs.current_blob }}
          POINTER_PREFLIGHT_POINTER_BEFORE_EXISTS: ${{ steps.pointer_preflight_producer.outputs.pointer_before_exists }}
          POINTER_PREFLIGHT_POINTER_BEFORE_ETAG: ${{ steps.pointer_preflight_producer.outputs.pointer_before_etag }}
        run: |
          set -euo pipefail
          readonly v10_prefix="reports/funded/dynamic-quote/sessions/dynamic-quote-funded-2026-08-13-v10/"
          readonly v5_state="reports/funded/dynamic-quote/sessions/dynamic-quote-funded-2026-07-29-v5/capital-reserve-state.json"
          readonly v5_state_sha256="sha256:9e63db7ef8c22d3af53a14f1858b817b8769ca7ba737e6668a900ffb73330c15"
          readonly preflight_execution="$PREFLIGHT_EXECUTION"
          readonly v5_etag_before="$PREFLIGHT_V5_ETAG_BEFORE"
          readonly intent_prefix="$PREFLIGHT_INTENT_PREFIX"
          readonly intent_container="$PREFLIGHT_INTENT_CONTAINER"
          readonly pointer_preflight_cutoff_at="$POINTER_PREFLIGHT_CUTOFF_AT"
          readonly pointer_preflight_cutoff_epoch="$POINTER_PREFLIGHT_CUTOFF_EPOCH"
          readonly pointer_preflight_intent_prefix="$POINTER_PREFLIGHT_INTENT_PREFIX"
          readonly pointer_preflight_intent_container="$POINTER_PREFLIGHT_INTENT_CONTAINER"
          readonly pointer_preflight_current_blob="$POINTER_PREFLIGHT_CURRENT_BLOB"
          readonly pointer_preflight_pointer_before_exists="$POINTER_PREFLIGHT_POINTER_BEFORE_EXISTS"
          readonly pointer_preflight_pointer_before_etag="$POINTER_PREFLIGHT_POINTER_BEFORE_ETAG"
          test -n "$preflight_execution"
          test -n "$v5_etag_before"
          test -n "$intent_prefix"
          test -n "$intent_container"
          test "$intent_prefix" = "$pointer_preflight_intent_prefix"
          test "$intent_container" = "$pointer_preflight_intent_container"
          test "$pointer_preflight_current_blob" = "${intent_prefix%/intents}/current-funded-intent.json"
          test -n "$pointer_preflight_cutoff_at"
          [[ "$pointer_preflight_cutoff_epoch" =~ ^[0-9]+$ ]]
          [[ "$pointer_preflight_pointer_before_exists" =~ ^(true|false)$ ]]
          if [ "$pointer_preflight_pointer_before_exists" = true ]; then
            test -n "$pointer_preflight_pointer_before_etag"
          else
            test -z "$pointer_preflight_pointer_before_etag"
          fi
          environment_id=$(az containerapp show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$FUNDED_APP" \
            --query properties.environmentId -o tsv)
          workspace_customer_id=$(az containerapp env show \
            --ids "$environment_id" \
            --query properties.appLogsConfiguration.logAnalyticsConfiguration.customerId -o tsv)
          preflight_ready=false
          for attempt in $(seq 1 36); do
            az monitor log-analytics query \
              --workspace "$workspace_customer_id" \
              --analytics-query "ContainerAppConsoleLogs_CL
                | where ContainerJobName_s == '$FUNDED_JOB'
                | where ContainerGroupName_s startswith '$preflight_execution'
                | extend record = parse_json(Log_s)
                | where tostring(record.schema) == 'polyedge.funded_direct_worker.v1'
                | where tostring(record.status) == 'preflight_validated'
                | project TimeGenerated, Log_s
                | order by TimeGenerated asc" \
              -o json > funded-preflight-logs.json || { sleep 10; continue; }
            if jq -e --arg session_blob "$v10_prefix" --arg session_sha "sha256:c516c052fc5c01eed5403842ff24bf4b08512d6c38e8260e2d064580c82322f8" --arg v5_state "$v5_state" --arg v5_sha "$v5_state_sha256" --arg intent_prefix "$intent_prefix" '
              length == 1
              and (.[0].Log_s | fromjson
                | .session_id == "dynamic-quote-funded-2026-08-13-v10"
                and .preflight_only == true
                and .writes_performed == false
                and .order_submission_attempted == false
                and .execution_grant_created == false
                and .risk_reservation_created == false
                and .completion_created == false
                and .session_manifest_blob_name == ($session_blob + "session.json")
                and .session_manifest_sha256 == $session_sha
                and .predecessor_state_session_id == "dynamic-quote-funded-2026-07-29-v5"
                and .predecessor_state_blob_name == $v5_state
                and .predecessor_state_sha256 == $v5_sha
                and .intent_handoff_blob_name == ($intent_prefix | sub("/intents$"; "/current-funded-intent.json"))
                and (.intent_blob_name | startswith($intent_prefix + "/") and test("/[0-9a-f]{64}\\.json$"))
                and (.intent_sha256 | test("^sha256:[0-9a-f]{64}$")))
            ' funded-preflight-logs.json >/dev/null; then
              preflight_ready=true
              break
            fi
            sleep 10
          done
          test "$preflight_ready" = true
          preflight_decision_id=$(jq -er '.[0].Log_s | fromjson | .decisionId' funded-preflight-logs.json)
          preflight_handoff_blob=$(jq -er '.[0].Log_s | fromjson | .intent_handoff_blob_name' funded-preflight-logs.json)
          preflight_intent_blob=$(jq -er '.[0].Log_s | fromjson | .intent_blob_name' funded-preflight-logs.json)
          preflight_intent_sha256=$(jq -er '.[0].Log_s | fromjson | .intent_sha256' funded-preflight-logs.json)
          [[ "$preflight_decision_id" =~ ^[0-9a-f]{64}$ ]]
          test "$preflight_handoff_blob" = "${intent_prefix%/intents}/current-funded-intent.json"
          test "$preflight_intent_blob" = "$intent_prefix/$preflight_decision_id.json"
          [[ "$preflight_intent_sha256" =~ ^sha256:[0-9a-f]{64}$ ]]
          az storage blob download \
            --account-name "$STORAGE_ACCOUNT" \
            --container-name "$intent_container" \
            --name "$preflight_intent_blob" \
            --file pointer-preflight-exact-intent.json \
            --auth-mode login --overwrite --only-show-errors -o none
          test "sha256:$(sha256sum pointer-preflight-exact-intent.json | cut -d' ' -f1)" = \
            "$preflight_intent_sha256"
          az storage blob show \
            --account-name "$STORAGE_ACCOUNT" \
            --container-name "$intent_container" \
            --name "$preflight_intent_blob" \
            --auth-mode login --only-show-errors -o json > pointer-preflight-exact-intent-properties.json
          pointer_preflight_last_modified=$(jq -er '.properties.lastModified' \
            pointer-preflight-exact-intent-properties.json)
          node - \
            pointer-preflight-exact-intent.json \
            "$preflight_decision_id" \
            "$preflight_intent_blob" \
            "$intent_prefix" \
            "$pointer_preflight_cutoff_epoch" \
            "$pointer_preflight_last_modified" <<'NODE'
          const assert = require("node:assert/strict");
          const fs = require("node:fs");
          const [file, decisionId, blobName, prefix, startedEpoch, lastModified] = process.argv.slice(2);
          const intent = JSON.parse(fs.readFileSync(file, "utf8"));
          const parsedStarted = Number(startedEpoch) * 1_000;
          const decisionAt = Date.parse(intent.decision_ts);
          const validUntil = Date.parse(intent.valid_until);
          const gtdExpiry = Date.parse(intent.gtd_expiry_ts);
          const modifiedAt = Date.parse(lastModified);
          assert.equal(intent.schema, "polyedge.execution_intent.v1");
          assert.equal(intent.decision_id, decisionId);
          assert.match(decisionId, /^[0-9a-f]{64}$/);
          assert.equal(blobName, `${prefix}/${decisionId}.json`);
          assert.ok(Number.isFinite(parsedStarted) && Number.isFinite(decisionAt) &&
            Number.isFinite(validUntil) && Number.isFinite(gtdExpiry) && Number.isFinite(modifiedAt));
          assert.ok(decisionAt >= parsedStarted, "intent decision predates pointer-only cutoff");
          assert.ok(modifiedAt >= parsedStarted, "intent blob predates pointer-only cutoff");
          assert.equal(intent.ttl_ms, 15_000);
          assert.equal(validUntil, decisionAt + intent.ttl_ms);
          assert.equal(gtdExpiry, validUntil + 300_000);
          assert.ok(intent.market_end_ts && Date.parse(intent.market_end_ts) > validUntil);
          NODE
          az storage blob show \
            --account-name "$STORAGE_ACCOUNT" \
            --container-name "$intent_container" \
            --name "$pointer_preflight_current_blob" \
            --auth-mode login --only-show-errors -o json > pointer-after-preflight.json
          pointer_after_etag=$(jq -er '.properties.etag' pointer-after-preflight.json)
          test -n "$pointer_after_etag"
          if [ "$pointer_preflight_pointer_before_exists" = true ]; then
            test "$pointer_after_etag" != "$pointer_preflight_pointer_before_etag"
          fi
          az storage blob download \
            --account-name "$STORAGE_ACCOUNT" \
            --container-name "$intent_container" \
            --name "$pointer_preflight_current_blob" \
            --file pointer-after-preflight.json \
            --auth-mode login --overwrite --only-show-errors -o none
          node - \
            pointer-after-preflight.json \
            pointer-preflight-exact-intent.json \
            "$preflight_decision_id" \
            "$preflight_intent_blob" \
            "$preflight_intent_sha256" \
            "$intent_prefix" <<'NODE'
          const assert = require("node:assert/strict");
          const fs = require("node:fs");
          const [pointerFile, intentFile, decisionId, blobName, sha256, prefix] = process.argv.slice(2);
          const pointer = JSON.parse(fs.readFileSync(pointerFile, "utf8"));
          const intent = JSON.parse(fs.readFileSync(intentFile, "utf8"));
          assert.equal(pointer.schema, "polyedge.funded_intent_handoff.v1");
          assert.match(pointer.decision_id, /^[0-9a-f]{64}$/);
          assert.match(pointer.intent_blob_name, new RegExp(`^${prefix}/[0-9a-f]{64}\\.json$`));
          assert.match(pointer.intent_sha256, /^sha256:[0-9a-f]{64}$/);
          const isWorkerPointer = pointer.decision_id === decisionId &&
            pointer.intent_blob_name === blobName && pointer.intent_sha256 === sha256;
          if (isWorkerPointer) {
            assert.equal(pointer.decision_ts, intent.decision_ts);
          } else {
            const pointerAt = Date.parse(pointer.decision_ts);
            const workerAt = Date.parse(intent.decision_ts);
            assert.ok(Number.isFinite(pointerAt) && Number.isFinite(workerAt));
            assert.ok(pointerAt > workerAt ||
              (pointerAt === workerAt && pointer.decision_id > decisionId),
              "current pointer is neither the worker handoff nor strictly newer");
          }
          NODE
          az storage blob list \
            --account-name "$STORAGE_ACCOUNT" \
            --container-name "$FUNDED_CONTAINER" \
            --prefix "$v10_prefix" \
            --num-results '*' \
            --auth-mode login \
            --only-show-errors -o json > v10-prefix-after-preflight.json
          jq -S '[.[] | {name, etag: .properties.etag, size: .properties.contentLength}]' \
            v10-prefix-after-preflight.json > v10-prefix-after-preflight.snapshot.json
          cmp -s v10-prefix-before-preflight.snapshot.json v10-prefix-after-preflight.snapshot.json
          az servicebus queue show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --namespace-name "$SERVICE_BUS_NAMESPACE" \
            --name "$SERVICE_BUS_QUEUE" \
            -o json > funded-queue-after-pointer-preflight.json
          jq -S '{
            status,
            active: .countDetails.activeMessageCount,
            scheduled: .countDetails.scheduledMessageCount,
            dead_letter: .countDetails.deadLetterMessageCount
          }' funded-queue-after-pointer-preflight.json > funded-queue-after-pointer-preflight.snapshot.json
          cmp -s \
            funded-queue-before-pointer-preflight.snapshot.json \
            funded-queue-after-pointer-preflight.snapshot.json
          v5_etag_after=$(az storage blob show \
            --account-name "$STORAGE_ACCOUNT" \
            --container-name "$FUNDED_CONTAINER" \
            --name "$v5_state" \
            --auth-mode login \
            --query properties.etag -o tsv)
          test "$v5_etag_after" = "$v5_etag_before"
          az storage blob download \
            --account-name "$STORAGE_ACCOUNT" \
            --container-name "$FUNDED_CONTAINER" \
            --name "$v5_state" \
            --file v5-state-after-preflight.json \
            --auth-mode login \
            --overwrite \
            --only-show-errors -o none
          test "sha256:$(sha256sum v5-state-after-preflight.json | cut -d' ' -f1)" = \
            "$v5_state_sha256"
          az containerapp job show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$FUNDED_JOB" \
            -o json > funded-preflight-job-after.json
          job_env() {
            jq -r --arg name "$1" \
              '.properties.template.containers[0].env[] | select(.name == $name) | .value' \
              funded-preflight-job-after.json
          }
          test "$(job_env FUNDED_DIRECT_WORKER_ENABLED)" = "false"
          test "$(job_env ALLOW_FUNDED_DIRECT)" = "false"
          test "$(job_env FUNDED_DIRECT_DRY_RUN)" = "true"
          test -z "$(job_env FUNDED_DIRECT_PREFLIGHT_ONLY)"

      - name: Restore normal producer handoff before service activation
        run: |
          set -euo pipefail
          restored=false
          for attempt in 1 2 3; do
            if az containerapp update \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --name "$INTENT_PRODUCER_APP" \
              --remove-env-vars STRATEGY_INTENT_POINTER_ONLY_PREFLIGHT \
              --set-env-vars \
                RUN_BOT_ON_STARTUP=true \
                STRATEGY_INTENT_OPERATOR_DIRECT=true \
                FUNDED_DIRECT_SERVICE_BUS_ENABLED=true \
                FUNDED_DIRECT_SERVICE_BUS_NAMESPACE="$SERVICE_BUS_NAMESPACE" \
                FUNDED_DIRECT_SERVICE_BUS_QUEUE="$SERVICE_BUS_QUEUE" \
              --only-show-errors -o none; then
              restored=true
              break
            fi
            sleep "$((attempt * 10))"
          done
          test "$restored" = true
          producer_revision=$(az containerapp show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$INTENT_PRODUCER_APP" \
            --query properties.latestRevisionName -o tsv)
          test -n "$producer_revision"
          for attempt in $(seq 1 36); do
            az containerapp revision list \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --name "$INTENT_PRODUCER_APP" -o json > producer-revisions-normal-restored.json
            if jq -e --arg revision "$producer_revision" '
              ([.[] | select(.properties.active == true)] | length) == 1
              and ([.[] | select(.properties.active == true)][0].name == $revision)
              and ([.[] | select(.name == $revision)][0].properties.healthState == "Healthy")
              and ([.[] | select(.name == $revision)][0].properties.replicas >= 1)
            ' producer-revisions-normal-restored.json >/dev/null; then break; fi
            sleep 5
          done
          jq -e --arg revision "$producer_revision" '
            ([.[] | select(.properties.active == true)] | length) == 1
            and ([.[] | select(.properties.active == true)][0].name == $revision)
            and ([.[] | select(.name == $revision)][0].properties.healthState == "Healthy")
            and ([.[] | select(.name == $revision)][0].properties.replicas >= 1)
          ' producer-revisions-normal-restored.json >/dev/null
          az containerapp show \
            --resource-group "$AZURE_RESOURCE_GROUP" --name "$INTENT_PRODUCER_APP" \
            -o json > intent-producer-normal-restored.json
          jq -e --arg namespace "$SERVICE_BUS_NAMESPACE" --arg queue "$SERVICE_BUS_QUEUE" '
            ([.properties.template.containers[0].env[] | select(.name == "STRATEGY_INTENT_POINTER_ONLY_PREFLIGHT")] | length) == 0
            and ([.properties.template.containers[0].env[] | select(.name == "FUNDED_DIRECT_SERVICE_BUS_ENABLED" and .value == "true")] | length) == 1
            and ([.properties.template.containers[0].env[] | select(.name == "FUNDED_DIRECT_SERVICE_BUS_NAMESPACE" and .value == $namespace)] | length) == 1
            and ([.properties.template.containers[0].env[] | select(.name == "FUNDED_DIRECT_SERVICE_BUS_QUEUE" and .value == $queue)] | length) == 1
          ' intent-producer-normal-restored.json >/dev/null
          az containerapp show \
            --resource-group "$AZURE_RESOURCE_GROUP" --name "$FUNDED_APP" -o json > funded-app-before-enable.json
          test "$(jq -r '.properties.template.scale.minReplicas' funded-app-before-enable.json)" = "0"
          test "$(jq -r '.properties.template.containers[0].env[] | select(.name == "FUNDED_DIRECT_SERVICE_ENABLED") | .value' funded-app-before-enable.json)" = "false"
          test "$(az servicebus queue show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --namespace-name "$SERVICE_BUS_NAMESPACE" \
            --name "$SERVICE_BUS_QUEUE" --query status -o tsv)" = "SendDisabled"
          echo "FUNDED_NORMAL_PRODUCER_RESTORED=true" >> "$GITHUB_ENV"

      - name: Enable v10 only after the zero-write preflight passes
        run: |
          set -euo pipefail
          deployed=false
          for attempt in 1 2 3; do
            if az deployment group create \
              --name "polyedge-funded-direct-cl-enabled-${GITHUB_RUN_ID}" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --template-file infra/funded-direct-chile.bicep \
              --parameters @infra/funded-direct-chile.parameters.json \
              --parameters venueProbeImage="${{ steps.images.outputs.funded_reference }}" \
              --parameters fundedDirectEnabled=true \
              --parameters fundedDirectQueueStatus=SendDisabled \
              --only-show-errors \
              -o json > funded-enabled-deployment.json 2> funded-enabled-deployment.stderr; then
              deployed=true
              break
            fi
            if ! grep -Fq 'unable to pull image using Managed identity' funded-enabled-deployment.stderr || [ "$attempt" -eq 3 ]; then
              cat funded-enabled-deployment.stderr >&2
              exit 1
            fi
            sleep "$((attempt * 30))"
          done
          test "$deployed" = true
          test "$(jq -r '.properties.provisioningState' funded-enabled-deployment.json)" = "Succeeded"

      - name: Verify one active cloud replica and exact live controls
        run: |
          set -euo pipefail
          for attempt in $(seq 1 36); do
            az containerapp show \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --name "$FUNDED_APP" \
              -o json > funded-app.json
            target_revision=$(jq -r '.properties.latestRevisionName' funded-app.json)
            az containerapp revision list \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --name "$FUNDED_APP" \
              -o json > funded-revisions.json
            active_revision_count=$(jq '[.[] | select(.properties.active == true)] | length' funded-revisions.json)
            active_revision=$(jq -r '[.[] | select(.properties.active == true)][0].name // ""' funded-revisions.json)
            target_health=$(jq -r --arg revision "$target_revision" \
              '.[] | select(.name == $revision) | .properties.healthState // ""' funded-revisions.json)
            target_replicas=$(jq -r --arg revision "$target_revision" \
              '.[] | select(.name == $revision) | .properties.replicas // 0' funded-revisions.json)
            if [ "$active_revision_count" = "1" ] && \
                [ "$active_revision" = "$target_revision" ] && \
                [ "$target_health" = "Healthy" ] && \
                [ "$target_replicas" = "1" ]; then
              break
            fi
            sleep 10
          done
          test "$active_revision_count" = "1"
          test "$active_revision" = "$target_revision"
          test "$target_health" = "Healthy"
          test "$target_replicas" = "1"
          test "$(jq -r '.properties.template.scale.minReplicas' funded-app.json)" = "1"
          test "$(jq -r '.properties.template.scale.maxReplicas' funded-app.json)" = "1"
          test "$(jq -r '.properties.template.containers[0].image' funded-app.json)" = "${{ steps.images.outputs.funded_reference }}"
          test "$(jq -r '.properties.template.containers[0].command | join(" ")' funded-app.json)" = "node src/funded-direct-service.mjs"
          env_value() {
            jq -r --arg name "$1" '.properties.template.containers[0].env[] | select(.name == $name) | .value' funded-app.json
          }
          env_secret_ref() {
            jq -r --arg name "$1" '.properties.template.containers[0].env[] | select(.name == $name) | .secretRef' funded-app.json
          }
          test "$(env_value FUNDED_DIRECT_SERVICE_ENABLED)" = "true"
          test "$(env_value FUNDED_DIRECT_ENGINE)" = "persistent_v1"
          test "$(env_value FUNDED_DIRECT_SERVICE_BUS_ENABLED)" = "true"
          test "$(env_value FUNDED_DIRECT_SERVICE_BUS_NAMESPACE)" = "$SERVICE_BUS_NAMESPACE"
          test "$(env_value FUNDED_DIRECT_SERVICE_BUS_QUEUE)" = "$SERVICE_BUS_QUEUE"
          test "$(env_value FUNDED_DIRECT_SIGNAL_TO_SEND_SLO_MS)" = "7000"
          test "$(env_value FUNDED_DIRECT_WORKER_ENABLED)" = "true"
          test "$(env_value ALLOW_FUNDED_DIRECT)" = "true"
          test "$(env_value FUNDED_DIRECT_DRY_RUN)" = "false"
          test "$(env_value ENABLE_TAKER_ORDERS)" = "false"
          test "$(env_value VENUE_PROBE_CAMPAIGN_CASH_FLOWS)" = "[]"
          test "$(env_value FUNDED_DIRECT_POLL_INTERVAL_MS)" = "1000"
          test "$(env_value FUNDED_DIRECT_MIN_REMAINING_TTL_MS)" = "7000"
          test "$(env_value FUNDED_DIRECT_CHILD_MIN_REMAINING_TTL_MS)" = "2000"
          test "$(env_value FUNDED_DIRECT_AUTO_REDEMPTION_ENABLED)" = "true"
          test "$(env_value FUNDED_DIRECT_AUTO_REDEMPTION_INTERVAL_MS)" = "60000"
          test "$(env_value FUNDED_DIRECT_AUTO_REDEMPTION_MIN_SECONDS_TO_EXPIRY)" = "30"
          test "$(env_value FUNDED_DIRECT_AUTO_REDEMPTION_MAX_SECONDS_TO_EXPIRY)" = "350"
          test -z "$(env_value VENUE_REDEMPTION_MAX_PAYOUT)"
          test "$(env_value VENUE_REDEMPTION_MAX_CONDITIONS)" = "1"
          test "$(env_secret_ref POLYMARKET_RELAYER_API_KEY)" = "polymarket-relayer-api-key"
          test "$(env_value FUNDED_DIRECT_SESSION_MANIFEST_BLOB_NAME)" = \
            "reports/funded/dynamic-quote/sessions/dynamic-quote-funded-2026-08-13-v10/session.json"
          test "$(env_value FUNDED_DIRECT_SESSION_MANIFEST_SHA256)" = \
            "sha256:c516c052fc5c01eed5403842ff24bf4b08512d6c38e8260e2d064580c82322f8"
          test "$(env_value VENUE_PROBE_FUNDED_CAMPAIGN_ID)" = \
            "dynamic-quote-funded-2026-08-13-v10"
          for name in \
            FUNDED_DIRECT_RESERVE_MIGRATION_SOURCE_SESSION_ID \
            FUNDED_DIRECT_RESERVE_MIGRATION_SOURCE_SESSION_MANIFEST_BLOB_NAME \
            FUNDED_DIRECT_RESERVE_MIGRATION_SOURCE_SESSION_MANIFEST_SHA256 \
            FUNDED_DIRECT_RESERVE_MIGRATION_SOURCE_STATE_BLOB_NAME \
            FUNDED_DIRECT_RESERVE_MIGRATION_MINIMUM_HISTORICAL_HIGH_WATER_EQUITY; do
            test -z "$(env_value "$name")"
          done
          session_json=$(env_value FUNDED_DIRECT_SESSION_MANIFEST_JSON)
          test "$(jq -r '.session_id' <<<"$session_json")" = "dynamic-quote-funded-2026-08-13-v10"
          test "$(jq -r '.no_deposits' <<<"$session_json")" = "true"
          test "$(jq -r '.allow_automatic_replenishment' <<<"$session_json")" = "false"
          test "$(jq -r '.allow_compounding' <<<"$session_json")" = "true"
          test "$(jq -r '.continue_after_loss' <<<"$session_json")" = "true"
          test "$(jq -r '.capital_policy.reserve_ratio' <<<"$session_json")" = "0.1"
          test "$(jq -r '.capital_policy.minimum_reserve' <<<"$session_json")" = "2"
          test "$(jq -r '.capital_policy.target_order_ratio' <<<"$session_json")" = "0.05"
          test "$(jq -r '.capital_policy.operating_buffer_ratio' <<<"$session_json")" = "0.01"
          test "$(jq -r '.capital_policy.reserve_basis' <<<"$session_json")" = "fully_reconciled_current_equity"
          test "$(jq -r '.capital_policy.loss_response' <<<"$session_json")" = "resize_from_fully_reconciled_current_equity"
          test "$(jq -r '.capital_policy.prior_state_session_id' <<<"$session_json")" = "dynamic-quote-funded-2026-07-29-v5"
          test "$(jq -r '.capital_policy.prior_state_blob_name' <<<"$session_json")" = \
            "reports/funded/dynamic-quote/sessions/dynamic-quote-funded-2026-07-29-v5/capital-reserve-state.json"
          test "$(jq -r '.capital_policy.prior_state_sha256' <<<"$session_json")" = \
            "sha256:9e63db7ef8c22d3af53a14f1858b817b8769ca7ba737e6668a900ffb73330c15"
          test "$(jq -r '.capital_policy.reserve_monotonic' <<<"$session_json")" = "false"
          test "$(jq -c '.external_cash_flows' <<<"$session_json")" = "[]"
          test "$(jq -c '.internal_settlements' <<<"$session_json")" = "[]"
          producer_image=$(az containerapp show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$INTENT_PRODUCER_APP" \
            --query properties.template.containers[0].image \
            -o tsv)
          test "$producer_image" = "${{ steps.images.outputs.producer_reference }}"
          az containerapp show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$INTENT_PRODUCER_APP" \
            -o json > intent-producer.json
          producer_env_value() {
            jq -r --arg name "$1" '.properties.template.containers[0].env[] | select(.name == $name) | .value' intent-producer.json
          }
          test "$(producer_env_value FUNDED_DIRECT_SERVICE_BUS_ENABLED)" = "true"
          test "$(producer_env_value FUNDED_DIRECT_SERVICE_BUS_NAMESPACE)" = "$SERVICE_BUS_NAMESPACE"
          test "$(producer_env_value FUNDED_DIRECT_SERVICE_BUS_QUEUE)" = "$SERVICE_BUS_QUEUE"
          test "$(producer_env_value LOCAL_JSONL_RECORDER_ENABLED)" = "false"

      - name: Refresh Azure login for post-deployment verification
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Verify Service Bus security and delivery contract
        run: |
          set -euo pipefail
          az servicebus namespace show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$SERVICE_BUS_NAMESPACE" \
            -o json > service-bus-namespace.json
          test "$(jq -r '.sku.name' service-bus-namespace.json)" = "Standard"
          test "$(jq -r '.disableLocalAuth' service-bus-namespace.json)" = "true"
          az servicebus queue show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --namespace-name "$SERVICE_BUS_NAMESPACE" \
            --name "$SERVICE_BUS_QUEUE" \
            -o json > service-bus-queue.json
          test "$(jq -r '.requiresDuplicateDetection' service-bus-queue.json)" = "true"
          test "$(jq -r '.status' service-bus-queue.json)" = "SendDisabled"
          test "$(jq -r '.duplicateDetectionHistoryTimeWindow' service-bus-queue.json)" = "PT10M"
          test "$(jq -r '.defaultMessageTimeToLive' service-bus-queue.json)" = "PT15S"
          test "$(jq -r '.deadLetteringOnMessageExpiration' service-bus-queue.json)" = "true"
          test "$(jq -r '.maxDeliveryCount' service-bus-queue.json)" = "3"
          az servicebus namespace network-rule-set show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --namespace-name "$SERVICE_BUS_NAMESPACE" \
            -o json > service-bus-network.json
          test "$(jq -r '.defaultAction' service-bus-network.json)" = "Deny"
          test "$(jq '.ipRules | length' service-bus-network.json)" = "2"
          producer_egress_ip=$(az network public-ip show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name pip-polyedge-venue-neu-egress-2 \
            --query ipAddress -o tsv)
          executor_egress_ip=$(az network public-ip show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name pip-polyedge-execution-cl-egress \
            --query ipAddress -o tsv)
          jq -e --arg producer "$producer_egress_ip" --arg executor "$executor_egress_ip" '
            ([.ipRules[].ipMask] | sort) == ([$producer, $executor] | sort)
          ' service-bus-network.json
          queue_id=$(az servicebus queue show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --namespace-name "$SERVICE_BUS_NAMESPACE" \
            --name "$SERVICE_BUS_QUEUE" \
            --query id -o tsv)
          test "$(az role assignment list --scope "$queue_id" --query "[?roleDefinitionName=='Azure Service Bus Data Sender'] | length(@)" -o tsv)" = "1"
          test "$(az role assignment list --scope "$queue_id" --query "[?roleDefinitionName=='Azure Service Bus Data Receiver'] | length(@)" -o tsv)" = "1"

      - name: Verify service startup and qset isolation
        run: |
          set -euo pipefail
          environment_id=$(az containerapp show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$FUNDED_APP" \
            --query properties.environmentId -o tsv)
          workspace_customer_id=$(az containerapp env show \
            --ids "$environment_id" \
            --query properties.appLogsConfiguration.logAnalyticsConfiguration.customerId -o tsv)
          active_revision=$(az containerapp show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$FUNDED_APP" \
            --query properties.latestRevisionName -o tsv)
          az containerapp revision list \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$FUNDED_APP" \
            -o json > funded-revisions-final.json
          test "$(jq '[.[] | select(.properties.active == true)] | length' funded-revisions-final.json)" = "1"
          test "$(jq -r '[.[] | select(.properties.active == true)][0].name' funded-revisions-final.json)" = "$active_revision"
          for attempt in $(seq 1 18); do
            az containerapp replica list \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --name "$FUNDED_APP" \
              --revision "$active_revision" \
              -o json > funded-replicas-final.json
            replica_started_at=$(jq -r \
              '.[0].properties.createdTime // "9999-12-31T23:59:59Z"' \
              funded-replicas-final.json)
            startup_count=$(az monitor log-analytics query \
              --workspace "$workspace_customer_id" \
              --analytics-query "ContainerAppConsoleLogs_CL
                | where ContainerAppName_s == '$FUNDED_APP'
                | where RevisionName_s == '$active_revision'
                | where TimeGenerated >= datetime($replica_started_at)
                | where Log_s contains '\"status\":\"persistent_service_started\"'
                | count" \
              --query '[0].Count' -o tsv) || { sleep 10; continue; }
            az monitor log-analytics query \
              --workspace "$workspace_customer_id" \
              --analytics-query "ContainerAppConsoleLogs_CL
                | where ContainerAppName_s == '$FUNDED_APP'
                | where RevisionName_s == '$active_revision'
                | where TimeGenerated >= datetime($replica_started_at)
                | extend record = parse_json(Log_s)
                | where tostring(record.status) == 'persistent_service_heartbeat'
                | top 1 by TimeGenerated desc
                | project Log_s" \
              -o json > funded-heartbeat-final.json || { sleep 10; continue; }
            if [ "${startup_count:-0}" -ge 1 ] && jq -e '
                length == 1
                and .[0].properties.runningState == "Running"
                and ([.[0].properties.containers[]
                  | select(.name == "funded-direct"
                    and .ready == true
                    and .runningState == "Running"
                    and .restartCount == 0)] | length) == 1
              ' funded-replicas-final.json >/dev/null && jq -e '
                length == 1
                and (.[0].Log_s | fromjson
                  | .executor.busy == false
                  and .executor.user_channel_ready == true
                  and (.executor.market_channel_ready == true
                    or .executor.warmed_market == null)
                  and .executor.reconnect_reconciliation_required == false
                  and .executor.user_channel_gaps == 0
                  and .executor.market_channel_gaps == 0)
              ' funded-heartbeat-final.json >/dev/null; then
              break
            fi
            sleep 10
          done
          test "${startup_count:-0}" -ge 1
          jq -e '
            length == 1
            and .[0].properties.runningState == "Running"
            and ([.[0].properties.containers[]
              | select(.name == "funded-direct"
                and .ready == true
                and .runningState == "Running"
                and .restartCount == 0)] | length) == 1
          ' funded-replicas-final.json
          jq -e '
            length == 1
            and (.[0].Log_s | fromjson
              | .executor.busy == false
              and .executor.user_channel_ready == true
              and (.executor.market_channel_ready == true
                or .executor.warmed_market == null)
              and .executor.reconnect_reconciliation_required == false
              and .executor.user_channel_gaps == 0
              and .executor.market_channel_gaps == 0)
          ' funded-heartbeat-final.json
          qset_after=$(az containerapp show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$PROTECTED_QSET_APP" \
            --query properties.latestRevisionName \
            -o tsv)
          test "$qset_after" = "$(cat protected-qset-revision-before.txt)"
          test "$(az servicebus queue show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --namespace-name "$SERVICE_BUS_NAMESPACE" \
            --name "$SERVICE_BUS_QUEUE" \
            --query status -o tsv)" = "SendDisabled"

      - name: Pause producer and warm funded intent before cutover
        run: |
          set -euo pipefail
          cutover_complete=false
          refence_incomplete_cutover() {
            if [ "$cutover_complete" != true ]; then
              az servicebus queue update \
                --resource-group "$AZURE_RESOURCE_GROUP" \
                --namespace-name "$SERVICE_BUS_NAMESPACE" \
                --name "$SERVICE_BUS_QUEUE" \
                --status SendDisabled \
                --only-show-errors -o none || true
              for attempt in 1 2 3; do
                if az containerapp update \
                  --resource-group "$AZURE_RESOURCE_GROUP" \
                  --name "$INTENT_PRODUCER_APP" \
                  --remove-env-vars STRATEGY_INTENT_POINTER_ONLY_PREFLIGHT \
                  --set-env-vars \
                    RUN_BOT_ON_STARTUP=true \
                    FUNDED_DIRECT_SERVICE_BUS_ENABLED=true \
                  --only-show-errors -o none; then
                  break
                fi
                sleep "$((attempt * 5))"
              done
            fi
          }
          trap refence_incomplete_cutover EXIT
          az servicebus queue show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --namespace-name "$SERVICE_BUS_NAMESPACE" \
            --name "$SERVICE_BUS_QUEUE" \
            -o json > funded-queue-before-activation.json
          test "$(jq -r '.status' funded-queue-before-activation.json)" = "SendDisabled"
          dlq_before=$(jq -r '.countDetails.deadLetterMessageCount' funded-queue-before-activation.json)
          [[ "$dlq_before" =~ ^[0-9]+$ ]]
          test "$dlq_before" = "$(cat funded-fenced-dlq-before.txt)"
          az containerapp update \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$INTENT_PRODUCER_APP" \
            --set-env-vars \
              RUN_BOT_ON_STARTUP=false \
              FUNDED_DIRECT_SERVICE_BUS_ENABLED=true \
            --only-show-errors \
            -o none
          producer_revision=$(az containerapp show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$INTENT_PRODUCER_APP" \
            --query properties.latestRevisionName -o tsv)
          test -n "$producer_revision"
          producer_paused=false
          for attempt in $(seq 1 36); do
            az containerapp revision list \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --name "$INTENT_PRODUCER_APP" \
              -o json > producer-revisions-paused.json
            if jq -e --arg revision "$producer_revision" '
              ([.[] | select(.properties.active == true)] | length) == 1
              and ([.[] | select(.properties.active == true)][0].name == $revision)
              and ([.[] | select(.name == $revision)] | length) == 1
              and ([.[] | select(.name == $revision)][0].properties.healthState == "Healthy")
              and ([.[] | select(.name == $revision)][0].properties.replicas >= 1)
            ' producer-revisions-paused.json >/dev/null; then
              producer_paused=true
              break
            fi
            sleep 5
          done
          test "$producer_paused" = true
          az containerapp show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$INTENT_PRODUCER_APP" \
            -o json > intent-producer-paused.json
          producer_paused_env() {
            jq -er --arg name "$1" '
              [.properties.template.containers[0].env[]
                | select(.name == $name) | .value]
              | if length == 1 then .[0]
                else error("expected one producer environment value for " + $name)
                end
            ' intent-producer-paused.json
          }
          test "$(producer_paused_env RUN_BOT_ON_STARTUP)" = "false"
          test "$(producer_paused_env STRATEGY_INTENT_OPERATOR_DIRECT)" = "true"
          test "$(producer_paused_env FUNDED_DIRECT_SERVICE_BUS_ENABLED)" = "true"
          az servicebus queue update \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --namespace-name "$SERVICE_BUS_NAMESPACE" \
            --name "$SERVICE_BUS_QUEUE" \
            --status Active \
            --only-show-errors -o none
          test "$(az servicebus queue show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --namespace-name "$SERVICE_BUS_NAMESPACE" \
            --name "$SERVICE_BUS_QUEUE" \
            --query status -o tsv)" = "Active"
          # Preserve one 360-second producer eligibility window for warmup and revision rollout.
          while :; do
            epoch=$(date -u +%s)
            remaining_seconds=$((900 - epoch % 900))
            if [ "$remaining_seconds" -ge 720 ]; then break; fi
            sleep 10
          done
          warmup_started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          warmup_execution=$(az containerapp job start \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$FUNDED_WARMUP_JOB" \
            --query name -o tsv)
          test -n "$warmup_execution"
          warmup_status=Running
          for attempt in $(seq 1 24); do
            warmup_status=$(az containerapp job execution show \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --name "$FUNDED_WARMUP_JOB" \
              --job-execution-name "$warmup_execution" \
              --query properties.status -o tsv)
            case "$warmup_status" in
              Succeeded) break ;;
              Failed|Stopped|Degraded) exit 1 ;;
            esac
            sleep 5
          done
          test "$warmup_status" = "Succeeded"
          producer_restarted_at=$warmup_started_at
          environment_id=$(az containerapp show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$FUNDED_APP" \
            --query properties.environmentId -o tsv)
          workspace_customer_id=$(az containerapp env show \
            --ids "$environment_id" \
            --query properties.appLogsConfiguration.logAnalyticsConfiguration.customerId -o tsv)
          funded_revision=$(az containerapp show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$FUNDED_APP" \
            --query properties.latestRevisionName -o tsv)
          test "$(az containerapp show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$FUNDED_APP" \
            --query properties.latestReadyRevisionName -o tsv)" = "$funded_revision"
          warmup_ready=false
          for attempt in $(seq 1 200); do
            az monitor log-analytics query \
              --workspace "$workspace_customer_id" \
              --analytics-query "ContainerAppConsoleLogs_CL
                | where ContainerAppName_s == '$FUNDED_APP'
                | where RevisionName_s == '$funded_revision'
                | where TimeGenerated >= datetime($producer_restarted_at)
                | extend record = parse_json(Log_s)
                | where tostring(record.status) == 'market_warmed'
                | top 1 by TimeGenerated desc
                | project TimeGenerated, Log_s" \
              -o json > funded-warmup-after-reopen.json || { sleep 5; continue; }
            warmup_market=$(jq -r '.[0].Log_s // "{}" | fromjson | .market_id // ""' \
              funded-warmup-after-reopen.json)
            warmup_time=$(jq -r '.[0].TimeGenerated // ""' funded-warmup-after-reopen.json)
            if [[ "$warmup_market" =~ ^[0-9]+$ ]] && [ -n "$warmup_time" ]; then
              az monitor log-analytics query \
                --workspace "$workspace_customer_id" \
                --analytics-query "ContainerAppConsoleLogs_CL
                  | where ContainerAppName_s == '$FUNDED_APP'
                  | where RevisionName_s == '$funded_revision'
                  | where TimeGenerated >= datetime($warmup_time)
                  | extend record = parse_json(Log_s)
                  | where tostring(record.status) == 'persistent_service_heartbeat'
                  | where tostring(record.executor.warmed_market.market_id) == '$warmup_market'
                  | top 1 by TimeGenerated desc
                  | project Log_s" \
                -o json > funded-heartbeat-after-reopen.json || { sleep 5; continue; }
              if jq -e '
                length == 1
                and (.[0].Log_s | fromjson
                  | .executor.user_channel_ready == true
                  and .executor.market_channel_ready == true
                  and .executor.safety_snapshot_cache_ready == true
                  and .executor.safety_snapshot_cache_error == null
                  and .executor.reconnect_reconciliation_required == false
                  and .executor.user_channel_gaps == 0
                  and .executor.market_channel_gaps == 0)
              ' funded-heartbeat-after-reopen.json >/dev/null; then
                warmup_ready=true
                break
              fi
            fi
            sleep 5
          done
          test "$warmup_ready" = true
          warmup_market_end_ts=$(jq -r '.[0].Log_s | fromjson | .executor.warmed_market.market_end_ts' \
            funded-heartbeat-after-reopen.json)
          test -n "$warmup_market_end_ts"
          echo "FUNDED_CUTOVER_DLQ_BEFORE=$dlq_before" >> "$GITHUB_ENV"
          echo "FUNDED_WARMUP_MARKET=$warmup_market" >> "$GITHUB_ENV"
          echo "FUNDED_WARMUP_MARKET_END_TS=$warmup_market_end_ts" >> "$GITHUB_ENV"
          trap - EXIT

      - name: Refresh Azure login before submitted v10 lifecycle
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Rewarm the producer and prove one submitted v10 child lifecycle
        run: |
          set -euo pipefail
          cutover_complete=false
          refence_incomplete_cutover() {
            if [ "$cutover_complete" != true ]; then
              az servicebus queue update \
                --resource-group "$AZURE_RESOURCE_GROUP" \
                --namespace-name "$SERVICE_BUS_NAMESPACE" \
                --name "$SERVICE_BUS_QUEUE" \
                --status SendDisabled \
                --only-show-errors -o none || true
              for attempt in 1 2 3; do
                if az containerapp update \
                  --resource-group "$AZURE_RESOURCE_GROUP" \
                  --name "$INTENT_PRODUCER_APP" \
                  --remove-env-vars STRATEGY_INTENT_POINTER_ONLY_PREFLIGHT \
                  --set-env-vars \
                    RUN_BOT_ON_STARTUP=true \
                    FUNDED_DIRECT_SERVICE_BUS_ENABLED=true \
                  --only-show-errors -o none; then
                  break
                fi
                sleep "$((attempt * 5))"
              done
            fi
          }
          trap refence_incomplete_cutover EXIT
          readonly dlq_before="$FUNDED_CUTOVER_DLQ_BEFORE"
          readonly warmup_market="$FUNDED_WARMUP_MARKET"
          readonly warmup_market_end_ts="$FUNDED_WARMUP_MARKET_END_TS"
          [[ "$dlq_before" =~ ^[0-9]+$ ]]
          test -n "$warmup_market"
          test -n "$warmup_market_end_ts"
          environment_id=$(az containerapp show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$FUNDED_APP" \
            --query properties.environmentId -o tsv)
          workspace_customer_id=$(az containerapp env show \
            --ids "$environment_id" \
            --query properties.appLogsConfiguration.logAnalyticsConfiguration.customerId -o tsv)
          funded_revision=$(az containerapp show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$FUNDED_APP" \
            --query properties.latestRevisionName -o tsv)
          test -n "$workspace_customer_id"
          test -n "$funded_revision"
          producer_enabled_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          test "$(( $(date -u -d "$warmup_market_end_ts" +%s) - $(date -u -d "$producer_enabled_at" +%s) ))" -ge 360
          az containerapp update \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$INTENT_PRODUCER_APP" \
            --set-env-vars \
              RUN_BOT_ON_STARTUP=true \
              FUNDED_DIRECT_SERVICE_BUS_ENABLED=true \
            --only-show-errors \
            -o none
          producer_revision=$(az containerapp show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$INTENT_PRODUCER_APP" \
            --query properties.latestRevisionName -o tsv)
          test -n "$producer_revision"
          producer_enabled=false
          for attempt in $(seq 1 36); do
            az containerapp revision list \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --name "$INTENT_PRODUCER_APP" \
              -o json > producer-revisions-enabled.json
            if jq -e --arg revision "$producer_revision" '
              ([.[] | select(.properties.active == true)] | length) == 1
              and ([.[] | select(.properties.active == true)][0].name == $revision)
              and ([.[] | select(.name == $revision)] | length) == 1
              and ([.[] | select(.name == $revision)][0].properties.healthState == "Healthy")
              and ([.[] | select(.name == $revision)][0].properties.replicas >= 1)
            ' producer-revisions-enabled.json >/dev/null; then
              producer_enabled=true
              break
            fi
            sleep 5
          done
          test "$producer_enabled" = true
          az containerapp show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$INTENT_PRODUCER_APP" \
            -o json > intent-producer-enabled.json
          producer_enabled_env() {
            jq -er --arg name "$1" '
              [.properties.template.containers[0].env[]
                | select(.name == $name) | .value]
              | if length == 1 then .[0]
                else error("expected one producer environment value for " + $name)
                end
            ' intent-producer-enabled.json
          }
          test "$(producer_enabled_env RUN_BOT_ON_STARTUP)" = "true"
          test "$(producer_enabled_env STRATEGY_INTENT_OPERATOR_DIRECT)" = "true"
          test "$(producer_enabled_env FUNDED_DIRECT_SERVICE_BUS_ENABLED)" = "true"
          az containerapp revision list \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$INTENT_PRODUCER_APP" \
            -o json > producer-revisions-after-reopen.json
          jq -e --arg revision "$producer_revision" '
            ([.[] | select(.properties.active == true)] | length) == 1
            and ([.[] | select(.properties.active == true)][0].name == $revision)
          ' producer-revisions-after-reopen.json
          az containerapp show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$INTENT_PRODUCER_APP" \
            -o json | jq -e --arg revision "$producer_revision" \
              --arg image "${{ steps.images.outputs.producer_reference }}" '
              .properties.latestRevisionName == $revision
              and .properties.latestReadyRevisionName == $revision
              and .properties.template.containers[0].image == $image
            ' >/dev/null
          test "$(az containerapp show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$FUNDED_APP" \
            --query properties.latestRevisionName -o tsv)" = "$funded_revision"
          test "$(az containerapp show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$FUNDED_APP" \
            --query properties.latestReadyRevisionName -o tsv)" = "$funded_revision"
          lifecycle_ready=false
          # Observe several 15-minute markets; warmup is not proof of a qualifying Place intent.
          lifecycle_deadline_epoch=$(( $(date -u +%s) + 2400 ))
          sleep_before_lifecycle_deadline() {
            local remaining=$(( lifecycle_deadline_epoch - $(date -u +%s) ))
            [ "$remaining" -gt 0 ] || return 1
            [ "$remaining" -le 10 ] || remaining=10
            sleep "$remaining"
          }
          while [ "$(date -u +%s)" -lt "$lifecycle_deadline_epoch" ]; do
            if ! az monitor log-analytics query \
              --workspace "$workspace_customer_id" \
              --analytics-query "ContainerAppConsoleLogs_CL
                | where ContainerAppName_s == '$FUNDED_APP'
                | where RevisionName_s == '$funded_revision'
                | where TimeGenerated >= datetime($producer_enabled_at)
                | extend record = parse_json(Log_s)
                | where tostring(record.schema) == 'polyedge.funded_direct_latency.v1'
                | where tostring(record.status) == 'intent_completed'
                | where tobool(record.order_submission_attempted) == true
                | where tostring(record.worker_status) == 'persistent_intent_completed'
                | where todouble(record.signal_to_send_ms) <= todouble(record.signal_to_send_slo_ms)
                | where tolong(record.signal_to_send_slo_ms) == 7000
                | top 1 by TimeGenerated asc
                | project TimeGenerated, Log_s" \
              -o json > funded-v10-lifecycle-latency.json; then
              sleep_before_lifecycle_deadline || break
              continue
            fi
            if jq -e '
              length == 1
              and (.[0].Log_s | fromjson
                | (.decision_id | test("^[0-9a-f]{64}$"))
                and .status == "intent_completed"
                and .order_submission_attempted == true
                and .worker_status == "persistent_intent_completed"
                and (.signal_to_send_ms | type == "number")
                and .signal_to_send_ms <= .signal_to_send_slo_ms
                and .signal_to_send_slo_ms == 7000)
            ' funded-v10-lifecycle-latency.json >/dev/null; then
              lifecycle_ready=true
              break
            fi
            sleep_before_lifecycle_deadline || break
          done
          test "$lifecycle_ready" = true
          decision_id=$(jq -r '.[0].Log_s | fromjson | .decision_id' funded-v10-lifecycle-latency.json)
          . scripts/verify-funded-v10-capital.sh
          az containerapp show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$FUNDED_APP" \
            -o json > funded-v10-live-app.json
          funded_env() {
            jq -r --arg name "$1" \
              '.properties.template.containers[0].env[] | select(.name == $name) | .value' \
              funded-v10-live-app.json
          }
          control_prefix=$(funded_env FUNDED_DIRECT_CONTROL_PREFIX)
          intent_container=$(funded_env STRATEGY_CANARY_INTENT_CONTAINER_NAME)
          intent_prefix=$(funded_env STRATEGY_CANARY_INTENT_PREFIX)
          test "$control_prefix" = "reports/funded/dynamic-quote"
          test -n "$intent_container"
          test "$intent_prefix" = "reports/research/venue-probe/control/strategy-canary/intents"
          authorization_blob="$control_prefix/sessions/dynamic-quote-funded-2026-08-13-v10/authorizations/$decision_id.json"
          completion_blob="$control_prefix/sessions/dynamic-quote-funded-2026-08-13-v10/completed/$decision_id.json"
          az storage blob download \
            --account-name "$STORAGE_ACCOUNT" \
            --container-name "$FUNDED_CONTAINER" \
            --name "$authorization_blob" \
            --file funded-v10-authorization.json \
            --auth-mode login \
            --overwrite \
            --only-show-errors -o none
          authorization_sha256="sha256:$(sha256sum funded-v10-authorization.json | cut -d' ' -f1)"
          az storage blob download \
            --account-name "$STORAGE_ACCOUNT" \
            --container-name "$FUNDED_CONTAINER" \
            --name "$completion_blob" \
            --file funded-v10-completion.json \
            --auth-mode login \
            --overwrite \
            --only-show-errors -o none
          jq -e --arg decision "$decision_id" --arg authorization_blob "$authorization_blob" --arg authorization_sha "$authorization_sha256" '
            .schema == "polyedge.operator_funded_intent_completion.v1"
            and .session_id == "dynamic-quote-funded-2026-08-13-v10"
            and .decision_id == $decision
            and .authorization_blob_name == $authorization_blob
            and .authorization_sha256 == $authorization_sha
            and .status == "child_completed"
            and .order_submission_attempted == true
            and .authorization_consumed == true
            and .risk_reservation_created == true
            and (.child_run_id | type == "string" and length > 0)
          ' funded-v10-completion.json
          child_run_id=$(jq -r '.child_run_id' funded-v10-completion.json)
          [[ "$child_run_id" =~ ^funded-direct-[0-9]{17}-[0-9a-f]{8}$ ]]
          jq -e --arg decision "$decision_id" --arg run "$child_run_id" --arg authorization_blob "$authorization_blob" --arg authorization_sha "$authorization_sha256" '
            .schema == "polyedge.operator_funded_intent_authorization.v1"
            and .authorization_mode == "operator_direct"
            and .session_id == "dynamic-quote-funded-2026-08-13-v10"
            and .decision_id == $decision
            and .child_run_id == $run
            and .promotion_manifest_blob_name == "reports/funded/dynamic-quote/sessions/dynamic-quote-funded-2026-08-13-v10/session.json"
            and .promotion_manifest_sha256 == "sha256:c516c052fc5c01eed5403842ff24bf4b08512d6c38e8260e2d064580c82322f8"
            and .operator_session_manifest_blob_name == .promotion_manifest_blob_name
            and .operator_session_manifest_sha256 == .promotion_manifest_sha256
            and .research_promotion_bypassed == true
            and .max_order_notional == 10.5
            and (.authorization_id | type == "string" and length > 0)
            and (.intent_blob_name | type == "string")
            and (.intent_sha256 | test("^sha256:[0-9a-f]{64}$"))
          ' funded-v10-authorization.json
          intent_blob=$(jq -r '.intent_blob_name' funded-v10-authorization.json)
          intent_sha256=$(jq -r '.intent_sha256' funded-v10-authorization.json)
          authorization_id=$(jq -r '.authorization_id' funded-v10-authorization.json)
          test "$intent_blob" = "$intent_prefix/$decision_id.json"
          az storage blob download \
            --account-name "$STORAGE_ACCOUNT" \
            --container-name "$intent_container" \
            --name "$intent_blob" \
            --file funded-v10-intent.json \
            --auth-mode login \
            --overwrite \
            --only-show-errors -o none
          test "$intent_sha256" = "sha256:$(sha256sum funded-v10-intent.json | cut -d' ' -f1)"
          node .github/workflows/verify-funded-v10-intent.mjs \
            --verify funded-v10-intent.json "$decision_id"
          intent_market=$(jq -er '.market_id | tostring' funded-v10-intent.json)
          intent_market_end_ts=$(jq -er '.market_end_ts | select(type == "string")' funded-v10-intent.json)
          lifecycle_completed_at=$(jq -er '.[0].TimeGenerated | select(type == "string")' \
            funded-v10-lifecycle-latency.json)
          node - funded-v10-intent.json <<'NODE'
          const assert = require("node:assert/strict");
          const fs = require("node:fs");
          const intent = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          const decisionAt = Date.parse(intent.decision_ts);
          const validUntil = Date.parse(intent.valid_until);
          const marketEnd = Date.parse(intent.market_end_ts);
          assert.ok(Number.isFinite(decisionAt) && Number.isFinite(validUntil) && Number.isFinite(marketEnd));
          assert.equal(intent.ttl_ms, 15_000);
          assert.equal(validUntil, decisionAt + intent.ttl_ms);
          assert.ok(marketEnd - decisionAt >= 360_000 && marketEnd - decisionAt <= 900_000,
            "funded intent is outside the configured market-expiry window");
          assert.ok(validUntil < marketEnd, "funded intent outlives its exact market");
          NODE
          if [ "$intent_market" != "$warmup_market" ]; then
            rollover_ready=false
            for attempt in $(seq 1 18); do
              az monitor log-analytics query \
                --workspace "$workspace_customer_id" \
                --analytics-query "ContainerAppConsoleLogs_CL
                  | where ContainerAppName_s == '$FUNDED_APP'
                  | where RevisionName_s == '$funded_revision'
                  | where TimeGenerated >= datetime($producer_enabled_at)
                  | where TimeGenerated <= datetime($lifecycle_completed_at)
                  | extend record = parse_json(Log_s)
                  | where tostring(record.status) == 'market_warmed'
                  | where tostring(record.market_id) == '$intent_market'
                  | top 1 by TimeGenerated desc
                  | project TimeGenerated, Log_s" \
                -o json > funded-v10-rollover-warmup.json || { sleep 10; continue; }
              rollover_warmup_time=$(jq -r '.[0].TimeGenerated // ""' \
                funded-v10-rollover-warmup.json)
              if [ -z "$rollover_warmup_time" ]; then
                sleep 10
                continue
              fi
              az monitor log-analytics query \
                --workspace "$workspace_customer_id" \
                --analytics-query "ContainerAppConsoleLogs_CL
                  | where ContainerAppName_s == '$FUNDED_APP'
                  | where RevisionName_s == '$funded_revision'
                  | where TimeGenerated >= datetime($rollover_warmup_time)
                  | where TimeGenerated <= datetime($lifecycle_completed_at)
                  | extend record = parse_json(Log_s)
                  | where tostring(record.status) == 'persistent_service_heartbeat'
                  | where tostring(record.executor.warmed_market.market_id) == '$intent_market'
                  | where todatetime(record.executor.warmed_market.market_end_ts) == datetime($intent_market_end_ts)
                  | top 1 by TimeGenerated desc
                  | project Log_s" \
                -o json > funded-v10-rollover-heartbeat.json || { sleep 10; continue; }
              if jq -e '
                length == 1
                and (.[0].Log_s | fromjson
                  | .executor.user_channel_ready == true
                  and .executor.market_channel_ready == true
                  and .executor.safety_snapshot_cache_ready == true
                  and .executor.safety_snapshot_cache_error == null
                  and .executor.reconnect_reconciliation_required == false
                  and .executor.user_channel_gaps == 0
                  and .executor.market_channel_gaps == 0)
              ' funded-v10-rollover-heartbeat.json >/dev/null; then
                rollover_ready=true
                break
              fi
              sleep 10
            done
            test "$rollover_ready" = true
          fi
          consumption_blob="reports/research/venue-probe/control/strategy-canary/consumed/$authorization_id.json"
          az storage blob download \
            --account-name "$STORAGE_ACCOUNT" \
            --container-name "$FUNDED_CONTAINER" \
            --name "$consumption_blob" \
            --file funded-v10-authorization-consumption.json \
            --auth-mode login \
            --overwrite \
            --only-show-errors -o none
          jq -e --arg authorization_id "$authorization_id" --arg authorization_sha "$authorization_sha256" --arg decision "$decision_id" --arg run "$child_run_id" '
            .schema == "polyedge.strategy_canary_authorization_consumption.v1"
            and .authorization_id == $authorization_id
            and .authorization_sha256 == $authorization_sha
            and .decision_id == $decision
            and .run_id == $run
          ' funded-v10-authorization-consumption.json
          az storage blob list \
            --account-name "$STORAGE_ACCOUNT" \
            --container-name "$FUNDED_CONTAINER" \
            --prefix "reports/research/venue-probe/risk-reservations/" \
            --num-results '*' \
            --auth-mode login \
            --only-show-errors -o json > funded-v10-risk-reservations.json
          reservation_blob=$(jq -r --arg decision "$decision_id" '
            [.[] | select(.name | endswith("/funded-direct-" + $decision + ".json"))]
            | if length == 1 then .[0].name else empty end
          ' funded-v10-risk-reservations.json)
          test -n "$reservation_blob"
          [[ "$reservation_blob" =~ ^reports/research/venue-probe/risk-reservations/[0-9]{4}-[0-9]{2}-[0-9]{2}/funded-direct-${decision_id}\.json$ ]]
          az storage blob download \
            --account-name "$STORAGE_ACCOUNT" \
            --container-name "$FUNDED_CONTAINER" \
            --name "$reservation_blob" \
            --file funded-v10-risk-reservation.json \
            --auth-mode login \
            --overwrite \
            --only-show-errors -o none
          az storage blob list \
            --account-name "$STORAGE_ACCOUNT" \
            --container-name "$FUNDED_CONTAINER" \
            --prefix "reports/research/venue-probe/runs/" \
            --num-results '*' \
            --auth-mode login \
            --only-show-errors -o json > funded-v10-run-summaries.json
          summary_blob=$(jq -r --arg run "$child_run_id" '
            [.[] | select(.name | endswith("/" + $run + "/summary.json"))]
            | if length == 1 then .[0].name else empty end
          ' funded-v10-run-summaries.json)
          test -n "$summary_blob"
          az storage blob download \
            --account-name "$STORAGE_ACCOUNT" \
            --container-name "$FUNDED_CONTAINER" \
            --name "$summary_blob" \
            --file funded-v10-run-summary.json \
            --auth-mode login \
            --overwrite \
            --only-show-errors -o none
          order_id=$(jq -r '.lifecycle.order_id // ""' funded-v10-run-summary.json)
          [[ "$order_id" =~ ^0x[0-9a-fA-F]{64}$ ]]
          jq -e --arg decision "$decision_id" --arg run "$child_run_id" --arg authorization_blob "$authorization_blob" --arg authorization_sha "$authorization_sha256" --arg intent_blob "$intent_blob" --arg intent_sha "$intent_sha256" --arg order_id "$order_id" '
            .schema_version == 3
            and .status == "completed"
            and .run_id == $run
            and .order_submission_attempted == true
            and .order_submitted == true
            and .provenance.decision_id == $decision
            and .provenance.authorization_kind == "operator_direct"
            and .provenance.operator_session_id == "dynamic-quote-funded-2026-08-13-v10"
            and .provenance.research_promotion_bypassed == true
            and .provenance.authorization_blob_name == $authorization_blob
            and .provenance.authorization_sha256 == $authorization_sha
            and .provenance.intent_blob_name == $intent_blob
            and .provenance.intent_sha256 == $intent_sha
            and .order.current_funds_scaled == true
            and .order.source_requested_notional == 10.5
            and .order.notional < 10.5
            and .lifecycle.order_id == $order_id
          ' funded-v10-run-summary.json
          jq -e --arg decision "$decision_id" --arg run "$child_run_id" --arg order_id "$order_id" '
            .schema_version == 1
            and .campaign_id == "dynamic-quote-funded-2026-08-13-v10"
            and .run_id == $run
            and .probe_id == ("funded-direct-" + $decision)
            and .order_submitted == true
            and .order_id == $order_id
          ' funded-v10-risk-reservation.json
          az servicebus queue update \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --namespace-name "$SERVICE_BUS_NAMESPACE" \
            --name "$SERVICE_BUS_QUEUE" \
            --status SendDisabled \
            --only-show-errors -o none
          test "$(az servicebus queue show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --namespace-name "$SERVICE_BUS_NAMESPACE" \
            --name "$SERVICE_BUS_QUEUE" \
            --query status -o tsv)" = "SendDisabled"
          {
            printf 'FUNDED_LIFECYCLE_DECISION_ID=%s\n' "$decision_id"
            printf 'FUNDED_LIFECYCLE_CHILD_RUN_ID=%s\n' "$child_run_id"
            printf 'FUNDED_LIFECYCLE_ORDER_ID=%s\n' "$order_id"
            printf 'FUNDED_LIFECYCLE_RESERVATION_BLOB=%s\n' "$reservation_blob"
          } >> "$GITHUB_ENV"
          trap - EXIT

      - name: Refresh Azure login before terminal reservation verification
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Wait for the exact terminal v10 reservation before cutover
        run: |
          set -euo pipefail
          readonly decision_id="${FUNDED_LIFECYCLE_DECISION_ID:?}"
          readonly child_run_id="${FUNDED_LIFECYCLE_CHILD_RUN_ID:?}"
          readonly order_id="${FUNDED_LIFECYCLE_ORDER_ID:?}"
          readonly reservation_blob="${FUNDED_LIFECYCLE_RESERVATION_BLOB:?}"
          readonly dlq_before="${FUNDED_CUTOVER_DLQ_BEFORE:?}"
          [[ "$decision_id" =~ ^[0-9a-f]{64}$ ]]
          [[ "$child_run_id" =~ ^funded-direct-[0-9]{17}-[0-9a-f]{8}$ ]]
          [[ "$order_id" =~ ^0x[0-9a-fA-F]{64}$ ]]
          [[ "$dlq_before" =~ ^[0-9]+$ ]]
          [[ "$reservation_blob" =~ ^reports/research/venue-probe/risk-reservations/[0-9]{4}-[0-9]{2}-[0-9]{2}/funded-direct-${decision_id}\.json$ ]]
          terminal_reservation_ready=false
          terminal_deadline_epoch=$(( $(date -u +%s) + 2400 ))
          sleep_before_terminal_deadline() {
            local remaining=$(( terminal_deadline_epoch - $(date -u +%s) ))
            [ "$remaining" -gt 0 ] || return 1
            [ "$remaining" -le 10 ] || remaining=10
            sleep "$remaining"
          }
          while [ "$(date -u +%s)" -lt "$terminal_deadline_epoch" ]; do
            if ! az storage blob download \
              --account-name "$STORAGE_ACCOUNT" \
              --container-name "$FUNDED_CONTAINER" \
              --name "$reservation_blob" \
              --file funded-v10-terminal-risk-reservation.json \
              --auth-mode login \
              --overwrite \
              --only-show-errors -o none; then
              sleep_before_terminal_deadline || break
              continue
            fi
            jq -e --arg decision "$decision_id" --arg run "$child_run_id" --arg order_id "$order_id" '
              .schema_version == 1
              and .campaign_id == "dynamic-quote-funded-2026-08-13-v10"
              and .run_id == $run
              and .probe_id == ("funded-direct-" + $decision)
              and .order_submitted == true
              and .order_id == $order_id
            ' funded-v10-terminal-risk-reservation.json >/dev/null
            if jq -e '
              (.state == "finalized_no_fill"
                and .matched_notional == 0
                and .reconciliation_complete == true
                and .zero_open_orders_confirmed == true)
              or
              (.state == "position_settled"
                and .matched_notional > 0
                and .settlement_verified == true
                and (.settlement_evidence_source == "verified_onchain_redemption"
                  or .settlement_evidence_source == "polymarket_data_api_redeemable"))
            ' funded-v10-terminal-risk-reservation.json >/dev/null; then
              terminal_reservation_ready=true
              break
            fi
            sleep_before_terminal_deadline || break
          done
          test "$terminal_reservation_ready" = true
          az servicebus queue show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --namespace-name "$SERVICE_BUS_NAMESPACE" \
            --name "$SERVICE_BUS_QUEUE" \
            -o json > funded-queue-after-lifecycle.json
          test "$(jq -r '.status' funded-queue-after-lifecycle.json)" = "SendDisabled"
          test "$(jq -r '.countDetails.activeMessageCount' funded-queue-after-lifecycle.json)" = "0"
          test "$(jq -r '.countDetails.scheduledMessageCount' funded-queue-after-lifecycle.json)" = "0"
          test "$(jq -r '.countDetails.deadLetterMessageCount' funded-queue-after-lifecycle.json)" = "$dlq_before"
          az servicebus queue update \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --namespace-name "$SERVICE_BUS_NAMESPACE" \
            --name "$SERVICE_BUS_QUEUE" \
            --status Active \
            --only-show-errors -o none
          test "$(az servicebus queue show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --namespace-name "$SERVICE_BUS_NAMESPACE" \
            --name "$SERVICE_BUS_QUEUE" \
            --query status -o tsv)" = "Active"
          echo "FUNDED_CUTOVER_COMPLETE=true" >> "$GITHUB_ENV"

      - name: Restore the dormant funded service after an incomplete cutover
        if: ${{ always() && (env.FUNDED_QUEUE_FENCED == 'true' || env.FUNDED_POINTER_PREFLIGHT_REQUESTED == 'true') && env.FUNDED_CUTOVER_COMPLETE != 'true' }}
        run: |
          set -euo pipefail
          queue_fenced=false
          for attempt in 1 2 3; do
            if az servicebus queue update \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --namespace-name "$SERVICE_BUS_NAMESPACE" \
              --name "$SERVICE_BUS_QUEUE" \
              --status SendDisabled \
              --only-show-errors -o none; then
              queue_fenced=true
              break
            fi
            sleep "$((attempt * 10))"
          done
          test "$queue_fenced" = true
          test "$(az servicebus queue show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --namespace-name "$SERVICE_BUS_NAMESPACE" \
            --name "$SERVICE_BUS_QUEUE" --query status -o tsv)" = "SendDisabled"
          producer_cleanup_updated=false
          for attempt in 1 2 3; do
            if az containerapp update \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --name "$INTENT_PRODUCER_APP" \
              --remove-env-vars STRATEGY_INTENT_POINTER_ONLY_PREFLIGHT \
              --set-env-vars \
                RUN_BOT_ON_STARTUP=true \
                FUNDED_DIRECT_SERVICE_BUS_ENABLED=true \
                FUNDED_DIRECT_SERVICE_BUS_NAMESPACE="$SERVICE_BUS_NAMESPACE" \
                FUNDED_DIRECT_SERVICE_BUS_QUEUE="$SERVICE_BUS_QUEUE" \
              --only-show-errors -o none; then
              producer_cleanup_updated=true
              break
            fi
            sleep "$((attempt * 10))"
          done
          test "$producer_cleanup_updated" = true
          restored_producer_revision=$(az containerapp show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$INTENT_PRODUCER_APP" \
            --query properties.latestRevisionName -o tsv)
          test -n "$restored_producer_revision"
          producer_restored=false
          for attempt in $(seq 1 36); do
            az containerapp revision list \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --name "$INTENT_PRODUCER_APP" \
              -o json > producer-revisions-restored.json
            if jq -e --arg revision "$restored_producer_revision" '
              ([.[] | select(.properties.active == true)] | length) == 1
              and ([.[] | select(.properties.active == true)][0].name == $revision)
              and ([.[] | select(.name == $revision)] | length) == 1
              and ([.[] | select(.name == $revision)][0].properties.healthState == "Healthy")
              and ([.[] | select(.name == $revision)][0].properties.replicas >= 1)
            ' producer-revisions-restored.json >/dev/null; then
              producer_restored=true
              break
            fi
            sleep 5
          done
          test "$producer_restored" = true
          az containerapp show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$INTENT_PRODUCER_APP" \
            -o json > intent-producer-restored.json
          restored_producer_env() {
            jq -er --arg name "$1" '
              [.properties.template.containers[0].env[]
                | select(.name == $name) | .value]
              | if length == 1 then .[0]
                else error("expected one restored producer environment value for " + $name)
                end
            ' intent-producer-restored.json
          }
          test "$(restored_producer_env RUN_BOT_ON_STARTUP)" = "true"
          test "$(restored_producer_env STRATEGY_INTENT_OPERATOR_DIRECT)" = "true"
          test "$(restored_producer_env FUNDED_DIRECT_SERVICE_BUS_ENABLED)" = "true"
          test "$(restored_producer_env FUNDED_DIRECT_SERVICE_BUS_NAMESPACE)" = "$SERVICE_BUS_NAMESPACE"
          test "$(restored_producer_env FUNDED_DIRECT_SERVICE_BUS_QUEUE)" = "$SERVICE_BUS_QUEUE"
          test "$(jq '[.properties.template.containers[0].env[]
            | select(.name == "STRATEGY_INTENT_POINTER_ONLY_PREFLIGHT")] | length' \
            intent-producer-restored.json)" = "0"
          if [ -n "${FUNDED_ROLLBACK_REVISION:-}" ]; then
            test -s funded-rollback-template.json
            rollback_command=(az containerapp revision copy \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --name "$FUNDED_APP" \
              --from-revision "$FUNDED_ROLLBACK_REVISION")
            exact_rollback=true
          else
            rollback_command=(az containerapp update \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --name "$FUNDED_APP" \
              --min-replicas 0 \
              --max-replicas 1 \
              --set-env-vars \
                FUNDED_DIRECT_SERVICE_ENABLED=false \
                FUNDED_DIRECT_AUTO_REDEMPTION_ENABLED=false \
                FUNDED_DIRECT_WORKER_ENABLED=false \
                ALLOW_FUNDED_DIRECT=false \
                FUNDED_DIRECT_DRY_RUN=true \
                ALLOW_LIVE=false \
                ALLOW_STRATEGY_CANARY=false \
                ENABLE_TAKER_ORDERS=false)
            exact_rollback=false
          fi
          rollback_applied=false
          for attempt in $(seq 1 30); do
            if "${rollback_command[@]}" --only-show-errors -o none \
              2> funded-rollback.stderr; then
              rollback_applied=true
              break
            fi
            if ! grep -Fq 'ContainerAppOperationInProgress' funded-rollback.stderr || \
              [ "$attempt" -eq 30 ]; then
              cat funded-rollback.stderr >&2
              exit 1
            fi
            sleep 10
          done
          test "$rollback_applied" = true
          test "$(az servicebus queue show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --namespace-name "$SERVICE_BUS_NAMESPACE" \
            --name "$SERVICE_BUS_QUEUE" \
            --query status -o tsv)" = "SendDisabled"
          restored_revision=$(az containerapp show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$FUNDED_APP" \
            --query properties.latestRevisionName -o tsv)
          test -n "$restored_revision"
          for attempt in $(seq 1 60); do
            ready_revision=$(az containerapp show \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --name "$FUNDED_APP" \
              --query properties.latestReadyRevisionName -o tsv)
            if [ "$ready_revision" = "$restored_revision" ]; then break; fi
            sleep 5
          done
          test "$ready_revision" = "$restored_revision"
          az containerapp revision show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$FUNDED_APP" \
            --revision "$restored_revision" \
            --only-show-errors -o json > restored-funded-revision.json
          if [ "$exact_rollback" = true ]; then
            jq -S '.properties.template' restored-funded-revision.json > restored-funded-template.json
            cmp funded-rollback-template.json restored-funded-template.json
            test "$(jq -r '.properties.active' restored-funded-revision.json)" = "true"
            while read -r active_revision; do
              if [ -n "$active_revision" ] && [ "$active_revision" != "$restored_revision" ]; then
                az containerapp revision deactivate \
                  --resource-group "$AZURE_RESOURCE_GROUP" \
                  --name "$FUNDED_APP" \
                  --revision "$active_revision" \
                  --only-show-errors -o none
              fi
            done < <(az containerapp revision list \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --name "$FUNDED_APP" \
              --query '[?properties.active].name' -o tsv)
            az containerapp revision list \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --name "$FUNDED_APP" \
              -o json > restored-funded-revisions.json
            jq -e --arg revision "$restored_revision" '
              ([.[] | select(.properties.active == true)] | length) == 1
              and ([.[] | select(.properties.active == true)][0].name == $revision)
            ' restored-funded-revisions.json >/dev/null
          else
            restored_env_value() {
              jq -er --arg name "$1" '
                [.properties.template.containers[0].env[]
                  | select(.name == $name) | .value]
                | if length == 1 and .[0] != null then .[0]
                  else error("expected exactly one non-null environment value for " + $name)
                  end
              ' restored-funded-revision.json
            }
            test "$(jq -r '.properties.template.scale.minReplicas' restored-funded-revision.json)" = "0"
            test "$(jq -r '.properties.template.scale.maxReplicas' restored-funded-revision.json)" = "1"
            for name in \
              FUNDED_DIRECT_SERVICE_ENABLED \
              FUNDED_DIRECT_AUTO_REDEMPTION_ENABLED \
              FUNDED_DIRECT_WORKER_ENABLED \
              ALLOW_FUNDED_DIRECT \
              ALLOW_LIVE \
              ALLOW_STRATEGY_CANARY \
              ENABLE_TAKER_ORDERS; do
              test "$(restored_env_value "$name")" = "false"
            done
            test "$(restored_env_value FUNDED_DIRECT_DRY_RUN)" = "true"
          fi
