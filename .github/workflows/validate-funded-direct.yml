          test "$(env_value FUNDED_DIRECT_SIGNAL_TO_SEND_SLO_MS)" = "7000"
          test "$(env_value FUNDED_DIRECT_WORKER_ENABLED)" = "true"
          test "$(env_value ALLOW_FUNDED_DIRECT)" = "true"
          test "$(env_value FUNDED_DIRECT_DRY_RUN)" = "false"
          test "$(env_value ENABLE_TAKER_ORDERS)" = "false"
          test "$(env_value VENUE_PROBE_CAMPAIGN_CASH_FLOWS)" = "[]"
          test "$(env_value FUNDED_DIRECT_POLL_INTERVAL_MS)" = "1000"
          test "$(env_value FUNDED_DIRECT_MIN_REMAINING_TTL_MS)" = "7000"
          test "$(env_value FUNDED_DIRECT_CHILD_MIN_REMAINING_TTL_MS)" = "2000"
          test "$(env_value FUNDED_DIRECT_AUTO_REDEMPTION_ENABLED)" = "true"
          test "$(env_value FUNDED_DIRECT_AUTO_REDEMPTION_INTERVAL_MS)" = "60000"
          test "$(env_value FUNDED_DIRECT_AUTO_REDEMPTION_MIN_SECONDS_TO_EXPIRY)" = "30"
          test "$(env_value FUNDED_DIRECT_AUTO_REDEMPTION_MAX_SECONDS_TO_EXPIRY)" = "350"
          test -z "$(env_value VENUE_REDEMPTION_MAX_PAYOUT)"
          test "$(env_value VENUE_REDEMPTION_MAX_CONDITIONS)" = "1"
          test "$(env_secret_ref POLYMARKET_RELAYER_API_KEY)" = "polymarket-relayer-api-key"
          test "$(env_value FUNDED_DIRECT_SESSION_MANIFEST_BLOB_NAME)" = \
            "reports/funded/dynamic-quote/sessions/dynamic-quote-funded-2026-08-13-v10/session.json"
          test "$(env_value FUNDED_DIRECT_SESSION_MANIFEST_SHA256)" = \
            "sha256:c516c052fc5c01eed5403842ff24bf4b08512d6c38e8260e2d064580c82322f8"
          test "$(env_value VENUE_PROBE_FUNDED_CAMPAIGN_ID)" = \
            "dynamic-quote-funded-2026-08-13-v10"
          for name in \
            FUNDED_DIRECT_RESERVE_MIGRATION_SOURCE_SESSION_ID \
            FUNDED_DIRECT_RESERVE_MIGRATION_SOURCE_SESSION_MANIFEST_BLOB_NAME \
            FUNDED_DIRECT_RESERVE_MIGRATION_SOURCE_SESSION_MANIFEST_SHA256 \
            FUNDED_DIRECT_RESERVE_MIGRATION_SOURCE_STATE_BLOB_NAME \
            FUNDED_DIRECT_RESERVE_MIGRATION_MINIMUM_HISTORICAL_HIGH_WATER_EQUITY; do
            test -z "$(env_value "$name")"
          done
          session_json=$(env_value FUNDED_DIRECT_SESSION_MANIFEST_JSON)
          test "$(jq -r '.session_id' <<<"$session_json")" = "dynamic-quote-funded-2026-08-13-v10"
          test "$(jq -r '.no_deposits' <<<"$session_json")" = "true"
          test "$(jq -r '.allow_automatic_replenishment' <<<"$session_json")" = "false"
          test "$(jq -r '.allow_compounding' <<<"$session_json")" = "true"
          test "$(jq -r '.continue_after_loss' <<<"$session_json")" = "true"
          test "$(jq -r '.capital_policy.reserve_ratio' <<<"$session_json")" = "0.1"
          test "$(jq -r '.capital_policy.minimum_reserve' <<<"$session_json")" = "2"
          test "$(jq -r '.capital_policy.target_order_ratio' <<<"$session_json")" = "0.05"
          test "$(jq -r '.capital_policy.operating_buffer_ratio' <<<"$session_json")" = "0.01"
          test "$(jq -r '.capital_policy.reserve_basis' <<<"$session_json")" = "fully_reconciled_current_equity"
          test "$(jq -r '.capital_policy.loss_response' <<<"$session_json")" = "resize_from_fully_reconciled_current_equity"
          test "$(jq -r '.capital_policy.prior_state_session_id' <<<"$session_json")" = "dynamic-quote-funded-2026-07-29-v5"
          test "$(jq -r '.capital_policy.prior_state_blob_name' <<<"$session_json")" = \
            "reports/funded/dynamic-quote/sessions/dynamic-quote-funded-2026-07-29-v5/capital-reserve-state.json"
          test "$(jq -r '.capital_policy.prior_state_sha256' <<<"$session_json")" = \
            "sha256:9e63db7ef8c22d3af53a14f1858b817b8769ca7ba737e6668a900ffb73330c15"
          test "$(jq -r '.capital_policy.reserve_monotonic' <<<"$session_json")" = "false"
          test "$(jq -c '.external_cash_flows' <<<"$session_json")" = "[]"
          test "$(jq -c '.internal_settlements' <<<"$session_json")" = "[]"
          producer_image=$(az containerapp show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$INTENT_PRODUCER_APP" \
            --query properties.template.containers[0].image \
            -o tsv)
          test "$producer_image" = "${{ steps.images.outputs.producer_reference }}"
          az containerapp show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$INTENT_PRODUCER_APP" \
            -o json > intent-producer.json
          producer_env_value() {
            jq -r --arg name "$1" '.properties.template.containers[0].env[] | select(.name == $name) | .value' intent-producer.json
          }
          test "$(producer_env_value FUNDED_DIRECT_SERVICE_BUS_ENABLED)" = "true"
          test "$(producer_env_value FUNDED_DIRECT_SERVICE_BUS_NAMESPACE)" = "$SERVICE_BUS_NAMESPACE"
          test "$(producer_env_value FUNDED_DIRECT_SERVICE_BUS_QUEUE)" = "$SERVICE_BUS_QUEUE"
          test "$(producer_env_value LOCAL_JSONL_RECORDER_ENABLED)" = "false"
          az containerapp revision show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$FUNDED_APP" \
            --revision "$target_revision" \
            --only-show-errors -o json > funded-workflow-revision.json
          jq -S '.properties.template' funded-workflow-revision.json \
            > funded-workflow-template.json
          workflow_template_sha256="sha256:$(sha256sum funded-workflow-template.json | cut -d' ' -f1)"
          {
            echo "FUNDED_WORKFLOW_ACTIVE_REVISION=$target_revision"
            echo "FUNDED_WORKFLOW_ACTIVE_TEMPLATE_SHA256=$workflow_template_sha256"
          } >> "$GITHUB_ENV"

      - name: Refresh Azure login for post-deployment verification
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Verify Service Bus security and delivery contract
        run: |
          set -euo pipefail
          az servicebus namespace show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$SERVICE_BUS_NAMESPACE" \
            -o json > service-bus-namespace.json
          test "$(jq -r '.sku.name' service-bus-namespace.json)" = "Standard"
          test "$(jq -r '.disableLocalAuth' service-bus-namespace.json)" = "true"
          az servicebus queue show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --namespace-name "$SERVICE_BUS_NAMESPACE" \
            --name "$SERVICE_BUS_QUEUE" \
            -o json > service-bus-queue.json
          test "$(jq -r '.requiresDuplicateDetection' service-bus-queue.json)" = "true"
          test "$(jq -r '.status' service-bus-queue.json)" = "SendDisabled"
          test "$(jq -r '.duplicateDetectionHistoryTimeWindow' service-bus-queue.json)" = "PT10M"
          test "$(jq -r '.defaultMessageTimeToLive' service-bus-queue.json)" = "PT15S"
          test "$(jq -r '.deadLetteringOnMessageExpiration' service-bus-queue.json)" = "true"
          test "$(jq -r '.maxDeliveryCount' service-bus-queue.json)" = "3"
          az servicebus namespace network-rule-set show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --namespace-name "$SERVICE_BUS_NAMESPACE" \
            -o json > service-bus-network.json
          test "$(jq -r '.defaultAction' service-bus-network.json)" = "Deny"
          test "$(jq '.ipRules | length' service-bus-network.json)" = "2"
          producer_egress_ip=$(az network public-ip show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name pip-polyedge-venue-neu-egress-2 \
            --query ipAddress -o tsv)
          executor_egress_ip=$(az network public-ip show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name pip-polyedge-execution-cl-egress \
            --query ipAddress -o tsv)
          jq -e --arg producer "$producer_egress_ip" --arg executor "$executor_egress_ip" '
            ([.ipRules[].ipMask] | sort) == ([$producer, $executor] | sort)
          ' service-bus-network.json
          queue_id=$(az servicebus queue show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --namespace-name "$SERVICE_BUS_NAMESPACE" \
            --name "$SERVICE_BUS_QUEUE" \
            --query id -o tsv)
          test "$(az role assignment list --scope "$queue_id" --query "[?roleDefinitionName=='Azure Service Bus Data Sender'] | length(@)" -o tsv)" = "1"
          az role assignment list \
            --scope "$queue_id" \
            --all \
            --fill-principal-name false \
            --only-show-errors \
            -o json > service-bus-queue-role-assignments.json
          scripts/verify-funded-receiver-role-contract.sh \
            service-bus-queue-role-assignments.json \
            "$queue_id" \
            "$FUNDED_RECEIVER_TRANSITION_PHASE"

      - name: Verify service startup and qset isolation
        run: |
          set -euo pipefail
          environment_id=$(az containerapp show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$FUNDED_APP" \
            --query properties.environmentId -o tsv)
          workspace_customer_id=$(az containerapp env show \
            --ids "$environment_id" \
            --query properties.appLogsConfiguration.logAnalyticsConfiguration.customerId -o tsv)
          active_revision=$(az containerapp show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$FUNDED_APP" \
            --query properties.latestRevisionName -o tsv)
          az containerapp revision list \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$FUNDED_APP" \
            -o json > funded-revisions-final.json
          test "$(jq '[.[] | select(.properties.active == true)] | length' funded-revisions-final.json)" = "1"
          test "$(jq -r '[.[] | select(.properties.active == true)][0].name' funded-revisions-final.json)" = "$active_revision"
          for attempt in $(seq 1 18); do
            az containerapp replica list \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --name "$FUNDED_APP" \
              --revision "$active_revision" \
              -o json > funded-replicas-final.json
            replica_started_at=$(jq -r \
              '.[0].properties.createdTime // "9999-12-31T23:59:59Z"' \
              funded-replicas-final.json)
            startup_count=$(az monitor log-analytics query \
              --workspace "$workspace_customer_id" \
              --analytics-query "ContainerAppConsoleLogs_CL
                | where ContainerAppName_s == '$FUNDED_APP'
                | where RevisionName_s == '$active_revision'
                | where TimeGenerated >= datetime($replica_started_at)
                | where Log_s contains '\"status\":\"persistent_service_started\"'
                | count" \
              --query '[0].Count' -o tsv) || { sleep 10; continue; }
            az monitor log-analytics query \
              --workspace "$workspace_customer_id" \
              --analytics-query "ContainerAppConsoleLogs_CL
                | where ContainerAppName_s == '$FUNDED_APP'
                | where RevisionName_s == '$active_revision'
                | where TimeGenerated >= datetime($replica_started_at)
                | extend record = parse_json(Log_s)
                | where tostring(record.status) == 'persistent_service_heartbeat'
                | top 1 by TimeGenerated desc
                | project Log_s" \
              -o json > funded-heartbeat-final.json || { sleep 10; continue; }
            if [ "${startup_count:-0}" -ge 1 ] && jq -e '
                length == 1
                and .[0].properties.runningState == "Running"
                and ([.[0].properties.containers[]
                  | select(.name == "funded-direct"
                    and .ready == true
                    and .runningState == "Running"
                    and .restartCount == 0)] | length) == 1
              ' funded-replicas-final.json >/dev/null && jq -e '
                length == 1
                and (.[0].Log_s | fromjson
                  | .executor.busy == false
                  and .executor.user_channel_ready == true
                  and (.executor.market_channel_ready == true
                    or .executor.warmed_market == null)
                  and .executor.reconnect_reconciliation_required == false
                  and .executor.user_channel_gaps == 0
                  and .executor.market_channel_gaps == 0)
              ' funded-heartbeat-final.json >/dev/null; then
              break
            fi
            sleep 10
          done
          test "${startup_count:-0}" -ge 1
          jq -e '
            length == 1
            and .[0].properties.runningState == "Running"
            and ([.[0].properties.containers[]
              | select(.name == "funded-direct"
                and .ready == true
                and .runningState == "Running"
                and .restartCount == 0)] | length) == 1
          ' funded-replicas-final.json
          jq -e '
            length == 1
            and (.[0].Log_s | fromjson
              | .executor.busy == false
              and .executor.user_channel_ready == true
              and (.executor.market_channel_ready == true
                or .executor.warmed_market == null)
              and .executor.reconnect_reconciliation_required == false
              and .executor.user_channel_gaps == 0
              and .executor.market_channel_gaps == 0)
          ' funded-heartbeat-final.json
          qset_after=$(az containerapp show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$PROTECTED_QSET_APP" \
            --query properties.latestRevisionName \
            -o tsv)
          test "$qset_after" = "$(cat protected-qset-revision-before.txt)"
          test "$(az servicebus queue show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --namespace-name "$SERVICE_BUS_NAMESPACE" \
            --name "$SERVICE_BUS_QUEUE" \
            --query status -o tsv)" = "SendDisabled"

      - name: Pause producer and warm funded intent before cutover
        run: |
          set -euo pipefail
          cutover_complete=false
          refence_incomplete_cutover() {
            if [ "$cutover_complete" != true ]; then
              az servicebus queue update \
                --resource-group "$AZURE_RESOURCE_GROUP" \
                --namespace-name "$SERVICE_BUS_NAMESPACE" \
                --name "$SERVICE_BUS_QUEUE" \
                --status SendDisabled \
                --only-show-errors -o none || true
              for attempt in 1 2 3; do
                if az containerapp update \
                  --resource-group "$AZURE_RESOURCE_GROUP" \
                  --name "$INTENT_PRODUCER_APP" \
                  --remove-env-vars STRATEGY_INTENT_POINTER_ONLY_PREFLIGHT \
                  --set-env-vars \
                    RUN_BOT_ON_STARTUP=true \
                    FUNDED_DIRECT_SERVICE_BUS_ENABLED=true \
                  --only-show-errors -o none; then
                  break
                fi
                sleep "$((attempt * 5))"
              done
            fi
          }
          trap refence_incomplete_cutover EXIT
          az servicebus queue show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --namespace-name "$SERVICE_BUS_NAMESPACE" \
            --name "$SERVICE_BUS_QUEUE" \
            -o json > funded-queue-before-activation.json
          test "$(jq -r '.status' funded-queue-before-activation.json)" = "SendDisabled"
          dlq_before=$(jq -r '.countDetails.deadLetterMessageCount' funded-queue-before-activation.json)
          [[ "$dlq_before" =~ ^[0-9]+$ ]]
          test "$dlq_before" = "$(cat funded-fenced-dlq-before.txt)"
          az containerapp update \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$INTENT_PRODUCER_APP" \
            --set-env-vars \
              RUN_BOT_ON_STARTUP=false \
              FUNDED_DIRECT_SERVICE_BUS_ENABLED=true \
            --only-show-errors \
            -o none
          producer_revision=$(az containerapp show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$INTENT_PRODUCER_APP" \
            --query properties.latestRevisionName -o tsv)
          test -n "$producer_revision"
          producer_paused=false
          for attempt in $(seq 1 36); do
            az containerapp revision list \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --name "$INTENT_PRODUCER_APP" \
              -o json > producer-revisions-paused.json
            if jq -e --arg revision "$producer_revision" '
              ([.[] | select(.properties.active == true)] | length) == 1
              and ([.[] | select(.properties.active == true)][0].name == $revision)
              and ([.[] | select(.name == $revision)] | length) == 1
              and ([.[] | select(.name == $revision)][0].properties.healthState == "Healthy")
              and ([.[] | select(.name == $revision)][0].properties.replicas >= 1)
            ' producer-revisions-paused.json >/dev/null; then
              producer_paused=true
              break
            fi
            sleep 5
          done
          test "$producer_paused" = true
          az containerapp show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$INTENT_PRODUCER_APP" \
            -o json > intent-producer-paused.json
          producer_paused_env() {
            jq -er --arg name "$1" '
              [.properties.template.containers[0].env[]
                | select(.name == $name) | .value]
              | if length == 1 then .[0]
                else error("expected one producer environment value for " + $name)
                end
            ' intent-producer-paused.json
          }
          test "$(producer_paused_env RUN_BOT_ON_STARTUP)" = "false"
          test "$(producer_paused_env STRATEGY_INTENT_OPERATOR_DIRECT)" = "true"
          test "$(producer_paused_env FUNDED_DIRECT_SERVICE_BUS_ENABLED)" = "true"
          az servicebus queue update \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --namespace-name "$SERVICE_BUS_NAMESPACE" \
            --name "$SERVICE_BUS_QUEUE" \
            --status Active \
            --only-show-errors -o none
          test "$(az servicebus queue show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --namespace-name "$SERVICE_BUS_NAMESPACE" \
            --name "$SERVICE_BUS_QUEUE" \
            --query status -o tsv)" = "Active"
          # Preserve one 360-second producer eligibility window for warmup and revision rollout.
          while :; do
            epoch=$(date -u +%s)
            remaining_seconds=$((900 - epoch % 900))
            if [ "$remaining_seconds" -ge 720 ]; then break; fi
            sleep 10
          done
          warmup_started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          warmup_execution=$(az containerapp job start \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$FUNDED_WARMUP_JOB" \
            --query name -o tsv)
          test -n "$warmup_execution"
          warmup_status=Running
          for attempt in $(seq 1 24); do
            warmup_status=$(az containerapp job execution show \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --name "$FUNDED_WARMUP_JOB" \
              --job-execution-name "$warmup_execution" \
              --query properties.status -o tsv)
            case "$warmup_status" in
              Succeeded) break ;;
              Failed|Stopped|Degraded) exit 1 ;;
            esac
            sleep 5
          done
          test "$warmup_status" = "Succeeded"
          producer_restarted_at=$warmup_started_at
          environment_id=$(az containerapp show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$FUNDED_APP" \
            --query properties.environmentId -o tsv)
          workspace_customer_id=$(az containerapp env show \
            --ids "$environment_id" \
            --query properties.appLogsConfiguration.logAnalyticsConfiguration.customerId -o tsv)
          funded_revision=$(az containerapp show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$FUNDED_APP" \
            --query properties.latestRevisionName -o tsv)
          test "$(az containerapp show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$FUNDED_APP" \
            --query properties.latestReadyRevisionName -o tsv)" = "$funded_revision"
          warmup_ready=false
          for attempt in $(seq 1 200); do
            az monitor log-analytics query \
              --workspace "$workspace_customer_id" \
              --analytics-query "ContainerAppConsoleLogs_CL
                | where ContainerAppName_s == '$FUNDED_APP'
                | where RevisionName_s == '$funded_revision'
                | where TimeGenerated >= datetime($producer_restarted_at)
                | extend record = parse_json(Log_s)
                | where tostring(record.status) == 'market_warmed'
                | top 1 by TimeGenerated desc
                | project TimeGenerated, Log_s" \
              -o json > funded-warmup-after-reopen.json || { sleep 5; continue; }
            warmup_market=$(jq -r '.[0].Log_s // "{}" | fromjson | .market_id // ""' \
              funded-warmup-after-reopen.json)
            warmup_time=$(jq -r '.[0].TimeGenerated // ""' funded-warmup-after-reopen.json)
            if [[ "$warmup_market" =~ ^[0-9]+$ ]] && [ -n "$warmup_time" ]; then
              az monitor log-analytics query \
                --workspace "$workspace_customer_id" \
                --analytics-query "ContainerAppConsoleLogs_CL
                  | where ContainerAppName_s == '$FUNDED_APP'
                  | where RevisionName_s == '$funded_revision'
                  | where TimeGenerated >= datetime($warmup_time)
                  | extend record = parse_json(Log_s)
                  | where tostring(record.status) == 'persistent_service_heartbeat'
                  | where tostring(record.executor.warmed_market.market_id) == '$warmup_market'
                  | top 1 by TimeGenerated desc
                  | project Log_s" \
                -o json > funded-heartbeat-after-reopen.json || { sleep 5; continue; }
              if jq -e '
                length == 1
                and (.[0].Log_s | fromjson
                  | .executor.user_channel_ready == true
                  and .executor.market_channel_ready == true
                  and .executor.safety_snapshot_cache_ready == true
                  and .executor.safety_snapshot_cache_error == null
                  and .executor.reconnect_reconciliation_required == false
                  and .executor.user_channel_gaps == 0
                  and .executor.market_channel_gaps == 0)
              ' funded-heartbeat-after-reopen.json >/dev/null; then
                warmup_ready=true
                break
              fi
            fi
            sleep 5
          done
          test "$warmup_ready" = true
          warmup_market_end_ts=$(jq -r '.[0].Log_s | fromjson | .executor.warmed_market.market_end_ts' \
            funded-heartbeat-after-reopen.json)
          test -n "$warmup_market_end_ts"
          echo "FUNDED_CUTOVER_DLQ_BEFORE=$dlq_before" >> "$GITHUB_ENV"
          echo "FUNDED_WARMUP_MARKET=$warmup_market" >> "$GITHUB_ENV"
          echo "FUNDED_WARMUP_MARKET_END_TS=$warmup_market_end_ts" >> "$GITHUB_ENV"
          trap - EXIT

      - name: Refresh Azure login before submitted v10 lifecycle
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Rewarm the producer and prove one submitted v10 child lifecycle
        run: |
          set -euo pipefail
          cutover_complete=false
          refence_incomplete_cutover() {
            if [ "$cutover_complete" != true ]; then
              az servicebus queue update \
                --resource-group "$AZURE_RESOURCE_GROUP" \
                --namespace-name "$SERVICE_BUS_NAMESPACE" \
                --name "$SERVICE_BUS_QUEUE" \
                --status SendDisabled \
                --only-show-errors -o none || true
              for attempt in 1 2 3; do
                if az containerapp update \
                  --resource-group "$AZURE_RESOURCE_GROUP" \
                  --name "$INTENT_PRODUCER_APP" \
                  --remove-env-vars STRATEGY_INTENT_POINTER_ONLY_PREFLIGHT \
                  --set-env-vars \
                    RUN_BOT_ON_STARTUP=true \
                    FUNDED_DIRECT_SERVICE_BUS_ENABLED=true \
                  --only-show-errors -o none; then
                  break
                fi
                sleep "$((attempt * 5))"
              done
            fi
          }
          trap refence_incomplete_cutover EXIT
          readonly dlq_before="$FUNDED_CUTOVER_DLQ_BEFORE"
          readonly warmup_market="$FUNDED_WARMUP_MARKET"
          readonly warmup_market_end_ts="$FUNDED_WARMUP_MARKET_END_TS"
          [[ "$dlq_before" =~ ^[0-9]+$ ]]
          test -n "$warmup_market"
          test -n "$warmup_market_end_ts"
          environment_id=$(az containerapp show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$FUNDED_APP" \
            --query properties.environmentId -o tsv)
          workspace_customer_id=$(az containerapp env show \
            --ids "$environment_id" \
            --query properties.appLogsConfiguration.logAnalyticsConfiguration.customerId -o tsv)
          funded_revision=$(az containerapp show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$FUNDED_APP" \
            --query properties.latestRevisionName -o tsv)
          test -n "$workspace_customer_id"
          test -n "$funded_revision"
          producer_enabled_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          test "$(( $(date -u -d "$warmup_market_end_ts" +%s) - $(date -u -d "$producer_enabled_at" +%s) ))" -ge 360
          az containerapp update \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$INTENT_PRODUCER_APP" \
            --set-env-vars \
              RUN_BOT_ON_STARTUP=true \
              FUNDED_DIRECT_SERVICE_BUS_ENABLED=true \
            --only-show-errors \
            -o none
          producer_revision=$(az containerapp show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$INTENT_PRODUCER_APP" \
            --query properties.latestRevisionName -o tsv)
          test -n "$producer_revision"
          producer_enabled=false
          for attempt in $(seq 1 36); do
            az containerapp revision list \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --name "$INTENT_PRODUCER_APP" \
              -o json > producer-revisions-enabled.json
            if jq -e --arg revision "$producer_revision" '
              ([.[] | select(.properties.active == true)] | length) == 1
              and ([.[] | select(.properties.active == true)][0].name == $revision)
              and ([.[] | select(.name == $revision)] | length) == 1
              and ([.[] | select(.name == $revision)][0].properties.healthState == "Healthy")
              and ([.[] | select(.name == $revision)][0].properties.replicas >= 1)
            ' producer-revisions-enabled.json >/dev/null; then
              producer_enabled=true
              break
            fi
            sleep 5
          done
          test "$producer_enabled" = true
          az containerapp show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$INTENT_PRODUCER_APP" \
            -o json > intent-producer-enabled.json
          producer_enabled_env() {
            jq -er --arg name "$1" '
              [.properties.template.containers[0].env[]
                | select(.name == $name) | .value]
              | if length == 1 then .[0]
                else error("expected one producer environment value for " + $name)
                end
            ' intent-producer-enabled.json
          }
          test "$(producer_enabled_env RUN_BOT_ON_STARTUP)" = "true"
          test "$(producer_enabled_env STRATEGY_INTENT_OPERATOR_DIRECT)" = "true"
          test "$(producer_enabled_env FUNDED_DIRECT_SERVICE_BUS_ENABLED)" = "true"
          az containerapp revision list \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$INTENT_PRODUCER_APP" \
            -o json > producer-revisions-after-reopen.json
          jq -e --arg revision "$producer_revision" '
            ([.[] | select(.properties.active == true)] | length) == 1
            and ([.[] | select(.properties.active == true)][0].name == $revision)
          ' producer-revisions-after-reopen.json
          az containerapp show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$INTENT_PRODUCER_APP" \
            -o json | jq -e --arg revision "$producer_revision" \
              --arg image "${{ steps.images.outputs.producer_reference }}" '
              .properties.latestRevisionName == $revision
              and .properties.latestReadyRevisionName == $revision
              and .properties.template.containers[0].image == $image
            ' >/dev/null
          test "$(az containerapp show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$FUNDED_APP" \
            --query properties.latestRevisionName -o tsv)" = "$funded_revision"
          test "$(az containerapp show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$FUNDED_APP" \
            --query properties.latestReadyRevisionName -o tsv)" = "$funded_revision"
          lifecycle_ready=false
          # Observe up to six 15-minute markets; warmup is not proof of a qualifying Place intent.
          monotonic_seconds() {
            python3 -c 'import time; print(int(time.monotonic()))'
          }
          lifecycle_signal_deadline_monotonic=$(( $(monotonic_seconds) + 5400 ))
          lifecycle_ingestion_deadline_monotonic=$(( lifecycle_signal_deadline_monotonic + 300 ))
          queue_fenced_for_ingestion=false
          sleep_before_lifecycle_deadline() {
            local remaining=$(( lifecycle_ingestion_deadline_monotonic - $(monotonic_seconds) ))
            [ "$remaining" -gt 0 ] || return 1
            [ "$remaining" -le 10 ] || remaining=10
            sleep "$remaining"
          }
          while [ "$(monotonic_seconds)" -lt "$lifecycle_ingestion_deadline_monotonic" ]; do
            if [ "$(monotonic_seconds)" -ge "$lifecycle_signal_deadline_monotonic" ] && \
              [ "$queue_fenced_for_ingestion" = false ]; then
              bash scripts/fence-funded-queue-and-wait-empty.sh \
                funded-queue-ingestion-grace.json
              queue_fenced_for_ingestion=true
            fi
            if ! az monitor log-analytics query \
              --workspace "$workspace_customer_id" \
              --analytics-query "ContainerAppConsoleLogs_CL
                | where ContainerAppName_s == '$FUNDED_APP'
                | where RevisionName_s == '$funded_revision'
                | where TimeGenerated >= datetime($producer_enabled_at)
                | extend record = parse_json(Log_s)
                | where tostring(record.schema) == 'polyedge.funded_direct_latency.v1'
                | where tostring(record.status) == 'intent_completed'
                | where tobool(record.order_submission_attempted) == true
                | where tobool(record.order_submitted) == true
                | where tostring(record.worker_status) == 'persistent_intent_completed'
                | where todouble(record.signal_to_send_ms) <= todouble(record.signal_to_send_slo_ms)
                | where tolong(record.signal_to_send_slo_ms) == 7000
                | top 1 by TimeGenerated asc
                | project TimeGenerated, Log_s" \
              -o json > funded-v10-lifecycle-latency.json; then
              sleep_before_lifecycle_deadline || break
              continue
            fi
            if jq -e '
              length == 1
              and (.[0].Log_s | fromjson
                | (.decision_id | test("^[0-9a-f]{64}$"))
                and .status == "intent_completed"
                and .order_submission_attempted == true
                and .order_submitted == true
                and .worker_status == "persistent_intent_completed"
                and (.signal_to_send_ms | type == "number")
                and .signal_to_send_ms <= .signal_to_send_slo_ms
                and .signal_to_send_slo_ms == 7000)
            ' funded-v10-lifecycle-latency.json >/dev/null; then
              lifecycle_ready=true
              break
            fi
            sleep_before_lifecycle_deadline || break
          done
          test "$lifecycle_ready" = true
          if [ "$queue_fenced_for_ingestion" = false ]; then
            bash scripts/fence-funded-queue-and-wait-empty.sh \
              funded-queue-after-lifecycle.json
            queue_fenced_for_ingestion=true
          fi
          decision_id=$(jq -r '.[0].Log_s | fromjson | .decision_id' funded-v10-lifecycle-latency.json)
          . scripts/verify-funded-v10-capital.sh
          az containerapp show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$FUNDED_APP" \
            -o json > funded-v10-live-app.json
          funded_env() {
            jq -r --arg name "$1" \
              '.properties.template.containers[0].env[] | select(.name == $name) | .value' \
              funded-v10-live-app.json
          }
          control_prefix=$(funded_env FUNDED_DIRECT_CONTROL_PREFIX)
          intent_container=$(funded_env STRATEGY_CANARY_INTENT_CONTAINER_NAME)
          intent_prefix=$(funded_env STRATEGY_CANARY_INTENT_PREFIX)
          test "$control_prefix" = "reports/funded/dynamic-quote"
          test -n "$intent_container"
          test "$intent_prefix" = "reports/research/venue-probe/control/strategy-canary/intents"
          authorization_blob="$control_prefix/sessions/dynamic-quote-funded-2026-08-13-v10/authorizations/$decision_id.json"
          completion_blob="$control_prefix/sessions/dynamic-quote-funded-2026-08-13-v10/completed/$decision_id.json"
          download_v10_blob() {
            local blob_name=$1 output_file=$2 error_file
            error_file=$(mktemp)
            for attempt in 1 2 3; do
              if az storage blob download \
                  --account-name "$STORAGE_ACCOUNT" \
                  --container-name "$FUNDED_CONTAINER" \
                  --name "$blob_name" \
                  --file "$output_file" \
                  --auth-mode login \
                  --overwrite \
                  --only-show-errors -o none 2>"$error_file"; then
                rm -f -- "$error_file"
                return 0
              fi
              [ "$attempt" = 3 ] || sleep "$((attempt * 5))"
            done
            if grep -Fq "BlobNotFound" "$error_file"; then
              rm -f -- "$error_file"
              return 2
            fi
            rm -f -- "$error_file"
            return 1
          }
          download_v10_blob "$authorization_blob" funded-v10-authorization.json
          authorization_sha256="sha256:$(sha256sum funded-v10-authorization.json | cut -d' ' -f1)"
          download_v10_blob "$completion_blob" funded-v10-completion.json
          jq -e --arg decision "$decision_id" --arg authorization_blob "$authorization_blob" --arg authorization_sha "$authorization_sha256" '
            .schema == "polyedge.operator_funded_intent_completion.v1"
            and .session_id == "dynamic-quote-funded-2026-08-13-v10"
            and .decision_id == $decision
            and .authorization_blob_name == $authorization_blob
            and .authorization_sha256 == $authorization_sha
            and .status == "child_completed"
            and .order_submission_attempted == true
            and .authorization_consumed == true
            and .risk_reservation_created == true
            and (.child_run_id | type == "string" and length > 0)
          ' funded-v10-completion.json
          child_run_id=$(jq -r '.child_run_id' funded-v10-completion.json)
          [[ "$child_run_id" =~ ^funded-direct-[0-9]{17}-[0-9a-f]{8}$ ]]
          jq -e --arg decision "$decision_id" --arg run "$child_run_id" --arg authorization_blob "$authorization_blob" --arg authorization_sha "$authorization_sha256" '
            .schema == "polyedge.operator_funded_intent_authorization.v1"
            and .authorization_mode == "operator_direct"
            and .session_id == "dynamic-quote-funded-2026-08-13-v10"
            and .decision_id == $decision
            and .child_run_id == $run
            and .promotion_manifest_blob_name == "reports/funded/dynamic-quote/sessions/dynamic-quote-funded-2026-08-13-v10/session.json"
            and .promotion_manifest_sha256 == "sha256:c516c052fc5c01eed5403842ff24bf4b08512d6c38e8260e2d064580c82322f8"
            and .operator_session_manifest_blob_name == .promotion_manifest_blob_name
            and .operator_session_manifest_sha256 == .promotion_manifest_sha256
            and .research_promotion_bypassed == true
            and .max_order_notional == 10.5
            and (.authorization_id | type == "string" and length > 0)
            and (.intent_blob_name | type == "string")
            and (.intent_sha256 | test("^sha256:[0-9a-f]{64}$"))
          ' funded-v10-authorization.json
          intent_blob=$(jq -r '.intent_blob_name' funded-v10-authorization.json)
          intent_sha256=$(jq -r '.intent_sha256' funded-v10-authorization.json)
          authorization_id=$(jq -r '.authorization_id' funded-v10-authorization.json)
          test "$intent_blob" = "$intent_prefix/$decision_id.json"
          az storage blob download \
            --account-name "$STORAGE_ACCOUNT" \
            --container-name "$intent_container" \
            --name "$intent_blob" \
            --file funded-v10-intent.json \
            --auth-mode login \
            --overwrite \
            --only-show-errors -o none
          test "$intent_sha256" = "sha256:$(sha256sum funded-v10-intent.json | cut -d' ' -f1)"
          node .github/workflows/verify-funded-v10-intent.mjs \
            --verify funded-v10-intent.json "$decision_id"
          intent_market=$(jq -er '.market_id | tostring' funded-v10-intent.json)
          intent_market_end_ts=$(jq -er '.market_end_ts | select(type == "string")' funded-v10-intent.json)
          lifecycle_completed_at=$(jq -er '.[0].TimeGenerated | select(type == "string")' \
            funded-v10-lifecycle-latency.json)
          node - funded-v10-intent.json <<'NODE'
          const assert = require("node:assert/strict");
          const fs = require("node:fs");
          const intent = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          const decisionAt = Date.parse(intent.decision_ts);
          const validUntil = Date.parse(intent.valid_until);
          const marketEnd = Date.parse(intent.market_end_ts);
          assert.ok(Number.isFinite(decisionAt) && Number.isFinite(validUntil) && Number.isFinite(marketEnd));
          assert.equal(intent.ttl_ms, 15_000);
          assert.equal(validUntil, decisionAt + intent.ttl_ms);
          assert.ok(marketEnd - decisionAt >= 360_000 && marketEnd - decisionAt <= 900_000,
            "funded intent is outside the configured market-expiry window");
          assert.ok(validUntil < marketEnd, "funded intent outlives its exact market");
          NODE
          if [ "$intent_market" != "$warmup_market" ]; then
            rollover_ready=false
            for attempt in $(seq 1 18); do
              az monitor log-analytics query \
                --workspace "$workspace_customer_id" \
                --analytics-query "ContainerAppConsoleLogs_CL
                  | where ContainerAppName_s == '$FUNDED_APP'
                  | where RevisionName_s == '$funded_revision'
                  | where TimeGenerated >= datetime($producer_enabled_at)
                  | where TimeGenerated <= datetime($lifecycle_completed_at)
                  | extend record = parse_json(Log_s)
                  | where tostring(record.status) == 'market_warmed'
                  | where tostring(record.market_id) == '$intent_market'
                  | top 1 by TimeGenerated desc
                  | project TimeGenerated, Log_s" \
                -o json > funded-v10-rollover-warmup.json || { sleep 10; continue; }
              rollover_warmup_time=$(jq -r '.[0].TimeGenerated // ""' \
                funded-v10-rollover-warmup.json)
              if [ -z "$rollover_warmup_time" ]; then
                sleep 10
                continue
              fi
              az monitor log-analytics query \
                --workspace "$workspace_customer_id" \
                --analytics-query "ContainerAppConsoleLogs_CL
                  | where ContainerAppName_s == '$FUNDED_APP'
                  | where RevisionName_s == '$funded_revision'
                  | where TimeGenerated >= datetime($rollover_warmup_time)
                  | where TimeGenerated <= datetime($lifecycle_completed_at)
                  | extend record = parse_json(Log_s)
                  | where tostring(record.status) == 'persistent_service_heartbeat'
                  | where tostring(record.executor.warmed_market.market_id) == '$intent_market'
                  | where todatetime(record.executor.warmed_market.market_end_ts) == datetime($intent_market_end_ts)
                  | top 1 by TimeGenerated desc
                  | project Log_s" \
                -o json > funded-v10-rollover-heartbeat.json || { sleep 10; continue; }
              if jq -e '
                length == 1
                and (.[0].Log_s | fromjson
                  | .executor.user_channel_ready == true
                  and .executor.market_channel_ready == true
                  and .executor.safety_snapshot_cache_ready == true
                  and .executor.safety_snapshot_cache_error == null
                  and .executor.reconnect_reconciliation_required == false
                  and .executor.user_channel_gaps == 0
                  and .executor.market_channel_gaps == 0)
              ' funded-v10-rollover-heartbeat.json >/dev/null; then
                rollover_ready=true
                break
              fi
              sleep 10
            done
            test "$rollover_ready" = true
          fi
          consumption_blob="reports/research/venue-probe/control/strategy-canary/consumed/$authorization_id.json"
          az storage blob download \
            --account-name "$STORAGE_ACCOUNT" \
            --container-name "$FUNDED_CONTAINER" \
            --name "$consumption_blob" \
            --file funded-v10-authorization-consumption.json \
            --auth-mode login \
            --overwrite \
            --only-show-errors -o none
          jq -e --arg authorization_id "$authorization_id" --arg authorization_sha "$authorization_sha256" --arg decision "$decision_id" --arg run "$child_run_id" '
            .schema == "polyedge.strategy_canary_authorization_consumption.v1"
            and .authorization_id == $authorization_id
            and .authorization_sha256 == $authorization_sha
            and .decision_id == $decision
            and .run_id == $run
          ' funded-v10-authorization-consumption.json
          authorization_at=$(jq -er '.authorized_at | select(type == "string")' funded-v10-authorization.json)
          completion_at=$(jq -er '.completed_at | select(type == "string")' funded-v10-completion.json)
          authorization_day=$(date -u -d "$authorization_at" +%Y-%m-%d)
          completion_day=$(date -u -d "$completion_at" +%Y-%m-%d)
          mapfile -t artifact_days < <(printf '%s\n' "$authorization_day" "$completion_day" | sort -u)
          test "${#artifact_days[@]}" -ge 1
          test "${#artifact_days[@]}" -le 2
          reservation_matches=0
          reservation_blob=
          reservation_file=
          for artifact_day in "${artifact_days[@]}"; do
            [[ "$artifact_day" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]
            candidate_blob="reports/research/venue-probe/risk-reservations/${artifact_day}/funded-direct-${decision_id}.json"
            candidate_file="funded-v10-risk-reservation-${artifact_day}.json"
            if download_v10_blob "$candidate_blob" "$candidate_file"; then
              reservation_matches=$((reservation_matches + 1))
              reservation_blob=$candidate_blob
              reservation_file=$candidate_file
            else
              candidate_status=$?
              test "$candidate_status" = 2 || exit "$candidate_status"
            fi
          done
          test "$reservation_matches" = 1
          [[ "$reservation_blob" =~ ^reports/research/venue-probe/risk-reservations/[0-9]{4}-[0-9]{2}-[0-9]{2}/funded-direct-${decision_id}\.json$ ]]
          summary_matches=0
          summary_blob=
          summary_file=
          for artifact_day in "${artifact_days[@]}"; do
            candidate_blob="reports/research/venue-probe/runs/${artifact_day}/${child_run_id}/summary.json"
            candidate_file="funded-v10-run-summary-${artifact_day}.json"
            if download_v10_blob "$candidate_blob" "$candidate_file"; then
              summary_matches=$((summary_matches + 1))
              summary_blob=$candidate_blob
              summary_file=$candidate_file
            else
              candidate_status=$?
              test "$candidate_status" = 2 || exit "$candidate_status"
            fi
          done
          test "$summary_matches" = 1
          order_id=$(jq -r '.lifecycle.order_id // ""' "$summary_file")
          [[ "$order_id" =~ ^0x[0-9a-fA-F]{64}$ ]]
          jq -e --arg decision "$decision_id" --arg run "$child_run_id" --arg authorization_blob "$authorization_blob" --arg authorization_sha "$authorization_sha256" --arg intent_blob "$intent_blob" --arg intent_sha "$intent_sha256" --arg order_id "$order_id" '
            .schema_version == 3
            and .status == "completed"
            and .run_id == $run
            and .order_submission_attempted == true
            and .order_submitted == true
            and .provenance.decision_id == $decision
            and .provenance.authorization_kind == "operator_direct"
            and .provenance.operator_session_id == "dynamic-quote-funded-2026-08-13-v10"
            and .provenance.research_promotion_bypassed == true
            and .provenance.authorization_blob_name == $authorization_blob
            and .provenance.authorization_sha256 == $authorization_sha
            and .provenance.intent_blob_name == $intent_blob
            and .provenance.intent_sha256 == $intent_sha
            and .order.current_funds_scaled == true
            and .order.source_requested_notional > .order.notional
            and .order.source_requested_notional <= 10.5
            and .order.notional < 10.5
            and .lifecycle.order_id == $order_id
          ' "$summary_file"
          jq -e --arg decision "$decision_id" --arg run "$child_run_id" --arg order_id "$order_id" '
            .schema_version == 1
            and .campaign_id == "dynamic-quote-funded-2026-08-13-v10"
            and .run_id == $run
            and .probe_id == ("funded-direct-" + $decision)
            and .order_submitted == true
            and .order_id == $order_id
          ' "$reservation_file"
          {
            printf 'FUNDED_LIFECYCLE_DECISION_ID=%s\n' "$decision_id"
            printf 'FUNDED_LIFECYCLE_CHILD_RUN_ID=%s\n' "$child_run_id"
            printf 'FUNDED_LIFECYCLE_ORDER_ID=%s\n' "$order_id"
            printf 'FUNDED_LIFECYCLE_RESERVATION_BLOB=%s\n' "$reservation_blob"
          } >> "$GITHUB_ENV"
          trap - EXIT

      - name: Refresh Azure login before terminal reservation verification
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Wait for the exact terminal v10 reservation before cutover
        run: |
          set -euo pipefail
          readonly decision_id="${FUNDED_LIFECYCLE_DECISION_ID:?}"
          readonly child_run_id="${FUNDED_LIFECYCLE_CHILD_RUN_ID:?}"
          readonly order_id="${FUNDED_LIFECYCLE_ORDER_ID:?}"
          readonly reservation_blob="${FUNDED_LIFECYCLE_RESERVATION_BLOB:?}"
          readonly dlq_before="${FUNDED_CUTOVER_DLQ_BEFORE:?}"
          [[ "$decision_id" =~ ^[0-9a-f]{64}$ ]]
          [[ "$child_run_id" =~ ^funded-direct-[0-9]{17}-[0-9a-f]{8}$ ]]
          [[ "$order_id" =~ ^0x[0-9a-fA-F]{64}$ ]]
          [[ "$dlq_before" =~ ^[0-9]+$ ]]
          [[ "$reservation_blob" =~ ^reports/research/venue-probe/risk-reservations/[0-9]{4}-[0-9]{2}-[0-9]{2}/funded-direct-${decision_id}\.json$ ]]
          terminal_reservation_ready=false
          monotonic_seconds() {
            python3 -c 'import time; print(int(time.monotonic()))'
          }
          terminal_deadline_monotonic=$(( $(monotonic_seconds) + 2400 ))
          sleep_before_terminal_deadline() {
            local remaining=$(( terminal_deadline_monotonic - $(monotonic_seconds) ))
            [ "$remaining" -gt 0 ] || return 1
            [ "$remaining" -le 10 ] || remaining=10
            sleep "$remaining"
          }
          while [ "$(monotonic_seconds)" -lt "$terminal_deadline_monotonic" ]; do
            if ! az storage blob download \
              --account-name "$STORAGE_ACCOUNT" \
              --container-name "$FUNDED_CONTAINER" \
              --name "$reservation_blob" \
              --file funded-v10-terminal-risk-reservation.json \
              --auth-mode login \
              --overwrite \
              --only-show-errors -o none; then
              sleep_before_terminal_deadline || break
              continue
            fi
            jq -e --arg decision "$decision_id" --arg run "$child_run_id" --arg order_id "$order_id" '
              .schema_version == 1
              and .campaign_id == "dynamic-quote-funded-2026-08-13-v10"
              and .run_id == $run
              and .probe_id == ("funded-direct-" + $decision)
              and .order_submitted == true
              and .order_id == $order_id
            ' funded-v10-terminal-risk-reservation.json >/dev/null
            if jq -e '
              (.state == "finalized_no_fill"
                and .matched_notional == 0
                and .reconciliation_complete == true
                and .zero_open_orders_confirmed == true)
              or
              (.state == "position_settled"
                and .matched_notional > 0
                and .settlement_verified == true
                and (.settlement_evidence_source == "verified_onchain_redemption"
                  or .settlement_evidence_source == "polymarket_data_api_redeemable"))
            ' funded-v10-terminal-risk-reservation.json >/dev/null; then
              terminal_reservation_ready=true
              break
            fi
            sleep_before_terminal_deadline || break
          done
          test "$terminal_reservation_ready" = true
          az servicebus queue show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --namespace-name "$SERVICE_BUS_NAMESPACE" \
            --name "$SERVICE_BUS_QUEUE" \
            -o json > funded-queue-after-lifecycle.json
          test "$(jq -r '.status' funded-queue-after-lifecycle.json)" = "SendDisabled"
          test "$(jq -r '.countDetails.activeMessageCount' funded-queue-after-lifecycle.json)" = "0"
          test "$(jq -r '.countDetails.scheduledMessageCount' funded-queue-after-lifecycle.json)" = "0"
          test "$(jq -r '.countDetails.deadLetterMessageCount' funded-queue-after-lifecycle.json)" = "$dlq_before"
          az servicebus queue update \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --namespace-name "$SERVICE_BUS_NAMESPACE" \
            --name "$SERVICE_BUS_QUEUE" \
            --status Active \
            --only-show-errors -o none
          test "$(az servicebus queue show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --namespace-name "$SERVICE_BUS_NAMESPACE" \
            --name "$SERVICE_BUS_QUEUE" \
            --query status -o tsv)" = "Active"
          echo "FUNDED_CUTOVER_COMPLETE=true" >> "$GITHUB_ENV"

      - name: Restore the dormant funded service after an incomplete cutover
        if: ${{ always() && (env.FUNDED_QUEUE_FENCE_REQUESTED == 'true' || env.FUNDED_QUEUE_FENCED == 'true' || env.FUNDED_POINTER_PREFLIGHT_REQUESTED == 'true') && env.FUNDED_CUTOVER_COMPLETE != 'true' }}
        run: |
          set -euo pipefail
          queue_fenced=false
          for attempt in 1 2 3; do
            if az servicebus queue update \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --namespace-name "$SERVICE_BUS_NAMESPACE" \
              --name "$SERVICE_BUS_QUEUE" \
              --status SendDisabled \
              --only-show-errors -o none; then
              queue_fenced=true
              break
            fi
            sleep "$((attempt * 10))"
          done
          test "$queue_fenced" = true
          test "$(az servicebus queue show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --namespace-name "$SERVICE_BUS_NAMESPACE" \
            --name "$SERVICE_BUS_QUEUE" --query status -o tsv)" = "SendDisabled"
          if [ "${FUNDED_POINTER_PREFLIGHT_REQUESTED:-false}" = true ]; then
            producer_cleanup_updated=false
            for attempt in 1 2 3; do
              if az containerapp update \
                --resource-group "$AZURE_RESOURCE_GROUP" \
                --name "$INTENT_PRODUCER_APP" \
                --remove-env-vars STRATEGY_INTENT_POINTER_ONLY_PREFLIGHT \
                --set-env-vars \
                  RUN_BOT_ON_STARTUP=true \
                  FUNDED_DIRECT_SERVICE_BUS_ENABLED=true \
                  FUNDED_DIRECT_SERVICE_BUS_NAMESPACE="$SERVICE_BUS_NAMESPACE" \
                  FUNDED_DIRECT_SERVICE_BUS_QUEUE="$SERVICE_BUS_QUEUE" \
                --only-show-errors -o none; then
                producer_cleanup_updated=true
                break
              fi
              sleep "$((attempt * 10))"
            done
            test "$producer_cleanup_updated" = true
          fi
          producer_restored=false
          for attempt in $(seq 1 36); do
            az containerapp revision list \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --name "$INTENT_PRODUCER_APP" \
              -o json > producer-revisions-restored.json
            if restored_producer_revision=$(jq -er '
              [.[] | select(.properties.active == true)] as $active
              | if ($active | length) == 1
                  and $active[0].properties.healthState == "Healthy"
                  and $active[0].properties.replicas >= 1
                then $active[0].name
                else error("expected one active healthy producer revision")
                end
            ' producer-revisions-restored.json); then
              producer_restored=true
              break
            fi
            sleep 5
          done
          test "$producer_restored" = true
          az containerapp revision show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$INTENT_PRODUCER_APP" \
            --revision "$restored_producer_revision" \
            --only-show-errors \
            -o json > intent-producer-restored.json
          restored_producer_env() {
            jq -er --arg name "$1" '
              [.properties.template.containers[0].env[]
                | select(.name == $name) | .value]
              | if length == 1 then .[0]
                else error("expected one restored producer environment value for " + $name)
                end
            ' intent-producer-restored.json
          }
          test "$(restored_producer_env RUN_BOT_ON_STARTUP)" = "true"
          test "$(restored_producer_env STRATEGY_INTENT_OPERATOR_DIRECT)" = "true"
          test "$(restored_producer_env FUNDED_DIRECT_SERVICE_BUS_ENABLED)" = "true"
          test "$(restored_producer_env FUNDED_DIRECT_SERVICE_BUS_NAMESPACE)" = "$SERVICE_BUS_NAMESPACE"
          test "$(restored_producer_env FUNDED_DIRECT_SERVICE_BUS_QUEUE)" = "$SERVICE_BUS_QUEUE"
          test "$(jq '[.properties.template.containers[0].env[]
            | select(.name == "STRATEGY_INTENT_POINTER_ONLY_PREFLIGHT")] | length' \
            intent-producer-restored.json)" = "0"
          if [ -n "${FUNDED_ROLLBACK_REVISION:-}" ]; then
            test -s funded-rollback-template.json
            exact_rollback=true
            rollback_noop=false
            az containerapp revision list \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --name "$FUNDED_APP" \
              --only-show-errors -o json > funded-revisions-before-rollback-copy.json
            current_rollback_revision=$(jq -er '
              [.[] | select(.properties.active == true)]
              | if length == 1 then .[0].name
                else error("expected one active funded revision before rollback copy")
                end
            ' funded-revisions-before-rollback-copy.json) || {
              printf '%s\n' 'funded_rollback_precopy_guard_failed' >&2
              exit 1
            }
            az containerapp revision show \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --name "$FUNDED_APP" \
              --revision "$current_rollback_revision" \
              --only-show-errors -o json > funded-revision-before-rollback-copy.json
            jq -S '.properties.template' funded-revision-before-rollback-copy.json \
              > funded-template-before-rollback-copy.json
            if cmp -s funded-rollback-template.json funded-template-before-rollback-copy.json; then
              rollback_noop=true
            elif [ "$current_rollback_revision" = "${FUNDED_WORKFLOW_ACTIVE_REVISION:-}" ] \
                && test -n "${FUNDED_WORKFLOW_ACTIVE_TEMPLATE_SHA256:-}" \
                && test "sha256:$(sha256sum funded-template-before-rollback-copy.json | cut -d' ' -f1)" = \
                  "$FUNDED_WORKFLOW_ACTIVE_TEMPLATE_SHA256"; then
              rollback_command=(az containerapp revision copy \
                --resource-group "$AZURE_RESOURCE_GROUP" \
                --name "$FUNDED_APP" \
                --from-revision "$FUNDED_ROLLBACK_REVISION")
            else
              printf '%s\n' 'funded_rollback_precopy_guard_failed' >&2
              exit 1
            fi
          else
            rollback_command=(az containerapp update \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --name "$FUNDED_APP" \
              --min-replicas 0 \
              --max-replicas 1 \
              --set-env-vars \
                FUNDED_DIRECT_SERVICE_ENABLED=false \
                FUNDED_DIRECT_AUTO_REDEMPTION_ENABLED=false \
                FUNDED_DIRECT_WORKER_ENABLED=false \
                ALLOW_FUNDED_DIRECT=false \
                FUNDED_DIRECT_DRY_RUN=true \
                ALLOW_LIVE=false \
                ALLOW_STRATEGY_CANARY=false \
                ENABLE_TAKER_ORDERS=false)
            exact_rollback=false
          fi
          rollback_applied=false
          if [ "${rollback_noop:-false}" = true ]; then
            rollback_applied=true
          else
            for attempt in $(seq 1 30); do
              if "${rollback_command[@]}" --only-show-errors -o none \
                2> funded-rollback.stderr; then
                rollback_applied=true
                break
              fi
              if ! grep -Fq 'ContainerAppOperationInProgress' funded-rollback.stderr || \
                [ "$attempt" -eq 30 ]; then
                cat funded-rollback.stderr >&2
                exit 1
              fi
              sleep 10
            done
          fi
          test "$rollback_applied" = true
          test "$(az servicebus queue show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --namespace-name "$SERVICE_BUS_NAMESPACE" \
            --name "$SERVICE_BUS_QUEUE" \
            --query status -o tsv)" = "SendDisabled"
          restored_revision=""
          restored_ready=false
          for attempt in $(seq 1 60); do
            az containerapp revision list \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --name "$FUNDED_APP" \
              --only-show-errors -o json > restored-funded-revisions.json
            if ! restored_revision=$(jq -er '
              [.[] | select(.properties.active == true)]
              | if length == 1 then .[0].name
                else error("expected exactly one active funded rollback revision")
                end
            ' restored-funded-revisions.json); then
              sleep 5
              continue
            fi
            az containerapp revision show \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --name "$FUNDED_APP" \
              --revision "$restored_revision" \
              --only-show-errors -o json > restored-funded-revision.json
            if [ "$exact_rollback" = true ]; then
              jq -S '.properties.template' restored-funded-revision.json \
                > restored-funded-template.json
              if test "$(jq -r '.properties.healthState' restored-funded-revision.json)" = "Healthy" \
                  && test "$(jq -r '.properties.replicas' restored-funded-revision.json)" -ge 1 \
                  && test "sha256:$(sha256sum restored-funded-template.json | cut -d' ' -f1)" = \
                    "$FUNDED_ROLLBACK_TEMPLATE_SHA256" \
                  && cmp -s funded-rollback-template.json restored-funded-template.json; then
                restored_ready=true
                break
              fi
            else
              restored_ready=true
              break
            fi
            sleep 5
          done
          test "$restored_ready" = true
          if [ "$exact_rollback" = true ]; then
            test "${FUNDED_ROLLBACK_REOPEN_AUTHORIZED:-false}" = true
            test -s funded-rollback-template.sha256
            test "$(cat funded-rollback-template.sha256)" = "$FUNDED_ROLLBACK_TEMPLATE_SHA256"
            cmp funded-rollback-template.json restored-funded-template.json
            test "$(jq -r '.properties.active' restored-funded-revision.json)" = "true"
            jq -e --arg revision "$restored_revision" '
              ([.[] | select(.properties.active == true)] | length) == 1
              and ([.[] | select(.properties.active == true)][0].name == $revision)
              and ([.[] | select(.name == $revision)] | length) == 1
              and ([.[] | select(.name == $revision)][0].properties.healthState == "Healthy")
              and ([.[] | select(.name == $revision)][0].properties.replicas >= 1)
            ' restored-funded-revisions.json >/dev/null
            az containerapp revision list \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --name "$INTENT_PRODUCER_APP" \
              -o json > producer-revisions-before-rollback-reopen.json
            jq -e --arg revision "$restored_producer_revision" '
              ([.[] | select(.properties.active == true)] | length) == 1
              and ([.[] | select(.properties.active == true)][0].name == $revision)
              and ([.[] | select(.name == $revision)] | length) == 1
              and ([.[] | select(.name == $revision)][0].properties.healthState == "Healthy")
              and ([.[] | select(.name == $revision)][0].properties.replicas >= 1)
            ' producer-revisions-before-rollback-reopen.json >/dev/null
            az containerapp revision show \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --name "$INTENT_PRODUCER_APP" \
              --revision "$restored_producer_revision" \
              --only-show-errors \
              -o json > intent-producer-restored.json
            test "$(restored_producer_env RUN_BOT_ON_STARTUP)" = "true"
            test "$(restored_producer_env STRATEGY_INTENT_OPERATOR_DIRECT)" = "true"
            test "$(restored_producer_env FUNDED_DIRECT_SERVICE_BUS_ENABLED)" = "true"
            test "$(restored_producer_env FUNDED_DIRECT_SERVICE_BUS_NAMESPACE)" = "$SERVICE_BUS_NAMESPACE"
            test "$(restored_producer_env FUNDED_DIRECT_SERVICE_BUS_QUEUE)" = "$SERVICE_BUS_QUEUE"
            test "$(jq '[.properties.template.containers[0].env[]
              | select(.name == "STRATEGY_INTENT_POINTER_ONLY_PREFLIGHT")] | length' \
              intent-producer-restored.json)" = "0"
            test -s funded-queue-rollback-baseline.json
            az servicebus queue show \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --namespace-name "$SERVICE_BUS_NAMESPACE" \
              --name "$SERVICE_BUS_QUEUE" \
              -o json > funded-queue-before-rollback-reopen.json
            jq -e --slurpfile fenced funded-queue-rollback-baseline.json '
              .status == "SendDisabled"
              and .countDetails.activeMessageCount == $fenced[0].countDetails.activeMessageCount
              and .countDetails.scheduledMessageCount == $fenced[0].countDetails.scheduledMessageCount
              and .countDetails.deadLetterMessageCount == $fenced[0].countDetails.deadLetterMessageCount
            ' funded-queue-before-rollback-reopen.json >/dev/null
            queue_reopened=false
            for attempt in 1 2 3; do
              if az servicebus queue update \
                  --resource-group "$AZURE_RESOURCE_GROUP" \
                  --namespace-name "$SERVICE_BUS_NAMESPACE" \
                  --name "$SERVICE_BUS_QUEUE" \
                  --status Active \
                  --only-show-errors -o none; then
                queue_reopened=true
                break
              fi
              sleep "$((attempt * 10))"
            done
            test "$queue_reopened" = true
            az servicebus queue show \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --namespace-name "$SERVICE_BUS_NAMESPACE" \
              --name "$SERVICE_BUS_QUEUE" \
              -o json > funded-queue-after-rollback-reopen.json
            jq -e '.status == "Active"' \
              funded-queue-after-rollback-reopen.json >/dev/null
          else
            restored_env_value() {
              jq -er --arg name "$1" '
                [.properties.template.containers[0].env[]
                  | select(.name == $name) | .value]
                | if length == 1 and .[0] != null then .[0]
                  else error("expected exactly one non-null environment value for " + $name)
                  end
              ' restored-funded-revision.json
            }
            test "$(jq -r '.properties.template.scale.minReplicas' restored-funded-revision.json)" = "0"
            test "$(jq -r '.properties.template.scale.maxReplicas' restored-funded-revision.json)" = "1"
            for name in \
              FUNDED_DIRECT_SERVICE_ENABLED \
              FUNDED_DIRECT_AUTO_REDEMPTION_ENABLED \
              FUNDED_DIRECT_WORKER_ENABLED \
              ALLOW_FUNDED_DIRECT \
              ALLOW_LIVE \
              ALLOW_STRATEGY_CANARY \
              ENABLE_TAKER_ORDERS; do
              test "$(restored_env_value "$name")" = "false"
            done
            test "$(restored_env_value FUNDED_DIRECT_DRY_RUN)" = "true"
          fi
