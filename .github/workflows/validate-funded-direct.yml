            "pointer_preflight_cutoff_epoch=$(date -u +%s)", pointerPreflightDeployment);
          const pointerSnapshot = workflow.indexOf("pointer-before-preflight.json", cutoff);
          const workerStart = workflow.indexOf("- name: Run the zero-write v10 preflight", pointerSnapshot);
          const workerStepEnd = workflow.indexOf("\n      - name:", workerStart + 1);
          assertOrdered(workerStart, workerStepEnd);
          const workerStep = workflow.slice(workerStart, workerStepEnd);
          assert.match(workerStep,
            /readonly v5_etag_before="\$\{PREFLIGHT_V5_ETAG_BEFORE:\?\}"[\s\S]*readonly intent_container="\$\{PREFLIGHT_INTENT_CONTAINER:\?\}"[\s\S]*readonly intent_prefix="\$\{PREFLIGHT_INTENT_PREFIX:\?\}"/);
          const pointerAfter = workflow.indexOf("pointer-after-preflight.json", workerStart);
          const queueInvariance = workflow.indexOf(
            "funded-queue-after-pointer-preflight.snapshot.json", pointerAfter);
          assertOrdered(exactIntentProof, queueInvariance);
          assertOrdered(pointerPreflight, cutoff, pointerSnapshot, workerStart);
          assertOrdered(workerStart, pointerAfter, queueInvariance);
          assert.match(workflow, /pointer_after_etag[\s\S]*pointer_before_etag/);
          const activationStart = workflow.lastIndexOf("- name: Pause producer and warm funded intent");
          const activationEnd = workflow.lastIndexOf("- name: Restore the dormant funded service");
          assertOrdered(activationStart, activationEnd);
          const activation = workflow.slice(activationStart, activationEnd);
          const pause = activation.indexOf("RUN_BOT_ON_STARTUP=false");
          const active = activation.indexOf("--status Active", pause);
          const warmupStep = activation.indexOf('--name "$FUNDED_WARMUP_JOB"', active);
          const ready = activation.indexOf('test "$warmup_ready" = true', warmupStep);
          const enable = activation.indexOf("RUN_BOT_ON_STARTUP=true", ready);
          const first = activation.indexOf("top 1 by TimeGenerated asc", enable);
          assertOrdered(pause, active, warmupStep, ready, enable, first);
          assert.match(activation, /signal_to_send_ms <= \.signal_to_send_slo_ms/);
          assert.match(activation, /where tobool\(record\.order_submitted\) == true/);
          assert.match(activation,
            /lifecycle_signal_deadline_monotonic=.*\+ 5400[\s\S]*lifecycle_ingestion_deadline_monotonic=.*\+ 300[\s\S]*queue_fenced_for_ingestion=false[\s\S]*fence-funded-queue-and-wait-empty\.sh[\s\S]*funded-v10-lifecycle-latency\.json/);
          const ingestionFence = fs.readFileSync("scripts/fence-funded-queue-and-wait-empty.sh", "utf8");
          assert.match(ingestionFence,
            /for attempt in 1 2 3[\s\S]*--status SendDisabled[\s\S]*for attempt in \$\(seq 1 36\)[\s\S]*activeMessageCount == 0[\s\S]*scheduledMessageCount == 0[\s\S]*test "\$queue_drained" = true/);
          const lifecycleAccepted = activation.indexOf('test "$lifecycle_ready" = true');
          const postLifecycleFence = activation.indexOf(
            "funded-queue-after-lifecycle.json", lifecycleAccepted);
          const capitalVerification = activation.indexOf(
            ". scripts/verify-funded-v10-capital.sh", postLifecycleFence);
          const authorizationDownload = activation.indexOf(
            'download_v10_blob "$authorization_blob" funded-v10-authorization.json',
            capitalVerification);
          for (const index of [
            lifecycleAccepted,
            postLifecycleFence,
            capitalVerification,
            authorizationDownload
          ]) assert.ok(index >= 0);
          assertOrdered(lifecycleAccepted, postLifecycleFence,
            capitalVerification, authorizationDownload);
          assert.match(activation, /funded-v10-rollover-warmup\.json/);
          assert.match(activation, /funded-v10-rollover-heartbeat\.json/);
          assert.match(activation,
            /download_v10_blob\(\)[\s\S]*for attempt in 1 2 3[\s\S]*download_v10_blob "\$authorization_blob" funded-v10-authorization\.json[\s\S]*download_v10_blob "\$completion_blob" funded-v10-completion\.json/);
          assert.match(activation, /TimeGenerated <= datetime\(\$lifecycle_completed_at\)/);
          assert.match(activation,
            /authorization_day=\$\(date -u -d "\$authorization_at" \+%Y-%m-%d\)/);
          assert.match(activation,
            /completion_day=\$\(date -u -d "\$completion_at" \+%Y-%m-%d\)/);
          assert.match(activation,
            /mapfile -t artifact_days < <\(printf '%s\\n' "\$authorization_day" "\$completion_day" \| sort -u\)/);
          assert.match(activation,
            /candidate_blob="reports\/research\/venue-probe\/risk-reservations\/\$\{artifact_day\}\/funded-direct-\$\{decision_id\}\.json"/);
          assert.match(activation,
            /candidate_blob="reports\/research\/venue-probe\/runs\/\$\{artifact_day\}\/\$\{child_run_id\}\/summary\.json"/);
          assert.match(activation, /test "\$reservation_matches" = 1/);
          assert.match(activation, /test "\$summary_matches" = 1/);
          assert.match(activation,
            /\.order\.source_requested_notional > \.order\.notional[\s\S]*\.order\.source_requested_notional <= 10\.5/);
          assert.equal(activation.includes("az storage blob exists"), false);
          assert.equal((activation.match(
            /if download_v10_blob "\$candidate_blob" "\$candidate_file"; then/g) || []).length, 2);
          assert.equal((activation.match(/candidate_status=\$\?/g) || []).length, 2);
          assert.equal((activation.match(
            /test "\$candidate_status" = 2 \|\| exit "\$candidate_status"/g) || []).length, 2);
          assert.match(activation, /grep -Fq "BlobNotFound" "\$error_file"/);
          assert.equal(activation.includes("--num-results '*'"), false);
          const lifecycleLogin = activation.indexOf("Refresh Azure login before submitted v10 lifecycle");
          const childRunValidation = activation.indexOf(
            '[[ "$child_run_id" =~ ^funded-direct-[0-9]{17}-[0-9a-f]{8}$ ]]', lifecycleLogin);
          const reservationValidation = activation.indexOf(
            '[[ "$reservation_blob" =~ ^reports/research/venue-probe/risk-reservations/', childRunValidation);
          const terminalLogin = activation.indexOf(
            "Refresh Azure login before terminal reservation verification", reservationValidation);
          const safeHandoff = activation.indexOf(
            "printf 'FUNDED_LIFECYCLE_DECISION_ID=%s\\n'", reservationValidation);
          const terminalLoop = activation.indexOf(
            "terminal_deadline_monotonic=$(( $(monotonic_seconds) + 2400 ))", terminalLogin);
          const terminalIdentity = activation.indexOf(".schema_version == 1", terminalLoop);
          const terminalProof = activation.indexOf('test "$terminal_reservation_ready" = true', terminalLoop);
          const terminalPredicate = activation.indexOf('.state == "position_settled"', terminalLoop);
          const queueReopen = activation.lastIndexOf("--status Active");
          const cutoverComplete = activation.indexOf("FUNDED_CUTOVER_COMPLETE=true", queueReopen);
          assertOrdered(lifecycleLogin, childRunValidation, reservationValidation);
          assertOrdered(reservationValidation, safeHandoff, terminalLogin);
          assertOrdered(terminalLogin, terminalLoop, terminalIdentity,
            terminalPredicate, terminalProof, queueReopen, cutoverComplete);
          const terminalStep = activation.slice(terminalLoop);
          assert.match(terminalStep, /\.schema_version == 1[\s\S]*\.campaign_id == "dynamic-quote-funded-2026-08-13-v10"[\s\S]*\.run_id == \$run[\s\S]*\.probe_id == \("funded-direct-" \+ \$decision\)[\s\S]*\.order_submitted == true[\s\S]*\.order_id == \$order_id/);
          assert.match(activation, /\.state == "finalized_no_fill"[\s\S]*\.state == "position_settled"[\s\S]*settlement_evidence_source == "verified_onchain_redemption"[\s\S]*settlement_evidence_source == "polymarket_data_api_redeemable"/);
          assert.equal(activation.includes('echo "FUNDED_LIFECYCLE_'), false);
          assert.equal(activation.includes("for attempt in $(seq 1 360); do"), false);
          const legacyPreflightLoop = ["for attempt in $(seq 1 ", "1200); do"].join("");
          assert.equal(workflow.includes(legacyPreflightLoop), false);
          const waitBounds = Object.fromEntries([...workflow.matchAll(
            /(capital_reconcile|preflight|lifecycle_signal|terminal)_deadline_monotonic=\$\(\( \$\(monotonic_seconds\) \+ ([0-9]+) \)\)/g
          )].map((match) => [match[1].replace("_signal", ""), Number(match[2])]));
          assert.deepEqual(waitBounds,
            { capital_reconcile: 900, preflight: 5700, lifecycle: 5400, terminal: 2400 });
          assert.equal((workflow.match(/python3 -c 'import time; print\(int\(time\.monotonic\(\)\)\)'/g) || []).length, 4);
          assert.ok(Object.values(waitBounds).reduce((sum, value) => sum + value, 0) <= 240 * 60);
          const rollback = workflow.slice(
            workflow.lastIndexOf("- name: Restore the dormant funded service"));
          assert.match(rollback,
            /if: \$\{\{ always\(\) &&[\s\S]*FUNDED_CUTOVER_COMPLETE != 'true'/);
          assert.match(rollback,
            /for attempt in \$\(seq 1 30\); do[\s\S]*ContainerAppOperationInProgress[\s\S]*sleep 10/);
          assert.match(rollback,
            /cmp funded-rollback-template\.json restored-funded-template\.json[\s\S]*properties\.active == true/);
          assert.equal(rollback.includes("az containerapp revision deactivate"), false);
          assert.equal(rollback.includes("latestReadyRevisionName"), false);
          assert.equal(rollback.includes("latestRevisionName"), false);
          assert.match(rollback,
            /FUNDED_WORKFLOW_ACTIVE_REVISION[\s\S]*FUNDED_WORKFLOW_ACTIVE_TEMPLATE_SHA256[\s\S]*funded_rollback_precopy_guard_failed/);
          assert.match(rollback,
            /producer-revisions-restored\.json[\s\S]*\[\.\[\] \| select\(\.properties\.active == true\)\] as \$active[\s\S]*az containerapp revision show[\s\S]*--revision "\$restored_producer_revision"/);
          assert.match(rollback,
            /properties\.healthState == "Healthy"[\s\S]*producer-revisions-before-rollback-reopen\.json[\s\S]*funded-queue-before-rollback-reopen\.json[\s\S]*--status Active[\s\S]*funded-queue-after-rollback-reopen\.json/);
          const exactRollbackStart = rollback.indexOf('if [ "$exact_rollback" = true ]');
          const fallbackRollbackStart = rollback.indexOf("\n          else", exactRollbackStart);
          assertOrdered(exactRollbackStart, fallbackRollbackStart);
          const exactRollback = rollback.slice(exactRollbackStart, fallbackRollbackStart);
          const fallbackRollback = rollback.slice(fallbackRollbackStart);
          assertOrdered(
            exactRollback.indexOf("cmp funded-rollback-template.json"),
            exactRollback.indexOf("--status Active")
          );
          const postRollbackReopen = exactRollback.slice(
            exactRollback.indexOf("--status Active"),
            exactRollback.length);
          assert.equal(postRollbackReopen.includes("activeMessageCount"), false);
          assert.equal(postRollbackReopen.includes("scheduledMessageCount"), false);
          assert.equal(postRollbackReopen.includes("deadLetterMessageCount"), false);
          assert.equal(fallbackRollback.includes("--status Active"), false);
          for (const retry of [
            "-o json > funded-preflight-logs.json || { sleep 10; continue; }",
            "--query '[0].Count' -o tsv) || { sleep 10; continue; }",
            "-o json > funded-heartbeat-final.json || { sleep 10; continue; }",
            "-o json > funded-warmup-after-reopen.json || { sleep 5; continue; }",
            "-o json > funded-heartbeat-after-reopen.json || { sleep 5; continue; }"
          ]) assert.ok(workflow.includes(retry), `missing bounded Log Analytics retry: ${retry}`);
          const recoveryJournalDiagnosticName =
            "- name: Report recovery journal " + "integrity metadata";
          const recoveryJournalDiagnosticStart = workflow.indexOf(
            recoveryJournalDiagnosticName);
          const recoveryJournalDiagnosticEnd = workflow.indexOf(
            "- name: Report only failed-closed redemption contract categories",
            recoveryJournalDiagnosticStart);
          assert.ok(recoveryJournalDiagnosticStart >= 0);
          assert.ok(recoveryJournalDiagnosticEnd > recoveryJournalDiagnosticStart);
          const recoveryJournalDiagnostic = workflow.slice(
            recoveryJournalDiagnosticStart, recoveryJournalDiagnosticEnd);
          assert.match(recoveryJournalDiagnostic, /if: \$\{\{ always\(\) \}\}/);
          assert.deepEqual([...recoveryJournalDiagnostic.matchAll(
            /az storage blob ([a-z-]+)/g
          )].map((match) => match[1]), ["show", "download"]);
          assert.match(recoveryJournalDiagnostic,
            /--if-match "\$etag"[\s\S]*sha256sum[\s\S]*journal_state[\s\S]*root_type[\s\S]*predecessor_run_id_type[\s\S]*finalized_control_run_id_type/);
          assert.match(recoveryJournalDiagnostic,
            /malformed_journal_sha256='sha256:abfa6beb115f41e302eba8aa0bb24e6b46083c4271a4eda7f058be12edf12df3'[\s\S]*\$journal_sha256 == \$malformed_sha256[\s\S]*predecessor_run_id \| type == "array"[\s\S]*finalized_control\.run_id \| type == "array"[\s\S]*"pinned_malformed"[\s\S]*elif common and corrected then[\s\S]*"corrected"/);
          assert.match(recoveryJournalDiagnostic,
            /keys \| sort\) == \["finalized_control", "predecessor_run_id", "recovered_summary", "recovery_journal_blob_name", "recovery_run_id", "schema_version", "type"\][\s\S]*finalized_control\.transaction_id[\s\S]*recovered_summary\.transaction_id == \.finalized_control\.transaction_id[\s\S]*journal_state: \$journal_state/);
          assert.match(recoveryJournalDiagnostic,
            /readonly recovery_run_id='venue-redemption-20260816164043326-56add08b'/);
          assert.match(recoveryJournalDiagnostic,
            /readonly journal_blob='reports\/funded\/dynamic-quote\/sessions\/dynamic-quote-funded-2026-08-13-v10\/recovery-controls\/venue-redemption-20260816163934709-03fccfd5\.json'/);
          NODE
          bash scripts/test-fence-funded-queue-and-wait-empty.sh
          bash scripts/test-verify-funded-v10-capital.sh
          bash scripts/test-verify-funded-receiver-role-contract.sh
          git diff --check

  diagnose-funded-lifecycle:
    if: github.event_name == 'workflow_dispatch' && inputs.diagnose_latest_lifecycle
    needs: funded-safety
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Report only failed lifecycle summary fields
        env:
          AZURE_RESOURCE_GROUP: rg-polyedge-dev
          CONTAINER_APP_ENVIRONMENT: polyedge-dev-env
          FUNDED_APP: polyedge-funded-direct-cl
          STORAGE_ACCOUNT: stpolyedge6urdjr5nmwx7w
          FUNDED_CONTAINER: polyedge-funded-evidence
        run: |
          set -euo pipefail
          umask 077
          workspace_id=$(az containerapp env show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$CONTAINER_APP_ENVIRONMENT" \
            --query properties.appLogsConfiguration.logAnalyticsConfiguration.customerId \
            -o tsv)
          test -n "$workspace_id"
          az monitor log-analytics query \
            --workspace "$workspace_id" \
            --analytics-query "ContainerAppConsoleLogs_CL
              | where ContainerAppName_s == '$FUNDED_APP'
              | where TimeGenerated >= ago(24h)
              | extend record = parse_json(Log_s)
              | where tostring(record.schema) == 'polyedge.funded_direct_latency.v1'
              | where tostring(record.status) == 'intent_completed'
              | where tobool(record.order_submission_attempted) == true
              | where tobool(record.order_submitted) == true
              | where tostring(record.worker_status) == 'persistent_intent_completed'
              | top 1 by TimeGenerated desc
              | project Log_s" \
            -o json > lifecycle.json
          decision_id=$(jq -er \
            '.[0].Log_s | fromjson | .decision_id | select(test("^[0-9a-f]{64}$"))' \
            lifecycle.json)
          control_prefix=reports/funded/dynamic-quote
          session_id=dynamic-quote-funded-2026-08-13-v10
          authorization_blob="$control_prefix/sessions/$session_id/authorizations/$decision_id.json"
          completion_blob="$control_prefix/sessions/$session_id/completed/$decision_id.json"
          download_blob() {
            local blob_name=$1 output_file=$2
            az storage blob download \
              --account-name "$STORAGE_ACCOUNT" \
              --container-name "$FUNDED_CONTAINER" \
              --name "$blob_name" \
              --file "$output_file" \
              --auth-mode login \
              --overwrite \
              --only-show-errors -o none > /dev/null 2> download-error.log || {
                echo 'funded diagnostic artifact download failed' >&2
                exit 1
              }
          }
          download_blob "$authorization_blob" authorization.json
          download_blob "$completion_blob" completion.json
          authorization_sha="sha256:$(sha256sum authorization.json | cut -d' ' -f1)"
          child_run_id=$(jq -er '.child_run_id | select(test("^funded-direct-[0-9]{17}-[0-9a-f]{8}$"))' completion.json)
          intent_blob=$(jq -er '.intent_blob_name | select(type == "string")' authorization.json)
          intent_sha=$(jq -er '.intent_sha256 | select(test("^sha256:[0-9a-f]{64}$"))' authorization.json)
          authorization_at=$(jq -er '.authorized_at | select(type == "string")' authorization.json)
          completion_at=$(jq -er '.completed_at | select(type == "string")' completion.json)
          jq -c \
            --arg decision "$decision_id" \
            --arg run "$child_run_id" '
              [
                {field:"schema", ok:(.schema == "polyedge.operator_funded_intent_authorization.v1")},
                {field:"authorization_mode", ok:(.authorization_mode == "operator_direct")},
                {field:"session_binding", ok:(.session_id == "dynamic-quote-funded-2026-08-13-v10")},
                {field:"decision_binding", ok:(.decision_id == $decision)},
                {field:"run_binding", ok:(.child_run_id == $run)},
                {field:"manifest_blob_binding", ok:(.promotion_manifest_blob_name == "reports/funded/dynamic-quote/sessions/dynamic-quote-funded-2026-08-13-v10/session.json")},
                {field:"manifest_hash_binding", ok:(.promotion_manifest_sha256 == "sha256:c516c052fc5c01eed5403842ff24bf4b08512d6c38e8260e2d064580c82322f8")},
                {field:"operator_manifest_blob_binding", ok:(.operator_session_manifest_blob_name == .promotion_manifest_blob_name)},
                {field:"operator_manifest_hash_binding", ok:(.operator_session_manifest_sha256 == .promotion_manifest_sha256)},
                {field:"promotion_mode", ok:(.research_promotion_bypassed == true)},
                {field:"notional_cap", ok:(.max_order_notional == 10.5)},
                {field:"authorization_id_shape", ok:((.authorization_id | type) == "string" and (.authorization_id | length) > 0)},
                {field:"intent_blob_shape", ok:((.intent_blob_name | type) == "string")},
                {field:"intent_hash_shape", ok:((.intent_sha256 | type) == "string" and (.intent_sha256 | test("^sha256:[0-9a-f]{64}$")))}
              ]
              | {
                  failed_fields: [.[] | select(.ok | not) | .field],
                  passed_count: ([.[] | select(.ok)] | length),
                  total: length
                }
            ' authorization.json > authorization-diagnostic.json
          authorization_day=$(date -u -d "$authorization_at" +%Y-%m-%d)
          completion_day=$(date -u -d "$completion_at" +%Y-%m-%d)
          summary_matches=0
          while read -r artifact_day; do
            candidate_blob="reports/research/venue-probe/runs/$artifact_day/$child_run_id/summary.json"
            if az storage blob download \
                --account-name "$STORAGE_ACCOUNT" \
                --container-name "$FUNDED_CONTAINER" \
                --name "$candidate_blob" \
                --file summary.json \
                --auth-mode login \
                --overwrite \
                --only-show-errors -o none > /dev/null 2> download-error.log; then
              summary_matches=$((summary_matches + 1))
            fi
          done < <(printf '%s\n' "$authorization_day" "$completion_day" | sort -u)
          test "$summary_matches" = 1
          order_id=$(jq -er '.lifecycle.order_id | select(test("^0x[0-9a-fA-F]{64}$"))' summary.json)
          jq -c \
            --arg decision "$decision_id" \
            --arg run "$child_run_id" \
            --arg authorization_blob "$authorization_blob" \
            --arg authorization_sha "$authorization_sha" \
            --arg intent_blob "$intent_blob" \
            --arg intent_sha "$intent_sha" \
            --arg order_id "$order_id" '
              [
                {field:"schema_version", ok:(.schema_version == 3)},
                {field:"status", ok:(.status == "completed")},
                {field:"run_binding", ok:(.run_id == $run)},
                {field:"submission_attempted", ok:(.order_submission_attempted == true)},
                {field:"submission_confirmed", ok:(.order_submitted == true)},
                {field:"decision_binding", ok:(.provenance.decision_id == $decision)},
                {field:"authorization_kind", ok:(.provenance.authorization_kind == "operator_direct")},
                {field:"session_binding", ok:(.provenance.operator_session_id == "dynamic-quote-funded-2026-08-13-v10")},
                {field:"promotion_mode", ok:(.provenance.research_promotion_bypassed == true)},
                {field:"authorization_blob_binding", ok:(.provenance.authorization_blob_name == $authorization_blob)},
                {field:"authorization_hash_binding", ok:(.provenance.authorization_sha256 == $authorization_sha)},
                {field:"intent_blob_binding", ok:(.provenance.intent_blob_name == $intent_blob)},
                {field:"intent_hash_binding", ok:(.provenance.intent_sha256 == $intent_sha)},
                {field:"current_funds_scaled", ok:(.order.current_funds_scaled == true)},
                {field:"requested_notional_reduced", ok:(.order.source_requested_notional > .order.notional)},
                {field:"requested_notional_cap", ok:(.order.source_requested_notional <= 10.5)},
                {field:"executed_notional_cap", ok:(.order.notional < 10.5)},
                {field:"order_binding", ok:(.lifecycle.order_id == $order_id)}
              ]
              | {
                  failed_fields: [.[] | select(.ok | not) | .field],
                  passed_count: ([.[] | select(.ok)] | length),
                  total: length
                }
            ' summary.json > summary-diagnostic.json
          jq -cn \
            --slurpfile authorization authorization-diagnostic.json \
            --slurpfile summary summary-diagnostic.json \
            '{
              authorization_failed_fields: $authorization[0].failed_fields,
              authorization_passed_count: $authorization[0].passed_count,
              authorization_total: $authorization[0].total,
              summary_failed_fields: $summary[0].failed_fields,
              summary_passed_count: $summary[0].passed_count,
                summary_total: $summary[0].total
              }' | tee lifecycle-diagnostic.json

      - name: Report recovery journal integrity metadata
        if: ${{ always() }}
        env:
          STORAGE_ACCOUNT: stpolyedge6urdjr5nmwx7w
          FUNDED_CONTAINER: polyedge-funded-evidence
        run: |
          set -euo pipefail
          umask 077
          readonly journal_blob='reports/funded/dynamic-quote/sessions/dynamic-quote-funded-2026-08-13-v10/recovery-controls/venue-redemption-20260816163934709-03fccfd5.json'
          readonly predecessor_run_id='venue-redemption-20260816163934709-03fccfd5'
          readonly recovery_run_id='venue-redemption-20260816164043326-56add08b'
          readonly malformed_journal_sha256='sha256:abfa6beb115f41e302eba8aa0bb24e6b46083c4271a4eda7f058be12edf12df3'
          metadata_file=$(mktemp)
          journal_file=$(mktemp)
          trap 'rm -f -- "$metadata_file" "$journal_file"' EXIT
          az storage blob show \
            --account-name "$STORAGE_ACCOUNT" \
            --container-name "$FUNDED_CONTAINER" \
            --name "$journal_blob" \
            --auth-mode login \
            --query '{etag: properties.etag, contentLength: properties.contentLength, lastModified: properties.lastModified}' \
            --only-show-errors -o json > "$metadata_file"
          etag=$(jq -er '.etag | select(type == "string" and length > 0)' "$metadata_file")
          content_length=$(jq -er '.contentLength | select(type == "number" and . > 0 and floor == . and . <= 1048576)' "$metadata_file")
          last_modified=$(jq -er '.lastModified | select(type == "string" and length > 0)' "$metadata_file")
          az storage blob download \
            --account-name "$STORAGE_ACCOUNT" \
            --container-name "$FUNDED_CONTAINER" \
            --name "$journal_blob" \
            --file "$journal_file" \
            --if-match "$etag" \
            --auth-mode login \
            --overwrite \
            --only-show-errors -o none
          test "$(stat --printf='%s' "$journal_file")" = "$content_length"
          journal_sha256="sha256:$(sha256sum "$journal_file" | cut -d' ' -f1)"
          journal_state=$(jq -er \
            --arg blob "$journal_blob" \
            --arg predecessor "$predecessor_run_id" \
            --arg recovery "$recovery_run_id" \
            --arg malformed_sha256 "$malformed_journal_sha256" \
            --arg journal_sha256 "$journal_sha256" '
            def common:
              type == "object"
              and (keys | sort) == ["finalized_control", "predecessor_run_id", "recovered_summary", "recovery_journal_blob_name", "recovery_run_id", "schema_version", "type"]
              and .schema_version == 1
              and .type == "redemption_recovery_journal"
              and (.finalized_control | type == "object")
              and .recovery_run_id == $recovery
              and .recovery_journal_blob_name == $blob
              and .finalized_control.recovery_run_id == $recovery;
            def corrected:
              (.predecessor_run_id | type == "string" and . == $predecessor)
              and (.finalized_control.run_id | type == "string" and . == $predecessor)
              and .finalized_control.schema_version == 1
              and .finalized_control.state == "confirmed_and_verified"
              and .finalized_control.submission_attempted == true
              and (.finalized_control.transaction_id | type == "string" and length > 0)
              and (.finalized_control.transaction_hash | type == "string" and test("^0x[0-9a-fA-F]{64}$"))
              and (.finalized_control.condition_ids | type == "array" and length > 0
                and length == (unique | length)
                and all(.[]; type == "string" and test("^0x[0-9a-fA-F]{64}$")))
              and (.finalized_control.expected_gross_payout | type == "number" and . > 0)
              and (.finalized_control.internal_settlement_blobs | type == "array" and length > 0
                and length == (unique | length)
                and all(.[]; type == "string" and length > 0))
              and .recovered_summary.schema_version == 1
              and .recovered_summary.status == "recovered_confirmed_and_verified"
              and .recovered_summary.run_id == $recovery
              and .recovered_summary.redemption_submitted == true
              and .recovered_summary.new_submission_attempted == false
              and .recovered_summary.confirmed_transaction_reused == true
              and .recovered_summary.transaction_id == .finalized_control.transaction_id
              and (.recovered_summary.transaction_hash | ascii_downcase)
                == (.finalized_control.transaction_hash | ascii_downcase)
              and ([.recovered_summary.selection.selected[].condition_id | ascii_downcase] | sort)
                == ([.finalized_control.condition_ids[] | ascii_downcase] | sort)
              and (.recovered_summary.internal_settlement_blobs | sort)
                == (.finalized_control.internal_settlement_blobs | sort);
            if common and $journal_sha256 == $malformed_sha256
              and (.predecessor_run_id | type == "array")
              and (.finalized_control.run_id | type == "array")
              and .predecessor_run_id == .finalized_control.run_id then
              "pinned_malformed"
            elif common and corrected then
              "corrected"
            else
              error("funded_recovery_journal_integrity_invalid")
            end
          ' "$journal_file")
          jq -c --arg blob_path "$journal_blob" --arg sha256 "$journal_sha256" \
            --arg etag "$etag" --argjson content_length "$content_length" \
            --arg last_modified "$last_modified" --arg recovery "$recovery_run_id" \
            --arg journal_state "$journal_state" '
              {
                blob_path: $blob_path,
                sha256: $sha256,
                etag: $etag,
                content_length: $content_length,
                last_modified: $last_modified,
                root_type: type,
                predecessor_run_id_type: (.predecessor_run_id | type),
                finalized_control_run_id_type: (.finalized_control.run_id | type),
                predecessor_and_finalized_run_ids_equal:
                  (.predecessor_run_id == .finalized_control.run_id),
                recovery_run_id_binding: (.recovery_run_id == $recovery),
                recovery_journal_blob_binding: (.recovery_journal_blob_name == $blob_path),
                journal_state: $journal_state,
                top_level_sorted_keys: (keys | sort)
              }
            ' "$journal_file"

      - name: Report only failed-closed redemption contract categories
        if: ${{ always() }}
        env:
          STORAGE_ACCOUNT: stpolyedge6urdjr5nmwx7w
          FUNDED_CONTAINER: polyedge-funded-evidence
        run: |
          set -euo pipefail
          umask 077
          prefix='reports/funded/dynamic-quote/sessions/dynamic-quote-funded-2026-08-13-v10/'
          latest="${prefix}latest-redemption.json"
          archive="${prefix}redemptions/"
          redemption_contract_diagnostic_filter=$(awk '
            /redemption_contract_category=\$\(jq -er .*\047$/ {capture=1; next}
            capture && /^[[:space:]]*\047 "\$redemption_file"/ {exit}
            capture {sub(/^                /, ""); print}
          ' .github/workflows/validate-funded-direct.yml)
          test -n "$redemption_contract_diagnostic_filter"
          az storage blob list \
            --account-name "$STORAGE_ACCOUNT" \
            --container-name "$FUNDED_CONTAINER" \
            --prefix "$prefix" \
            --num-results '*' \
            --auth-mode login \
            --only-show-errors -o json > v10-redemption-diagnostic-list.json
          : > v10-redemption-diagnostic-recovery-controls.jsonl
          while IFS= read -r recovery_control_blob; do
            recovery_control_file=$(mktemp)
            az storage blob download \
              --account-name "$STORAGE_ACCOUNT" \
              --container-name "$FUNDED_CONTAINER" \
              --name "$recovery_control_blob" \
              --file "$recovery_control_file" \
              --auth-mode login \
              --overwrite \
              --only-show-errors -o none
            jq -c --arg blob_name "$recovery_control_blob" \
              --arg sha256 "sha256:$(sha256sum "$recovery_control_file" | cut -d' ' -f1)" \
              '{blob_name: $blob_name, sha256: $sha256, value: .}' \
              "$recovery_control_file" \
              >> v10-redemption-diagnostic-recovery-controls.jsonl
          done < <(jq -r --arg prefix "${prefix}recovery-controls/" '
            .[].name | select(startswith($prefix))
          ' v10-redemption-diagnostic-list.json)
          recovery_controls=$(jq -sc '.' \
            v10-redemption-diagnostic-recovery-controls.jsonl)
          category_file=$(mktemp)
          mismatch_signature_file=$(mktemp)
          while IFS= read -r blob_name; do
            redemption_file=$(mktemp)
            az storage blob download \
              --account-name "$STORAGE_ACCOUNT" \
              --container-name "$FUNDED_CONTAINER" \
              --name "$blob_name" \
              --file "$redemption_file" \
              --auth-mode login \
              --overwrite \
              --only-show-errors -o none > /dev/null 2> download-error.log || {
                echo 'funded redemption diagnostic artifact download failed' >&2
                exit 1
            }
            if [ "$(jq -r '.status' "$redemption_file")" = failed_closed ]; then
              redemption_control='{}'
              recovery_journal_summary='{}'
              recovery_control_blob_name=''
              recovery_control_sha256=''
              if [ "$(jq -r '.redemption_submitted' "$redemption_file")" = true ]; then
                recovery_control_wrapper=$(jq -ce \
                  --arg run_id "$(jq -r '.run_id' "$redemption_file")" '
                  [.[] | select(.value.predecessor_run_id == $run_id)]
                  | if length == 1 then .[0]
                    else error("recovery control cardinality mismatch") end
                ' <<<"$recovery_controls")
                redemption_control=$(jq -c '.value.finalized_control' \
                  <<<"$recovery_control_wrapper")
                recovery_journal_summary=$(jq -c '.value.recovered_summary' \
                  <<<"$recovery_control_wrapper")
                recovery_control_blob_name=$(jq -r '.blob_name' \
                  <<<"$recovery_control_wrapper")
                recovery_control_sha256=$(jq -r '.sha256' \
                  <<<"$recovery_control_wrapper")
              fi
              category=$(jq -er --argjson authorized_ceiling 0 \
                --argjson redemption_control "$redemption_control" \
                --argjson recovery_journal_summary "$recovery_journal_summary" \
                --arg recovery_control_blob_name "$recovery_control_blob_name" \
                --arg recovery_control_sha256 "$recovery_control_sha256" \
                --arg record_sha256 \
                  "sha256:$(sha256sum "$redemption_file" | cut -d' ' -f1)" \
                --arg blob_name "$blob_name" --arg latest "$latest" \
                "$redemption_contract_diagnostic_filter" \
                "$redemption_file")
              printf '%s\n' "$category" >> "$category_file"
              if [ "$category" != ok ]; then
                jq -cer --arg blob_name "$blob_name" --arg latest "$latest" '
                  def error_family:
                    if (.error | type) != "string" then "non_string"
                    elif .error | startswith("fail closed:") then "safety_gate"
                    elif .error | startswith("Data API positions returned HTTP ") then
                      "data_api_positions_http"
                    elif .error == "Data API activity returned HTTP 429" then
                      "data_api_activity_http_429"
                    elif .error | startswith("Data API activity returned HTTP ") then
                      "data_api_activity_http_other"
                    elif .error | startswith("venue_redemption blocked:") then
                      "configuration_block"
                    elif .error | startswith("relayer /submit returned HTTP 4") then
                      "relayer_submit_4xx"
                    elif .error | startswith("relayer /submit returned HTTP 5") then
                      "relayer_submit_5xx"
                    elif .error | startswith("relayer accepted response") then
                      "relayer_acceptance_shape"
                    elif .error | test("timeout"; "i") then "timeout_other"
                    else "unclassified" end;
                  {
                    error_family: error_family,
                    failed_fields: ([
                      if $blob_name == $latest then "latest_pointer" else empty end,
                      if (.error != "Data API positions returned HTTP 429"
                          and .error != "Data API activity returned HTTP 429"
                          and .error != "The operation was aborted due to timeout")
                        then "error_class" else empty end,
                      if .redemption_submitted != false
                        then "submission" else empty end,
                      if .research_only != false
                        then "research_mode" else empty end,
                      if .live_strategy_enabled != true
                        then "live_strategy" else empty end,
                      if (keys | sort) != ([
                          "error", "finished_ts", "live_strategy_enabled",
                          "redemption_submitted", "research_only", "run_id",
                          "schema_version", "status"
                        ] | sort) then "field_set" else empty end
                    ])
                  }
                ' "$redemption_file" >> "$mismatch_signature_file"
              fi
            fi
          done < <(jq -r --arg latest "$latest" --arg archive "$archive" '
            .[] | .name | select(. == $latest or startswith($archive))
          ' v10-redemption-diagnostic-list.json)
          test -s "$category_file"
          jq -Rn '[inputs] | group_by(.)
            | map({category: .[0], count: length})' < "$category_file"
          test -s "$mismatch_signature_file"
          jq -s 'sort_by(.error_family, .failed_fields)
            | group_by({error_family, failed_fields})
            | map({
                error_family: .[0].error_family,
                failed_fields: .[0].failed_fields,
                count: length
              })' "$mismatch_signature_file"

  deploy-funded-service:
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_funded_service
    needs: funded-safety
    runs-on: ubuntu-latest
    timeout-minutes: 360
    concurrency:
      group: polyedge-funded-direct-cl
      cancel-in-progress: false
    env:
      AZURE_RESOURCE_GROUP: rg-polyedge-dev
      ACR_NAME: crpolyedge6urdjr5nmwx7w
      FUNDED_APP: polyedge-funded-direct-cl
      INTENT_PRODUCER_APP: polyedge-shadow-neu
      PROTECTED_QSET_APP: polyedge-shadow-qset-neu
      SERVICE_BUS_NAMESPACE: sb-polyedge-funded-cl-6urdjr5nmwx7w
      SERVICE_BUS_QUEUE: funded-dynamic-quote-intents
      FUNDED_RECEIVER_TRANSITION_PHASE: ${{ inputs.funded_receiver_transition_phase }}
      FUNDED_JOB: polyedge-funded-direct-cl-job
      FUNDED_WARMUP_JOB: polyedge-funded-warmup-cl
      LEGACY_NEU_FUNDED_JOB: polyedge-funded-ladder-neu-job
      STORAGE_ACCOUNT: stpolyedge6urdjr5nmwx7w
      FUNDED_CONTAINER: polyedge-funded-evidence
    steps:
      - uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Verify deployment identity, intent producer, and protected qset
        env:
          EXPECTED_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          set -euo pipefail
          test "$(az account show --query id -o tsv)" = "$EXPECTED_SUBSCRIPTION_ID"
          az group show --name "$AZURE_RESOURCE_GROUP" --query name -o tsv
          az containerapp show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$INTENT_PRODUCER_APP" \
            --query properties.latestRevisionName \
            -o tsv > intent-producer-revision-before.txt
          test -s intent-producer-revision-before.txt
          az containerapp show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$PROTECTED_QSET_APP" \
            --query properties.latestRevisionName \
            -o tsv > protected-qset-revision-before.txt
          test -s protected-qset-revision-before.txt

      - name: Build and publish immutable producer and funded worker images
        id: images
        run: |
          set -euo pipefail
          login_server=$(az acr show --name "$ACR_NAME" --query loginServer -o tsv)
          producer_tag="$login_server/polyedge-rust-backend:${GITHUB_SHA}"
          funded_tag="$login_server/polyedge-venue-probe:${GITHUB_SHA}"
          retry_registry() {
            for attempt in 1 2 3; do
              if "$@"; then return 0; fi
              [ "$attempt" = 3 ] || sleep "$((attempt * 10))"
            done
            return 1
          }
          retry_registry az acr login --name "$ACR_NAME"
          docker build --build-arg GIT_SHA="$GITHUB_SHA" -f Dockerfile.rust -t "$producer_tag" .
          docker build -f Dockerfile.venue-probe -t "$funded_tag" .
          retry_registry docker push "$producer_tag"
          retry_registry docker push "$funded_tag"
          producer_digest=$(az acr repository show \
            --name "$ACR_NAME" \
            --image "polyedge-rust-backend:${GITHUB_SHA}" \
            --query digest \
            -o tsv)
          funded_digest=$(az acr repository show \
            --name "$ACR_NAME" \
            --image "polyedge-venue-probe:${GITHUB_SHA}" \
            --query digest \
            -o tsv)
          test -n "$producer_digest"
          test -n "$funded_digest"
          echo "producer_reference=$login_server/polyedge-rust-backend@$producer_digest" >> "$GITHUB_OUTPUT"
          echo "funded_reference=$login_server/polyedge-venue-probe@$funded_digest" >> "$GITHUB_OUTPUT"

      - name: Prove isolated funded infrastructure deployment scope
        run: |
          set -euo pipefail
          az deployment group what-if \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --template-file infra/funded-direct-chile.bicep \
            --parameters @infra/funded-direct-chile.parameters.json \
            --parameters venueProbeImage="${{ steps.images.outputs.funded_reference }}" \
            --parameters fundedDirectQueueStatus=SendDisabled \
            --result-format ResourceIdOnly \
            --no-pretty-print \
            -o json > funded-what-if.json
          jq -e '
            [ .changes[]
              | select(.changeType != "Ignore" and .changeType != "NoChange")
              | select(.resourceId | ascii_downcase | test("qset|polyedge-shadow-neu|/containerapps/polyedge-dev$"))
            ] | length == 0
          ' funded-what-if.json

      - name: Refresh Azure login before funded fence
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Fence queue and verify predecessor before dormant v8 audit
        run: |
          set -euo pipefail
          az containerapp show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$FUNDED_APP" \
            --only-show-errors -o json > current-funded-app.json
          jq -e '.properties.configuration.activeRevisionsMode == "Single"' \
            current-funded-app.json >/dev/null || {
            printf '%s\n' 'funded_predecessor_selection_failed' >&2
            exit 1
          }
          az containerapp revision list \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$FUNDED_APP" \
            --only-show-errors -o json > current-funded-revisions.json
          if ! current_revision=$(jq -er '
            [.[] | select(.properties.active == true)]
            | if length == 1
                and .[0].properties.healthState == "Healthy"
                and ((. [0].properties.template.scale.minReplicas // 0 | tonumber) != 1
                  or ((. [0].properties.replicas // 0) | tonumber) >= 1)
              then .[0].name
              else error("expected exactly one active healthy funded predecessor")
              end
          ' current-funded-revisions.json); then
            printf '%s\n' 'funded_predecessor_selection_failed' >&2
            exit 1
          fi
          az containerapp revision show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$FUNDED_APP" \
            --revision "$current_revision" \
            --only-show-errors \
            -o json > current-funded-revision.json
          current_session=$(jq -r '
            [.properties.template.containers[0].env[]
              | select(.name == "VENUE_PROBE_FUNDED_CAMPAIGN_ID")
              | .value][0] // ""
          ' current-funded-revision.json)
          current_revision_created_at=$(jq -r '.properties.createdTime // ""' current-funded-revision.json)
          environment_id=$(az containerapp show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$FUNDED_APP" \
            --query properties.environmentId -o tsv)
          workspace_customer_id=$(az containerapp env show \
            --ids "$environment_id" \
            --query properties.appLogsConfiguration.logAnalyticsConfiguration.customerId -o tsv)
          test -n "$current_revision"
          test -n "$current_revision_created_at"
          test -n "$workspace_customer_id"
          env_value() {
            jq -er --arg name "$1" '
              [.properties.template.containers[0].env[]
                | select(.name == $name) | .value]
              | if length == 1 and .[0] != null then .[0]
                else error("expected exactly one non-null environment value for " + $name)
                end
          ' current-funded-revision.json
          }
          # maintenance_predecessor_verifier_begin
          verify_exact_maintenance_predecessor() {
            local revision_file=$1
            local expected_revision_pattern=$2
            local expected_image=$3
            local expected_template_sha256=$4
            local canonical_template_file=$5
            [[ "$(jq -r '.name' "$revision_file")" =~ $expected_revision_pattern ]] || return 1
            test "$(jq -r '.properties.active' "$revision_file")" = \
              "true" || return 1
            test "$(jq -r '.properties.healthState' "$revision_file")" = \
              "Healthy" || return 1
            test "$(jq -r '.properties.template.containers[0].image' \
              "$revision_file")" = "$expected_image" || return 1
            test "$(jq -r '
              [.properties.template.containers[0].env[]
                | select(.name == "FUNDED_DIRECT_AUTO_REDEMPTION_ENABLED") | .value]
              | if length == 1 then .[0] else "" end
            ' "$revision_file")" = "false" || return 1
            jq -S '.properties.template' "$revision_file" \
              > "$canonical_template_file" || return 1
            test "sha256:$(sha256sum "$canonical_template_file" | cut -d' ' -f1)" = \
              "$expected_template_sha256"
          }
          # maintenance_predecessor_verifier_end
          predecessor_contract_failed() {
            printf '%s\n' 'funded_predecessor_contract_invalid' >&2
            exit 1
          }
          trap predecessor_contract_failed ERR
          case "$current_session" in
            dynamic-quote-funded-2026-07-29-v5)
              test "$(jq -r '.properties.template.scale.minReplicas' current-funded-revision.json)" = "0"
              test "$(jq -r '.properties.template.scale.maxReplicas' current-funded-revision.json)" = "1"
              for name in \
                FUNDED_DIRECT_SERVICE_ENABLED \
                FUNDED_DIRECT_WORKER_ENABLED \
                FUNDED_DIRECT_AUTO_REDEMPTION_ENABLED \
                ALLOW_FUNDED_DIRECT \
                ALLOW_LIVE \
                ALLOW_STRATEGY_CANARY \
                ENABLE_TAKER_ORDERS; do
                test "$(env_value "$name")" = "false"
              done
              test "$(env_value FUNDED_DIRECT_DRY_RUN)" = "true"
              test "$(env_value VENUE_PROBE_FUNDED_CAMPAIGN_ID)" = \
                "dynamic-quote-funded-2026-07-29-v5"
              test "$(env_value VENUE_PROBE_CAMPAIGN_BASELINE_EQUITY)" = "11.09862"
              test "$(env_value FUNDED_DIRECT_SESSION_MANIFEST_BLOB_NAME)" = \
                "reports/funded/dynamic-quote/sessions/dynamic-quote-funded-2026-07-29-v5/session.json"
              test "$(env_value FUNDED_DIRECT_SESSION_MANIFEST_SHA256)" = \
                "sha256:b8877f266f1e68d846ad2fd3ae8732c2d533cc7ccc14482ac5f76d0d1c1f58f9"
              test "$(env_value FUNDED_DIRECT_RESERVE_MIGRATION_SOURCE_SESSION_ID)" = \
                "dynamic-quote-funded-2026-08-03-v7"
              test "$(env_value FUNDED_DIRECT_RESERVE_MIGRATION_SOURCE_SESSION_MANIFEST_BLOB_NAME)" = \
                "reports/funded/dynamic-quote/sessions/dynamic-quote-funded-2026-08-03-v7/session.json"
              test "$(env_value FUNDED_DIRECT_RESERVE_MIGRATION_SOURCE_SESSION_MANIFEST_SHA256)" = \
                "sha256:410abe9fc7f2f81359bbb4ef8304a153326d7be170a76dc64e84dd2bf1a4e709"
              test "$(env_value FUNDED_DIRECT_RESERVE_MIGRATION_SOURCE_STATE_BLOB_NAME)" = \
                "reports/funded/dynamic-quote/sessions/dynamic-quote-funded-2026-08-03-v7/capital-reserve-state.json"
              test "$(env_value FUNDED_DIRECT_RESERVE_MIGRATION_MINIMUM_HISTORICAL_HIGH_WATER_EQUITY)" = \
                "75.90162"
              ;;
            dynamic-quote-funded-2026-08-11-v8)
              test "$(jq -r '.properties.template.scale.minReplicas' current-funded-revision.json)" = "0"
              test "$(jq -r '.properties.template.scale.maxReplicas' current-funded-revision.json)" = "1"
              for name in \
                FUNDED_DIRECT_SERVICE_ENABLED \
                FUNDED_DIRECT_WORKER_ENABLED \
                FUNDED_DIRECT_AUTO_REDEMPTION_ENABLED \
                ALLOW_FUNDED_DIRECT \
                ALLOW_LIVE \
                ALLOW_STRATEGY_CANARY \
                ENABLE_TAKER_ORDERS; do
                test "$(env_value "$name")" = "false"
              done
              test "$(env_value VENUE_PROBE_FUNDED_CAMPAIGN_ID)" = \
                "dynamic-quote-funded-2026-08-11-v8"
              test "$(env_value FUNDED_DIRECT_DRY_RUN)" = "true"
              test "$(env_value FUNDED_DIRECT_SESSION_MANIFEST_BLOB_NAME)" = \
                "reports/funded/dynamic-quote/sessions/dynamic-quote-funded-2026-08-11-v8/session.json"
              test "$(env_value FUNDED_DIRECT_SESSION_MANIFEST_SHA256)" = \
                "sha256:04c4b7e9816b71b12e1f7ecd14c34be6bc368ab4db581ee34c62fb1c69e5d4bf"
              readonly v8_prefix="reports/funded/dynamic-quote/sessions/dynamic-quote-funded-2026-08-11-v8/"
              readonly v8_session="${v8_prefix}session.json"
              readonly v8_state="${v8_prefix}capital-reserve-state.json"
              az storage blob list \
                --account-name "$STORAGE_ACCOUNT" \
                --container-name "$FUNDED_CONTAINER" \
                --prefix "$v8_prefix" \
                --num-results '*' \
                --auth-mode login \
                --only-show-errors -o json > dormant-v8-prefix.json
              jq -e --arg session "$v8_session" --arg state "$v8_state" '
                (length == 1 or length == 2)
                and ([.[].name] | index($session) != null)
                and ([.[].name | select(. != $session and . != $state)] | length) == 0
              ' dormant-v8-prefix.json >/dev/null
              az storage blob download \
                --account-name "$STORAGE_ACCOUNT" \
                --container-name "$FUNDED_CONTAINER" \
                --name "$v8_session" \
                --file dormant-v8-session.json \
                --auth-mode login \
                --overwrite \
                --only-show-errors -o none
              test "sha256:$(sha256sum dormant-v8-session.json | cut -d' ' -f1)" = \
                "sha256:04c4b7e9816b71b12e1f7ecd14c34be6bc368ab4db581ee34c62fb1c69e5d4bf"
              if jq -e --arg state "$v8_state" '[.[].name] | index($state) != null' \
                  dormant-v8-prefix.json >/dev/null; then
                az storage blob download \
                  --account-name "$STORAGE_ACCOUNT" \
                  --container-name "$FUNDED_CONTAINER" \
                  --name "$v8_state" \
                  --file dormant-v8-capital-reserve-state.json \
                  --auth-mode login \
                  --overwrite \
                  --only-show-errors -o none
                jq -e '
                  .schema == "polyedge.protected_compounding_state.v2"
                  and .session_id == "dynamic-quote-funded-2026-08-11-v8"
                  and .reconciliation_complete == true
                  and .reserve_ratio == 0.1
                  and .minimum_reserve == 2
                  and .target_order_ratio == 0.05
                  and .operating_buffer_ratio == 0.01
                  and .minimum_order_notional == 1
                  and .reserve_basis == "fully_reconciled_current_equity"
                  and .loss_response == "resize_from_fully_reconciled_current_equity"
                  and .continue_after_loss == true
                  and .reserve_monotonic == false
                  and .prior_state_session_id == "dynamic-quote-funded-2026-07-29-v5"
                  and .prior_state_blob_name == "reports/funded/dynamic-quote/sessions/dynamic-quote-funded-2026-07-29-v5/capital-reserve-state.json"
                  and .prior_state_sha256 == "sha256:617b0bd69466dc7d6ff7d61b26f5a4ed1bcfd557d5d9e4b62688b7fb13bf28c6"
                  and .high_water_equity >= 102.78112
                  and .historical_high_water_equity >= 102.78112
                  and (.last_reconciled_equity - 31.655501 | fabs) <= 0.01
                  and (.authorized_equity_ceiling - 31.655501 | fabs) <= 0.0000011
                  and .verified_realized_pnl == 0
                  and .verified_settlement_ids == []
                  and (.protected_reserve - ([2, (.last_reconciled_equity * .reserve_ratio)] | max) | fabs) <= 0.0000011
                  and (.operating_buffer - (.last_reconciled_equity * .operating_buffer_ratio) | fabs) <= 0.0000011
                  and (.operable_capital - ([0, (.last_reconciled_equity - .protected_reserve - .operating_buffer)] | max) | fabs) <= 0.0000011
                  and ([keys[] | select(test("migration_|cash.flow"))] | length) == 0
                ' dormant-v8-capital-reserve-state.json >/dev/null
              fi
              ;;
            dynamic-quote-funded-2026-08-13-v10)
              test "$(jq -r '.properties.template.scale.maxReplicas' current-funded-revision.json)" = "1"
              test "$(env_value VENUE_PROBE_FUNDED_CAMPAIGN_ID)" = \
                "dynamic-quote-funded-2026-08-13-v10"
              test "$(env_value VENUE_PROBE_CAMPAIGN_BASELINE_EQUITY)" = "29.505501"
              test "$(env_value VENUE_PROBE_CAMPAIGN_CASH_FLOWS)" = "[]"
              test "$(env_value FUNDED_DIRECT_SESSION_MANIFEST_BLOB_NAME)" = \
                "reports/funded/dynamic-quote/sessions/dynamic-quote-funded-2026-08-13-v10/session.json"
              test "$(env_value FUNDED_DIRECT_SESSION_MANIFEST_SHA256)" = \
                "sha256:c516c052fc5c01eed5403842ff24bf4b08512d6c38e8260e2d064580c82322f8"
              for name in \
                FUNDED_DIRECT_RESERVE_MIGRATION_SOURCE_SESSION_ID \
                FUNDED_DIRECT_RESERVE_MIGRATION_SOURCE_SESSION_MANIFEST_BLOB_NAME \
                FUNDED_DIRECT_RESERVE_MIGRATION_SOURCE_SESSION_MANIFEST_SHA256 \
                FUNDED_DIRECT_RESERVE_MIGRATION_SOURCE_STATE_BLOB_NAME \
                FUNDED_DIRECT_RESERVE_MIGRATION_MINIMUM_HISTORICAL_HIGH_WATER_EQUITY; do
                test -z "$(env_value "$name")"
              done
              current_min_replicas=$(jq -r '.properties.template.scale.minReplicas' current-funded-revision.json)
              case "$current_min_replicas" in
                0)
                  for name in \
                    FUNDED_DIRECT_SERVICE_ENABLED \
                    FUNDED_DIRECT_WORKER_ENABLED \
                    FUNDED_DIRECT_AUTO_REDEMPTION_ENABLED \
                    ALLOW_FUNDED_DIRECT \
                    ALLOW_LIVE \
                    ALLOW_STRATEGY_CANARY \
                    ENABLE_TAKER_ORDERS; do
                    test "$(env_value "$name")" = "false"
                  done
                  test "$(env_value FUNDED_DIRECT_DRY_RUN)" = "true"
                  ;;
                1)
                  for name in \
                    FUNDED_DIRECT_SERVICE_ENABLED \
                    FUNDED_DIRECT_WORKER_ENABLED \
                    ALLOW_FUNDED_DIRECT; do
                    test "$(env_value "$name")" = "true"
                  done
                  for name in \
                    ALLOW_LIVE \
                    ALLOW_STRATEGY_CANARY \
                    ENABLE_TAKER_ORDERS; do
                    test "$(env_value "$name")" = "false"
                  done
                  test "$(env_value FUNDED_DIRECT_DRY_RUN)" = "false"
                  if [ "$(env_value FUNDED_DIRECT_AUTO_REDEMPTION_ENABLED)" = "false" ]; then
                    verify_exact_maintenance_predecessor \
                      current-funded-revision.json \
                      '^polyedge-funded-direct-cl--[a-z0-9][a-z0-9-]*$' \
                      "crpolyedge6urdjr5nmwx7w.azurecr.io/polyedge-venue-probe@sha256:9dc88f6f91728d858339fa6942e0ac9f57b9ecc71c8e5da2e4782df2e72b4d32" \
                      "sha256:2d9af6a7af5ff8885dc4afa6e7126de170005cb83d6e511269d5c3927e8b49ad" \
                      current-funded-maintenance-template.json
                  else
                    test "$(env_value FUNDED_DIRECT_AUTO_REDEMPTION_ENABLED)" = "true"
                  fi
                  ;;
                *)
                  echo "Refusing v10 rerun from invalid replica configuration: $current_min_replicas" >&2
                  predecessor_contract_failed
                  ;;
              esac
              ;;
            *)
              echo "Refusing cutover from unexpected funded session: ${current_session:-<unset>}" >&2
              predecessor_contract_failed
              ;;
          esac
          trap - ERR
          if ! jq -S '.properties.template' current-funded-revision.json \
              > funded-rollback-template.json; then
            printf '%s\n' 'funded_predecessor_rollback_capture_failed' >&2
            exit 1
          fi
          rollback_template_sha256="sha256:$(sha256sum funded-rollback-template.json | cut -d' ' -f1)"
          [[ "$rollback_template_sha256" =~ ^sha256:[0-9a-f]{64}$ ]] || {
            printf '%s\n' 'funded_predecessor_rollback_capture_failed' >&2
            exit 1
          }
          printf '%s\n' "$current_revision" > funded-rollback-revision.txt
          printf '%s\n' "$rollback_template_sha256" > funded-rollback-template.sha256
          {
            echo "FUNDED_ROLLBACK_REVISION=$current_revision"
            echo "FUNDED_ROLLBACK_TEMPLATE_SHA256=$rollback_template_sha256"
            echo "FUNDED_ROLLBACK_CAPTURED=true"
          } >> "$GITHUB_ENV"
          predecessor_live=false
          if [ "$(jq -r '.properties.template.scale.minReplicas' current-funded-revision.json)" = "1" ]; then
            predecessor_live=true
          fi
          az servicebus queue show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --namespace-name "$SERVICE_BUS_NAMESPACE" \
            --name "$SERVICE_BUS_QUEUE" \
            -o json > funded-queue-before-fence.json
          jq -e '
            .status == "Active"
            and ([.countDetails.activeMessageCount,
                  .countDetails.scheduledMessageCount,
                  .countDetails.deadLetterMessageCount]
                 | all(type == "number" or type == "string"))
          ' funded-queue-before-fence.json >/dev/null || {
            printf '%s\n' 'funded_predecessor_queue_prefence_invalid' >&2
            exit 1
          }
          cp funded-queue-before-fence.json funded-queue-rollback-baseline.next.json
          mv funded-queue-rollback-baseline.next.json funded-queue-rollback-baseline.json
          pre_fence_dlq=$(jq -r '.countDetails.deadLetterMessageCount' funded-queue-before-fence.json)
          [[ "$pre_fence_dlq" =~ ^[0-9]+$ ]]
          printf '%s\n' "$pre_fence_dlq" > funded-fenced-dlq-before.next.txt
          mv funded-fenced-dlq-before.next.txt funded-fenced-dlq-before.txt
          if [ "$predecessor_live" = true ]; then
            echo "FUNDED_ROLLBACK_REOPEN_AUTHORIZED=true" >> "$GITHUB_ENV"
          fi
          az containerapp revision list \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$FUNDED_APP" \
            --only-show-errors -o json > funded-revisions-before-fence.json
          jq -e --arg revision "$current_revision" '
            ([.[] | select(.properties.active == true)] | length) == 1
            and ([.[] | select(.properties.active == true)][0].name == $revision)
            and ([.[] | select(.properties.active == true)][0].properties.healthState == "Healthy")
            and (([.[] | select(.properties.active == true)][0].properties.template.scale.minReplicas // 0 | tonumber) != 1
              or (([.[] | select(.properties.active == true)][0].properties.replicas // 0) | tonumber) >= 1)
          ' funded-revisions-before-fence.json >/dev/null || {
            printf '%s\n' 'funded_predecessor_changed_before_fence' >&2
            exit 1
          }
          az containerapp revision show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$FUNDED_APP" \
            --revision "$current_revision" \
            --only-show-errors -o json > current-funded-revision-before-fence.json
          jq -S '.properties.template' current-funded-revision-before-fence.json \
            > funded-rollback-template-before-fence.json
          cmp funded-rollback-template.json funded-rollback-template-before-fence.json || {
            printf '%s\n' 'funded_predecessor_changed_before_fence' >&2
            exit 1
          }
          echo "FUNDED_QUEUE_FENCE_REQUESTED=true" >> "$GITHUB_ENV"
          fence_started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          az servicebus queue update \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --namespace-name "$SERVICE_BUS_NAMESPACE" \
            --name "$SERVICE_BUS_QUEUE" \
            --status SendDisabled \
            --only-show-errors -o none
          echo "FUNDED_QUEUE_FENCED=true" >> "$GITHUB_ENV"
          test "$(az servicebus queue show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --namespace-name "$SERVICE_BUS_NAMESPACE" \
            --name "$SERVICE_BUS_QUEUE" \
            --query status -o tsv)" = "SendDisabled"
          for attempt in $(seq 1 30); do
            active_messages=$(az servicebus queue show \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --namespace-name "$SERVICE_BUS_NAMESPACE" \
              --name "$SERVICE_BUS_QUEUE" \
              --query countDetails.activeMessageCount -o tsv)
            if [ "${active_messages:-0}" = "0" ]; then break; fi
            sleep 5
          done
          test "${active_messages:-0}" = "0"
          az servicebus queue show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --namespace-name "$SERVICE_BUS_NAMESPACE" \
            --name "$SERVICE_BUS_QUEUE" -o json > funded-fenced-queue-snapshot.json
          jq -e '
            .status == "SendDisabled"
            and (.countDetails.activeMessageCount | tonumber) == 0
            and (.countDetails.scheduledMessageCount | tonumber) == 0
            and (.countDetails.deadLetterMessageCount | tonumber) >= 0
          ' funded-fenced-queue-snapshot.json >/dev/null
          jq -r '.countDetails.deadLetterMessageCount' \
            funded-fenced-queue-snapshot.json > funded-fenced-dlq-before.next.txt
          mv funded-fenced-queue-snapshot.json funded-queue-rollback-baseline.json
          mv funded-fenced-dlq-before.next.txt funded-fenced-dlq-before.txt
          az containerapp revision list \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$FUNDED_APP" \
            --only-show-errors -o json > funded-revisions-after-fence.json
          jq -e --arg revision "$current_revision" '
            ([.[] | select(.properties.active == true)] | length) == 1
            and ([.[] | select(.properties.active == true)][0].name == $revision)
            and ([.[] | select(.properties.active == true)][0].properties.healthState == "Healthy")
            and (([.[] | select(.properties.active == true)][0].properties.template.scale.minReplicas // 0 | tonumber) != 1
              or (([.[] | select(.properties.active == true)][0].properties.replicas // 0) | tonumber) >= 1)
          ' funded-revisions-after-fence.json >/dev/null || {
            printf '%s\n' 'funded_predecessor_changed_after_fence' >&2
            exit 1
          }
          az containerapp revision show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$FUNDED_APP" \
            --revision "$current_revision" \
            --only-show-errors -o json > current-funded-revision-after-fence.json
          jq -S '.properties.template' current-funded-revision-after-fence.json \
            > funded-rollback-template-after-fence.json
          cmp funded-rollback-template.json funded-rollback-template-after-fence.json || {
            printf '%s\n' 'funded_predecessor_changed_after_fence' >&2
            exit 1
          }
          readonly v8_campaign_prefix="reports/research/venue-probe/control/campaign-risk/dynamic-quote-funded-2026-08-11-v8/"
          echo "FUNDED_RETIRE_WORKSPACE_CUSTOMER_ID=$workspace_customer_id" >> "$GITHUB_ENV"

      - name: Audit exact dormant v8 storage and history before log retirement checks
        run: |
          set -euo pipefail
          readonly v8_campaign_prefix="reports/research/venue-probe/control/campaign-risk/dynamic-quote-funded-2026-08-11-v8/"
          readonly v8_baseline="${v8_campaign_prefix}baseline.json"
          readonly v8_index="${v8_campaign_prefix}unresolved-reservations-index.json"
          az storage blob list \
            --account-name "$STORAGE_ACCOUNT" \
            --container-name "$FUNDED_CONTAINER" \
            --prefix "$v8_campaign_prefix" \
            --num-results '*' \
            --auth-mode login \
            --only-show-errors -o json > dormant-v8-campaign-prefix.json
          jq -e --arg baseline "$v8_baseline" --arg index "$v8_index" '
            length == 2
            and ([.[].name] | sort) == ([$baseline, $index] | sort)
          ' dormant-v8-campaign-prefix.json >/dev/null
          v8_index_etag=$(jq -r --arg index "$v8_index" '
            .[] | select(.name == $index) | .properties.etag
          ' dormant-v8-campaign-prefix.json)
          v8_index_etag=${v8_index_etag#\"}
          v8_index_etag=${v8_index_etag%\"}
          [[ "$v8_index_etag" =~ ^0x[0-9A-Fa-f]+$ ]]
          az storage blob download \
            --account-name "$STORAGE_ACCOUNT" \
            --container-name "$FUNDED_CONTAINER" \
            --name "$v8_baseline" \
            --file dormant-v8-baseline.json \
            --auth-mode login \
            --overwrite \
            --only-show-errors -o none
          jq -e '
            .schema_version == 1
            and .campaign_id == "dynamic-quote-funded-2026-08-11-v8"
            and .baseline_equity == 31.655501
            and .equity_floor == 0
            and .max_campaign_drawdown == 31.655501
            and .max_order_notional == 10.5
            and .max_open_orders == 1
            and .max_unresolved_positions == 1
            and .max_reconciliation_discrepancy == 0.01
            and (.created_ts | type == "string")
          ' dormant-v8-baseline.json >/dev/null
          az storage blob download \
            --account-name "$STORAGE_ACCOUNT" \
            --container-name "$FUNDED_CONTAINER" \
            --name "$v8_index" \
            --file dormant-v8-unresolved-index.json \
            --auth-mode login \
            --overwrite \
            --only-show-errors -o none
          jq -e '
            .schema == "polyedge.funded_unresolved_risk_reservation_index.v1"
            and .schema_version == 1
            and .campaign_id == "dynamic-quote-funded-2026-08-11-v8"
            and (.generation | type == "number" and . >= 1 and floor == .)
            and .unresolved_count == 0
            and .entries == []
            and .entries_sha256 == "sha256:4f53cda18c2baa0c0354bb5f9a3ecbe5ed12ab4d8e11ba873c2f11161202b945"
            and (.rebuilt_ts | type == "string")
            and (.updated_ts | type == "string")
          ' dormant-v8-unresolved-index.json >/dev/null
          az storage blob list \
            --account-name "$STORAGE_ACCOUNT" \
            --container-name "$FUNDED_CONTAINER" \
            --prefix "reports/research/venue-probe/risk-reservations/" \
            --num-results '*' \
            --auth-mode login \
            --only-show-errors -o json > all-risk-reservation-blobs.json
          while IFS= read -r blob_name; do
            audit_file=$(mktemp)
            az storage blob download \
              --account-name "$STORAGE_ACCOUNT" \
              --container-name "$FUNDED_CONTAINER" \
              --name "$blob_name" \
              --file "$audit_file" \
              --auth-mode login \
              --overwrite \
              --only-show-errors -o none
            jq -e --arg session "dynamic-quote-funded-2026-08-11-v8" '
              ([.. | objects | .campaign_id? // empty] | index($session)) == null
            ' "$audit_file" >/dev/null
            rm -f "$audit_file"
          done < <(jq -r '.[] | select(.name | endswith(".json")) | .name' \
            all-risk-reservation-blobs.json)
          az storage blob list \
            --account-name "$STORAGE_ACCOUNT" \
            --container-name "$FUNDED_CONTAINER" \
            --prefix "reports/research/venue-probe/runs/" \
            --num-results '*' \
            --auth-mode login \
            --only-show-errors -o json > all-run-blobs.json
          while IFS= read -r blob_name; do
            audit_file=$(mktemp)
            az storage blob download \
              --account-name "$STORAGE_ACCOUNT" \
              --container-name "$FUNDED_CONTAINER" \
              --name "$blob_name" \
              --file "$audit_file" \
              --auth-mode login \
              --overwrite \
              --only-show-errors -o none
            jq -e --arg session "dynamic-quote-funded-2026-08-11-v8" '
              ([.. | objects | .operator_session_id? // empty] | index($session)) == null
            ' "$audit_file" >/dev/null
            rm -f "$audit_file"
          done < <(jq -r '.[] | select(.name | endswith("/summary.json")) | .name' all-run-blobs.json)
          az storage blob list \
            --account-name "$STORAGE_ACCOUNT" \
            --container-name "$FUNDED_CONTAINER" \
            --prefix "reports/research/venue-probe/control/strategy-canary/consumed/" \
            --num-results '*' \
            --auth-mode login \
            --only-show-errors -o json > all-authorization-consumptions.json
          while IFS= read -r blob_name; do
            audit_file=$(mktemp)
            az storage blob download \
              --account-name "$STORAGE_ACCOUNT" \
              --container-name "$FUNDED_CONTAINER" \
              --name "$blob_name" \
              --file "$audit_file" \
              --auth-mode login \
              --overwrite \
              --only-show-errors -o none
            jq -e --arg session "dynamic-quote-funded-2026-08-11-v8" '
              ([.. | strings] | index($session)) == null
            ' "$audit_file" >/dev/null
            rm -f "$audit_file"
          done < <(jq -r '.[] | select(.name | endswith(".json")) | .name' \
            all-authorization-consumptions.json)
          printf '%s\n' "$v8_index_etag" > dormant-v8-index-etag-before.txt

      - name: Refresh Azure login before dormant v8 Log Analytics and final retirement checks
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Verify exact dormant v8 Log Analytics and final retirement checks
        run: |
          set -euo pipefail
          readonly workspace_customer_id="$FUNDED_RETIRE_WORKSPACE_CUSTOMER_ID"
          test -n "$workspace_customer_id"
          readonly v8_index="reports/research/venue-probe/control/campaign-risk/dynamic-quote-funded-2026-08-11-v8/unresolved-reservations-index.json"
          readonly v8_index_etag="$(cat dormant-v8-index-etag-before.txt)"
          [[ "$v8_index_etag" =~ ^0x[0-9A-Fa-f]+$ ]]
          current_v8_index_etag=$(az storage blob show \
            --account-name "$STORAGE_ACCOUNT" \
            --container-name "$FUNDED_CONTAINER" \
            --name "$v8_index" \
            --auth-mode login \
            --query properties.etag -o tsv)
          current_v8_index_etag=${current_v8_index_etag#\"}
          current_v8_index_etag=${current_v8_index_etag%\"}
          [[ "$current_v8_index_etag" =~ ^0x[0-9A-Fa-f]+$ ]]
          test "$current_v8_index_etag" = "$v8_index_etag"
          az containerapp revision list \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$FUNDED_APP" \
            --all \
            -o json > funded-v8-revisions.json
          v8_revisions_json=$(jq -c --arg session "dynamic-quote-funded-2026-08-11-v8" '
            [ .[]
              | select(any(.properties.template.containers[0].env[]?;
                  .name == "VENUE_PROBE_FUNDED_CAMPAIGN_ID" and .value == $session))
            ]
          ' funded-v8-revisions.json)
          test "$(jq 'length' <<<"$v8_revisions_json")" -ge 1
          while IFS= read -r revision_name; do
            [[ "$revision_name" =~ ^polyedge-funded-direct-cl--[a-z0-9-]+$ ]]
          done < <(jq -r '.[].name' <<<"$v8_revisions_json")
          v8_revision_names_kql=$(jq -r '[.[].name] | unique | map(@sh) | join(", ")' \
            <<<"$v8_revisions_json")
          test -n "$v8_revision_names_kql"
          v8_first_revision_created_at=$(jq -r \
            '[.[].properties.createdTime] | min // ""' <<<"$v8_revisions_json")
          test -n "$v8_first_revision_created_at"
          retirement_audit_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          az extension add --name log-analytics --allow-preview true --only-show-errors
          sleep 60
          az monitor log-analytics query \
            --workspace "$workspace_customer_id" \
            --analytics-query "ContainerAppConsoleLogs_CL
              | where ContainerAppName_s == '$FUNDED_APP'
              | where RevisionName_s in ($v8_revision_names_kql)
              | where TimeGenerated between (datetime($v8_first_revision_created_at) .. datetime($retirement_audit_at))
              | summarize
                  OrderSubmissionAttempted=countif(Log_s contains '\"order_submission_attempted\":true'),
                  OrderSubmitted=countif(Log_s contains '\"order_submitted\":true'),
                  RiskReservationCreated=countif(Log_s contains '\"risk_reservation_created\":true'
                    or Log_s contains '\"status\":\"funded_risk_reservation_created\"'),
                  AuthorizationConsumed=countif(Log_s contains '\"authorization_consumed\":true'
                    or Log_s contains '\"status\":\"funded_authorization_consumed\"'),
                  RedemptionSubmitted=countif(Log_s contains '\"redemption_submitted\":true'),
                  ChildCompleted=countif(Log_s contains '\"status\":\"child_completed\"')" \
            -o json > funded-v8-retirement-aggregate.json
          jq -e '
            length == 1
            and (.[0].OrderSubmissionAttempted | tonumber) == 0
            and (.[0].OrderSubmitted | tonumber) == 0
            and (.[0].RiskReservationCreated | tonumber) == 0
            and (.[0].AuthorizationConsumed | tonumber) == 0
            and (.[0].RedemptionSubmitted | tonumber) == 0
            and (.[0].ChildCompleted | tonumber) == 0
          ' funded-v8-retirement-aggregate.json >/dev/null
          az monitor log-analytics query \
            --workspace "$workspace_customer_id" \
            --analytics-query "ContainerAppConsoleLogs_CL
              | where ContainerAppName_s == '$FUNDED_APP'
              | where RevisionName_s in ($v8_revision_names_kql)
              | where TimeGenerated between (datetime($v8_first_revision_created_at) .. datetime($retirement_audit_at))
              | extend record = parse_json(Log_s)
              | where tostring(record.schema) == 'polyedge.funded_capital_snapshot.v1'
              | where tostring(record.session_id) == 'dynamic-quote-funded-2026-08-11-v8'
              | top 1 by TimeGenerated desc
              | project TimeGenerated,
                  SnapshotSource=tostring(record.snapshot_source),
                  RiskPassed=tobool(record.risk_passed),
                  BlockerCount=array_length(record.blockers),
                  OpenOrderCount=toint(record.open_order_count),
                  UnresolvedPositionCount=toint(record.unresolved_position_count),
                  UnresolvedRiskReservationCount=toint(record.unresolved_risk_reservation_count),
                  AccountEquity=todouble(record.account_equity)" \
            -o json > funded-v8-retirement-reconciliation.json
          jq -e '
            length == 1
            and (.[0].SnapshotSource == "live_preflight"
              or .[0].SnapshotSource == "persistent_safety_cache")
            and ((.[0].RiskPassed | tostring | ascii_downcase) == "true")
            and (.[0].BlockerCount | tonumber) == 0
            and (.[0].OpenOrderCount | tonumber) == 0
            and (.[0].UnresolvedPositionCount | tonumber) == 0
            and (.[0].UnresolvedRiskReservationCount | tonumber) == 0
            and ((.[0].AccountEquity | tonumber) - 31.655501 | fabs) <= 0.01
          ' funded-v8-retirement-reconciliation.json >/dev/null
          az storage blob download \
            --account-name "$STORAGE_ACCOUNT" \
            --container-name "$FUNDED_CONTAINER" \
            --name "reports/funded/dynamic-quote/sessions/dynamic-quote-funded-2026-07-29-v5/capital-reserve-state.json" \
            --file current-v5-capital-reserve-state.json \
            --auth-mode login \
            --overwrite \
            --only-show-errors -o none
          test "sha256:$(sha256sum current-v5-capital-reserve-state.json | cut -d' ' -f1)" = \
            "sha256:9e63db7ef8c22d3af53a14f1858b817b8769ca7ba737e6668a900ffb73330c15"
          jq -e '
            .schema == "polyedge.protected_compounding_state.v1"
            and .session_id == "dynamic-quote-funded-2026-07-29-v5"
            and .reconciliation_complete == true
            and .high_water_equity >= 102.78112
            and .historical_high_water_equity >= 102.78112
            and (.last_reconciled_equity - 29.505501 | fabs) <= 0.01
          ' current-v5-capital-reserve-state.json >/dev/null
      - name: Deploy continuous funded Dynamic Quote service
        run: |
          set -euo pipefail
          deployed=false
          for attempt in 1 2 3; do
            if az deployment group create \
              --name "polyedge-funded-direct-cl-${GITHUB_RUN_ID}" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --template-file infra/funded-direct-chile.bicep \
              --parameters @infra/funded-direct-chile.parameters.json \
              --parameters venueProbeImage="${{ steps.images.outputs.funded_reference }}" \
              --parameters fundedDirectEnabled=false \
              --parameters fundedDirectQueueStatus=SendDisabled \
              --only-show-errors \
              -o json > funded-deployment.json 2> funded-deployment.stderr; then
              deployed=true
              break
            fi
            if ! grep -Fq 'unable to pull image using Managed identity' funded-deployment.stderr || [ "$attempt" -eq 3 ]; then
              cat funded-deployment.stderr >&2
              exit 1
            fi
            sleep "$((attempt * 30))"
          done
          test "$deployed" = true
          test "$(jq -r '.properties.provisioningState' funded-deployment.json)" = "Succeeded"
          workflow_revision_captured=false
          for attempt in $(seq 1 36); do
            az containerapp revision list \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --name "$FUNDED_APP" \
              --only-show-errors -o json > funded-workflow-revisions.json
            if ! workflow_revision=$(jq -er '
              [.[] | select(.properties.active == true)]
              | if length == 1 then .[0].name
                else error("expected one workflow-created funded revision")
                end
            ' funded-workflow-revisions.json); then
              sleep 5
              continue
            fi
            az containerapp revision show \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --name "$FUNDED_APP" \
              --revision "$workflow_revision" \
              --only-show-errors -o json > funded-workflow-revision.json
            jq -S '.properties.template' funded-workflow-revision.json \
              > funded-workflow-template.json
            if [ "$workflow_revision" != "$FUNDED_ROLLBACK_REVISION" ] \
                && ! cmp -s funded-rollback-template.json funded-workflow-template.json \
                && jq -e --arg image "${{ steps.images.outputs.funded_reference }}" '
                  .properties.template.scale.minReplicas == 0
                  and .properties.template.scale.maxReplicas == 1
                  and .properties.template.containers[0].image == $image
                  and (.properties.template.containers[0].command | join(" "))
                    == "node src/funded-direct-service.mjs"
                  and ([.properties.template.containers[0].env[]
                    | select(.name == "VENUE_PROBE_FUNDED_CAMPAIGN_ID"
                      and .value == "dynamic-quote-funded-2026-08-13-v10")] | length) == 1
                  and ([.properties.template.containers[0].env[]
                    | select(.name == "FUNDED_DIRECT_SESSION_MANIFEST_BLOB_NAME"
                      and .value == "reports/funded/dynamic-quote/sessions/dynamic-quote-funded-2026-08-13-v10/session.json")] | length) == 1
                  and ([.properties.template.containers[0].env[]
                    | select(.name == "FUNDED_DIRECT_SESSION_MANIFEST_SHA256"
                      and .value == "sha256:c516c052fc5c01eed5403842ff24bf4b08512d6c38e8260e2d064580c82322f8")] | length) == 1
                  and ([.properties.template.containers[0].env[]
                    | select(.name == "FUNDED_DIRECT_SERVICE_ENABLED" and .value == "false")] | length) == 1
                  and ([.properties.template.containers[0].env[]
                    | select(.name == "FUNDED_DIRECT_WORKER_ENABLED" and .value == "false")] | length) == 1
                  and ([.properties.template.containers[0].env[]
                    | select(.name == "FUNDED_DIRECT_AUTO_REDEMPTION_ENABLED" and .value == "false")] | length) == 1
                  and ([.properties.template.containers[0].env[]
                    | select(.name == "ALLOW_FUNDED_DIRECT" and .value == "false")] | length) == 1
                  and ([.properties.template.containers[0].env[]
                    | select(.name == "FUNDED_DIRECT_DRY_RUN" and .value == "true")] | length) == 1
                  and ([.properties.template.containers[0].env[]
                    | select(.name == "ALLOW_LIVE" and .value == "false")] | length) == 1
                  and ([.properties.template.containers[0].env[]
                    | select(.name == "ALLOW_STRATEGY_CANARY" and .value == "false")] | length) == 1
                  and ([.properties.template.containers[0].env[]
                    | select(.name == "ENABLE_TAKER_ORDERS" and .value == "false")] | length) == 1
                ' funded-workflow-revision.json >/dev/null; then
              workflow_template_sha256="sha256:$(sha256sum funded-workflow-template.json | cut -d' ' -f1)"
              {
                echo "FUNDED_WORKFLOW_ACTIVE_REVISION=$workflow_revision"
                echo "FUNDED_WORKFLOW_ACTIVE_TEMPLATE_SHA256=$workflow_template_sha256"
              } >> "$GITHUB_ENV"
              workflow_revision_captured=true
              break
            fi
            sleep 5
          done
          test "$workflow_revision_captured" = true

      - name: Keep the obsolete North Europe funded job fail-closed
        run: |
          set -euo pipefail
          az containerapp job update \
            --resource-group "$AZURE_RESOURCE_GROUP" \
