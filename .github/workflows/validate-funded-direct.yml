name: Validate funded Dynamic Quote safety

on:
  pull_request:
    paths:
      - ".github/workflows/validate-funded-direct.yml"
      - ".github/workflows/verify-funded-v10-intent.mjs"
      - ".github/workflows/verify-funded-v10-settlement.mjs"
      - "scripts/test-verify-funded-v10-capital.sh"
      - "scripts/verify-funded-v10-capital.sh"
      - "scripts/test-verify-funded-receiver-role-contract.sh"
      - "scripts/verify-funded-receiver-role-contract.sh"
      - "scripts/fence-funded-queue-and-wait-empty.sh"
      - "scripts/test-fence-funded-queue-and-wait-empty.sh"
      - "crates/polyedge-api/**"
      - "crates/polyedge-config/**"
      - "crates/polyedge-domain/**"
      - "crates/polyedge-storage/**"
      - "infra/funded-direct-chile.bicep"
      - "infra/funded-direct-chile.parameters.json"
      - "infra/storage-service-endpoints.bicep"
      - "infra/venue-probe.bicep"
      - "research/configs/funded_direct_dynamic_quote_*.json"
      - "venue-probe/**"
  workflow_dispatch:
    inputs:
      deploy_funded_service:
        description: Build and deploy the explicitly authorized continuous funded Dynamic Quote service
        required: true
        default: false
        type: boolean
      diagnose_latest_lifecycle:
        description: Read the latest funded lifecycle and report only failed summary field names
        required: true
        default: false
        type: boolean
      funded_receiver_transition_phase:
        description: Exact funded queue receiver contract; Azure-only remains the fail-closed default
        required: true
        default: azure-only
        type: choice
        options:
          - azure-only
          - azure-oci-transition

permissions:
  contents: read
  id-token: write

concurrency:
  group: validate-funded-direct-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  funded-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preserve isolated qset
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          git diff --name-only "origin/${GITHUB_BASE_REF}...HEAD" > changed-files.txt
          if grep -E '(^research/configs/.*qset|^infra/shadow-profitability-qset-v1\.bicep$|^\.github/workflows/deploy-polyedge-shadow-qset\.yml$)' changed-files.txt; then
            echo "Funded repair must not modify the frozen qset lane" >&2
            exit 1
          fi

      - name: Validate immutable operator-funded session and continuous deployment inputs
        run: |
          set -euo pipefail
          node <<'NODE'
          const assert = require("node:assert/strict");
          const crypto = require("node:crypto");
          const fs = require("node:fs");
          const session = JSON.parse(fs.readFileSync("research/configs/funded_direct_dynamic_quote_2026-08-13_v10.json"));
          const predecessor = JSON.parse(fs.readFileSync("research/configs/funded_direct_dynamic_quote_2026-07-29_v5.json"));
          const parameters = JSON.parse(fs.readFileSync("infra/funded-direct-chile.parameters.json")).parameters;
          const embedded = JSON.parse(parameters.fundedDirectSessionManifestJson.value);
          assert.deepEqual(embedded, session);
          const digest = `sha256:${crypto.createHash("sha256").update(JSON.stringify(session, null, 2)).digest("hex")}`;
          assert.equal(parameters.fundedDirectSessionManifestSha256.value, digest);
          assert.equal(parameters.fundedDirectEnabled.value, true);
          assert.equal(session.research_promotion_bypassed, true);
          assert.equal(session.research_lane_isolated, true);
          assert.equal(session.no_deposits, true);
          assert.equal(session.allow_automatic_replenishment, false);
          assert.equal(session.allow_compounding, true);
          assert.equal(session.schema_version, "polyedge.operator_funded_session.v3");
          assert.equal(session.continue_after_loss, true);
          assert.equal(session.capital_policy.reserve_ratio, 0.1);
          assert.equal(session.capital_policy.minimum_reserve, 2);
          assert.equal(session.capital_policy.target_order_ratio, 0.05);
          assert.equal(session.capital_policy.operating_buffer_ratio, 0.01);
          assert.equal(session.capital_policy.minimum_order_notional, 1);
          assert.equal(session.capital_policy.reserve_basis, "fully_reconciled_current_equity");
          assert.equal(session.capital_policy.loss_response, "resize_from_fully_reconciled_current_equity");
          assert.equal(session.capital_policy.prior_state_session_id, predecessor.session_id);
          assert.equal(session.capital_policy.prior_state_blob_name, predecessor.capital_policy.state_blob_name);
          assert.equal(
            session.capital_policy.prior_state_sha256,
            "sha256:9e63db7ef8c22d3af53a14f1858b817b8769ca7ba737e6668a900ffb73330c15"
          );
          assert.equal(session.capital_policy.minimum_historical_high_water_equity, 102.78112);
          assert.equal(session.capital_policy.high_water_update, "full_reconciliation_only");
          assert.equal(session.capital_policy.reserve_monotonic, false);
          assert.deepEqual(session.external_cash_flows, []);
          assert.deepEqual(session.internal_settlements, []);
          assert.equal(session.session_id, "dynamic-quote-funded-2026-08-13-v10");
          assert.equal(session.starting_collateral, 29.505501);
          assert.equal(session.max_account_loss, 29.505501);
          assert.equal(session.target_order_notional, 10.5);
          assert.equal(session.max_order_notional, 10.5);
          assert.equal(
            parameters.fundedDirectSessionManifestBlobName.value,
            "reports/funded/dynamic-quote/sessions/dynamic-quote-funded-2026-08-13-v10/session.json"
          );
          assert.equal(
            parameters.fundedDirectSessionManifestSha256.value,
            "sha256:c516c052fc5c01eed5403842ff24bf4b08512d6c38e8260e2d064580c82322f8"
          );
          assert.equal(parameters.fundedDirectCampaignId.value, session.session_id);
          for (const name of [
            "fundedDirectReserveMigrationSourceSessionId",
            "fundedDirectReserveMigrationSourceSessionManifestBlobName",
            "fundedDirectReserveMigrationSourceSessionManifestSha256",
            "fundedDirectReserveMigrationSourceStateBlobName",
            "fundedDirectReserveMigrationMinimumHistoricalHighWaterEquity"
          ]) assert.equal(parameters[name].value, "");
          assert.equal(parameters.fundedDirectStartingCollateral.value, "29.505501");
          assert.equal(parameters.fundedDirectMaxAccountLoss.value, "29.505501");
          NODE
          node --test .github/workflows/verify-funded-v10-intent.mjs

      - name: Validate archived failed-closed redemption guard
        run: |
          set -euo pipefail
          redemption_filter=$(awk '
            /--arg blob_name .*--arg latest .*v10_latest_redemption.*\047$/ {capture=1; next}
            capture && /^[[:space:]]*\047 "\$redemption_file"/ {exit}
            capture {sub(/^              /, ""); print}
          ' .github/workflows/validate-funded-direct.yml)
          test -n "$redemption_filter"
          binding_diagnostic_filter=$(awk '
            /binding_diagnostic=\$\(jq -er --argjson settlement_bindings .*\047$/ {capture=1; next}
            capture && /^[[:space:]]*\047 "\$redemption_file"/ {exit}
            capture {sub(/^                /, ""); print}
          ' .github/workflows/validate-funded-direct.yml)
          test -n "$binding_diagnostic_filter"
          redemption_contract_diagnostic_filter=$(awk '
            /redemption_contract_category=\$\(jq -er .*\047$/ {capture=1; next}
            capture && /^[[:space:]]*\047 "\$redemption_file"/ {exit}
            capture {sub(/^                /, ""); print}
          ' .github/workflows/validate-funded-direct.yml)
          test -n "$redemption_contract_diagnostic_filter"
          legacy_candidate_verifier=$(awk '
            index($0, "# legacy_" "candidate_verifier_begin") {capture=1; next}
            index($0, "# legacy_" "candidate_verifier_end") {exit}
            capture {sub(/^          /, ""); print}
          ' .github/workflows/validate-funded-direct.yml)
          test -n "$legacy_candidate_verifier"
          eval "$legacy_candidate_verifier"
          candidate_test_dir=$(mktemp -d)
          trap 'rm -rf -- "$candidate_test_dir"' EXIT
          candidate_fixture="$candidate_test_dir/candidates.jsonl"
          printf '%s\n' \
            '{"blob_name":"redemptions/2026-08-16/venue-redemption-20260816111111111-aaaaaaaa.json","record_sha256":"sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"}' \
            '{"blob_name":"redemptions/2026-08-16/venue-redemption-20260816122222222-bbbbbbbb.json","record_sha256":"sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb"}' \
            > "$candidate_fixture"
          jq -sc 'sort_by(.blob_name)' "$candidate_fixture" | tr -d '\n' \
            > "$candidate_test_dir/expected.json"
          candidate_fixture_sha="sha256:$(sha256sum \
            "$candidate_test_dir/expected.json" | cut -d' ' -f1)"
          verify_reviewed_legacy_onchain_candidates "$candidate_fixture" 2 \
            "$candidate_fixture_sha" "$candidate_test_dir/verified.json"
          reject_candidate_fixture() {
            if verify_reviewed_legacy_onchain_candidates "$1" 2 \
                "$candidate_fixture_sha" "$candidate_test_dir/rejected.json"; then
              echo "unexpected accepted legacy candidate mutation" >&2
              exit 1
            fi
          }
          jq -c 'if input_line_number == 1 then .blob_name += "-future" else . end' \
            "$candidate_fixture" > "$candidate_test_dir/wrong-name.jsonl"
          reject_candidate_fixture "$candidate_test_dir/wrong-name.jsonl"
          jq -c 'if input_line_number == 1 then .record_sha256 = ("sha256:" + ("c" * 64)) else . end' \
            "$candidate_fixture" > "$candidate_test_dir/wrong-sha.jsonl"
          reject_candidate_fixture "$candidate_test_dir/wrong-sha.jsonl"
          head -n 1 "$candidate_fixture" > "$candidate_test_dir/missing.jsonl"
          reject_candidate_fixture "$candidate_test_dir/missing.jsonl"
          cp "$candidate_fixture" "$candidate_test_dir/extra.jsonl"
          printf '%s\n' \
            '{"blob_name":"redemptions/2026-08-17/venue-redemption-20260817000000000-cccccccc.json","record_sha256":"sha256:cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc"}' \
            >> "$candidate_test_dir/extra.jsonl"
          reject_candidate_fixture "$candidate_test_dir/extra.jsonl"
          maintenance_verifier=$(awk '
            index($0, "# maintenance_" "predecessor_verifier_begin") {capture=1; next}
            index($0, "# maintenance_" "predecessor_verifier_end") {exit}
            capture {sub(/^          /, ""); print}
          ' .github/workflows/validate-funded-direct.yml)
          test -n "$maintenance_verifier"
          eval "$maintenance_verifier"
          maintenance_fixture="$candidate_test_dir/maintenance.json"
          jq -n '{
            name: "app--maintenance",
            properties: {
              active: true,
              healthState: "Healthy",
              template: {
                containers: [{
                  image: "registry.example.invalid/worker@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa",
                  env: [{
                    name: "FUNDED_DIRECT_AUTO_REDEMPTION_ENABLED",
                    value: "false"
                  }]
                }],
                scale: {minReplicas: 1, maxReplicas: 1}
              }
            }
          }' > "$maintenance_fixture"
          jq -S '.properties.template' "$maintenance_fixture" \
            > "$candidate_test_dir/maintenance-template.json"
          maintenance_template_sha="sha256:$(sha256sum \
            "$candidate_test_dir/maintenance-template.json" | cut -d' ' -f1)"
          verify_exact_maintenance_predecessor "$maintenance_fixture" \
            app--maintenance \
            "registry.example.invalid/worker@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa" \
            "$maintenance_template_sha" \
            "$candidate_test_dir/maintenance-verified.json"
          reject_maintenance_fixture() {
            if verify_exact_maintenance_predecessor "$1" \
                app--maintenance \
                "registry.example.invalid/worker@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa" \
                "$maintenance_template_sha" \
                "$candidate_test_dir/maintenance-rejected.json"; then
              echo "unexpected accepted maintenance predecessor mutation" >&2
              exit 1
            fi
          }
          jq '.name="app--wrong"' "$maintenance_fixture" \
            > "$candidate_test_dir/maintenance-wrong-revision.json"
          reject_maintenance_fixture \
            "$candidate_test_dir/maintenance-wrong-revision.json"
          jq '.properties.template.containers[0].image="registry.example.invalid/wrong@sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb"' \
            "$maintenance_fixture" \
            > "$candidate_test_dir/maintenance-wrong-image.json"
          reject_maintenance_fixture "$candidate_test_dir/maintenance-wrong-image.json"
          jq '.properties.template.containers[0].env[0].value="true"' \
            "$maintenance_fixture" \
            > "$candidate_test_dir/maintenance-wrong-auto.json"
          reject_maintenance_fixture "$candidate_test_dir/maintenance-wrong-auto.json"
          jq '.properties.template.scale.maxReplicas=2' "$maintenance_fixture" \
            > "$candidate_test_dir/maintenance-wrong-template.json"
          reject_maintenance_fixture "$candidate_test_dir/maintenance-wrong-template.json"
          producer_selector='[.[] | select(.properties.active == true)] as $active
            | if ($active | length) == 1
                and $active[0].properties.healthState == "Healthy"
                and $active[0].properties.replicas >= 1
              then $active[0].name
              else error("expected one active healthy producer revision")
              end'
          jq -n '[{
            name: "producer--ready",
            properties: {active: true, healthState: "Healthy", replicas: 1}
          }]' > "$candidate_test_dir/producer-selector.json"
          test "$(jq -er "$producer_selector" \
            "$candidate_test_dir/producer-selector.json")" = "producer--ready"
          jq '. += [{name:"producer--unexpected", properties:{active:true,healthState:"Healthy",replicas:1}}]' \
            "$candidate_test_dir/producer-selector.json" \
            > "$candidate_test_dir/producer-selector-ambiguous.json"
          if jq -er "$producer_selector" \
              "$candidate_test_dir/producer-selector-ambiguous.json" >/dev/null; then
            echo "unexpected accepted ambiguous producer revision" >&2
            exit 1
          fi
          prefix='reports/funded/dynamic-quote/sessions/dynamic-quote-funded-2026-08-13-v10/'
          latest="${prefix}latest-redemption.json"
          archive_prefix="${prefix}redemptions/"
          archive="${archive_prefix}2026-08-15/venue-redemption-20260815001356008-deadbeef.json"
          common=(--argjson authorized_ceiling 29.505501 --arg latest "$latest" \
            --argjson redemption_control '{}' --arg recovery_control_blob_name '' \
            --arg recovery_control_sha256 '' \
            --argjson recovery_journal_summary '{}')
          valid_failed='{"schema_version":1,"finished_ts":"2026-08-15T00:13:56.008Z","run_id":"venue-redemption-20260815001356008-deadbeef","status":"failed_closed","error":"Data API positions returned HTTP 429","redemption_submitted":false,"research_only":false,"live_strategy_enabled":true}'
          valid_timeout="$(printf '%s\n' "$valid_failed" | jq -c \
            '.error="The operation was aborted due to timeout"')"
          valid_activity_rate_limit="$(printf '%s\n' "$valid_failed" | jq -c \
            '.error="Data API activity returned HTTP 429"')"
          valid_legacy_no_payout="$(printf '%s\n' "$valid_failed" | jq -c \
            '.error=("fail closed: selected condition has no positive onchain payout (0x" + ("a" * 64) + ")")')"
          valid_legacy_payout_mismatch="$(printf '%s\n' "$valid_failed" | jq -c \
            '.error=("fail closed: Data API payout disagrees with onchain payout for 0x" + ("b" * 64))')"
          validate_record() {
            local blob_name="$1"
            local document="$2"
            local settlement_bindings="${3:-[]}"
            printf '%s\n' "$document" | jq -e "${common[@]}" \
              --argjson settlement_bindings "$settlement_bindings" \
              --arg record_sha256 \
                "sha256:$(printf '%s' "$document" | sha256sum | cut -d' ' -f1)" \
              --arg blob_name "$blob_name" "$redemption_filter" >/dev/null || return 1
            if [ "$blob_name" != "$latest" ]; then
              local redemption_date redemption_run
              redemption_date=$(printf '%s\n' "$document" | jq -r '.finished_ts[0:10]')
              redemption_run=$(printf '%s\n' "$document" | jq -r '.run_id')
              test "$blob_name" = "${archive_prefix}${redemption_date}/${redemption_run}.json"
            fi
          }
          assert_contract_category() {
            local expected="$1"
            local blob_name="$2"
            local document="$3"
            local actual
            actual=$(printf '%s\n' "$document" | jq -er "${common[@]}" \
              --arg record_sha256 \
                "sha256:$(printf '%s' "$document" | sha256sum | cut -d' ' -f1)" \
              --arg blob_name "$blob_name" \
              "$redemption_contract_diagnostic_filter")
            test "$actual" = "$expected"
          }
          reject_record() {
            if validate_record "$1" "$2" "${3:-[]}"; then
              echo "unexpected accepted redemption fixture" >&2
              exit 1
            fi
          }
          validate_record "$archive" "$valid_failed"
          validate_record "$archive" "$valid_timeout"
          validate_record "$archive" "$valid_activity_rate_limit"
          validate_record "$archive" "$valid_legacy_no_payout"
          validate_record "$archive" "$valid_legacy_payout_mismatch"
          validate_record "$latest" "$valid_failed"
          reject_record "$latest" "$valid_legacy_no_payout"
          assert_contract_category ok "$archive" "$valid_failed"
          assert_contract_category ok "$archive" "$valid_activity_rate_limit"
          assert_contract_category ok "$latest" "$valid_failed"
          assert_contract_category failed_closed_error_class "$latest" \
            "$valid_legacy_no_payout"
          assert_contract_category failed_closed_error_class "$archive" \
            "$(printf '%s\n' "$valid_failed" | jq -c '.error="unexpected"')"
          assert_contract_category failed_closed_submission "$archive" \
            "$(printf '%s\n' "$valid_failed" | jq -c '.redemption_submitted=true')"
          assert_contract_category failed_closed_research_mode "$archive" \
            "$(printf '%s\n' "$valid_failed" | jq -c '.research_only=true')"
          assert_contract_category failed_closed_live_strategy "$archive" \
            "$(printf '%s\n' "$valid_failed" | jq -c '.live_strategy_enabled=false')"
          assert_contract_category failed_closed_field_set "$archive" \
            "$(printf '%s\n' "$valid_failed" | jq -c '.unexpected="no"')"
          assert_contract_category record_header "$archive" \
            "$(printf '%s\n' "$valid_failed" | jq -c '.finished_ts="2026-02-30T00:13:56.008Z"')"
          reject_record "$archive" "$(printf '%s\n' "$valid_timeout" | jq -c '.redemption_submitted=true')"
          reject_record "$archive" "$(printf '%s\n' "$valid_timeout" | jq -c '.research_only=true')"
          reject_record "$archive" "$(printf '%s\n' "$valid_timeout" | jq -c '.live_strategy_enabled=false')"
          reject_record "$archive" "$(printf '%s\n' "$valid_timeout" | jq -c '.unexpected="no"')"
          reject_record "$archive" "$(printf '%s\n' "$valid_timeout" | jq -c 'del(.research_only)')"
          reject_record "$archive" "$(printf '%s\n' "$valid_timeout" | jq -c '.error="The operation was aborted due to timeout."')"
          reject_record "$archive" "$(printf '%s\n' "$valid_failed" | jq -c '.error="Data API positions returned HTTP 500"')"
          reject_record "$archive" "$(printf '%s\n' "$valid_failed" | jq -c '.error="Data API activity returned HTTP 500"')"
          reject_record "$archive" "$(printf '%s\n' "$valid_failed" | jq -c '.error="Data API activity returned HTTP 429 extra"')"
          reject_record "$archive" "$(printf '%s\n' "$valid_legacy_no_payout" | jq -c '.error += " extra"')"
          reject_record "$archive" "$(printf '%s\n' "$valid_legacy_payout_mismatch" | jq -c '.error |= sub("0x"; "0X")')"
          reject_record "$archive" "$(printf '%s\n' "$valid_failed" | jq -c '.redemption_submitted=true')"
          reject_record "$archive" "$(printf '%s\n' "$valid_failed" | jq -c '.unexpected="no"')"
          reject_record "$archive" "$(printf '%s\n' "$valid_failed" | jq -c 'del(.research_only)')"
          reject_record "$archive" "$(printf '%s\n' "$valid_failed" | jq -c '.run_id += "\n"')"
          reject_record "$archive" "$(printf '%s\n' "$valid_failed" | jq -c '.finished_ts="2026-08-15garbage"')"
          reject_record "$archive" "$(printf '%s\n' "$valid_failed" | jq -c '.finished_ts="2026-02-30T00:13:56.008Z"')"
          valid_noop='{"schema_version":1,"finished_ts":"2026-08-15T00:14:56.008Z","run_id":"venue-redemption-20260815001456008-acde1234","status":"nothing_to_redeem","execution_origin":"azure_chile_central_static_egress","execution_country":"CL","static_egress_verified":true,"dry_run":false,"redemption_enabled":true,"zero_open_orders_confirmed":true,"derived_wallet_match":true,"wallet_type":"legacy_uups_deposit_wallet","research_only":false,"live_strategy_enabled":true,"liquid_collateral_before":5,"redemption_submitted":false,"selection":{"selected":[],"selected_gross_payout":0},"planned_calls":[]}'
          validate_record "$latest" "$valid_noop"
          assert_contract_category ok "$latest" "$valid_noop"
          assert_contract_category active_execution_contract "$latest" \
            "$(printf '%s\n' "$valid_noop" | jq -c '.dry_run=true')"
          assert_contract_category nothing_to_redeem_contract "$latest" \
            "$(printf '%s\n' "$valid_noop" | jq -c '.planned_calls=[{}]')"
          assert_contract_category unsupported_status "$latest" \
            "$(printf '%s\n' "$valid_noop" | jq -c '.status="unexpected"')"
          transaction_hash="0x$(printf 'a%.0s' {1..64})"
          condition_id="0x$(printf 'b%.0s' {1..64})"
          settlement_blob="${prefix}internal-settlements/$(printf 'c%.0s' {1..64}).json"
          settlement_bindings=$(jq -cn \
            --arg blob_name "$settlement_blob" \
            --arg transaction_hash "$transaction_hash" \
            --arg condition_id "$condition_id" '[{
              blob_name: $blob_name,
              type: "internal_automatic_settlement",
              transaction_hash: $transaction_hash,
              condition_id: $condition_id,
              payout: 2
            }]')
          valid_verified=$(jq -cn \
            --arg transaction_hash "$transaction_hash" \
            --arg condition_id "$condition_id" \
            --arg settlement_blob "$settlement_blob" '{
              schema_version: 1,
              finished_ts: "2026-08-15T00:15:56.008Z",
              run_id: "venue-redemption-20260815001556008-f00dbabe",
              status: "redeemed_and_verified",
              execution_origin: "azure_chile_central_static_egress",
              execution_country: "CL",
              static_egress_verified: true,
              dry_run: false,
              redemption_enabled: true,
              zero_open_orders_confirmed: true,
              derived_wallet_match: true,
              wallet_type: "legacy_uups_deposit_wallet",
              research_only: false,
              live_strategy_enabled: true,
              liquid_collateral_before: 5,
              redemption_submitted: true,
              selection: {
                selected: [{condition_id: $condition_id, gross_payout: 2}],
                selected_gross_payout: 2
              },
              planned_calls: [{}],
              transaction_id: "fixture-transaction",
              transaction_hash: $transaction_hash,
              liquid_collateral_after: 7,
              realized_payout: 2,
              internal_settlement_blobs: [$settlement_blob]
            }')
          recovery_run_id="venue-redemption-20260815001656008-acde1234"
          predecessor_run_id="venue-redemption-20260815001356008-deadbeef"
          recovery_control_blob_name="${prefix}recovery-controls/${predecessor_run_id}.json"
          recovery_control_sha256="sha256:$(printf 'recovery-journal' | sha256sum | cut -d' ' -f1)"
          valid_submitted_failure=$(printf '%s\n' "$valid_failed" | jq -c '
            .error="fail closed: terminal evidence requires zero durable unresolved risk reservations (observed 1)"
            | .redemption_submitted=true')
          valid_recovered=$(printf '%s\n' "$valid_verified" | jq -c \
            --arg run_id "$recovery_run_id" \
            --arg recovery_control_blob_name "$recovery_control_blob_name" \
            --arg predecessor_run_id "$predecessor_run_id" '
            .run_id=$run_id
            | .status="recovered_confirmed_and_verified"
            | .liquid_collateral_after=.liquid_collateral_before
            | .planned_calls=[]
