name: Validate funded Dynamic Quote safety

on:
  pull_request:
    paths:
      - ".github/workflows/validate-funded-direct.yml"
      - "crates/polyedge-api/**"
      - "crates/polyedge-config/**"
      - "crates/polyedge-domain/**"
      - "crates/polyedge-storage/**"
      - "infra/funded-direct-chile.bicep"
      - "infra/funded-direct-chile.parameters.json"
      - "infra/storage-service-endpoints.bicep"
      - "infra/venue-probe.bicep"
      - "research/configs/funded_direct_dynamic_quote_*.json"
      - "venue-probe/**"
  workflow_dispatch:
    inputs:
      deploy_funded_service:
        description: Build and deploy the explicitly authorized continuous funded Dynamic Quote service
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

concurrency:
  group: validate-funded-direct-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  funded-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preserve isolated qset
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          git diff --name-only "origin/${GITHUB_BASE_REF}...HEAD" > changed-files.txt
          if grep -E '(^research/configs/.*qset|^infra/shadow-profitability-qset-v1\.bicep$|^\.github/workflows/deploy-polyedge-shadow-qset\.yml$)' changed-files.txt; then
            echo "Funded repair must not modify the frozen qset lane" >&2
            exit 1
          fi

      - name: Validate immutable operator-funded session and continuous deployment inputs
        run: |
          set -euo pipefail
          node <<'NODE'
          const assert = require("node:assert/strict");
          const crypto = require("node:crypto");
          const fs = require("node:fs");
          const session = JSON.parse(fs.readFileSync("research/configs/funded_direct_dynamic_quote_2026-08-12_v9.json"));
          const predecessor = JSON.parse(fs.readFileSync("research/configs/funded_direct_dynamic_quote_2026-07-29_v5.json"));
          const parameters = JSON.parse(fs.readFileSync("infra/funded-direct-chile.parameters.json")).parameters;
          const embedded = JSON.parse(parameters.fundedDirectSessionManifestJson.value);
          assert.deepEqual(embedded, session);
          const digest = `sha256:${crypto.createHash("sha256").update(JSON.stringify(session, null, 2)).digest("hex")}`;
          assert.equal(parameters.fundedDirectSessionManifestSha256.value, digest);
          assert.equal(parameters.fundedDirectEnabled.value, true);
          assert.equal(session.research_promotion_bypassed, true);
          assert.equal(session.research_lane_isolated, true);
          assert.equal(session.no_deposits, true);
          assert.equal(session.allow_automatic_replenishment, false);
          assert.equal(session.allow_compounding, true);
          assert.equal(session.schema_version, "polyedge.operator_funded_session.v3");
          assert.equal(session.continue_after_loss, true);
          assert.equal(session.capital_policy.reserve_ratio, 0.1);
          assert.equal(session.capital_policy.minimum_reserve, 2);
          assert.equal(session.capital_policy.target_order_ratio, 0.05);
          assert.equal(session.capital_policy.operating_buffer_ratio, 0.01);
          assert.equal(session.capital_policy.minimum_order_notional, 1);
          assert.equal(session.capital_policy.reserve_basis, "fully_reconciled_current_equity");
          assert.equal(session.capital_policy.loss_response, "resize_from_fully_reconciled_current_equity");
          assert.equal(session.capital_policy.prior_state_session_id, predecessor.session_id);
          assert.equal(session.capital_policy.prior_state_blob_name, predecessor.capital_policy.state_blob_name);
          assert.equal(
            session.capital_policy.prior_state_sha256,
            "sha256:617b0bd69466dc7d6ff7d61b26f5a4ed1bcfd557d5d9e4b62688b7fb13bf28c6"
          );
          assert.equal(session.capital_policy.minimum_historical_high_water_equity, 102.78112);
          assert.equal(session.capital_policy.high_water_update, "full_reconciliation_only");
          assert.equal(session.capital_policy.reserve_monotonic, false);
          assert.deepEqual(session.external_cash_flows, []);
          assert.deepEqual(session.internal_settlements, []);
          assert.equal(session.session_id, "dynamic-quote-funded-2026-08-12-v9");
          assert.equal(session.starting_collateral, 31.655501);
          assert.equal(session.max_account_loss, 31.655501);
          assert.equal(session.target_order_notional, 10.5);
          assert.equal(session.max_order_notional, 10.5);
          assert.equal(
            parameters.fundedDirectSessionManifestBlobName.value,
            "reports/funded/dynamic-quote/sessions/dynamic-quote-funded-2026-08-12-v9/session.json"
          );
          assert.equal(
            parameters.fundedDirectSessionManifestSha256.value,
            "sha256:15f7b4e2c749d401e9dbab01a6a9dca8ce81166948a5621a8b4c6dff536f4d22"
          );
          assert.equal(parameters.fundedDirectCampaignId.value, session.session_id);
          for (const name of [
            "fundedDirectReserveMigrationSourceSessionId",
            "fundedDirectReserveMigrationSourceSessionManifestBlobName",
            "fundedDirectReserveMigrationSourceSessionManifestSha256",
            "fundedDirectReserveMigrationSourceStateBlobName",
            "fundedDirectReserveMigrationMinimumHistoricalHighWaterEquity"
          ]) assert.equal(parameters[name].value, "");
          assert.equal(parameters.fundedDirectStartingCollateral.value, "31.655501");
          assert.equal(parameters.fundedDirectMaxAccountLoss.value, "31.655501");
          NODE

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: venue-probe/package-lock.json

      - name: Test funded worker and adversarial controls
        working-directory: venue-probe
        run: |
          npm ci
          npm test

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Validate intent producer contracts
        run: |
          set -euo pipefail
          cargo fmt --all --check
          cargo test -p polyedge-api
          cargo test -p polyedge-config
          cargo test -p polyedge-domain
          cargo test -p polyedge-storage

      - name: Build fail-closed Azure templates
        run: |
          set -euo pipefail
          az bicep build --file infra/funded-direct-chile.bicep --stdout > funded-direct-chile.json
          az bicep build --file infra/storage-service-endpoints.bicep --stdout > storage-service-endpoints.json
          az bicep build --file infra/venue-probe.bicep --stdout > venue-probe.json
          node <<'NODE'
          const assert = require("node:assert/strict");
          const fs = require("node:fs");
          const template = JSON.parse(fs.readFileSync("funded-direct-chile.json"));
          const resources = (type) => template.resources.filter((resource) => resource.type === type);
          const [namespace] = resources("Microsoft.ServiceBus/namespaces");
          assert.equal(resources("Microsoft.ServiceBus/namespaces").length, 1);
          assert.equal(namespace.sku.name, "Standard");
          assert.equal(namespace.properties.disableLocalAuth, true);
          assert.equal(namespace.properties.publicNetworkAccess, "Enabled");
          const [networkRules] = resources("Microsoft.ServiceBus/namespaces/networkRuleSets");
          assert.equal(networkRules.properties.defaultAction, "Deny");
          assert.equal(networkRules.properties.ipRules.length, 2);
          assert.equal(template.parameters.fundedDirectQueueStatus.defaultValue, "Active");
          assert.deepEqual(template.parameters.fundedDirectQueueStatus.allowedValues, ["Active", "SendDisabled"]);
          const [queue] = resources("Microsoft.ServiceBus/namespaces/queues");
          assert.equal(queue.properties.status, "[parameters('fundedDirectQueueStatus')]");
          assert.equal(queue.properties.requiresDuplicateDetection, true);
          assert.equal(queue.properties.duplicateDetectionHistoryTimeWindow, "PT10M");
          assert.equal(queue.properties.defaultMessageTimeToLive, "PT10S");
          assert.equal(queue.properties.lockDuration, "PT30S");
          assert.equal(queue.properties.deadLetteringOnMessageExpiration, true);
          assert.equal(queue.properties.maxDeliveryCount, 3);
          const deadLetterAlert = resources("Microsoft.Insights/metricAlerts").find((resource) =>
            resource.name === "polyedge-funded-direct-dead-letters");
          assert.equal(deadLetterAlert.properties.criteria.allOf[0].timeAggregation, "Maximum");
          const roleIds = resources("Microsoft.Authorization/roleAssignments")
            .map((resource) => resource.properties.roleDefinitionId.toLowerCase());
          assert.equal(roleIds.filter((value) => value.includes("69a216fc-b8fb-44d8-bc22-1f3c2cd27a39")).length, 1);
          assert.equal(roleIds.filter((value) => value.includes("4f6d3b9b-027b-4f4c-9142-0e5a2a2247e0")).length, 1);
          const isolatedEndpoints = JSON.parse(fs.readFileSync("storage-service-endpoints.json"));
          const endpointSubnets = isolatedEndpoints.resources.filter((resource) =>
            resource.type === "Microsoft.Network/virtualNetworks/subnets");
          assert.equal(endpointSubnets.length, 2);
          assert.equal(endpointSubnets.every((resource) =>
            resource.properties.serviceEndpoints.some((endpoint) => endpoint.service === "Microsoft.Storage.Global")), true);
          const chileVnet = template.resources.find((resource) =>
            resource.type === "Microsoft.Network/virtualNetworks");
          assert.equal(chileVnet.properties.subnets[0].properties.serviceEndpoints[0].service, "Microsoft.Storage.Global");
          assert.equal(template.parameters.producerPublicIpName.defaultValue, "pip-polyedge-venue-neu-egress-2");
          const app = template.resources.find((resource) =>
            resource.type === "Microsoft.App/containerApps" &&
            resource.properties.template.containers[0].name === "funded-direct");
          const envEntries = app.properties.template.containers[0].env;
          const env = Object.fromEntries(envEntries.map((entry) => [entry.name, entry.value]));
          assert.equal(env.FUNDED_DIRECT_ENGINE, "persistent_v1");
          assert.equal(env.FUNDED_DIRECT_SERVICE_BUS_ENABLED, "true");
          assert.equal(env.FUNDED_DIRECT_SIGNAL_TO_SEND_SLO_MS, "2000");
          assert.equal(env.FUNDED_DIRECT_POLL_INTERVAL_MS, "1000");
          assert.equal(env.FUNDED_DIRECT_MIN_REMAINING_TTL_MS, "7000");
          assert.equal(env.FUNDED_DIRECT_CHILD_MIN_REMAINING_TTL_MS, "2000");
          for (const name of [
            "FUNDED_DIRECT_RESERVE_MIGRATION_SOURCE_SESSION_ID",
            "FUNDED_DIRECT_RESERVE_MIGRATION_SOURCE_SESSION_MANIFEST_BLOB_NAME",
            "FUNDED_DIRECT_RESERVE_MIGRATION_SOURCE_SESSION_MANIFEST_SHA256",
            "FUNDED_DIRECT_RESERVE_MIGRATION_SOURCE_STATE_BLOB_NAME",
            "FUNDED_DIRECT_RESERVE_MIGRATION_MINIMUM_HISTORICAL_HIGH_WATER_EQUITY"
          ]) assert.ok(name in env, `${name} missing from funded executor`);
          assert.match(JSON.stringify(env.FUNDED_DIRECT_AUTO_REDEMPTION_ENABLED), /fundedDirectEnabled/);
          assert.equal(env.FUNDED_DIRECT_AUTO_REDEMPTION_INTERVAL_MS, "60000");
          assert.equal(env.FUNDED_DIRECT_AUTO_REDEMPTION_MIN_SECONDS_TO_EXPIRY, "30");
          assert.equal(env.FUNDED_DIRECT_AUTO_REDEMPTION_MAX_SECONDS_TO_EXPIRY, "350");
          assert.equal("VENUE_REDEMPTION_MAX_PAYOUT" in env, false);
          assert.equal(env.VENUE_REDEMPTION_MAX_CONDITIONS, "1");
          assert.equal(
            envEntries.find((entry) => entry.name === "POLYMARKET_RELAYER_API_KEY")?.secretRef,
            "polymarket-relayer-api-key"
          );
          assert.equal(
            app.properties.configuration.secrets.find((entry) => entry.name === "polymarket-relayer-api-key")
              ?.keyVaultUrl.includes("secrets/polymarket-relayer-api-key"),
            true
          );
          assert.equal(app.properties.template.scale.maxReplicas, 1);
          assert.match(JSON.stringify(app.properties.template.scale.minReplicas), /fundedDirectEnabled/);
          const producer = JSON.parse(fs.readFileSync("venue-probe.json")).resources.find((resource) =>
            resource.type === "Microsoft.App/containerApps" &&
            resource.properties.template.containers[0].name === "shadow-runtime");
          const producerEnv = Object.fromEntries(producer.properties.template.containers[0].env.map((entry) => [entry.name, entry.value]));
          assert.ok("FUNDED_DIRECT_SERVICE_BUS_ENABLED" in producerEnv);
          assert.ok("FUNDED_DIRECT_SERVICE_BUS_NAMESPACE" in producerEnv);
          assert.ok("FUNDED_DIRECT_SERVICE_BUS_QUEUE" in producerEnv);
          assert.equal(producerEnv.LOCAL_JSONL_RECORDER_ENABLED, "false");
          assert.equal(
            JSON.parse(fs.readFileSync("venue-probe.json")).parameters.publicIpName.defaultValue,
            "pip-polyedge-venue-neu-egress-2"
          );
          const producerVnet = JSON.parse(fs.readFileSync("venue-probe.json")).resources.find((resource) =>
            resource.type === "Microsoft.Network/virtualNetworks");
          assert.equal(producerVnet.properties.subnets[0].properties.serviceEndpoints[0].service, "Microsoft.Storage.Global");
          const warmup = template.resources.find((resource) =>
            resource.type === "Microsoft.App/jobs" &&
            resource.properties.template.containers[0].name === "funded-warmup");
          assert.equal(warmup.properties.template.containers[0].command.join(" "), "node src/funded-direct-warmup.mjs");
          assert.equal(warmup.properties.template.containers[0].env.some((entry) => entry.name === "POLYMARKET_PRIVATE_KEY"), false);
          NODE
          git diff --check

  deploy-funded-service:
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_funded_service
    needs: funded-safety
    runs-on: ubuntu-latest
    timeout-minutes: 300
    concurrency:
      group: polyedge-funded-direct-cl
      cancel-in-progress: false
    env:
      AZURE_RESOURCE_GROUP: rg-polyedge-dev
      ACR_NAME: crpolyedge6urdjr5nmwx7w
      FUNDED_APP: polyedge-funded-direct-cl
      INTENT_PRODUCER_APP: polyedge-shadow-neu
      PROTECTED_QSET_APP: polyedge-shadow-qset-neu
      SERVICE_BUS_NAMESPACE: sb-polyedge-funded-cl-6urdjr5nmwx7w
      SERVICE_BUS_QUEUE: funded-dynamic-quote-intents
      FUNDED_JOB: polyedge-funded-direct-cl-job
      LEGACY_NEU_FUNDED_JOB: polyedge-funded-ladder-neu-job
      STORAGE_ACCOUNT: stpolyedge6urdjr5nmwx7w
      FUNDED_CONTAINER: polyedge-funded-evidence
    steps:
      - uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Verify deployment identity, intent producer, and protected qset
        env:
          EXPECTED_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          set -euo pipefail
          test "$(az account show --query id -o tsv)" = "$EXPECTED_SUBSCRIPTION_ID"
          az group show --name "$AZURE_RESOURCE_GROUP" --query name -o tsv
          az containerapp show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$INTENT_PRODUCER_APP" \
            --query properties.latestRevisionName \
            -o tsv > intent-producer-revision-before.txt
          test -s intent-producer-revision-before.txt
          az containerapp show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$PROTECTED_QSET_APP" \
            --query properties.latestRevisionName \
            -o tsv > protected-qset-revision-before.txt
          test -s protected-qset-revision-before.txt

      - name: Build and publish immutable producer and funded worker images
        id: images
        run: |
          set -euo pipefail
          login_server=$(az acr show --name "$ACR_NAME" --query loginServer -o tsv)
          producer_tag="$login_server/polyedge-rust-backend:${GITHUB_SHA}"
          funded_tag="$login_server/polyedge-venue-probe:${GITHUB_SHA}"
          az acr login --name "$ACR_NAME"
          docker build --build-arg GIT_SHA="$GITHUB_SHA" -f Dockerfile.rust -t "$producer_tag" .
          docker build -f Dockerfile.venue-probe -t "$funded_tag" .
          docker push "$producer_tag"
          docker push "$funded_tag"
          producer_digest=$(az acr repository show \
            --name "$ACR_NAME" \
            --image "polyedge-rust-backend:${GITHUB_SHA}" \
            --query digest \
            -o tsv)
          funded_digest=$(az acr repository show \
            --name "$ACR_NAME" \
            --image "polyedge-venue-probe:${GITHUB_SHA}" \
            --query digest \
            -o tsv)
          test -n "$producer_digest"
          test -n "$funded_digest"
          echo "producer_reference=$login_server/polyedge-rust-backend@$producer_digest" >> "$GITHUB_OUTPUT"
          echo "funded_reference=$login_server/polyedge-venue-probe@$funded_digest" >> "$GITHUB_OUTPUT"

      - name: Prove isolated funded infrastructure deployment scope
        run: |
          set -euo pipefail
          az deployment group what-if \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --template-file infra/funded-direct-chile.bicep \
            --parameters @infra/funded-direct-chile.parameters.json \
            --parameters venueProbeImage="${{ steps.images.outputs.funded_reference }}" \
            --parameters fundedDirectQueueStatus=SendDisabled \
            --result-format ResourceIdOnly \
            --no-pretty-print \
            -o json > funded-what-if.json
          jq -e '
            [ .changes[]
              | select(.changeType != "Ignore" and .changeType != "NoChange")
              | select(.resourceId | ascii_downcase | test("qset|polyedge-shadow-neu|/containerapps/polyedge-dev$"))
            ] | length == 0
          ' funded-what-if.json

      - name: Refresh Azure login before funded fence
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Retire exact dormant v8 before any v9 deployment
        run: |
          set -euo pipefail
          az containerapp show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$FUNDED_APP" \
            -o json > current-funded-app.json
          current_revision=$(jq -r '.properties.latestReadyRevisionName // ""' current-funded-app.json)
          test -n "$current_revision"
          az containerapp revision show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$FUNDED_APP" \
            --revision "$current_revision" \
            --only-show-errors \
            -o json > current-funded-revision.json
          current_session=$(jq -r '
            [.properties.template.containers[0].env[]
              | select(.name == "VENUE_PROBE_FUNDED_CAMPAIGN_ID")
              | .value][0] // ""
          ' current-funded-revision.json)
          current_revision_created_at=$(jq -r '.properties.createdTime // ""' current-funded-revision.json)
          environment_id=$(az containerapp show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$FUNDED_APP" \
            --query properties.environmentId -o tsv)
          workspace_customer_id=$(az containerapp env show \
            --ids "$environment_id" \
            --query properties.appLogsConfiguration.logAnalyticsConfiguration.customerId -o tsv)
          test -n "$current_revision"
          test -n "$current_revision_created_at"
          test -n "$workspace_customer_id"
          fence_started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          az servicebus queue update \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --namespace-name "$SERVICE_BUS_NAMESPACE" \
            --name "$SERVICE_BUS_QUEUE" \
            --status SendDisabled \
            --only-show-errors -o none
          echo "FUNDED_QUEUE_FENCED=true" >> "$GITHUB_ENV"
          test "$(az servicebus queue show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --namespace-name "$SERVICE_BUS_NAMESPACE" \
            --name "$SERVICE_BUS_QUEUE" \
            --query status -o tsv)" = "SendDisabled"
          for attempt in $(seq 1 30); do
            active_messages=$(az servicebus queue show \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --namespace-name "$SERVICE_BUS_NAMESPACE" \
              --name "$SERVICE_BUS_QUEUE" \
              --query countDetails.activeMessageCount -o tsv)
            if [ "${active_messages:-0}" = "0" ]; then break; fi
            sleep 5
          done
          test "${active_messages:-0}" = "0"
          queue_snapshot=$(az servicebus queue show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --namespace-name "$SERVICE_BUS_NAMESPACE" \
            --name "$SERVICE_BUS_QUEUE" -o json)
          test "$(jq -r '.countDetails.activeMessageCount' <<<"$queue_snapshot")" = "0"
          test "$(jq -r '.countDetails.scheduledMessageCount' <<<"$queue_snapshot")" = "0"
          test "$(jq -r '.countDetails.deadLetterMessageCount' <<<"$queue_snapshot")" = "854"
          env_value() {
            jq -er --arg name "$1" '
              [.properties.template.containers[0].env[]
                | select(.name == $name) | .value]
              | if length == 1 and .[0] != null then .[0]
                else error("expected exactly one non-null environment value for " + $name)
                end
            ' current-funded-revision.json
          }
          case "$current_session" in
            dynamic-quote-funded-2026-07-29-v5)
              test "$(jq -r '.properties.template.scale.minReplicas' current-funded-revision.json)" = "0"
              test "$(jq -r '.properties.template.scale.maxReplicas' current-funded-revision.json)" = "1"
              for name in \
                FUNDED_DIRECT_SERVICE_ENABLED \
                FUNDED_DIRECT_WORKER_ENABLED \
                FUNDED_DIRECT_AUTO_REDEMPTION_ENABLED \
                ALLOW_FUNDED_DIRECT \
                ALLOW_LIVE \
                ALLOW_STRATEGY_CANARY \
                ENABLE_TAKER_ORDERS; do
                test "$(env_value "$name")" = "false"
              done
              test "$(env_value FUNDED_DIRECT_DRY_RUN)" = "true"
              test "$(env_value VENUE_PROBE_FUNDED_CAMPAIGN_ID)" = \
                "dynamic-quote-funded-2026-07-29-v5"
              test "$(env_value VENUE_PROBE_CAMPAIGN_BASELINE_EQUITY)" = "11.09862"
              test "$(env_value FUNDED_DIRECT_SESSION_MANIFEST_BLOB_NAME)" = \
                "reports/funded/dynamic-quote/sessions/dynamic-quote-funded-2026-07-29-v5/session.json"
              test "$(env_value FUNDED_DIRECT_SESSION_MANIFEST_SHA256)" = \
                "sha256:b8877f266f1e68d846ad2fd3ae8732c2d533cc7ccc14482ac5f76d0d1c1f58f9"
              test "$(env_value FUNDED_DIRECT_RESERVE_MIGRATION_SOURCE_SESSION_ID)" = \
                "dynamic-quote-funded-2026-08-03-v7"
              test "$(env_value FUNDED_DIRECT_RESERVE_MIGRATION_SOURCE_SESSION_MANIFEST_BLOB_NAME)" = \
                "reports/funded/dynamic-quote/sessions/dynamic-quote-funded-2026-08-03-v7/session.json"
              test "$(env_value FUNDED_DIRECT_RESERVE_MIGRATION_SOURCE_SESSION_MANIFEST_SHA256)" = \
                "sha256:410abe9fc7f2f81359bbb4ef8304a153326d7be170a76dc64e84dd2bf1a4e709"
              test "$(env_value FUNDED_DIRECT_RESERVE_MIGRATION_SOURCE_STATE_BLOB_NAME)" = \
                "reports/funded/dynamic-quote/sessions/dynamic-quote-funded-2026-08-03-v7/capital-reserve-state.json"
              test "$(env_value FUNDED_DIRECT_RESERVE_MIGRATION_MINIMUM_HISTORICAL_HIGH_WATER_EQUITY)" = \
                "75.90162"
              ;;
            dynamic-quote-funded-2026-08-11-v8)
              test "$(jq -r '.properties.template.scale.minReplicas' current-funded-revision.json)" = "0"
              test "$(jq -r '.properties.template.scale.maxReplicas' current-funded-revision.json)" = "1"
              for name in \
                FUNDED_DIRECT_SERVICE_ENABLED \
                FUNDED_DIRECT_WORKER_ENABLED \
                FUNDED_DIRECT_AUTO_REDEMPTION_ENABLED \
                ALLOW_FUNDED_DIRECT \
                ALLOW_LIVE \
                ALLOW_STRATEGY_CANARY \
                ENABLE_TAKER_ORDERS; do
                test "$(env_value "$name")" = "false"
              done
              test "$(env_value VENUE_PROBE_FUNDED_CAMPAIGN_ID)" = \
                "dynamic-quote-funded-2026-08-11-v8"
              test "$(env_value FUNDED_DIRECT_DRY_RUN)" = "true"
              test "$(env_value FUNDED_DIRECT_SESSION_MANIFEST_BLOB_NAME)" = \
                "reports/funded/dynamic-quote/sessions/dynamic-quote-funded-2026-08-11-v8/session.json"
              test "$(env_value FUNDED_DIRECT_SESSION_MANIFEST_SHA256)" = \
                "sha256:04c4b7e9816b71b12e1f7ecd14c34be6bc368ab4db581ee34c62fb1c69e5d4bf"
              readonly v8_prefix="reports/funded/dynamic-quote/sessions/dynamic-quote-funded-2026-08-11-v8/"
              readonly v8_session="${v8_prefix}session.json"
              readonly v8_state="${v8_prefix}capital-reserve-state.json"
              az storage blob list \
                --account-name "$STORAGE_ACCOUNT" \
                --container-name "$FUNDED_CONTAINER" \
                --prefix "$v8_prefix" \
                --num-results '*' \
                --auth-mode login \
                --only-show-errors -o json > dormant-v8-prefix.json
              jq -e --arg session "$v8_session" --arg state "$v8_state" '
                (length == 1 or length == 2)
                and ([.[].name] | index($session) != null)
                and ([.[].name | select(. != $session and . != $state)] | length) == 0
              ' dormant-v8-prefix.json >/dev/null
              az storage blob download \
                --account-name "$STORAGE_ACCOUNT" \
                --container-name "$FUNDED_CONTAINER" \
                --name "$v8_session" \
                --file dormant-v8-session.json \
                --auth-mode login \
                --overwrite \
                --only-show-errors -o none
              test "sha256:$(sha256sum dormant-v8-session.json | cut -d' ' -f1)" = \
                "sha256:04c4b7e9816b71b12e1f7ecd14c34be6bc368ab4db581ee34c62fb1c69e5d4bf"
              if jq -e --arg state "$v8_state" '[.[].name] | index($state) != null' \
                  dormant-v8-prefix.json >/dev/null; then
                az storage blob download \
                  --account-name "$STORAGE_ACCOUNT" \
                  --container-name "$FUNDED_CONTAINER" \
                  --name "$v8_state" \
                  --file dormant-v8-capital-reserve-state.json \
                  --auth-mode login \
                  --overwrite \
                  --only-show-errors -o none
                jq -e '
                  .schema == "polyedge.protected_compounding_state.v2"
                  and .session_id == "dynamic-quote-funded-2026-08-11-v8"
                  and .reconciliation_complete == true
                  and .reserve_ratio == 0.1
                  and .minimum_reserve == 2
                  and .target_order_ratio == 0.05
                  and .operating_buffer_ratio == 0.01
                  and .minimum_order_notional == 1
                  and .reserve_basis == "fully_reconciled_current_equity"
                  and .loss_response == "resize_from_fully_reconciled_current_equity"
                  and .continue_after_loss == true
                  and .reserve_monotonic == false
                  and .prior_state_session_id == "dynamic-quote-funded-2026-07-29-v5"
                  and .prior_state_blob_name == "reports/funded/dynamic-quote/sessions/dynamic-quote-funded-2026-07-29-v5/capital-reserve-state.json"
                  and .prior_state_sha256 == "sha256:617b0bd69466dc7d6ff7d61b26f5a4ed1bcfd557d5d9e4b62688b7fb13bf28c6"
                  and .high_water_equity >= 102.78112
                  and .historical_high_water_equity >= 102.78112
                  and (.last_reconciled_equity - 31.655501 | fabs) <= 0.01
                  and (.authorized_equity_ceiling - 31.655501 | fabs) <= 0.0000011
                  and .verified_realized_pnl == 0
                  and .verified_settlement_ids == []
                  and (.protected_reserve - ([2, (.last_reconciled_equity * .reserve_ratio)] | max) | fabs) <= 0.0000011
                  and (.operating_buffer - (.last_reconciled_equity * .operating_buffer_ratio) | fabs) <= 0.0000011
                  and (.operable_capital - ([0, (.last_reconciled_equity - .protected_reserve - .operating_buffer)] | max) | fabs) <= 0.0000011
                  and ([keys[] | select(test("migration_|cash.flow"))] | length) == 0
                ' dormant-v8-capital-reserve-state.json >/dev/null
              fi
              ;;
            *)
              echo "Refusing cutover from unexpected funded session: ${current_session:-<unset>}" >&2
              exit 1
              ;;
          esac
          readonly v8_campaign_prefix="reports/research/venue-probe/control/campaign-risk/dynamic-quote-funded-2026-08-11-v8/"
          readonly v8_baseline="${v8_campaign_prefix}baseline.json"
          readonly v8_index="${v8_campaign_prefix}unresolved-reservations-index.json"
          az storage blob list \
            --account-name "$STORAGE_ACCOUNT" \
            --container-name "$FUNDED_CONTAINER" \
            --prefix "$v8_campaign_prefix" \
            --num-results '*' \
            --auth-mode login \
            --only-show-errors -o json > dormant-v8-campaign-prefix.json
          jq -e --arg baseline "$v8_baseline" --arg index "$v8_index" '
            length == 2
            and ([.[].name] | sort) == ([$baseline, $index] | sort)
          ' dormant-v8-campaign-prefix.json >/dev/null
          v8_index_etag=$(jq -r --arg index "$v8_index" '
            .[] | select(.name == $index) | .properties.etag
          ' dormant-v8-campaign-prefix.json)
          v8_index_etag=${v8_index_etag#\"}
          v8_index_etag=${v8_index_etag%\"}
          [[ "$v8_index_etag" =~ ^0x[0-9A-Fa-f]+$ ]]
          az storage blob download \
            --account-name "$STORAGE_ACCOUNT" \
            --container-name "$FUNDED_CONTAINER" \
            --name "$v8_baseline" \
            --file dormant-v8-baseline.json \
            --auth-mode login \
            --overwrite \
            --only-show-errors -o none
          jq -e '
            .schema_version == 1
            and .campaign_id == "dynamic-quote-funded-2026-08-11-v8"
            and .baseline_equity == 31.655501
            and .equity_floor == 0
            and .max_campaign_drawdown == 31.655501
            and .max_order_notional == 10.5
            and .max_open_orders == 1
            and .max_unresolved_positions == 1
            and .max_reconciliation_discrepancy == 0.01
            and (.created_ts | type == "string")
          ' dormant-v8-baseline.json >/dev/null
          az storage blob download \
            --account-name "$STORAGE_ACCOUNT" \
            --container-name "$FUNDED_CONTAINER" \
            --name "$v8_index" \
            --file dormant-v8-unresolved-index.json \
            --auth-mode login \
            --overwrite \
            --only-show-errors -o none
          jq -e '
            .schema == "polyedge.funded_unresolved_risk_reservation_index.v1"
            and .schema_version == 1
            and .campaign_id == "dynamic-quote-funded-2026-08-11-v8"
            and (.generation | type == "number" and . >= 1 and floor == .)
            and .unresolved_count == 0
            and .entries == []
            and .entries_sha256 == "sha256:4f53cda18c2baa0c0354bb5f9a3ecbe5ed12ab4d8e11ba873c2f11161202b945"
            and (.rebuilt_ts | type == "string")
            and (.updated_ts | type == "string")
          ' dormant-v8-unresolved-index.json >/dev/null
          az storage blob list \
            --account-name "$STORAGE_ACCOUNT" \
            --container-name "$FUNDED_CONTAINER" \
            --prefix "reports/research/venue-probe/risk-reservations/" \
            --num-results '*' \
            --auth-mode login \
            --only-show-errors -o json > all-risk-reservation-blobs.json
          while IFS= read -r blob_name; do
            audit_file=$(mktemp)
            az storage blob download \
              --account-name "$STORAGE_ACCOUNT" \
              --container-name "$FUNDED_CONTAINER" \
              --name "$blob_name" \
              --file "$audit_file" \
              --auth-mode login \
              --overwrite \
              --only-show-errors -o none
            jq -e --arg session "dynamic-quote-funded-2026-08-11-v8" '
              ([.. | objects | .campaign_id? // empty] | index($session)) == null
            ' "$audit_file" >/dev/null
            rm -f "$audit_file"
          done < <(jq -r '.[] | select(.name | endswith(".json")) | .name' \
            all-risk-reservation-blobs.json)
          az storage blob list \
            --account-name "$STORAGE_ACCOUNT" \
            --container-name "$FUNDED_CONTAINER" \
            --prefix "reports/research/venue-probe/runs/" \
            --num-results '*' \
            --auth-mode login \
            --only-show-errors -o json > all-run-blobs.json
          while IFS= read -r blob_name; do
            audit_file=$(mktemp)
            az storage blob download \
              --account-name "$STORAGE_ACCOUNT" \
              --container-name "$FUNDED_CONTAINER" \
              --name "$blob_name" \
              --file "$audit_file" \
              --auth-mode login \
              --overwrite \
              --only-show-errors -o none
            jq -e --arg session "dynamic-quote-funded-2026-08-11-v8" '
              ([.. | objects | .operator_session_id? // empty] | index($session)) == null
            ' "$audit_file" >/dev/null
            rm -f "$audit_file"
          done < <(jq -r '.[] | select(.name | endswith("/summary.json")) | .name' all-run-blobs.json)
          az storage blob list \
            --account-name "$STORAGE_ACCOUNT" \
            --container-name "$FUNDED_CONTAINER" \
            --prefix "reports/research/venue-probe/control/strategy-canary/consumed/" \
            --num-results '*' \
            --auth-mode login \
            --only-show-errors -o json > all-authorization-consumptions.json
          while IFS= read -r blob_name; do
            audit_file=$(mktemp)
            az storage blob download \
              --account-name "$STORAGE_ACCOUNT" \
              --container-name "$FUNDED_CONTAINER" \
              --name "$blob_name" \
              --file "$audit_file" \
              --auth-mode login \
              --overwrite \
              --only-show-errors -o none
            jq -e --arg session "dynamic-quote-funded-2026-08-11-v8" '
              ([.. | strings] | index($session)) == null
            ' "$audit_file" >/dev/null
            rm -f "$audit_file"
          done < <(jq -r '.[] | select(.name | endswith(".json")) | .name' \
            all-authorization-consumptions.json)
          current_v8_index_etag=$(az storage blob show \
            --account-name "$STORAGE_ACCOUNT" \
            --container-name "$FUNDED_CONTAINER" \
            --name "$v8_index" \
            --auth-mode login \
            --query properties.etag -o tsv)
          current_v8_index_etag=${current_v8_index_etag#\"}
          current_v8_index_etag=${current_v8_index_etag%\"}
          [[ "$current_v8_index_etag" =~ ^0x[0-9A-Fa-f]+$ ]]
          test "$current_v8_index_etag" = "$v8_index_etag"
          az containerapp revision list \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$FUNDED_APP" \
            --all \
            -o json > funded-v8-revisions.json
          v8_revisions_json=$(jq -c --arg session "dynamic-quote-funded-2026-08-11-v8" '
            [ .[]
              | select(any(.properties.template.containers[0].env[]?;
                  .name == "VENUE_PROBE_FUNDED_CAMPAIGN_ID" and .value == $session))
            ]
          ' funded-v8-revisions.json)
          test "$(jq 'length' <<<"$v8_revisions_json")" -ge 1
          while IFS= read -r revision_name; do
            [[ "$revision_name" =~ ^polyedge-funded-direct-cl--[a-z0-9-]+$ ]]
          done < <(jq -r '.[].name' <<<"$v8_revisions_json")
          v8_revision_names_kql=$(jq -r '[.[].name] | unique | map(@sh) | join(", ")' \
            <<<"$v8_revisions_json")
          test -n "$v8_revision_names_kql"
          v8_first_revision_created_at=$(jq -r \
            '[.[].properties.createdTime] | min // ""' <<<"$v8_revisions_json")
          test -n "$v8_first_revision_created_at"
          retirement_audit_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          az extension add --name log-analytics --allow-preview true --only-show-errors
          sleep 60
          az monitor log-analytics query \
            --workspace "$workspace_customer_id" \
            --analytics-query "ContainerAppConsoleLogs_CL
              | where ContainerAppName_s == '$FUNDED_APP'
              | where RevisionName_s in ($v8_revision_names_kql)
              | where TimeGenerated between (datetime($v8_first_revision_created_at) .. datetime($retirement_audit_at))
              | summarize
                  OrderSubmissionAttempted=countif(Log_s contains '\"order_submission_attempted\":true'),
                  OrderSubmitted=countif(Log_s contains '\"order_submitted\":true'),
                  RiskReservationCreated=countif(Log_s contains '\"risk_reservation_created\":true'
                    or Log_s contains '\"status\":\"funded_risk_reservation_created\"'),
                  AuthorizationConsumed=countif(Log_s contains '\"authorization_consumed\":true'
                    or Log_s contains '\"status\":\"funded_authorization_consumed\"'),
                  RedemptionSubmitted=countif(Log_s contains '\"redemption_submitted\":true'),
                  ChildCompleted=countif(Log_s contains '\"status\":\"child_completed\"')" \
            -o json > funded-v8-retirement-aggregate.json
          jq -e '
            length == 1
            and (.[0].OrderSubmissionAttempted | tonumber) == 0
            and (.[0].OrderSubmitted | tonumber) == 0
            and (.[0].RiskReservationCreated | tonumber) == 0
            and (.[0].AuthorizationConsumed | tonumber) == 0
            and (.[0].RedemptionSubmitted | tonumber) == 0
            and (.[0].ChildCompleted | tonumber) == 0
          ' funded-v8-retirement-aggregate.json >/dev/null
          az monitor log-analytics query \
            --workspace "$workspace_customer_id" \
            --analytics-query "ContainerAppConsoleLogs_CL
              | where ContainerAppName_s == '$FUNDED_APP'
              | where RevisionName_s in ($v8_revision_names_kql)
              | where TimeGenerated between (datetime($v8_first_revision_created_at) .. datetime($retirement_audit_at))
              | extend record = parse_json(Log_s)
              | where tostring(record.schema) == 'polyedge.funded_capital_snapshot.v1'
              | where tostring(record.session_id) == 'dynamic-quote-funded-2026-08-11-v8'
              | top 1 by TimeGenerated desc
              | project TimeGenerated,
                  SnapshotSource=tostring(record.snapshot_source),
                  RiskPassed=tobool(record.risk_passed),
                  BlockerCount=array_length(record.blockers),
                  OpenOrderCount=toint(record.open_order_count),
                  UnresolvedPositionCount=toint(record.unresolved_position_count),
                  UnresolvedRiskReservationCount=toint(record.unresolved_risk_reservation_count),
                  AccountEquity=todouble(record.account_equity)" \
            -o json > funded-v8-retirement-reconciliation.json
          jq -e '
            length == 1
            and (.[0].SnapshotSource == "live_preflight"
              or .[0].SnapshotSource == "persistent_safety_cache")
            and ((.[0].RiskPassed | tostring | ascii_downcase) == "true")
            and (.[0].BlockerCount | tonumber) == 0
            and (.[0].OpenOrderCount | tonumber) == 0
            and (.[0].UnresolvedPositionCount | tonumber) == 0
            and (.[0].UnresolvedRiskReservationCount | tonumber) == 0
            and ((.[0].AccountEquity | tonumber) - 31.655501 | fabs) <= 0.01
          ' funded-v8-retirement-reconciliation.json >/dev/null
          az storage blob download \
            --account-name "$STORAGE_ACCOUNT" \
            --container-name "$FUNDED_CONTAINER" \
            --name "reports/funded/dynamic-quote/sessions/dynamic-quote-funded-2026-07-29-v5/capital-reserve-state.json" \
            --file current-v5-capital-reserve-state.json \
            --auth-mode login \
            --overwrite \
            --only-show-errors -o none
          jq -e '
            .schema == "polyedge.protected_compounding_state.v1"
            and .session_id == "dynamic-quote-funded-2026-07-29-v5"
            and .reconciliation_complete == true
            and .high_water_equity >= 102.78112
            and .historical_high_water_equity >= 102.78112
            and (.last_reconciled_equity - 31.655501 | fabs) <= 0.01
          ' current-v5-capital-reserve-state.json >/dev/null
          jq -S '.properties.template' current-funded-revision.json > funded-rollback-template.json
          echo "FUNDED_ROLLBACK_REVISION=$current_revision" >> "$GITHUB_ENV"
      - name: Deploy continuous funded Dynamic Quote service
        run: |
          set -euo pipefail
          deployed=false
          for attempt in 1 2 3; do
            if az deployment group create \
              --name "polyedge-funded-direct-cl-${GITHUB_RUN_ID}" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --template-file infra/funded-direct-chile.bicep \
              --parameters @infra/funded-direct-chile.parameters.json \
              --parameters venueProbeImage="${{ steps.images.outputs.funded_reference }}" \
              --parameters fundedDirectEnabled=false \
              --parameters fundedDirectQueueStatus=SendDisabled \
              --only-show-errors \
              -o json > funded-deployment.json 2> funded-deployment.stderr; then
              deployed=true
              break
            fi
            if ! grep -Fq 'unable to pull image using Managed identity' funded-deployment.stderr || [ "$attempt" -eq 3 ]; then
              cat funded-deployment.stderr >&2
              exit 1
            fi
            sleep "$((attempt * 30))"
          done
          test "$deployed" = true
          test "$(jq -r '.properties.provisioningState' funded-deployment.json)" = "Succeeded"

      - name: Keep the obsolete North Europe funded job fail-closed
        run: |
          set -euo pipefail
          az containerapp job update \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$LEGACY_NEU_FUNDED_JOB" \
            --set-env-vars \
              FUNDED_DIRECT_WORKER_ENABLED=false \
              ALLOW_FUNDED_DIRECT=false \
              FUNDED_DIRECT_DRY_RUN=true \
              FUNDED_LADDER_CONTROLLER_ENABLED=false \
              ALLOW_FUNDED_LADDER=false \
              FUNDED_LADDER_DRY_RUN=true \
              ALLOW_LIVE=false \
            --only-show-errors \
            -o none
          az containerapp job show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$LEGACY_NEU_FUNDED_JOB" \
            -o json > legacy-neu-funded-job.json
          test "$(jq -r '.properties.configuration.triggerType' legacy-neu-funded-job.json)" = "Manual"
          legacy_env() {
            jq -r --arg name "$1" \
              '.properties.template.containers[0].env[] | select(.name == $name) | .value' \
              legacy-neu-funded-job.json
          }
          test "$(legacy_env FUNDED_DIRECT_WORKER_ENABLED)" = "false"
          test "$(legacy_env ALLOW_FUNDED_DIRECT)" = "false"
          test "$(legacy_env FUNDED_DIRECT_DRY_RUN)" = "true"
          test "$(legacy_env FUNDED_LADDER_CONTROLLER_ENABLED)" = "false"
          test "$(legacy_env ALLOW_FUNDED_LADDER)" = "false"
          test "$(legacy_env FUNDED_LADDER_DRY_RUN)" = "true"
          test "$(legacy_env ALLOW_LIVE)" = "false"
          running=$(az containerapp job execution list \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$LEGACY_NEU_FUNDED_JOB" \
            --query "[?properties.status=='Running'] | length(@)" -o tsv)
          test "${running:-0}" = "0"

      - name: Refresh Azure login before reserve migration proof
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Prove the v5 predecessor while the v9 service remains disabled
        run: |
          set -euo pipefail
          az containerapp show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$FUNDED_APP" \
            -o json > disabled-v9-funded-app.json
          test "$(jq -r '.properties.template.scale.minReplicas' disabled-v9-funded-app.json)" = "0"
          test "$(jq -r '.properties.template.containers[0].env[] | select(.name == "FUNDED_DIRECT_SERVICE_ENABLED") | .value' disabled-v9-funded-app.json)" = "false"
          test "$(jq -r '.properties.template.containers[0].env[] | select(.name == "FUNDED_DIRECT_DRY_RUN") | .value' disabled-v9-funded-app.json)" = "true"
          az storage blob download \
            --account-name "$STORAGE_ACCOUNT" \
            --container-name "$FUNDED_CONTAINER" \
            --name "reports/funded/dynamic-quote/sessions/dynamic-quote-funded-2026-07-29-v5/capital-reserve-state.json" \
            --file v5-capital-reserve-state.json \
            --auth-mode login \
            --overwrite \
            --only-show-errors -o none
          jq -e '
            .schema == "polyedge.protected_compounding_state.v1"
            and .session_id == "dynamic-quote-funded-2026-07-29-v5"
            and .reconciliation_complete == true
            and .historical_high_water_equity >= 102.78112
            and .high_water_equity >= 102.78112
            and (.last_reconciled_equity - 31.655501 | fabs) <= 0.01
          ' v5-capital-reserve-state.json

      - name: Deploy and verify the retry-capable Dynamic Quote intent producer
        run: |
          set -euo pipefail
          az containerapp update \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$INTENT_PRODUCER_APP" \
            --image "${{ steps.images.outputs.producer_reference }}" \
            --set-env-vars \
              FUNDED_DIRECT_SERVICE_BUS_ENABLED=true \
              FUNDED_DIRECT_SERVICE_BUS_NAMESPACE="$SERVICE_BUS_NAMESPACE" \
              FUNDED_DIRECT_SERVICE_BUS_QUEUE="$SERVICE_BUS_QUEUE" \
              LOCAL_JSONL_RECORDER_ENABLED=false \
            --only-show-errors \
            -o none
          producer_revision=$(az containerapp show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$INTENT_PRODUCER_APP" \
            --query properties.latestRevisionName -o tsv)
          test -n "$producer_revision"
          for attempt in $(seq 1 36); do
            az containerapp revision list \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --name "$INTENT_PRODUCER_APP" \
              -o json > producer-revisions.json
            active_count=$(jq '[.[] | select(.properties.active == true)] | length' producer-revisions.json)
            active_revision=$(jq -r '[.[] | select(.properties.active == true)][0].name // ""' producer-revisions.json)
            health=$(jq -r --arg revision "$producer_revision" \
              '.[] | select(.name == $revision) | .properties.healthState // ""' producer-revisions.json)
            replicas=$(jq -r --arg revision "$producer_revision" \
              '.[] | select(.name == $revision) | .properties.replicas // 0' producer-revisions.json)
            if [ "$active_count" = "1" ] && \
                [ "$active_revision" = "$producer_revision" ] && \
                [ "$health" = "Healthy" ] && \
                [ "$replicas" -ge 1 ]; then
              break
            fi
            sleep 10
          done
          test "$active_count" = "1"
          test "$active_revision" = "$producer_revision"
          test "$health" = "Healthy"
          test "$replicas" -ge 1
          producer_image=$(az containerapp show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$INTENT_PRODUCER_APP" \
            --query properties.template.containers[0].image -o tsv)
          test "$producer_image" = "${{ steps.images.outputs.producer_reference }}"
          printf '%s\n' "$producer_revision" > intent-producer-revision-deployed.txt

      - name: Run the zero-write v9 preflight against a fresh producer intent
        id: funded_preflight
        run: |
          set -euo pipefail
          v9_prefix="reports/funded/dynamic-quote/sessions/dynamic-quote-funded-2026-08-12-v9/"
          readonly v9_session_blob="${v9_prefix}session.json"
          readonly v9_session_sha256="sha256:15f7b4e2c749d401e9dbab01a6a9dca8ce81166948a5621a8b4c6dff536f4d22"
          readonly v9_latest_redemption="${v9_prefix}latest-redemption.json"
          readonly v9_redemption_prefix="${v9_prefix}redemptions/"
          v5_state="reports/funded/dynamic-quote/sessions/dynamic-quote-funded-2026-07-29-v5/capital-reserve-state.json"
          readonly v5_state_sha256="sha256:617b0bd69466dc7d6ff7d61b26f5a4ed1bcfd557d5d9e4b62688b7fb13bf28c6"
          az storage blob list \
            --account-name "$STORAGE_ACCOUNT" \
            --container-name "$FUNDED_CONTAINER" \
            --prefix "$v9_prefix" \
            --num-results '*' \
            --auth-mode login \
            --only-show-errors -o json > v9-prefix-before-preflight.json
          jq -e \
            --arg session "$v9_session_blob" \
            --arg latest "$v9_latest_redemption" \
            --arg archive "$v9_redemption_prefix" '
            ([.[].name] | length == (unique | length))
            and all(.[].properties.contentLength; . > 0 and . <= 16384)
            and all(.[].name;
              . == $session
              or . == $latest
              or test("^" + $archive + "[0-9]{4}-[0-9]{2}-[0-9]{2}/venue-redemption-[0-9]{17}-[0-9a-f]{8}\\.json$"))
          ' v9-prefix-before-preflight.json >/dev/null
          jq -S '[.[] | {name, etag: .properties.etag, size: .properties.contentLength}]' \
            v9-prefix-before-preflight.json > v9-prefix-before-preflight.snapshot.json
          if jq -e --arg session "$v9_session_blob" \
              '[.[].name] | index($session) != null' \
              v9-prefix-before-preflight.json >/dev/null; then
            az storage blob download \
              --account-name "$STORAGE_ACCOUNT" \
              --container-name "$FUNDED_CONTAINER" \
              --name "$v9_session_blob" \
              --file existing-v9-session.json \
              --auth-mode login \
              --overwrite \
              --only-show-errors -o none
            test "$v9_session_sha256" = "sha256:$(sha256sum existing-v9-session.json | cut -d' ' -f1)"
          fi
          archive_count=$(jq --arg archive "$v9_redemption_prefix" \
            '[.[].name | select(startswith($archive))] | length' \
            v9-prefix-before-preflight.json)
          latest_count=$(jq --arg latest "$v9_latest_redemption" \
            '[.[].name | select(. == $latest)] | length' \
            v9-prefix-before-preflight.json)
          if [ "$archive_count" = "0" ]; then
            test "$latest_count" = "0"
          else
            test "$latest_count" = "1"
          fi
          : > existing-v9-redemption-sha256.txt
          while IFS= read -r blob_name; do
            redemption_file=$(mktemp)
            az storage blob download \
              --account-name "$STORAGE_ACCOUNT" \
              --container-name "$FUNDED_CONTAINER" \
              --name "$blob_name" \
              --file "$redemption_file" \
              --auth-mode login \
              --overwrite \
              --only-show-errors -o none
            jq -e '
              .schema_version == 1
              and .status == "nothing_to_redeem"
              and (.finished_ts | type == "string")
              and (.run_id | test("^venue-redemption-[0-9]{17}-[0-9a-f]{8}$"))
              and .execution_origin == "azure_chile_central_static_egress"
              and .execution_country == "CL"
              and .static_egress_verified == true
              and .dry_run == false
              and .redemption_enabled == true
              and .redemption_submitted == false
              and .zero_open_orders_confirmed == true
              and .selection.selected == []
              and .selection.selected_gross_payout == 0
              and .planned_calls == []
              and .derived_wallet_match == true
              and .wallet_type == "legacy_uups_deposit_wallet"
              and .research_only == false
              and .live_strategy_enabled == true
              and (.liquid_collateral_before - 31.655501 | fabs) <= 0.0000011
            ' "$redemption_file" >/dev/null
            redemption_sha="sha256:$(sha256sum "$redemption_file" | cut -d' ' -f1)"
            if [ "$blob_name" = "$v9_latest_redemption" ]; then
              latest_redemption_sha="$redemption_sha"
            else
              redemption_date=$(jq -r '.finished_ts[0:10]' "$redemption_file")
              redemption_run=$(jq -r '.run_id' "$redemption_file")
              test "$blob_name" = \
                "${v9_redemption_prefix}${redemption_date}/${redemption_run}.json"
              printf '%s\n' "$redemption_sha" >> existing-v9-redemption-sha256.txt
            fi
          done < <(jq -r --arg latest "$v9_latest_redemption" --arg archive "$v9_redemption_prefix" '
            .[].name | select(. == $latest or startswith($archive))
          ' v9-prefix-before-preflight.json)
          if [ "$archive_count" != "0" ]; then
            grep -Fqx "$latest_redemption_sha" existing-v9-redemption-sha256.txt
          fi
          v5_etag_before=$(az storage blob show \
            --account-name "$STORAGE_ACCOUNT" \
            --container-name "$FUNDED_CONTAINER" \
            --name "$v5_state" \
            --auth-mode login \
            --query properties.etag -o tsv)
          test -n "$v5_etag_before"
          az storage blob download \
            --account-name "$STORAGE_ACCOUNT" \
            --container-name "$FUNDED_CONTAINER" \
            --name "$v5_state" \
            --file v5-state-before-preflight.json \
            --auth-mode login \
            --overwrite \
            --only-show-errors -o none
          v5_sha_before="sha256:$(sha256sum v5-state-before-preflight.json | cut -d' ' -f1)"
          test "$v5_sha_before" = "$v5_state_sha256"
          az containerapp job show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$FUNDED_JOB" \
            -o json > funded-preflight-job.json
          intent_container=$(jq -r '.properties.template.containers[0].env[] | select(.name == "STRATEGY_CANARY_INTENT_CONTAINER_NAME") | .value' funded-preflight-job.json)
          intent_prefix=$(jq -r '.properties.template.containers[0].env[] | select(.name == "STRATEGY_CANARY_INTENT_PREFIX") | .value' funded-preflight-job.json)
          test -n "$intent_container"
          test -n "$intent_prefix"
          jq '
            .properties.template
            | .containers |= map(
                if .name == "funded-direct" then
                  .env = (
                    [.env[] | select(.name != "FUNDED_DIRECT_WORKER_ENABLED"
                      and .name != "ALLOW_FUNDED_DIRECT"
                      and .name != "FUNDED_DIRECT_DRY_RUN"
                      and .name != "FUNDED_DIRECT_PREFLIGHT_ONLY"
                      and .name != "FUNDED_DIRECT_MAX_ITERATIONS"
                      and .name != "FUNDED_DIRECT_POLL_INTERVAL_MS"
                      and .name != "FUNDED_DIRECT_MAX_IDLE_MS")]
                    + [
                      {name:"FUNDED_DIRECT_WORKER_ENABLED",value:"true"},
                      {name:"ALLOW_FUNDED_DIRECT",value:"true"},
                      {name:"FUNDED_DIRECT_DRY_RUN",value:"true"},
                      {name:"FUNDED_DIRECT_PREFLIGHT_ONLY",value:"true"},
                      {name:"FUNDED_DIRECT_MAX_ITERATIONS",value:"2000"},
                      {name:"FUNDED_DIRECT_POLL_INTERVAL_MS",value:"6000"},
                      {name:"FUNDED_DIRECT_MAX_IDLE_MS",value:"10800000"}
                    ]
                  )
                else . end
              )
          ' funded-preflight-job.json > funded-preflight-execution.yaml
          jq -e '
            .containers | length == 1
            and ([.[] | select(.name == "funded-direct") | .env[]
              | select(.name == "FUNDED_DIRECT_WORKER_ENABLED" and .value == "true")] | length) == 1
            and ([.[] | select(.name == "funded-direct") | .env[]
              | select(.name == "ALLOW_FUNDED_DIRECT" and .value == "true")] | length) == 1
            and ([.[] | select(.name == "funded-direct") | .env[]
              | select(.name == "FUNDED_DIRECT_DRY_RUN" and .value == "true")] | length) == 1
            and ([.[] | select(.name == "funded-direct") | .env[]
              | select(.name == "FUNDED_DIRECT_PREFLIGHT_ONLY" and .value == "true")] | length) == 1
            and ([.[] | select(.name == "funded-direct") | .env[]
              | select(.name == "FUNDED_DIRECT_MAX_ITERATIONS" and .value == "2000")] | length) == 1
            and ([.[] | select(.name == "funded-direct") | .env[]
              | select(.name == "FUNDED_DIRECT_POLL_INTERVAL_MS" and .value == "6000")] | length) == 1
            and ([.[] | select(.name == "funded-direct") | .env[]
              | select(.name == "FUNDED_DIRECT_MAX_IDLE_MS" and .value == "10800000")] | length) == 1
          ' funded-preflight-execution.yaml
          preflight_execution=$(az containerapp job start \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$FUNDED_JOB" \
            --yaml funded-preflight-execution.yaml \
            --query name -o tsv)
          test -n "$preflight_execution"
          status=Running
          for attempt in $(seq 1 1100); do
            status=$(az containerapp job execution show \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --name "$FUNDED_JOB" \
              --job-execution-name "$preflight_execution" \
              --query properties.status -o tsv)
            case "$status" in
              Succeeded) break ;;
              Failed|Stopped|Degraded) exit 1 ;;
            esac
            sleep 10
          done
          test "$status" = "Succeeded"
          echo "execution=$preflight_execution" >> "$GITHUB_OUTPUT"
          echo "v5_etag_before=$v5_etag_before" >> "$GITHUB_OUTPUT"
          echo "intent_container=$intent_container" >> "$GITHUB_OUTPUT"
          echo "intent_prefix=$intent_prefix" >> "$GITHUB_OUTPUT"

      - name: Refresh Azure login after zero-write preflight wait
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Verify the zero-write v9 preflight
        env:
          PREFLIGHT_EXECUTION: ${{ steps.funded_preflight.outputs.execution }}
          PREFLIGHT_V5_ETAG_BEFORE: ${{ steps.funded_preflight.outputs.v5_etag_before }}
          PREFLIGHT_INTENT_PREFIX: ${{ steps.funded_preflight.outputs.intent_prefix }}
        run: |
          set -euo pipefail
          readonly v9_prefix="reports/funded/dynamic-quote/sessions/dynamic-quote-funded-2026-08-12-v9/"
          readonly v5_state="reports/funded/dynamic-quote/sessions/dynamic-quote-funded-2026-07-29-v5/capital-reserve-state.json"
          readonly v5_state_sha256="sha256:617b0bd69466dc7d6ff7d61b26f5a4ed1bcfd557d5d9e4b62688b7fb13bf28c6"
          readonly preflight_execution="$PREFLIGHT_EXECUTION"
          readonly v5_etag_before="$PREFLIGHT_V5_ETAG_BEFORE"
          readonly intent_prefix="$PREFLIGHT_INTENT_PREFIX"
          test -n "$preflight_execution"
          test -n "$v5_etag_before"
          test -n "$intent_prefix"
          environment_id=$(az containerapp show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$FUNDED_APP" \
            --query properties.environmentId -o tsv)
          workspace_customer_id=$(az containerapp env show \
            --ids "$environment_id" \
            --query properties.appLogsConfiguration.logAnalyticsConfiguration.customerId -o tsv)
          preflight_ready=false
          for attempt in $(seq 1 36); do
            az monitor log-analytics query \
              --workspace "$workspace_customer_id" \
              --analytics-query "ContainerAppConsoleLogs_CL
                | where ContainerJobName_s == '$FUNDED_JOB'
                | where ContainerGroupName_s startswith '$preflight_execution'
                | extend record = parse_json(Log_s)
                | where tostring(record.schema) == 'polyedge.funded_direct_worker.v1'
                | where tostring(record.status) == 'preflight_validated'
                | project TimeGenerated, Log_s
                | order by TimeGenerated asc" \
              -o json > funded-preflight-logs.json
            if jq -e --arg session_blob "$v9_prefix" --arg session_sha "sha256:15f7b4e2c749d401e9dbab01a6a9dca8ce81166948a5621a8b4c6dff536f4d22" --arg v5_state "$v5_state" --arg v5_sha "$v5_state_sha256" --arg intent_prefix "$intent_prefix" '
              length == 1
              and (.[0].Log_s | fromjson
                | .session_id == "dynamic-quote-funded-2026-08-12-v9"
                and .preflight_only == true
                and .writes_performed == false
                and .order_submission_attempted == false
                and .execution_grant_created == false
                and .risk_reservation_created == false
                and .completion_created == false
                and .session_manifest_blob_name == ($session_blob + "session.json")
                and .session_manifest_sha256 == $session_sha
                and .predecessor_state_session_id == "dynamic-quote-funded-2026-07-29-v5"
                and .predecessor_state_blob_name == $v5_state
                and .predecessor_state_sha256 == $v5_sha
                and .intent_handoff_blob_name == ($intent_prefix | sub("/intents$"; "/current-funded-intent.json"))
                and (.intent_blob_name | startswith($intent_prefix + "/") and test("/[0-9a-f]{64}\\.json$"))
                and (.intent_sha256 | test("^sha256:[0-9a-f]{64}$")))
            ' funded-preflight-logs.json >/dev/null; then
              preflight_ready=true
              break
            fi
            sleep 10
          done
          test "$preflight_ready" = true
          az storage blob list \
            --account-name "$STORAGE_ACCOUNT" \
            --container-name "$FUNDED_CONTAINER" \
            --prefix "$v9_prefix" \
            --num-results '*' \
            --auth-mode login \
            --only-show-errors -o json > v9-prefix-after-preflight.json
          jq -S '[.[] | {name, etag: .properties.etag, size: .properties.contentLength}]' \
            v9-prefix-after-preflight.json > v9-prefix-after-preflight.snapshot.json
          cmp -s v9-prefix-before-preflight.snapshot.json v9-prefix-after-preflight.snapshot.json
          v5_etag_after=$(az storage blob show \
            --account-name "$STORAGE_ACCOUNT" \
            --container-name "$FUNDED_CONTAINER" \
            --name "$v5_state" \
            --auth-mode login \
            --query properties.etag -o tsv)
          test "$v5_etag_after" = "$v5_etag_before"
          az storage blob download \
            --account-name "$STORAGE_ACCOUNT" \
            --container-name "$FUNDED_CONTAINER" \
            --name "$v5_state" \
            --file v5-state-after-preflight.json \
            --auth-mode login \
            --overwrite \
            --only-show-errors -o none
          test "sha256:$(sha256sum v5-state-after-preflight.json | cut -d' ' -f1)" = \
            "$v5_state_sha256"
          az containerapp job show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$FUNDED_JOB" \
            -o json > funded-preflight-job-after.json
          job_env() {
            jq -r --arg name "$1" \
              '.properties.template.containers[0].env[] | select(.name == $name) | .value' \
              funded-preflight-job-after.json
          }
          test "$(job_env FUNDED_DIRECT_WORKER_ENABLED)" = "false"
          test "$(job_env ALLOW_FUNDED_DIRECT)" = "false"
          test "$(job_env FUNDED_DIRECT_DRY_RUN)" = "true"
          test -z "$(job_env FUNDED_DIRECT_PREFLIGHT_ONLY)"

      - name: Enable v9 only after the zero-write preflight passes
        run: |
          set -euo pipefail
          deployed=false
          for attempt in 1 2 3; do
            if az deployment group create \
              --name "polyedge-funded-direct-cl-enabled-${GITHUB_RUN_ID}" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --template-file infra/funded-direct-chile.bicep \
              --parameters @infra/funded-direct-chile.parameters.json \
              --parameters venueProbeImage="${{ steps.images.outputs.funded_reference }}" \
              --parameters fundedDirectEnabled=true \
              --parameters fundedDirectQueueStatus=SendDisabled \
              --only-show-errors \
              -o json > funded-enabled-deployment.json 2> funded-enabled-deployment.stderr; then
              deployed=true
              break
            fi
            if ! grep -Fq 'unable to pull image using Managed identity' funded-enabled-deployment.stderr || [ "$attempt" -eq 3 ]; then
              cat funded-enabled-deployment.stderr >&2
              exit 1
            fi
            sleep "$((attempt * 30))"
          done
          test "$deployed" = true
          test "$(jq -r '.properties.provisioningState' funded-enabled-deployment.json)" = "Succeeded"

      - name: Verify one active cloud replica and exact live controls
        run: |
          set -euo pipefail
          for attempt in $(seq 1 36); do
            az containerapp show \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --name "$FUNDED_APP" \
              -o json > funded-app.json
            target_revision=$(jq -r '.properties.latestRevisionName' funded-app.json)
            az containerapp revision list \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --name "$FUNDED_APP" \
              -o json > funded-revisions.json
            active_revision_count=$(jq '[.[] | select(.properties.active == true)] | length' funded-revisions.json)
            active_revision=$(jq -r '[.[] | select(.properties.active == true)][0].name // ""' funded-revisions.json)
            target_health=$(jq -r --arg revision "$target_revision" \
              '.[] | select(.name == $revision) | .properties.healthState // ""' funded-revisions.json)
            target_replicas=$(jq -r --arg revision "$target_revision" \
              '.[] | select(.name == $revision) | .properties.replicas // 0' funded-revisions.json)
            if [ "$active_revision_count" = "1" ] && \
                [ "$active_revision" = "$target_revision" ] && \
                [ "$target_health" = "Healthy" ] && \
                [ "$target_replicas" = "1" ]; then
              break
            fi
            sleep 10
          done
          test "$active_revision_count" = "1"
          test "$active_revision" = "$target_revision"
          test "$target_health" = "Healthy"
          test "$target_replicas" = "1"
          test "$(jq -r '.properties.template.scale.minReplicas' funded-app.json)" = "1"
          test "$(jq -r '.properties.template.scale.maxReplicas' funded-app.json)" = "1"
          test "$(jq -r '.properties.template.containers[0].image' funded-app.json)" = "${{ steps.images.outputs.funded_reference }}"
          test "$(jq -r '.properties.template.containers[0].command | join(" ")' funded-app.json)" = "node src/funded-direct-service.mjs"
          env_value() {
            jq -r --arg name "$1" '.properties.template.containers[0].env[] | select(.name == $name) | .value' funded-app.json
          }
          env_secret_ref() {
            jq -r --arg name "$1" '.properties.template.containers[0].env[] | select(.name == $name) | .secretRef' funded-app.json
          }
          test "$(env_value FUNDED_DIRECT_SERVICE_ENABLED)" = "true"
          test "$(env_value FUNDED_DIRECT_ENGINE)" = "persistent_v1"
          test "$(env_value FUNDED_DIRECT_SERVICE_BUS_ENABLED)" = "true"
          test "$(env_value FUNDED_DIRECT_SERVICE_BUS_NAMESPACE)" = "$SERVICE_BUS_NAMESPACE"
          test "$(env_value FUNDED_DIRECT_SERVICE_BUS_QUEUE)" = "$SERVICE_BUS_QUEUE"
          test "$(env_value FUNDED_DIRECT_SIGNAL_TO_SEND_SLO_MS)" = "2000"
          test "$(env_value FUNDED_DIRECT_WORKER_ENABLED)" = "true"
          test "$(env_value ALLOW_FUNDED_DIRECT)" = "true"
          test "$(env_value FUNDED_DIRECT_DRY_RUN)" = "false"
          test "$(env_value ENABLE_TAKER_ORDERS)" = "false"
          test "$(env_value VENUE_PROBE_CAMPAIGN_CASH_FLOWS)" = "[]"
          test "$(env_value FUNDED_DIRECT_POLL_INTERVAL_MS)" = "1000"
          test "$(env_value FUNDED_DIRECT_MIN_REMAINING_TTL_MS)" = "7000"
          test "$(env_value FUNDED_DIRECT_CHILD_MIN_REMAINING_TTL_MS)" = "2000"
          test "$(env_value FUNDED_DIRECT_AUTO_REDEMPTION_ENABLED)" = "true"
          test "$(env_value FUNDED_DIRECT_AUTO_REDEMPTION_INTERVAL_MS)" = "60000"
          test "$(env_value FUNDED_DIRECT_AUTO_REDEMPTION_MIN_SECONDS_TO_EXPIRY)" = "30"
          test "$(env_value FUNDED_DIRECT_AUTO_REDEMPTION_MAX_SECONDS_TO_EXPIRY)" = "350"
          test -z "$(env_value VENUE_REDEMPTION_MAX_PAYOUT)"
          test "$(env_value VENUE_REDEMPTION_MAX_CONDITIONS)" = "1"
          test "$(env_secret_ref POLYMARKET_RELAYER_API_KEY)" = "polymarket-relayer-api-key"
          test "$(env_value FUNDED_DIRECT_SESSION_MANIFEST_BLOB_NAME)" = \
            "reports/funded/dynamic-quote/sessions/dynamic-quote-funded-2026-08-12-v9/session.json"
          test "$(env_value FUNDED_DIRECT_SESSION_MANIFEST_SHA256)" = \
            "sha256:15f7b4e2c749d401e9dbab01a6a9dca8ce81166948a5621a8b4c6dff536f4d22"
          test "$(env_value VENUE_PROBE_FUNDED_CAMPAIGN_ID)" = \
            "dynamic-quote-funded-2026-08-12-v9"
          for name in \
            FUNDED_DIRECT_RESERVE_MIGRATION_SOURCE_SESSION_ID \
            FUNDED_DIRECT_RESERVE_MIGRATION_SOURCE_SESSION_MANIFEST_BLOB_NAME \
            FUNDED_DIRECT_RESERVE_MIGRATION_SOURCE_SESSION_MANIFEST_SHA256 \
            FUNDED_DIRECT_RESERVE_MIGRATION_SOURCE_STATE_BLOB_NAME \
            FUNDED_DIRECT_RESERVE_MIGRATION_MINIMUM_HISTORICAL_HIGH_WATER_EQUITY; do
            test -z "$(env_value "$name")"
          done
          session_json=$(env_value FUNDED_DIRECT_SESSION_MANIFEST_JSON)
          test "$(jq -r '.session_id' <<<"$session_json")" = "dynamic-quote-funded-2026-08-12-v9"
          test "$(jq -r '.no_deposits' <<<"$session_json")" = "true"
          test "$(jq -r '.allow_automatic_replenishment' <<<"$session_json")" = "false"
          test "$(jq -r '.allow_compounding' <<<"$session_json")" = "true"
          test "$(jq -r '.continue_after_loss' <<<"$session_json")" = "true"
          test "$(jq -r '.capital_policy.reserve_ratio' <<<"$session_json")" = "0.1"
          test "$(jq -r '.capital_policy.minimum_reserve' <<<"$session_json")" = "2"
          test "$(jq -r '.capital_policy.target_order_ratio' <<<"$session_json")" = "0.05"
          test "$(jq -r '.capital_policy.operating_buffer_ratio' <<<"$session_json")" = "0.01"
          test "$(jq -r '.capital_policy.reserve_basis' <<<"$session_json")" = "fully_reconciled_current_equity"
          test "$(jq -r '.capital_policy.loss_response' <<<"$session_json")" = "resize_from_fully_reconciled_current_equity"
          test "$(jq -r '.capital_policy.prior_state_session_id' <<<"$session_json")" = "dynamic-quote-funded-2026-07-29-v5"
          test "$(jq -r '.capital_policy.prior_state_blob_name' <<<"$session_json")" = \
            "reports/funded/dynamic-quote/sessions/dynamic-quote-funded-2026-07-29-v5/capital-reserve-state.json"
          test "$(jq -r '.capital_policy.prior_state_sha256' <<<"$session_json")" = \
            "sha256:617b0bd69466dc7d6ff7d61b26f5a4ed1bcfd557d5d9e4b62688b7fb13bf28c6"
          test "$(jq -r '.capital_policy.reserve_monotonic' <<<"$session_json")" = "false"
          test "$(jq -c '.external_cash_flows' <<<"$session_json")" = "[]"
          test "$(jq -c '.internal_settlements' <<<"$session_json")" = "[]"
          producer_image=$(az containerapp show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$INTENT_PRODUCER_APP" \
            --query properties.template.containers[0].image \
            -o tsv)
          test "$producer_image" = "${{ steps.images.outputs.producer_reference }}"
          az containerapp show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$INTENT_PRODUCER_APP" \
            -o json > intent-producer.json
          producer_env_value() {
            jq -r --arg name "$1" '.properties.template.containers[0].env[] | select(.name == $name) | .value' intent-producer.json
          }
          test "$(producer_env_value FUNDED_DIRECT_SERVICE_BUS_ENABLED)" = "true"
          test "$(producer_env_value FUNDED_DIRECT_SERVICE_BUS_NAMESPACE)" = "$SERVICE_BUS_NAMESPACE"
          test "$(producer_env_value FUNDED_DIRECT_SERVICE_BUS_QUEUE)" = "$SERVICE_BUS_QUEUE"
          test "$(producer_env_value LOCAL_JSONL_RECORDER_ENABLED)" = "false"

      - name: Refresh Azure login for post-deployment verification
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Verify Service Bus security and delivery contract
        run: |
          set -euo pipefail
          az servicebus namespace show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$SERVICE_BUS_NAMESPACE" \
            -o json > service-bus-namespace.json
          test "$(jq -r '.sku.name' service-bus-namespace.json)" = "Standard"
          test "$(jq -r '.disableLocalAuth' service-bus-namespace.json)" = "true"
          az servicebus queue show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --namespace-name "$SERVICE_BUS_NAMESPACE" \
            --name "$SERVICE_BUS_QUEUE" \
            -o json > service-bus-queue.json
          test "$(jq -r '.requiresDuplicateDetection' service-bus-queue.json)" = "true"
          test "$(jq -r '.status' service-bus-queue.json)" = "SendDisabled"
          test "$(jq -r '.duplicateDetectionHistoryTimeWindow' service-bus-queue.json)" = "PT10M"
          test "$(jq -r '.defaultMessageTimeToLive' service-bus-queue.json)" = "PT10S"
          test "$(jq -r '.deadLetteringOnMessageExpiration' service-bus-queue.json)" = "true"
          test "$(jq -r '.maxDeliveryCount' service-bus-queue.json)" = "3"
          az servicebus namespace network-rule-set show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --namespace-name "$SERVICE_BUS_NAMESPACE" \
            -o json > service-bus-network.json
          test "$(jq -r '.defaultAction' service-bus-network.json)" = "Deny"
          test "$(jq '.ipRules | length' service-bus-network.json)" = "2"
          producer_egress_ip=$(az network public-ip show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name pip-polyedge-venue-neu-egress-2 \
            --query ipAddress -o tsv)
          executor_egress_ip=$(az network public-ip show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name pip-polyedge-execution-cl-egress \
            --query ipAddress -o tsv)
          jq -e --arg producer "$producer_egress_ip" --arg executor "$executor_egress_ip" '
            ([.ipRules[].ipMask] | sort) == ([$producer, $executor] | sort)
          ' service-bus-network.json
          queue_id=$(az servicebus queue show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --namespace-name "$SERVICE_BUS_NAMESPACE" \
            --name "$SERVICE_BUS_QUEUE" \
            --query id -o tsv)
          test "$(az role assignment list --scope "$queue_id" --query "[?roleDefinitionName=='Azure Service Bus Data Sender'] | length(@)" -o tsv)" = "1"
          test "$(az role assignment list --scope "$queue_id" --query "[?roleDefinitionName=='Azure Service Bus Data Receiver'] | length(@)" -o tsv)" = "1"

      - name: Verify service startup and qset isolation
        run: |
          set -euo pipefail
          environment_id=$(az containerapp show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$FUNDED_APP" \
            --query properties.environmentId -o tsv)
          workspace_customer_id=$(az containerapp env show \
            --ids "$environment_id" \
            --query properties.appLogsConfiguration.logAnalyticsConfiguration.customerId -o tsv)
          active_revision=$(az containerapp show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$FUNDED_APP" \
            --query properties.latestRevisionName -o tsv)
          az containerapp revision list \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$FUNDED_APP" \
            -o json > funded-revisions-final.json
          test "$(jq '[.[] | select(.properties.active == true)] | length' funded-revisions-final.json)" = "1"
          test "$(jq -r '[.[] | select(.properties.active == true)][0].name' funded-revisions-final.json)" = "$active_revision"
          for attempt in $(seq 1 18); do
            az containerapp replica list \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --name "$FUNDED_APP" \
              --revision "$active_revision" \
              -o json > funded-replicas-final.json
            replica_started_at=$(jq -r \
              '.[0].properties.createdTime // "9999-12-31T23:59:59Z"' \
              funded-replicas-final.json)
            startup_count=$(az monitor log-analytics query \
              --workspace "$workspace_customer_id" \
              --analytics-query "ContainerAppConsoleLogs_CL
                | where ContainerAppName_s == '$FUNDED_APP'
                | where RevisionName_s == '$active_revision'
                | where TimeGenerated >= datetime($replica_started_at)
                | where Log_s contains '\"status\":\"persistent_service_started\"'
                | count" \
              --query '[0].Count' -o tsv)
            az monitor log-analytics query \
              --workspace "$workspace_customer_id" \
              --analytics-query "ContainerAppConsoleLogs_CL
                | where ContainerAppName_s == '$FUNDED_APP'
                | where RevisionName_s == '$active_revision'
                | where TimeGenerated >= datetime($replica_started_at)
                | extend record = parse_json(Log_s)
                | where tostring(record.status) == 'persistent_service_heartbeat'
                | top 1 by TimeGenerated desc
                | project Log_s" \
              -o json > funded-heartbeat-final.json
            if [ "${startup_count:-0}" -ge 1 ] && jq -e '
                length == 1
                and .[0].properties.runningState == "Running"
                and ([.[0].properties.containers[]
                  | select(.name == "funded-direct"
                    and .ready == true
                    and .runningState == "Running"
                    and .restartCount == 0)] | length) == 1
              ' funded-replicas-final.json >/dev/null && jq -e '
                length == 1
                and (.[0].Log_s | fromjson
                  | .executor.busy == false
                  and .executor.user_channel_ready == true
                  and (.executor.market_channel_ready == true
                    or .executor.warmed_market == null)
                  and .executor.reconnect_reconciliation_required == false
                  and .executor.user_channel_gaps == 0
                  and .executor.market_channel_gaps == 0)
              ' funded-heartbeat-final.json >/dev/null; then
              break
            fi
            sleep 10
          done
          test "${startup_count:-0}" -ge 1
          jq -e '
            length == 1
            and .[0].properties.runningState == "Running"
            and ([.[0].properties.containers[]
              | select(.name == "funded-direct"
                and .ready == true
                and .runningState == "Running"
                and .restartCount == 0)] | length) == 1
          ' funded-replicas-final.json
          jq -e '
            length == 1
            and (.[0].Log_s | fromjson
              | .executor.busy == false
              and .executor.user_channel_ready == true
              and (.executor.market_channel_ready == true
                or .executor.warmed_market == null)
              and .executor.reconnect_reconciliation_required == false
              and .executor.user_channel_gaps == 0
              and .executor.market_channel_gaps == 0)
          ' funded-heartbeat-final.json
          qset_after=$(az containerapp show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$PROTECTED_QSET_APP" \
            --query properties.latestRevisionName \
            -o tsv)
          test "$qset_after" = "$(cat protected-qset-revision-before.txt)"
          test "$(az servicebus queue show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --namespace-name "$SERVICE_BUS_NAMESPACE" \
            --name "$SERVICE_BUS_QUEUE" \
            --query status -o tsv)" = "SendDisabled"

      - name: Rewarm the producer and prove one complete v9 lifecycle before cutover
        run: |
          set -euo pipefail
          cutover_complete=false
          refence_incomplete_cutover() {
            if [ "$cutover_complete" != true ]; then
              az servicebus queue update \
                --resource-group "$AZURE_RESOURCE_GROUP" \
                --namespace-name "$SERVICE_BUS_NAMESPACE" \
                --name "$SERVICE_BUS_QUEUE" \
                --status SendDisabled \
                --only-show-errors -o none || true
            fi
          }
          trap refence_incomplete_cutover EXIT
          az servicebus queue show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --namespace-name "$SERVICE_BUS_NAMESPACE" \
            --name "$SERVICE_BUS_QUEUE" \
            -o json > funded-queue-before-activation.json
          test "$(jq -r '.status' funded-queue-before-activation.json)" = "SendDisabled"
          dlq_before=$(jq -r '.countDetails.deadLetterMessageCount' funded-queue-before-activation.json)
          [[ "$dlq_before" =~ ^[0-9]+$ ]]
          activation_started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          az servicebus queue update \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --namespace-name "$SERVICE_BUS_NAMESPACE" \
            --name "$SERVICE_BUS_QUEUE" \
            --status Active \
            --only-show-errors -o none
          test "$(az servicebus queue show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --namespace-name "$SERVICE_BUS_NAMESPACE" \
            --name "$SERVICE_BUS_QUEUE" \
            --query status -o tsv)" = "Active"
          producer_revision=$(cat intent-producer-revision-deployed.txt)
          az containerapp show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$INTENT_PRODUCER_APP" \
            -o json > intent-producer-after-reopen.json
          test "$(jq -r '.properties.latestRevisionName' intent-producer-after-reopen.json)" = "$producer_revision"
          test "$(jq -r '.properties.latestReadyRevisionName' intent-producer-after-reopen.json)" = "$producer_revision"
          test "$(jq -r '.properties.template.containers[0].image' intent-producer-after-reopen.json)" = \
            "${{ steps.images.outputs.producer_reference }}"
          az containerapp replica list \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$INTENT_PRODUCER_APP" \
            --revision "$producer_revision" \
            -o json > producer-replicas-before-reopen-restart.json
          jq -e 'length == 1' producer-replicas-before-reopen-restart.json
          jq '[.[].name]' producer-replicas-before-reopen-restart.json > \
            producer-replica-names-before-reopen-restart.json
          az containerapp revision restart \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$INTENT_PRODUCER_APP" \
            --revision "$producer_revision" \
            --only-show-errors -o none
          producer_ready=false
          for attempt in $(seq 1 36); do
            az containerapp replica list \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --name "$INTENT_PRODUCER_APP" \
              --revision "$producer_revision" \
              -o json > producer-replicas-after-reopen.json
            if jq -e --slurpfile prior producer-replica-names-before-reopen-restart.json '
              if length == 1 then
                .[0] as $replica
                | ($prior[0] | index($replica.name)) == null
                  and $replica.properties.runningState == "Running"
                  and ([$replica.properties.containers[]
                    | select(.name == "shadow-runtime"
                      and .ready == true
                      and .runningState == "Running"
                      and .restartCount == 0)] | length) == 1
              else false end
            ' producer-replicas-after-reopen.json >/dev/null; then
              producer_ready=true
              break
            fi
            sleep 5
          done
          test "$producer_ready" = true
          producer_restarted_at=$(jq -r '.[0].properties.createdTime' producer-replicas-after-reopen.json)
          environment_id=$(az containerapp show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$FUNDED_APP" \
            --query properties.environmentId -o tsv)
          workspace_customer_id=$(az containerapp env show \
            --ids "$environment_id" \
            --query properties.appLogsConfiguration.logAnalyticsConfiguration.customerId -o tsv)
          funded_revision=$(az containerapp show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$FUNDED_APP" \
            --query properties.latestRevisionName -o tsv)
          test "$(az containerapp show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$FUNDED_APP" \
            --query properties.latestReadyRevisionName -o tsv)" = "$funded_revision"
          warmup_ready=false
          for attempt in $(seq 1 200); do
            az monitor log-analytics query \
              --workspace "$workspace_customer_id" \
              --analytics-query "ContainerAppConsoleLogs_CL
                | where ContainerAppName_s == '$FUNDED_APP'
                | where RevisionName_s == '$funded_revision'
                | where TimeGenerated >= datetime($producer_restarted_at)
                | extend record = parse_json(Log_s)
                | where tostring(record.status) == 'market_warmed'
                | top 1 by TimeGenerated desc
                | project TimeGenerated, Log_s" \
              -o json > funded-warmup-after-reopen.json
            warmup_market=$(jq -r '.[0].Log_s // "{}" | fromjson | .market_id // ""' \
              funded-warmup-after-reopen.json)
            warmup_time=$(jq -r '.[0].TimeGenerated // ""' funded-warmup-after-reopen.json)
            if [[ "$warmup_market" =~ ^[0-9]+$ ]] && [ -n "$warmup_time" ]; then
              az monitor log-analytics query \
                --workspace "$workspace_customer_id" \
                --analytics-query "ContainerAppConsoleLogs_CL
                  | where ContainerAppName_s == '$FUNDED_APP'
                  | where RevisionName_s == '$funded_revision'
                  | where TimeGenerated >= datetime($warmup_time)
                  | extend record = parse_json(Log_s)
                  | where tostring(record.status) == 'persistent_service_heartbeat'
                  | where tostring(record.executor.warmed_market.market_id) == '$warmup_market'
                  | top 1 by TimeGenerated desc
                  | project Log_s" \
                -o json > funded-heartbeat-after-reopen.json
              if jq -e '
                length == 1
                and (.[0].Log_s | fromjson
                  | .executor.user_channel_ready == true
                  and .executor.market_channel_ready == true
                  and .executor.safety_snapshot_cache_ready == true
                  and .executor.safety_snapshot_cache_error == null
                  and .executor.reconnect_reconciliation_required == false
                  and .executor.user_channel_gaps == 0
                  and .executor.market_channel_gaps == 0)
              ' funded-heartbeat-after-reopen.json >/dev/null; then
                warmup_ready=true
                break
              fi
            fi
            sleep 5
          done
          test "$warmup_ready" = true
          az containerapp revision list \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$INTENT_PRODUCER_APP" \
            -o json > producer-revisions-after-reopen.json
          jq -e --arg revision "$producer_revision" '
            ([.[] | select(.properties.active == true)] | length) == 1
            and ([.[] | select(.properties.active == true)][0].name == $revision)
          ' producer-revisions-after-reopen.json
          az containerapp show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$INTENT_PRODUCER_APP" \
            -o json | jq -e --arg revision "$producer_revision" \
              --arg image "${{ steps.images.outputs.producer_reference }}" '
              .properties.latestRevisionName == $revision
              and .properties.latestReadyRevisionName == $revision
              and .properties.template.containers[0].image == $image
            ' >/dev/null
          test "$(az containerapp show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$FUNDED_APP" \
            --query properties.latestRevisionName -o tsv)" = "$funded_revision"
          test "$(az containerapp show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$FUNDED_APP" \
            --query properties.latestReadyRevisionName -o tsv)" = "$funded_revision"
          lifecycle_ready=false
          # Cover at least two BTC 15-minute market boundaries; warmup is readiness,
          # not proof that the strategy has emitted a qualifying Place intent.
          for attempt in $(seq 1 180); do
            az monitor log-analytics query \
              --workspace "$workspace_customer_id" \
              --analytics-query "ContainerAppConsoleLogs_CL
                | where ContainerAppName_s == '$FUNDED_APP'
                | where RevisionName_s == '$funded_revision'
                | where TimeGenerated >= datetime($activation_started_at)
                | extend record = parse_json(Log_s)
                | where tostring(record.schema) == 'polyedge.funded_direct_latency.v1'
                | where tostring(record.status) == 'intent_completed'
                | where tostring(record.worker_status) == 'persistent_intent_completed'
                | where tobool(record.order_submission_attempted) == true
                | top 1 by TimeGenerated asc
                | project TimeGenerated, Log_s" \
              -o json > funded-v9-lifecycle-latency.json
            if jq -e '
              length == 1
              and (.[0].Log_s | fromjson
                | (.decision_id | test("^[0-9a-f]{64}$"))
                and .order_submission_attempted == true
                and .worker_status == "persistent_intent_completed")
            ' funded-v9-lifecycle-latency.json >/dev/null; then
              lifecycle_ready=true
              break
            fi
            sleep 10
          done
          test "$lifecycle_ready" = true
          decision_id=$(jq -r '.[0].Log_s | fromjson | .decision_id' funded-v9-lifecycle-latency.json)
          . scripts/verify-funded-v9-capital.sh
          az containerapp show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$FUNDED_APP" \
            -o json > funded-v9-live-app.json
          funded_env() {
            jq -r --arg name "$1" \
              '.properties.template.containers[0].env[] | select(.name == $name) | .value' \
              funded-v9-live-app.json
          }
          control_prefix=$(funded_env FUNDED_DIRECT_CONTROL_PREFIX)
          intent_container=$(funded_env STRATEGY_CANARY_INTENT_CONTAINER_NAME)
          intent_prefix=$(funded_env STRATEGY_CANARY_INTENT_PREFIX)
          test "$control_prefix" = "reports/funded/dynamic-quote"
          test -n "$intent_container"
          test "$intent_prefix" = "reports/research/venue-probe/control/strategy-canary/intents"
          authorization_blob="$control_prefix/sessions/dynamic-quote-funded-2026-08-12-v9/authorizations/$decision_id.json"
          completion_blob="$control_prefix/sessions/dynamic-quote-funded-2026-08-12-v9/completed/$decision_id.json"
          az storage blob download \
            --account-name "$STORAGE_ACCOUNT" \
            --container-name "$FUNDED_CONTAINER" \
            --name "$authorization_blob" \
            --file funded-v9-authorization.json \
            --auth-mode login \
            --overwrite \
            --only-show-errors -o none
          authorization_sha256="sha256:$(sha256sum funded-v9-authorization.json | cut -d' ' -f1)"
          az storage blob download \
            --account-name "$STORAGE_ACCOUNT" \
            --container-name "$FUNDED_CONTAINER" \
            --name "$completion_blob" \
            --file funded-v9-completion.json \
            --auth-mode login \
            --overwrite \
            --only-show-errors -o none
          jq -e --arg decision "$decision_id" --arg authorization_blob "$authorization_blob" --arg authorization_sha "$authorization_sha256" '
            .schema == "polyedge.operator_funded_intent_completion.v1"
            and .session_id == "dynamic-quote-funded-2026-08-12-v9"
            and .decision_id == $decision
            and .authorization_blob_name == $authorization_blob
            and .authorization_sha256 == $authorization_sha
            and .status == "child_completed"
            and .order_submission_attempted == true
            and .authorization_consumed == true
            and .risk_reservation_created == true
            and (.child_run_id | type == "string" and length > 0)
          ' funded-v9-completion.json
          child_run_id=$(jq -r '.child_run_id' funded-v9-completion.json)
          jq -e --arg decision "$decision_id" --arg run "$child_run_id" --arg authorization_blob "$authorization_blob" --arg authorization_sha "$authorization_sha256" '
            .schema == "polyedge.operator_funded_intent_authorization.v1"
            and .authorization_mode == "operator_direct"
            and .session_id == "dynamic-quote-funded-2026-08-12-v9"
            and .decision_id == $decision
            and .child_run_id == $run
            and .promotion_manifest_blob_name == "reports/funded/dynamic-quote/sessions/dynamic-quote-funded-2026-08-12-v9/session.json"
            and .promotion_manifest_sha256 == "sha256:15f7b4e2c749d401e9dbab01a6a9dca8ce81166948a5621a8b4c6dff536f4d22"
            and .operator_session_manifest_blob_name == .promotion_manifest_blob_name
            and .operator_session_manifest_sha256 == .promotion_manifest_sha256
            and .research_promotion_bypassed == true
            and .max_order_notional == 10.5
            and (.authorization_id | type == "string" and length > 0)
            and (.intent_blob_name | type == "string")
            and (.intent_sha256 | test("^sha256:[0-9a-f]{64}$"))
          ' funded-v9-authorization.json
          intent_blob=$(jq -r '.intent_blob_name' funded-v9-authorization.json)
          intent_sha256=$(jq -r '.intent_sha256' funded-v9-authorization.json)
          authorization_id=$(jq -r '.authorization_id' funded-v9-authorization.json)
          test "$intent_blob" = "$intent_prefix/$decision_id.json"
          az storage blob download \
            --account-name "$STORAGE_ACCOUNT" \
            --container-name "$intent_container" \
            --name "$intent_blob" \
            --file funded-v9-intent.json \
            --auth-mode login \
            --overwrite \
            --only-show-errors -o none
          test "$intent_sha256" = "sha256:$(sha256sum funded-v9-intent.json | cut -d' ' -f1)"
          jq -e --arg decision "$decision_id" '
            .decision_id == $decision
            and .notional == "10.5"
          ' funded-v9-intent.json
          consumption_blob="reports/research/venue-probe/control/strategy-canary/consumed/$authorization_id.json"
          az storage blob download \
            --account-name "$STORAGE_ACCOUNT" \
            --container-name "$FUNDED_CONTAINER" \
            --name "$consumption_blob" \
            --file funded-v9-authorization-consumption.json \
            --auth-mode login \
            --overwrite \
            --only-show-errors -o none
          jq -e --arg authorization_id "$authorization_id" --arg authorization_sha "$authorization_sha256" --arg decision "$decision_id" --arg run "$child_run_id" '
            .schema == "polyedge.strategy_canary_authorization_consumption.v1"
            and .authorization_id == $authorization_id
            and .authorization_sha256 == $authorization_sha
            and .decision_id == $decision
            and .run_id == $run
          ' funded-v9-authorization-consumption.json
          az storage blob list \
            --account-name "$STORAGE_ACCOUNT" \
            --container-name "$FUNDED_CONTAINER" \
            --prefix "reports/research/venue-probe/risk-reservations/" \
            --num-results '*' \
            --auth-mode login \
            --only-show-errors -o json > funded-v9-risk-reservations.json
          reservation_blob=$(jq -r --arg decision "$decision_id" '
            [.[] | select(.name | endswith("/funded-direct-" + $decision + ".json"))]
            | if length == 1 then .[0].name else empty end
          ' funded-v9-risk-reservations.json)
          test -n "$reservation_blob"
          az storage blob download \
            --account-name "$STORAGE_ACCOUNT" \
            --container-name "$FUNDED_CONTAINER" \
            --name "$reservation_blob" \
            --file funded-v9-risk-reservation.json \
            --auth-mode login \
            --overwrite \
            --only-show-errors -o none
          az storage blob list \
            --account-name "$STORAGE_ACCOUNT" \
            --container-name "$FUNDED_CONTAINER" \
            --prefix "reports/research/venue-probe/runs/" \
            --num-results '*' \
            --auth-mode login \
            --only-show-errors -o json > funded-v9-run-summaries.json
          summary_blob=$(jq -r --arg run "$child_run_id" '
            [.[] | select(.name | endswith("/" + $run + "/summary.json"))]
            | if length == 1 then .[0].name else empty end
          ' funded-v9-run-summaries.json)
          test -n "$summary_blob"
          az storage blob download \
            --account-name "$STORAGE_ACCOUNT" \
            --container-name "$FUNDED_CONTAINER" \
            --name "$summary_blob" \
            --file funded-v9-run-summary.json \
            --auth-mode login \
            --overwrite \
            --only-show-errors -o none
          order_id=$(jq -r '.lifecycle.order_id // ""' funded-v9-run-summary.json)
          [[ "$order_id" =~ ^0x[0-9a-fA-F]{64}$ ]]
          jq -e --arg decision "$decision_id" --arg run "$child_run_id" --arg authorization_blob "$authorization_blob" --arg authorization_sha "$authorization_sha256" --arg intent_blob "$intent_blob" --arg intent_sha "$intent_sha256" --arg order_id "$order_id" '
            .schema_version == 3
            and .status == "completed"
            and .run_id == $run
            and .order_submission_attempted == true
            and .order_submitted == true
            and .provenance.decision_id == $decision
            and .provenance.authorization_kind == "operator_direct"
            and .provenance.operator_session_id == "dynamic-quote-funded-2026-08-12-v9"
            and .provenance.research_promotion_bypassed == true
            and .provenance.authorization_blob_name == $authorization_blob
            and .provenance.authorization_sha256 == $authorization_sha
            and .provenance.intent_blob_name == $intent_blob
            and .provenance.intent_sha256 == $intent_sha
            and .order.current_funds_scaled == true
            and .order.source_requested_notional == 10.5
            and .order.notional < 10.5
            and .lifecycle.order_id == $order_id
          ' funded-v9-run-summary.json
          jq -e --arg decision "$decision_id" --arg run "$child_run_id" --arg order_id "$order_id" '
            .schema_version == 1
            and .campaign_id == "dynamic-quote-funded-2026-08-12-v9"
            and .run_id == $run
            and .probe_id == ("funded-direct-" + $decision)
            and .order_submitted == true
            and .order_id == $order_id
            and (
              (.state == "finalized_no_fill"
                and .matched_notional == 0
                and .reconciliation_complete == true
                and .zero_open_orders_confirmed == true)
              or
              (.state == "position_settled"
                and .matched_notional > 0
                and .settlement_verified == true
                and (.settlement_evidence_source == "verified_onchain_redemption"
                  or .settlement_evidence_source == "polymarket_data_api_redeemable"))
            )
          ' funded-v9-risk-reservation.json
          az servicebus queue show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --namespace-name "$SERVICE_BUS_NAMESPACE" \
            --name "$SERVICE_BUS_QUEUE" \
            -o json > funded-queue-after-lifecycle.json
          test "$(jq -r '.status' funded-queue-after-lifecycle.json)" = "Active"
          test "$(jq -r '.countDetails.activeMessageCount' funded-queue-after-lifecycle.json)" = "0"
          test "$(jq -r '.countDetails.scheduledMessageCount' funded-queue-after-lifecycle.json)" = "0"
          test "$(jq -r '.countDetails.deadLetterMessageCount' funded-queue-after-lifecycle.json)" = "$dlq_before"
          echo "FUNDED_CUTOVER_COMPLETE=true" >> "$GITHUB_ENV"
          cutover_complete=true
          trap - EXIT

      - name: Restore the dormant funded service after an incomplete cutover
        if: ${{ always() && env.FUNDED_QUEUE_FENCED == 'true' && env.FUNDED_CUTOVER_COMPLETE != 'true' }}
        run: |
          set -euo pipefail
          az servicebus queue update \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --namespace-name "$SERVICE_BUS_NAMESPACE" \
            --name "$SERVICE_BUS_QUEUE" \
            --status SendDisabled \
            --only-show-errors -o none
          if [ -n "${FUNDED_ROLLBACK_REVISION:-}" ]; then
            test -s funded-rollback-template.json
            az containerapp revision copy \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --name "$FUNDED_APP" \
              --from-revision "$FUNDED_ROLLBACK_REVISION" \
              --only-show-errors -o none
            exact_rollback=true
          else
            az containerapp update \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --name "$FUNDED_APP" \
              --min-replicas 0 \
              --max-replicas 1 \
              --set-env-vars \
                FUNDED_DIRECT_SERVICE_ENABLED=false \
                FUNDED_DIRECT_AUTO_REDEMPTION_ENABLED=false \
                FUNDED_DIRECT_WORKER_ENABLED=false \
                ALLOW_FUNDED_DIRECT=false \
                FUNDED_DIRECT_DRY_RUN=true \
                ALLOW_LIVE=false \
                ALLOW_STRATEGY_CANARY=false \
                ENABLE_TAKER_ORDERS=false \
              --only-show-errors -o none
            exact_rollback=false
          fi
          test "$(az servicebus queue show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --namespace-name "$SERVICE_BUS_NAMESPACE" \
            --name "$SERVICE_BUS_QUEUE" \
            --query status -o tsv)" = "SendDisabled"
          restored_revision=$(az containerapp show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$FUNDED_APP" \
            --query properties.latestRevisionName -o tsv)
          test -n "$restored_revision"
          for attempt in $(seq 1 60); do
            ready_revision=$(az containerapp show \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --name "$FUNDED_APP" \
              --query properties.latestReadyRevisionName -o tsv)
            if [ "$ready_revision" = "$restored_revision" ]; then break; fi
            sleep 5
          done
          test "$ready_revision" = "$restored_revision"
          az containerapp revision show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$FUNDED_APP" \
            --revision "$restored_revision" \
            --only-show-errors -o json > restored-funded-revision.json
          if [ "$exact_rollback" = true ]; then
            jq -S '.properties.template' restored-funded-revision.json > restored-funded-template.json
            cmp funded-rollback-template.json restored-funded-template.json
          fi
          restored_env_value() {
            jq -er --arg name "$1" '
              [.properties.template.containers[0].env[]
                | select(.name == $name) | .value]
              | if length == 1 and .[0] != null then .[0]
                else error("expected exactly one non-null environment value for " + $name)
                end
            ' restored-funded-revision.json
          }
          test "$(jq -r '.properties.template.scale.minReplicas' restored-funded-revision.json)" = "0"
          test "$(jq -r '.properties.template.scale.maxReplicas' restored-funded-revision.json)" = "1"
          for name in \
            FUNDED_DIRECT_SERVICE_ENABLED \
            FUNDED_DIRECT_AUTO_REDEMPTION_ENABLED \
            FUNDED_DIRECT_WORKER_ENABLED \
            ALLOW_FUNDED_DIRECT \
            ALLOW_LIVE \
            ALLOW_STRATEGY_CANARY \
            ENABLE_TAKER_ORDERS; do
            test "$(restored_env_value "$name")" = "false"
          done
          test "$(restored_env_value FUNDED_DIRECT_DRY_RUN)" = "true"
