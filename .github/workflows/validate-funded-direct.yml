          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Prove the v5 predecessor while the v10 service remains disabled
        run: |
          set -euo pipefail
          az containerapp show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$FUNDED_APP" \
            -o json > disabled-v10-funded-app.json
          test "$(jq -r '.properties.template.scale.minReplicas' disabled-v10-funded-app.json)" = "0"
          test "$(jq -r '.properties.template.containers[0].env[] | select(.name == "FUNDED_DIRECT_SERVICE_ENABLED") | .value' disabled-v10-funded-app.json)" = "false"
          test "$(jq -r '.properties.template.containers[0].env[] | select(.name == "FUNDED_DIRECT_DRY_RUN") | .value' disabled-v10-funded-app.json)" = "true"
          az storage blob download \
            --account-name "$STORAGE_ACCOUNT" \
            --container-name "$FUNDED_CONTAINER" \
            --name "reports/funded/dynamic-quote/sessions/dynamic-quote-funded-2026-07-29-v5/capital-reserve-state.json" \
            --file v5-capital-reserve-state.json \
