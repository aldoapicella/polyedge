            "$reviewed_legacy_onchain_error_sha256" \
            existing-v10-legacy-onchain-error-candidates.json
          jq -se --argjson recovery_controls "$recovery_controls" '
            # redemption_chain_contract_begin
            group_by(.run_id) as $record_groups
            | ($record_groups | all(.[];
                ([.[].record_sha256] | unique | length) == 1)) as $same_run_immutable
            | ($record_groups | map(.[0])) as $records
            | [$records[] | select(.status == "failed_closed"
                and .redemption_submitted == true)] as $submitted_failures
            | [$records[] | select(
                .status == "recovered_confirmed_and_verified")] as $recoveries
            | [$records[] | select(.status == "redeemed_and_verified"
                or .status == "recovered_confirmed_and_verified")]
              as $verified_transactions
            | $same_run_immutable
            and ($recovery_controls | length) == ($submitted_failures | length)
            and ($recovery_controls | length) == ($recoveries | length)
            and all($recovery_controls[]; . as $control
              | ([ $submitted_failures[] | select(
                    .run_id == $control.value.predecessor_run_id
                    and .recovery_control_blob_name == $control.blob_name
                    and .recovery_control_sha256 == $control.sha256
                    and .chain_predecessor_run_id
                      == $control.value.predecessor_run_id
                    and .chain_recovery_run_id
                      == $control.value.recovery_run_id
                    and (.chain_transaction_hash | ascii_downcase)
                      == ($control.value.finalized_control.transaction_hash
                        | ascii_downcase)
                    and (.chain_settlement_blobs | sort)
                      == ($control.value.finalized_control.internal_settlement_blobs
                        | sort))
                  ] | length) == 1
              and ([ $recoveries[] | select(
                    .run_id == $control.value.recovery_run_id
                    and .recovery_control_blob_name == $control.blob_name
                    and .recovery_control_sha256 == $control.sha256
                    and .chain_predecessor_run_id
                      == $control.value.predecessor_run_id
                    and .chain_recovery_run_id
                      == $control.value.recovery_run_id
                    and (.transaction_hash | ascii_downcase)
                      == ($control.value.finalized_control.transaction_hash
                        | ascii_downcase)
                    and (.chain_transaction_hash | ascii_downcase)
                      == ($control.value.finalized_control.transaction_hash
                        | ascii_downcase)
                    and (.internal_settlement_blobs | sort)
                      == ($control.value.finalized_control.internal_settlement_blobs
                        | sort)
                    and (.chain_settlement_blobs | sort)
                      == ($control.value.finalized_control.internal_settlement_blobs
                        | sort))
                  ] | length) == 1)
            and ([$verified_transactions[].transaction_hash | ascii_downcase]
              | length == (unique | length))
            and ([$verified_transactions[].internal_settlement_blobs[]]
              | length == (unique | length))
            # redemption_chain_contract_end
          ' existing-v10-redemption-chain.jsonl >/dev/null
          v5_etag_before=$(az storage blob show \
            --account-name "$STORAGE_ACCOUNT" \
            --container-name "$FUNDED_CONTAINER" \
            --name "$v5_state" \
            --auth-mode login \
            --query properties.etag -o tsv)
          test -n "$v5_etag_before"
          az storage blob download \
            --account-name "$STORAGE_ACCOUNT" \
            --container-name "$FUNDED_CONTAINER" \
            --name "$v5_state" \
            --file v5-state-before-preflight.json \
            --auth-mode login \
            --overwrite \
            --only-show-errors -o none
          v5_sha_before="sha256:$(sha256sum v5-state-before-preflight.json | cut -d' ' -f1)"
          test "$v5_sha_before" = "$v5_state_sha256"
          jq '
            .properties.template
            | .containers |= map(
                if .name == "funded-direct" then
                  .env = (
                    [.env[] | select(.name != "FUNDED_DIRECT_WORKER_ENABLED"
                      and .name != "ALLOW_FUNDED_DIRECT"
                      and .name != "FUNDED_DIRECT_DRY_RUN"
                      and .name != "FUNDED_DIRECT_PREFLIGHT_ONLY"
                      and .name != "FUNDED_DIRECT_MAX_ITERATIONS"
                      and .name != "FUNDED_DIRECT_POLL_INTERVAL_MS"
                      and .name != "FUNDED_DIRECT_MAX_IDLE_MS")]
                    + [
                      {name:"FUNDED_DIRECT_WORKER_ENABLED",value:"true"},
                      {name:"ALLOW_FUNDED_DIRECT",value:"true"},
                      {name:"FUNDED_DIRECT_DRY_RUN",value:"true"},
                      {name:"FUNDED_DIRECT_PREFLIGHT_ONLY",value:"true"},
                      {name:"FUNDED_DIRECT_MAX_ITERATIONS",value:"5401"},
                      {name:"FUNDED_DIRECT_POLL_INTERVAL_MS",value:"1000"},
                      {name:"FUNDED_DIRECT_MAX_IDLE_MS",value:"5400000"}
                    ]
                  )
                else . end
              )
          ' funded-preflight-job.json > funded-preflight-execution.yaml
          echo "PREFLIGHT_V5_ETAG_BEFORE=$v5_etag_before" >> "$GITHUB_ENV"
          echo "PREFLIGHT_INTENT_CONTAINER=$intent_container" >> "$GITHUB_ENV"
          echo "PREFLIGHT_INTENT_PREFIX=$intent_prefix" >> "$GITHUB_ENV"

      - name: Refresh Azure login before zero-write v10 preflight
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Run the zero-write v10 preflight against a fresh producer intent
        id: funded_preflight
        run: |
          set -euo pipefail
          readonly v5_etag_before="${PREFLIGHT_V5_ETAG_BEFORE:?}"
          readonly intent_container="${PREFLIGHT_INTENT_CONTAINER:?}"
          readonly intent_prefix="${PREFLIGHT_INTENT_PREFIX:?}"
          [[ "$v5_etag_before" =~ ^\"?0x[[:xdigit:]]+\"?$ ]]
          [[ "$intent_prefix" =~ /intents$ ]]
          test -s funded-preflight-execution.yaml
          jq -e '
            .containers | length == 1
            and ([.[] | select(.name == "funded-direct") | .env[]
              | select(.name == "FUNDED_DIRECT_WORKER_ENABLED" and .value == "true")] | length) == 1
            and ([.[] | select(.name == "funded-direct") | .env[]
              | select(.name == "ALLOW_FUNDED_DIRECT" and .value == "true")] | length) == 1
            and ([.[] | select(.name == "funded-direct") | .env[]
              | select(.name == "FUNDED_DIRECT_DRY_RUN" and .value == "true")] | length) == 1
            and ([.[] | select(.name == "funded-direct") | .env[]
              | select(.name == "FUNDED_DIRECT_PREFLIGHT_ONLY" and .value == "true")] | length) == 1
            and ([.[] | select(.name == "funded-direct") | .env[]
              | select(.name == "FUNDED_DIRECT_MAX_ITERATIONS" and .value == "5401")] | length) == 1
            and ([.[] | select(.name == "funded-direct") | .env[]
              | select(.name == "FUNDED_DIRECT_POLL_INTERVAL_MS" and .value == "1000")] | length) == 1
            and ([.[] | select(.name == "funded-direct") | .env[]
              | select(.name == "FUNDED_DIRECT_MAX_IDLE_MS" and .value == "5400000")] | length) == 1
          ' funded-preflight-execution.yaml
          preflight_execution=$(az containerapp job start \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$FUNDED_JOB" \
            --yaml funded-preflight-execution.yaml \
            --query name -o tsv)
          test -n "$preflight_execution"
          status=Running
          monotonic_seconds() {
            python3 -c 'import time; print(int(time.monotonic()))'
          }
          preflight_deadline_monotonic=$(( $(monotonic_seconds) + 5700 ))
          sleep_before_preflight_deadline() {
            local remaining=$(( preflight_deadline_monotonic - $(monotonic_seconds) ))
            [ "$remaining" -gt 0 ] || return 1
            [ "$remaining" -le 10 ] || remaining=10
            sleep "$remaining"
          }
          while [ "$(monotonic_seconds)" -lt "$preflight_deadline_monotonic" ]; do
            if ! status=$(az containerapp job execution show \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --name "$FUNDED_JOB" \
              --job-execution-name "$preflight_execution" \
              --query properties.status -o tsv); then
              sleep_before_preflight_deadline || break
              continue
            fi
            case "$status" in
              Succeeded) break ;;
              Failed|Stopped|Degraded) exit 1 ;;
            esac
            sleep_before_preflight_deadline || break
          done
          test "$status" = "Succeeded"
          echo "execution=$preflight_execution" >> "$GITHUB_OUTPUT"
          echo "v5_etag_before=$v5_etag_before" >> "$GITHUB_OUTPUT"
          echo "intent_container=$intent_container" >> "$GITHUB_OUTPUT"
          echo "intent_prefix=$intent_prefix" >> "$GITHUB_OUTPUT"

      - name: Refresh Azure login after zero-write preflight wait
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Verify the zero-write v10 preflight
        env:
          PREFLIGHT_EXECUTION: ${{ steps.funded_preflight.outputs.execution }}
          POINTER_PREFLIGHT_CUTOFF_AT: ${{ steps.pointer_preflight_producer.outputs.cutoff_at }}
          POINTER_PREFLIGHT_CUTOFF_EPOCH: ${{ steps.pointer_preflight_producer.outputs.cutoff_epoch }}
          POINTER_PREFLIGHT_INTENT_PREFIX: ${{ steps.pointer_preflight_producer.outputs.intent_prefix }}
          POINTER_PREFLIGHT_INTENT_CONTAINER: ${{ steps.pointer_preflight_producer.outputs.intent_container }}
          POINTER_PREFLIGHT_CURRENT_BLOB: ${{ steps.pointer_preflight_producer.outputs.current_blob }}
          POINTER_PREFLIGHT_POINTER_BEFORE_EXISTS: ${{ steps.pointer_preflight_producer.outputs.pointer_before_exists }}
          POINTER_PREFLIGHT_POINTER_BEFORE_ETAG: ${{ steps.pointer_preflight_producer.outputs.pointer_before_etag }}
        run: |
          set -euo pipefail
          readonly v10_prefix="reports/funded/dynamic-quote/sessions/dynamic-quote-funded-2026-08-13-v10/"
          readonly v5_state="reports/funded/dynamic-quote/sessions/dynamic-quote-funded-2026-07-29-v5/capital-reserve-state.json"
          readonly v5_state_sha256="sha256:9e63db7ef8c22d3af53a14f1858b817b8769ca7ba737e6668a900ffb73330c15"
          readonly preflight_execution="$PREFLIGHT_EXECUTION"
          readonly v5_etag_before="$PREFLIGHT_V5_ETAG_BEFORE"
          readonly intent_prefix="$PREFLIGHT_INTENT_PREFIX"
          readonly intent_container="$PREFLIGHT_INTENT_CONTAINER"
          readonly pointer_preflight_cutoff_at="$POINTER_PREFLIGHT_CUTOFF_AT"
          readonly pointer_preflight_cutoff_epoch="$POINTER_PREFLIGHT_CUTOFF_EPOCH"
          readonly pointer_preflight_intent_prefix="$POINTER_PREFLIGHT_INTENT_PREFIX"
          readonly pointer_preflight_intent_container="$POINTER_PREFLIGHT_INTENT_CONTAINER"
          readonly pointer_preflight_current_blob="$POINTER_PREFLIGHT_CURRENT_BLOB"
          readonly pointer_preflight_pointer_before_exists="$POINTER_PREFLIGHT_POINTER_BEFORE_EXISTS"
          readonly pointer_preflight_pointer_before_etag="$POINTER_PREFLIGHT_POINTER_BEFORE_ETAG"
          test -n "$preflight_execution"
          test -n "$v5_etag_before"
          test -n "$intent_prefix"
          test -n "$intent_container"
          test "$intent_prefix" = "$pointer_preflight_intent_prefix"
          test "$intent_container" = "$pointer_preflight_intent_container"
          test "$pointer_preflight_current_blob" = "${intent_prefix%/intents}/current-funded-intent.json"
          test -n "$pointer_preflight_cutoff_at"
          [[ "$pointer_preflight_cutoff_epoch" =~ ^[0-9]+$ ]]
          [[ "$pointer_preflight_pointer_before_exists" =~ ^(true|false)$ ]]
          if [ "$pointer_preflight_pointer_before_exists" = true ]; then
            test -n "$pointer_preflight_pointer_before_etag"
          else
            test -z "$pointer_preflight_pointer_before_etag"
          fi
          environment_id=$(az containerapp show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$FUNDED_APP" \
            --query properties.environmentId -o tsv)
          workspace_customer_id=$(az containerapp env show \
            --ids "$environment_id" \
            --query properties.appLogsConfiguration.logAnalyticsConfiguration.customerId -o tsv)
          preflight_ready=false
          for attempt in $(seq 1 36); do
            az monitor log-analytics query \
              --workspace "$workspace_customer_id" \
              --analytics-query "ContainerAppConsoleLogs_CL
                | where ContainerJobName_s == '$FUNDED_JOB'
                | where ContainerGroupName_s startswith '$preflight_execution'
                | extend record = parse_json(Log_s)
                | where tostring(record.schema) == 'polyedge.funded_direct_worker.v1'
                | where tostring(record.status) == 'preflight_validated'
                | project TimeGenerated, Log_s
                | order by TimeGenerated asc" \
              -o json > funded-preflight-logs.json || { sleep 10; continue; }
            if jq -e --arg session_blob "$v10_prefix" --arg session_sha "sha256:c516c052fc5c01eed5403842ff24bf4b08512d6c38e8260e2d064580c82322f8" --arg v5_state "$v5_state" --arg v5_sha "$v5_state_sha256" --arg intent_prefix "$intent_prefix" '
              length == 1
              and (.[0].Log_s | fromjson
                | .session_id == "dynamic-quote-funded-2026-08-13-v10"
                and .preflight_only == true
                and .writes_performed == false
                and .order_submission_attempted == false
                and .execution_grant_created == false
                and .risk_reservation_created == false
                and .completion_created == false
                and .session_manifest_blob_name == ($session_blob + "session.json")
                and .session_manifest_sha256 == $session_sha
                and .predecessor_state_session_id == "dynamic-quote-funded-2026-07-29-v5"
                and .predecessor_state_blob_name == $v5_state
                and .predecessor_state_sha256 == $v5_sha
                and .intent_handoff_blob_name == ($intent_prefix | sub("/intents$"; "/current-funded-intent.json"))
                and (.intent_blob_name | startswith($intent_prefix + "/") and test("/[0-9a-f]{64}\\.json$"))
                and (.intent_sha256 | test("^sha256:[0-9a-f]{64}$")))
            ' funded-preflight-logs.json >/dev/null; then
              preflight_ready=true
              break
            fi
            sleep 10
          done
          test "$preflight_ready" = true
          preflight_decision_id=$(jq -er '.[0].Log_s | fromjson | .decisionId' funded-preflight-logs.json)
          preflight_handoff_blob=$(jq -er '.[0].Log_s | fromjson | .intent_handoff_blob_name' funded-preflight-logs.json)
          preflight_intent_blob=$(jq -er '.[0].Log_s | fromjson | .intent_blob_name' funded-preflight-logs.json)
          preflight_intent_sha256=$(jq -er '.[0].Log_s | fromjson | .intent_sha256' funded-preflight-logs.json)
          [[ "$preflight_decision_id" =~ ^[0-9a-f]{64}$ ]]
          test "$preflight_handoff_blob" = "${intent_prefix%/intents}/current-funded-intent.json"
          test "$preflight_intent_blob" = "$intent_prefix/$preflight_decision_id.json"
          [[ "$preflight_intent_sha256" =~ ^sha256:[0-9a-f]{64}$ ]]
          az storage blob download \
            --account-name "$STORAGE_ACCOUNT" \
            --container-name "$intent_container" \
            --name "$preflight_intent_blob" \
            --file pointer-preflight-exact-intent.json \
            --auth-mode login --overwrite --only-show-errors -o none
          test "sha256:$(sha256sum pointer-preflight-exact-intent.json | cut -d' ' -f1)" = \
            "$preflight_intent_sha256"
          az storage blob show \
            --account-name "$STORAGE_ACCOUNT" \
            --container-name "$intent_container" \
            --name "$preflight_intent_blob" \
            --auth-mode login --only-show-errors -o json > pointer-preflight-exact-intent-properties.json
          pointer_preflight_last_modified=$(jq -er '.properties.lastModified' \
            pointer-preflight-exact-intent-properties.json)
          node - \
            pointer-preflight-exact-intent.json \
            "$preflight_decision_id" \
            "$preflight_intent_blob" \
            "$intent_prefix" \
            "$pointer_preflight_cutoff_epoch" \
            "$pointer_preflight_last_modified" <<'NODE'
          const assert = require("node:assert/strict");
          const fs = require("node:fs");
          const [file, decisionId, blobName, prefix, startedEpoch, lastModified] = process.argv.slice(2);
          const intent = JSON.parse(fs.readFileSync(file, "utf8"));
          const parsedStarted = Number(startedEpoch) * 1_000;
          const decisionAt = Date.parse(intent.decision_ts);
          const validUntil = Date.parse(intent.valid_until);
          const gtdExpiry = Date.parse(intent.gtd_expiry_ts);
          const modifiedAt = Date.parse(lastModified);
          assert.equal(intent.schema, "polyedge.execution_intent.v1");
          assert.equal(intent.decision_id, decisionId);
          assert.match(decisionId, /^[0-9a-f]{64}$/);
          assert.equal(blobName, `${prefix}/${decisionId}.json`);
          assert.ok(Number.isFinite(parsedStarted) && Number.isFinite(decisionAt) &&
            Number.isFinite(validUntil) && Number.isFinite(gtdExpiry) && Number.isFinite(modifiedAt));
          assert.ok(decisionAt >= parsedStarted, "intent decision predates pointer-only cutoff");
          assert.ok(modifiedAt >= parsedStarted, "intent blob predates pointer-only cutoff");
          assert.equal(intent.ttl_ms, 15_000);
          assert.equal(validUntil, decisionAt + intent.ttl_ms);
          assert.equal(gtdExpiry, validUntil + 300_000);
          assert.ok(intent.market_end_ts && Date.parse(intent.market_end_ts) > validUntil);
          NODE
          az storage blob show \
            --account-name "$STORAGE_ACCOUNT" \
            --container-name "$intent_container" \
            --name "$pointer_preflight_current_blob" \
            --auth-mode login --only-show-errors -o json > pointer-after-preflight.json
          pointer_after_etag=$(jq -er '.properties.etag' pointer-after-preflight.json)
          test -n "$pointer_after_etag"
          if [ "$pointer_preflight_pointer_before_exists" = true ]; then
            test "$pointer_after_etag" != "$pointer_preflight_pointer_before_etag"
          fi
          az storage blob download \
            --account-name "$STORAGE_ACCOUNT" \
            --container-name "$intent_container" \
            --name "$pointer_preflight_current_blob" \
            --file pointer-after-preflight.json \
            --auth-mode login --overwrite --only-show-errors -o none
          node - \
            pointer-after-preflight.json \
            pointer-preflight-exact-intent.json \
            "$preflight_decision_id" \
            "$preflight_intent_blob" \
            "$preflight_intent_sha256" \
            "$intent_prefix" <<'NODE'
          const assert = require("node:assert/strict");
          const fs = require("node:fs");
          const [pointerFile, intentFile, decisionId, blobName, sha256, prefix] = process.argv.slice(2);
          const pointer = JSON.parse(fs.readFileSync(pointerFile, "utf8"));
          const intent = JSON.parse(fs.readFileSync(intentFile, "utf8"));
          assert.equal(pointer.schema, "polyedge.funded_intent_handoff.v1");
          assert.match(pointer.decision_id, /^[0-9a-f]{64}$/);
          assert.match(pointer.intent_blob_name, new RegExp(`^${prefix}/[0-9a-f]{64}\\.json$`));
          assert.match(pointer.intent_sha256, /^sha256:[0-9a-f]{64}$/);
          const isWorkerPointer = pointer.decision_id === decisionId &&
            pointer.intent_blob_name === blobName && pointer.intent_sha256 === sha256;
          if (isWorkerPointer) {
            assert.equal(pointer.decision_ts, intent.decision_ts);
          } else {
            const pointerAt = Date.parse(pointer.decision_ts);
            const workerAt = Date.parse(intent.decision_ts);
            assert.ok(Number.isFinite(pointerAt) && Number.isFinite(workerAt));
            assert.ok(pointerAt > workerAt ||
              (pointerAt === workerAt && pointer.decision_id > decisionId),
              "current pointer is neither the worker handoff nor strictly newer");
          }
          NODE
          az storage blob list \
            --account-name "$STORAGE_ACCOUNT" \
            --container-name "$FUNDED_CONTAINER" \
            --prefix "$v10_prefix" \
            --num-results '*' \
            --auth-mode login \
            --only-show-errors -o json > v10-prefix-after-preflight.json
          jq -S '[.[] | {name, etag: .properties.etag, size: .properties.contentLength}]' \
            v10-prefix-after-preflight.json > v10-prefix-after-preflight.snapshot.json
          cmp -s v10-prefix-before-preflight.snapshot.json v10-prefix-after-preflight.snapshot.json
          az servicebus queue show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --namespace-name "$SERVICE_BUS_NAMESPACE" \
            --name "$SERVICE_BUS_QUEUE" \
            -o json > funded-queue-after-pointer-preflight.json
          jq -S '{
            status,
            active: .countDetails.activeMessageCount,
            scheduled: .countDetails.scheduledMessageCount,
            dead_letter: .countDetails.deadLetterMessageCount
          }' funded-queue-after-pointer-preflight.json > funded-queue-after-pointer-preflight.snapshot.json
          cmp -s \
            funded-queue-before-pointer-preflight.snapshot.json \
            funded-queue-after-pointer-preflight.snapshot.json
          v5_etag_after=$(az storage blob show \
            --account-name "$STORAGE_ACCOUNT" \
            --container-name "$FUNDED_CONTAINER" \
            --name "$v5_state" \
            --auth-mode login \
            --query properties.etag -o tsv)
          test "$v5_etag_after" = "$v5_etag_before"
          az storage blob download \
            --account-name "$STORAGE_ACCOUNT" \
            --container-name "$FUNDED_CONTAINER" \
            --name "$v5_state" \
            --file v5-state-after-preflight.json \
            --auth-mode login \
            --overwrite \
            --only-show-errors -o none
          test "sha256:$(sha256sum v5-state-after-preflight.json | cut -d' ' -f1)" = \
            "$v5_state_sha256"
          az containerapp job show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$FUNDED_JOB" \
            -o json > funded-preflight-job-after.json
          job_env() {
            jq -r --arg name "$1" \
              '.properties.template.containers[0].env[] | select(.name == $name) | .value' \
              funded-preflight-job-after.json
          }
          test "$(job_env FUNDED_DIRECT_WORKER_ENABLED)" = "false"
          test "$(job_env ALLOW_FUNDED_DIRECT)" = "false"
          test "$(job_env FUNDED_DIRECT_DRY_RUN)" = "true"
          test -z "$(job_env FUNDED_DIRECT_PREFLIGHT_ONLY)"

      - name: Restore normal producer handoff before service activation
        run: |
          set -euo pipefail
          restored=false
          for attempt in 1 2 3; do
            if az containerapp update \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --name "$INTENT_PRODUCER_APP" \
              --remove-env-vars STRATEGY_INTENT_POINTER_ONLY_PREFLIGHT \
              --set-env-vars \
                RUN_BOT_ON_STARTUP=true \
                STRATEGY_INTENT_OPERATOR_DIRECT=true \
                FUNDED_DIRECT_SERVICE_BUS_ENABLED=true \
                FUNDED_DIRECT_SERVICE_BUS_NAMESPACE="$SERVICE_BUS_NAMESPACE" \
                FUNDED_DIRECT_SERVICE_BUS_QUEUE="$SERVICE_BUS_QUEUE" \
              --only-show-errors -o none; then
              restored=true
              break
            fi
            sleep "$((attempt * 10))"
          done
          test "$restored" = true
          producer_revision=$(az containerapp show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$INTENT_PRODUCER_APP" \
            --query properties.latestRevisionName -o tsv)
          test -n "$producer_revision"
          for attempt in $(seq 1 36); do
            az containerapp revision list \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --name "$INTENT_PRODUCER_APP" -o json > producer-revisions-normal-restored.json
            if jq -e --arg revision "$producer_revision" '
              ([.[] | select(.properties.active == true)] | length) == 1
              and ([.[] | select(.properties.active == true)][0].name == $revision)
              and ([.[] | select(.name == $revision)][0].properties.healthState == "Healthy")
              and ([.[] | select(.name == $revision)][0].properties.replicas >= 1)
            ' producer-revisions-normal-restored.json >/dev/null; then break; fi
            sleep 5
          done
          jq -e --arg revision "$producer_revision" '
            ([.[] | select(.properties.active == true)] | length) == 1
            and ([.[] | select(.properties.active == true)][0].name == $revision)
            and ([.[] | select(.name == $revision)][0].properties.healthState == "Healthy")
            and ([.[] | select(.name == $revision)][0].properties.replicas >= 1)
          ' producer-revisions-normal-restored.json >/dev/null
          az containerapp show \
            --resource-group "$AZURE_RESOURCE_GROUP" --name "$INTENT_PRODUCER_APP" \
            -o json > intent-producer-normal-restored.json
          jq -e --arg namespace "$SERVICE_BUS_NAMESPACE" --arg queue "$SERVICE_BUS_QUEUE" '
            ([.properties.template.containers[0].env[] | select(.name == "STRATEGY_INTENT_POINTER_ONLY_PREFLIGHT")] | length) == 0
            and ([.properties.template.containers[0].env[] | select(.name == "FUNDED_DIRECT_SERVICE_BUS_ENABLED" and .value == "true")] | length) == 1
            and ([.properties.template.containers[0].env[] | select(.name == "FUNDED_DIRECT_SERVICE_BUS_NAMESPACE" and .value == $namespace)] | length) == 1
            and ([.properties.template.containers[0].env[] | select(.name == "FUNDED_DIRECT_SERVICE_BUS_QUEUE" and .value == $queue)] | length) == 1
          ' intent-producer-normal-restored.json >/dev/null
          az containerapp show \
            --resource-group "$AZURE_RESOURCE_GROUP" --name "$FUNDED_APP" -o json > funded-app-before-enable.json
          test "$(jq -r '.properties.template.scale.minReplicas' funded-app-before-enable.json)" = "0"
          test "$(jq -r '.properties.template.containers[0].env[] | select(.name == "FUNDED_DIRECT_SERVICE_ENABLED") | .value' funded-app-before-enable.json)" = "false"
          test "$(az servicebus queue show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --namespace-name "$SERVICE_BUS_NAMESPACE" \
            --name "$SERVICE_BUS_QUEUE" --query status -o tsv)" = "SendDisabled"
          echo "FUNDED_NORMAL_PRODUCER_RESTORED=true" >> "$GITHUB_ENV"

      - name: Enable v10 only after the zero-write preflight passes
        run: |
          set -euo pipefail
          deployed=false
          for attempt in 1 2 3; do
            if az deployment group create \
              --name "polyedge-funded-direct-cl-enabled-${GITHUB_RUN_ID}" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --template-file infra/funded-direct-chile.bicep \
              --parameters @infra/funded-direct-chile.parameters.json \
              --parameters venueProbeImage="${{ steps.images.outputs.funded_reference }}" \
              --parameters fundedDirectEnabled=true \
              --parameters fundedDirectQueueStatus=SendDisabled \
              --only-show-errors \
              -o json > funded-enabled-deployment.json 2> funded-enabled-deployment.stderr; then
              deployed=true
              break
            fi
            if ! grep -Fq 'unable to pull image using Managed identity' funded-enabled-deployment.stderr || [ "$attempt" -eq 3 ]; then
              cat funded-enabled-deployment.stderr >&2
              exit 1
            fi
            sleep "$((attempt * 30))"
          done
          test "$deployed" = true
          test "$(jq -r '.properties.provisioningState' funded-enabled-deployment.json)" = "Succeeded"

      - name: Verify one active cloud replica and exact live controls
        run: |
          set -euo pipefail
          for attempt in $(seq 1 36); do
            az containerapp show \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --name "$FUNDED_APP" \
              -o json > funded-app.json
            target_revision=$(jq -r '.properties.latestRevisionName' funded-app.json)
            az containerapp revision list \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --name "$FUNDED_APP" \
              -o json > funded-revisions.json
            active_revision_count=$(jq '[.[] | select(.properties.active == true)] | length' funded-revisions.json)
            active_revision=$(jq -r '[.[] | select(.properties.active == true)][0].name // ""' funded-revisions.json)
            target_health=$(jq -r --arg revision "$target_revision" \
              '.[] | select(.name == $revision) | .properties.healthState // ""' funded-revisions.json)
            target_replicas=$(jq -r --arg revision "$target_revision" \
              '.[] | select(.name == $revision) | .properties.replicas // 0' funded-revisions.json)
            if [ "$active_revision_count" = "1" ] && \
                [ "$active_revision" = "$target_revision" ] && \
                [ "$target_health" = "Healthy" ] && \
                [ "$target_replicas" = "1" ]; then
              break
            fi
            sleep 10
          done
          test "$active_revision_count" = "1"
          test "$active_revision" = "$target_revision"
          test "$target_health" = "Healthy"
          test "$target_replicas" = "1"
          test "$(jq -r '.properties.template.scale.minReplicas' funded-app.json)" = "1"
          test "$(jq -r '.properties.template.scale.maxReplicas' funded-app.json)" = "1"
          test "$(jq -r '.properties.template.containers[0].image' funded-app.json)" = "${{ steps.images.outputs.funded_reference }}"
          test "$(jq -r '.properties.template.containers[0].command | join(" ")' funded-app.json)" = "node src/funded-direct-service.mjs"
          env_value() {
            jq -r --arg name "$1" '.properties.template.containers[0].env[] | select(.name == $name) | .value' funded-app.json
          }
          env_secret_ref() {
            jq -r --arg name "$1" '.properties.template.containers[0].env[] | select(.name == $name) | .secretRef' funded-app.json
          }
          test "$(env_value FUNDED_DIRECT_SERVICE_ENABLED)" = "true"
          test "$(env_value FUNDED_DIRECT_ENGINE)" = "persistent_v1"
          test "$(env_value FUNDED_DIRECT_SERVICE_BUS_ENABLED)" = "true"
          test "$(env_value FUNDED_DIRECT_SERVICE_BUS_NAMESPACE)" = "$SERVICE_BUS_NAMESPACE"
