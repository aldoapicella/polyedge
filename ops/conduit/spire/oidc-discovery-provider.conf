log_level = "info"
domains = ["oidc.example.invalid"]
listen_socket_path = "/run/spire-oidc/provider.sock"
jwt_issuer = "https://oidc.example.invalid"
jwks_uri = "https://oidc.example.invalid/keys"
set_key_use = true

workload_api {
    socket_path = "/run/spire/agent.sock"
    trust_domain = "polyedge.local"
}

health_checks {
    bind_port = "8008"
}
