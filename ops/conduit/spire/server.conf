server {
    bind_address = "127.0.0.1"
    bind_port = "8085"
    socket_path = "/run/spire-server/api.sock"
    trust_domain = "polyedge.local"
    data_dir = "/var/lib/spire-server"
    log_level = "INFO"
    audit_log_enabled = true
    default_jwt_svid_ttl = "5m"
    jwt_key_type = "rsa-2048"
    jwt_issuer = "https://oidc.aldoapicella.com"
}

plugins {
    DataStore "sql" {
        plugin_data {
            database_type = "sqlite3"
            connection_string = "/var/lib/spire-server/datastore.sqlite3"
        }
    }

    NodeAttestor "join_token" {
        plugin_data {}
    }

    KeyManager "disk" {
        plugin_data {
            keys_path = "/var/lib/spire-server/keys.json"
        }
    }
}
